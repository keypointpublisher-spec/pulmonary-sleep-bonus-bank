issure integrity. Steroids, antibiotics, radiation and oxygen are not volume reduction methods.","t":"Options: surgery and bronchoscopic valves or coils; fissure integrity matters for valves."},{"id":"B5.27","c":5,"q":"Alpha-1 antitrypsin deficiency should be suspected in:","o":["Pneumonia","Sleep apnea","Elderly smokers only","Early-onset emphysema, basal predominance, or a family history","Asthma only"],"a":3,"e":"Suspect alpha-1 antitrypsin deficiency in early-onset emphysema, basal predominance or a family history, and screen all patients with COPD once. It is not limited to elderly smokers and is not a cause of pneumonia, sleep apnea or asthma alone.","t":"Screen every patient with COPD once for alpha-1 antitrypsin deficiency."},{"id":"B5.28","c":5,"q":"Which vaccine is part of routine COPD care?","o":["Typhoid","None","Influenza and pneumococcal, with others per the current schedule","Rabies","Yellow fever"],"a":2,"e":"Influenza and pneumococcal vaccines, with others per the current schedule, are part of routine COPD care because they reduce exacerbations and pneumonia. Typhoid, rabies and yellow fever vaccines are not routine.","t":"COPD routine vaccines: influenza and pneumococcal, plus others by schedule."},{"id":"B5.29","c":5,"q":"The intervention that slows decline in lung function in COPD is:","o":["Inhaled steroid","Rehabilitation","Smoking cessation","Antibiotics","Oxygen"],"a":2,"e":"Smoking cessation is the only intervention shown to slow the decline in lung function in COPD. Inhaled steroids, rehabilitation, antibiotics and oxygen help symptoms or outcomes but do not slow decline.","t":"Only smoking cessation slows lung function decline."},{"id":"B5.30","c":5,"q":"A patient asks whether the inhaler should be taken when he feels well. The correct answer is:","o":["Only when symptomatic","Never","Only during infections","Only at night","Maintenance bronchodilators are taken regularly to prevent symptoms and exacerbations"],"a":4,"e":"Maintenance bronchodilators work by regular use, preventing symptoms and exacerbations, so the patient should take them even when feeling well. Using them only when symptomatic, only at night or only during infections defeats the purpose.","t":"Maintenance inhalers are taken every day, even when well."},{"id":"B5.31","c":5,"q":"An older COPD patient has poor hand strength and cannot use a dry powder inhaler. The best step is:","o":["Match the device to the patient's ability and check technique","Add oral steroid","Continue the same device","Stop therapy","Ignore"],"a":0,"e":"Poor hand strength can prevent adequate inspiratory effort or actuation, so match the device to the patient's ability and check technique. Continuing the same device, stopping therapy or adding oral steroid does not fix delivery.","t":"Choose the device the patient can use."},{"id":"B5.32","c":5,"q":"A patient has COPD and a CAT score of 24. This indicates:","o":["Heart failure","Normal findings","High symptom burden","Low symptom burden","Asthma"],"a":2,"e":"A CAT score of 10 or more indicates high symptom burden, so 24 is high. It does not suggest heart failure or asthma, and it is not normal or low.","t":"CAT 10 or more = high symptom burden."},{"id":"B5.33","c":5,"q":"A patient with COPD and an mMRC grade 1 has symptoms only when hurrying. This is:","o":["High symptom burden","Asthma","Low symptom burden","Disability","Respiratory failure"],"a":2,"e":"An mMRC grade of 0 to 1 means breathlessness only with strenuous exercise or when hurrying, a low symptom burden. High burden starts at mMRC 2. It does not imply disability or respiratory failure.","t":"mMRC 0 to 1 is low symptom burden; 2 or more is high."},{"id":"B5.34","c":5,"q":"Disease activity as a target in GOLD 2026 refers to:","o":["Aiming for stability and prevention of exacerbations and deterioration","Stopping therapy","Ignoring symptoms","Increasing exacerbations","Using FEV1 only"],"a":0,"e":"Disease activity as a target means aiming for stability, preventing exacerbations and deterioration. It does not mean stopping therapy, ignoring symptoms, increasing exacerbations or using FEV1 alone.","t":"The goal is a stable, low-activity disease state."},{"id":"B5.35","c":5,"q":"Palliative care in advanced COPD is:","o":["Used instead of rehabilitation","Not appropriate","Replaces inhalers","Reserved for the last days","Part of core therapy for symptom relief and planning"],"a":4,"e":"Palliative care in advanced COPD is part of core therapy, for symptom relief and planning, and is not reserved for the last days. It supports rather than replaces inhalers and rehabilitation.","t":"Palliative care belongs alongside standard COPD therapy."},{"id":"B5.36","c":5,"q":"A patient with COPD and a BMI of 17 has progressive weight loss. Which assessment matters most?","o":["Ignore","Add steroids","Stop rehabilitation","Nutrition and evaluation for other causes, including cancer and depression","Increase inhaler dose"],"a":3,"e":"A BMI of 17 with progressive weight loss is a poor prognostic marker. The key step is a nutritional assessment and a search for other causes, including cancer and depression. Increasing the inhaler dose, adding steroids or stopping rehabilitation does not address it.","t":"Weight loss in COPD needs nutrition work-up and a search for cancer and depression."}]}</script>
