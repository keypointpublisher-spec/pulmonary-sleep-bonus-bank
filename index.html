use during this period."},{"id":"B13.5","c":13,"q":"Which vaccine is recommended for patients with chronic lung disease each year?","o":["Typhoid","Rabies","Yellow fever","Influenza","Hepatitis A only"],"a":3,"e":"Annual influenza vaccination is standard."},{"id":"B13.6","c":13,"q":"Which pairing is correct for pneumococcal protection in chronic lung disease?","o":["Only antibiotics","Only in childhood","Never repeated","No vaccination","Vaccination according to the current schedule"],"a":4,"e":"Follow the current schedule from the national authority."},{"id":"B13.7","c":13,"q":"Live vaccines are generally avoided in:","o":["Nobody","Children","Pregnant women only","Healthy adults","Patients on high-dose immunosuppression"],"a":4,"e":"They can cause disease in immunocompromised hosts."},{"id":"B13.8","c":13,"q":"A patient on tumor necrosis factor inhibitors has fever and a lobar infiltrate. Which unusual pathogens should be considered?","o":["No infections","Only common bacteria","Parasites only","Only viruses","Mycobacteria, Legionella, and endemic fungi"],"a":4,"e":"These agents increase the risk of granulomatous infections."},{"id":"B13.9","c":13,"q":"A patient with a central line in the ICU has fever, and blood cultures grow Staphylococcus aureus. Which action is essential?","o":["Oral antibiotics only","Observe","Steroids","Remove the catheter and treat with appropriate antibiotics","Retain the line"],"a":3,"e":"Source control and prolonged therapy are needed."},{"id":"B13.10","c":13,"q":"The key step in preventing ventilator-associated pneumonia includes:","o":["Head-of-bed elevation, oral care, and minimizing sedation","Supine position","Routine antibiotics","Deep sedation","Avoiding extubation"],"a":0,"e":"A bundle approach reduces risk."},{"id":"B13.11","c":13,"q":"A patient with a rapidly progressing infiltrate over hours after chemotherapy-induced neutropenia is most likely to have:","o":["Cytomegalovirus","Bacterial pneumonia","Pneumocystis pneumonia","Sarcoidosis","Radiation pneumonitis"],"a":1,"e":"Tempo helps: rapid onset suggests bacterial infection, slower onset fungi and Pneumocystis."},{"id":"B13.12","c":13,"q":"An immunocompromised patient has nonproductive cough and ground-glass opacities, and sputum induction is unrevealing. The next diagnostic step is:","o":["Observation","Chest radiograph in a year","Discharge","Bronchoalveolar lavage","Steroids first"],"a":3,"e":"Lavage is high yield in immunocompromised hosts."},{"id":"B13.13","c":13,"q":"Clostridioides difficile infection risk rises in the ICU because of:","o":["Antibiotic exposure","Early mobility","Hand hygiene","Enteral feeding","Light sedation"],"a":0,"e":"Antibiotics disrupt gut flora."},{"id":"B13.14","c":13,"q":"The best approach to antimicrobial stewardship in the ICU is:","o":["No cultures","Culture-guided de-escalation and defined duration","Continue unchanged","Longest possible therapy","Broadest agent always"],"a":1,"e":"De-escalation reduces resistance and harm."},{"id":"B13.15","c":13,"q":"An immunocompromised patient has a positive serum cryptococcal antigen and a lung nodule. The next test is:","o":["Colonoscopy","Skin test","Spirometry","Lumbar puncture","No test"],"a":3,"e":"Evaluate for meningeal involvement."},{"id":"B13.16","c":13,"q":"Which statement about respiratory syncytial virus vaccination is correct?","o":["It is not available","It replaces influenza vaccine","Vaccination is available for older adults and selected high-risk adults according to the current schedule","It is live and given to everyone","It is only for children"],"a":2,"e":"Check the current national schedule for eligibility."},{"id":"B24.1","c":24,"q":"A patient with advanced fibrosis has a rapidly declining forced vital capacity and DLCO despite treatment. The right time for referral to a transplant center is:","o":["Early, before the patient is too ill","When transplant is already contraindicated","Never","After one year of bed rest","Only when ventilated"],"a":0,"e":"Early referral allows evaluation and optimization."},{"id":"B24.2","c":24,"q":"Which factor is a usual contraindication to lung transplantation?","o":["Hypertension","Active malignancy or untreated chronic infection","Age of 40","Mild anemia","Prior pneumonia"],"a":1,"e":"These risks outweigh benefit."},{"id":"B24.3","c":24,"q":"Primary graft dysfunction occurs:","o":["After 1 year","After 6 months","Only in recipients of living donors","After 5 years","In the first 72 hours after transplant"],"a":4,"e":"It is an early ischemia-reperfusion injury."},{"id":"B24.4","c":24,"q":"A transplant recipient 3 weeks after surgery has fever, dyspnea, and a declining FEV1. The first approach is:","o":["Increase steroids without testing","Oxygen only","Discharge","Bronchoscopy with biopsy to differentiate rejection from infection","Reassurance"],"a":3,"e":"Rejection and infection overlap and need tissue and cultures."},{"id":"B24.5","c":24,"q":"Chronic lung allograft dysfunction manifested as obstruction is called:","o":["Restrictive allograft syndrome","Bronchiolitis obliterans syndrome","Acute cellular rejection","Hyperacute rejection","Primary graft dysfunction"],"a":1,"e":"It is the obstructive phenotype."},{"id":"B24.6","c":24,"q":"Restrictive allograft syndrome is characterized by:","o":["Improvement with steroids","Obstruction only","Restriction with upper lobe fibrosis and pleural thickening","Pleural effusion alone","Normal physiology"],"a":2,"e":"It has a worse prognosis than the obstructive form."},{"id":"B24.7","c":24,"q":"A transplant recipient has a rising creatinine and tremor. A likely culprit is:","o":["An antibiotic only","Oxygen","A calcineurin inhibitor","A statin","A diuretic only"],"a":2,"e":"These agents cause nephrotoxicity and neurotoxicity."},{"id":"B24.8","c":24,"q":"Which infection is most associated with the first month after lung transplantation?","o":["No infections","Pneumocystis only","Bacterial and fungal infections","Tuberculosis only","Late viral infections only"],"a":2,"e":"Surgical and ventilator-related infections dominate early."},{"id":"B24.9","c":24,"q":"Cytomegalovirus risk is highest when:","o":["Both are positive","The donor is positive and the recipient is negative","Neither is tested","Recipient is positive and donor negative","Both are negative"],"a":1,"e":"The mismatch carries the highest risk and prompts prophylaxis."},{"id":"B24.10","c":24,"q":"A recipient with new airway stricture at the anastomosis presents with:","o":["Rash","Cough only","Normal breathing","Effusion only","Wheeze, stridor, and obstruction"],"a":4,"e":"Bronchoscopy and dilation or stenting treat it."},{"id":"B24.11","c":24,"q":"Posttransplant lymphoproliferative disorder is linked to:","o":["Epstein-Barr virus and immunosuppression","Tuberculosis","Smoking","Sleep apnea","Asthma"],"a":0,"e":"It is a B-cell proliferation seen in transplant recipients."},{"id":"B7.1","c":7,"q":"A 70-year-old former smoker has 18 months of dry cough, exertional dyspnea, bibasilar inspiratory crackles, and clubbing. HRCT shows subpleural basal honeycombing with traction bronchiectasis and no atypical features. The most likely diagnosis is:","o":["Organizing pneumonia","Sarcoidosis","Asthma","Idiopathic pulmonary fibrosis","Hypersensitivity pneumonitis"],"a":3,"e":"A UIP pattern in the right clinical setting is diagnostic without biopsy."},{"id":"B7.2","c":7,"q":"Which HRCT finding is most atypical for a usual interstitial pneumonia pattern?","o":["Basal subpleural predominance","Reticulation","Honeycombing","Extensive mosaic attenuation with three-density sign","Traction bronchiectasis"],"a":3,"e":"Air trapping with the three-density sign suggests hypersensitivity pneumonitis."},{"id":"B7.3","c":7,"q":"The best next step for a patient with an indeterminate HRCT pattern and a suspected interstitial lung disease is:","o":["Multidisciplinary discussion, with biopsy considered if still unresolved","Antibiotics","Immediate lobectomy","Immediate steroids","Observation without review"],"a":0,"e":"Integration of clinical, radiologic, and pathologic data is the standard."},{"id":"B7.4","c":7,"q":"Nintedanib for a patient with idiopathic pulmonary fibrosis is dosed at:","o":["150 mg once daily","300 mg twice daily","600 mg three times daily","150 mg twice daily with food","50 mg daily"],"a":3,"e":"The label dose is 150 mg twice daily, with a reduction to 100 mg twice daily for adverse effects."},{"id":"B7.5","c":7,"q":"A patient taking nintedanib develops diarrhea and elevated liver enzymes. Which action is correct?","o":["Dose reduction, treatment interruption, and monitoring","Stop all follow-up","Double the dose","Add steroids","Ignore the results"],"a":0,"e":"Adverse effects are managed with dose adjustment."},{"id":"B7.6","c":7,"q":"A patient with mild hepatic impairment (Child-Pugh A) starts nintedanib. The label dose is:","o":["100 mg twice daily","200 mg twice daily","300 mg twice daily","No dose","150 mg twice daily"],"a":0,"e":"Use the reduced dose in mild impairment, and it is not recommended in moderate or severe impairment."},{"id":"B7.7","c":7,"q":"In a patient who smokes, nintedanib exposure is:","o":["Unmeasurable","Unchanged","Contraindicated","Higher","Lower, so cessation should be encouraged"],"a":4,"e":"Smoking lowers drug exposure."},{"id":"B7.8","c":7,"q":"Pirfenidone is started with which titration?","o":["801 mg once daily","267 mg three times daily for the first week, then 534 mg three times daily for the second week, then 801 mg three times daily","2,403 mg once daily","100 mg daily","Full dose at once"],"a":1,"e":"The label uses a 14-day titration to the maintenance dose."},{"id":"B7.9","c":7,"q":"The maximum daily dose of pirfenidone is:","o":["801 mg","2,403 mg","4,806 mg","1,200 mg","3,000 mg"],"a":1,"e":"Three divided doses of 801 mg."},{"id":"B7.10","c":7,"q":"A patient stops pirfenidone for 3 weeks because of an illness. How should it be restarted?","o":["At full dose","Repeat the titration schedule","Never restart","At double dose","At a random dose"],"a":1,"e":"After a gap of 14 days or more, re-titrate."},{"id":"B7.11","c":7,"q":"A patient on pirfenidone is prescribed ciprofloxacin, a moderate CYP1A2 inhibitor, 750 mg twice daily. Per the label, the pirfenidone dose becomes:","o":["267 mg once daily","801 mg three times daily","No change","534 mg three times daily","Contraindicated"],"a":3,"e":"The label specifies the adjustment."},{"id":"B7.12","c":7,"q":"Which adverse effect of pirfenidone should be specifically counseled?","o":["Hyperthyroidism","Photosensitivity and nausea","Gingival hyperplasia","Hearing loss","Alopecia"],"a":1,"e":"Sun protection and taking the drug with food are advised."},{"id":"B7.13","c":7,"q":"According to the 2022 guideline, progressive pulmonary fibrosis is identified by:","o":["A single abnormal radiograph","Cough alone","Worsening symptoms, physiology, or imaging within the past year in a patient with a non-IPF fibrosing disease","Smoking history","Age over 65"],"a":2,"e":"Progression across clinical, physiologic, and radiologic domains defines it."},{"id":"B7.14","c":7,"q":"Nintedanib is approved for which of these indications?","o":["Cystic fibrosis","Sarcoidosis alone","Asthma","Pneumonia","Idiopathic pulmonary fibrosis, chronic fibrosing interstitial lung disease with a progressive phenotype, and systemic sclerosis-associated interstitial lung disease"],"a":4,"e":"The label covers these three uses."},{"id":"B7.15","c":7,"q":"Which treatment is recommended against in idiopathic pulmonary fibrosis because of harm in a trial?","o":["Pulmonary rehabilitation","Antifibrotic therapy","Oxygen for hypoxemia","Vaccination","Combination prednisone, azathioprine, and N-acetylcysteine"],"a":4,"e":"The triple combination increased deaths and hospitalizations."},{"id":"B7.16","c":7,"q":"A patient with idiopathic pulmonary fibrosis has acute worsening over 3 weeks with new bilateral ground-glass opacities and no infection or heart failure. This is:","o":["Pleural effusion","Asthma","Pneumothorax","Acute exacerbation of idiopathic pulmonary fibrosis","Pulmonary embolism"],"a":3,"e":"The diagnosis requires exclusion of other causes and carries a poor prognosis."},{"id":"B7.17","c":7,"q":"Which supportive care measure improves quality of life in fibrotic interstitial lung disease?","o":["Bed rest","Opioid avoidance without discussion","Pulmonary rehabilitation and appropriate oxygen","No vaccination","Smoking"],"a":2,"e":"Rehabilitation improves exercise capacity and symptoms."},{"id":"B7.18","c":7,"q":"A patient with idiopathic pulmonary fibrosis is considered for transplant. The best time to refer is:","o":["Early after diagnosis, if age and comorbidities allow","After ventilation","After age 90","At respiratory failure only","Never"],"a":0,"e":"Early referral allows planning."},{"id":"B7.19","c":7,"q":"Which idiopathic interstitial pneumonia is strongly tied to smoking and shows pigmented macrophages in alveoli?","o":["Acute interstitial pneumonia","Desquamative interstitial pneumonia","Usual interstitial pneumonia","Lymphoid interstitial pneumonia","Organizing pneumonia"],"a":1,"e":"Smoking-related disease shows macrophage accumulation."},{"id":"B8.1","c":8,"q":"A woman with systemic sclerosis has a decline in forced vital capacity and a nonspecific interstitial pneumonia pattern. Which antifibrotic has an indication for systemic sclerosis interstitial lung disease?","o":["Methotrexate","Azithromycin","Montelukast","Pirfenidone for systemic sclerosis specifically","Nintedanib"],"a":4,"e":"The label covers systemic sclerosis-associated interstitial lung disease."},{"id":"B8.2","c":8,"q":"Which interstitial pattern is typical of systemic sclerosis?","o":["Granulomatous","Nonspecific interstitial pneumonia","Pleural plaques","Usual interstitial pneumonia only","Cavitary"],"a":1,"e":"NSIP is the most common pattern."},{"id":"B8.3","c":8,"q":"A patient with rheumatoid arthritis has an interstitial lung disease. The most common pattern is:","o":["Cystic disease","Alveolar proteinosis","Pleural plaques","Granulomatous disease only","Usual interstitial pneumonia"],"a":4,"e":"Rheumatoid disease can show a UIP pattern, with worse prognosis."},{"id":"B8.4","c":8,"q":"A patient with proximal weakness, mechanic's hands, and interstitial lung disease has antisynthetase antibodies. The syndrome is:","o":["Sarcoidosis","Lupus","Antisynthetase syndrome","Scleroderma","Sjogren syndrome"],"a":2,"e":"Myositis, interstitial lung disease, and arthritis form the syndrome."},{"id":"B8.5","c":8,"q":"A patient with rapidly progressive interstitial lung disease and amyopathic dermatomyositis has anti-MDA5 antibodies. The expected course is:","o":["Benign","Rapid progression with high mortality","No lung disease","Slow progression","Spontaneous resolution"],"a":1,"e":"Early aggressive evaluation is needed."},{"id":"B8.6","c":8,"q":"A 35-year-old woman has bilateral hilar adenopathy, erythema nodosum, and arthralgia. The diagnosis is:","o":["Tuberculosis","Lymphoma","Histoplasmosis","Silicosis","Lofgren syndrome (sarcoidosis)"],"a":4,"e":"The syndrome has a good prognosis."},{"id":"B8.7","c":8,"q":"A patient with sarcoidosis has hypercalcemia and a high ACE level. Which statement is correct?","o":["ACE predicts response","ACE is diagnostic","ACE excludes disease","Serum ACE is neither sensitive nor specific for diagnosis","ACE replaces biopsy"],"a":3,"e":"Biopsy evidence of noncaseating granulomas remains central."},{"id":"B8.8","c":8,"q":"A sarcoidosis patient has cardiac palpitations and a conduction block. What should be done?","o":["Stop all follow-up","Reassure","Give antibiotics","Treat as anxiety","Evaluate for cardiac sarcoidosis with ECG, imaging, and specialist input"],"a":4,"e":"Cardiac sarcoidosis causes arrhythmia and sudden death."},{"id":"B8.9","c":8,"q":"In sarcoidosis, the main indication to start treatment is:","o":["Elevated ACE alone","Threatened organ function or severe symptoms","Asymptomatic stage I disease","Hilar adenopathy alone on radiograph","A patient request without findings"],"a":1,"e":"Asymptomatic disease is often observed."},{"id":"B8.10","c":8,"q":"A patient with a bird hobby has cough, dyspnea, crackles, and HRCT with centrilobular nodules and mosaic attenuation with air trapping. The diagnosis is:","o":["Sarcoidosis","Pneumonia","Idiopathic pulmonary fibrosis","Hypersensitivity pneumonitis","Lung cancer"],"a":3,"e":"The exposure and the imaging fit."},{"id":"B8.11","c":8,"q":"The most important treatment in hypersensitivity pneumonitis is:","o":["Surgery","Antigen avoidance","Chronic antibiotics","Oxygen alone","Diuretics"],"a":1,"e":"Identify and remove the exposure."},{"id":"B8.12","c":8,"q":"A patient on long-term amiodarone develops dyspnea, a reduced DLCO, and new opacities. The first step is:","o":["Evaluate for amiodarone pulmonary toxicity and discuss stopping","Surgery","Increase the dose","Ignore","Start antifungals"],"a":0,"e":"Drug-induced lung disease is considered in every patient on amiodarone."},{"id":"B8.13","c":8,"q":"A patient treated with bleomycin develops dry cough and fibrosis. A risk factor for toxicity is:","o":["Vegetarian diet","High cumulative dose and supplemental oxygen exposure","Young age only","Low dose","No risk factors"],"a":1,"e":"Both increase risk."},{"id":"B8.14","c":8,"q":"Nitrofurantoin can cause:","o":["Acute hypersensitivity pneumonitis and chronic fibrosis","Thyroid disease","Only rash","Hearing loss","Cataracts"],"a":0,"e":"Acute and chronic pulmonary reactions occur."},{"id":"B8.15","c":8,"q":"A patient on methotrexate has fever, dry cough, and hypoxemia with diffuse ground-glass opacities. The diagnosis to consider is:","o":["Aspiration","Pneumothorax","Pulmonary embolism only","Asthma","Methotrexate pneumonitis"],"a":4,"e":"It is an idiosyncratic hypersensitivity reaction."},{"id":"B8.16","c":8,"q":"A patient on a checkpoint inhibitor has new cough and ground-glass opacities. The correct approach is:","o":["Hold the drug, exclude infection, and treat as immune-related pneumonitis","Continue unchanged","Add antibiotics only","Increase the dose","Ignore"],"a":0,"e":"Severity grading determines steroid use."},{"id":"B8.17","c":8,"q":"A patient has fever, dry cough, and peripheral eosinophilia with peripheral \"photographic negative\" opacities. The diagnosis is:","o":["Pulmonary edema","Sarcoidosis","Chronic eosinophilic pneumonia","Pneumocystis pneumonia","Fibrosis"],"a":2,"e":"It responds quickly to corticosteroids."},{"id":"B8.18","c":8,"q":"A patient has migratory peripheral opacities, a reverse halo sign, and subacute fever. The diagnosis to consider is:","o":["Emphysema","Cryptogenic organizing pneumonia","Pneumonia only","Sarcoidosis","Idiopathic pulmonary fibrosis"],"a":1,"e":"Organizing pneumonia gives migrating opacities."},{"id":"B8.19","c":8,"q":"A young woman has cystic lung disease, recurrent pneumothorax, and renal angiomyolipoma. The diagnosis is:","o":["Sarcoidosis","Birt-Hogg-Dube syndrome","Pulmonary Langerhans cell histiocytosis","Emphysema","Lymphangioleiomyomatosis"],"a":4,"e":"The combination suggests lymphangioleiomyomatosis, often with tuberous sclerosis."},{"id":"B8.20","c":8,"q":"A smoker has upper lobe nodules and cysts with sparing of the costophrenic angles. The diagnosis is:","o":["Cystic fibrosis","Lymphangioleiomyomatosis","Asthma","Bronchiectasis","Pulmonary Langerhans cell histiocytosis"],"a":4,"e":"Smoking cessation is the cornerstone."},{"id":"B8.21","c":8,"q":"A patient has crazy-paving on CT, a milky lavage fluid, and slowly progressive dyspnea. The diagnosis is:","o":["Pulmonary alveolar proteinosis","Pneumonia","Asthma","Heart failure","Fibrosis"],"a":0,"e":"Whole-lung lavage is a standard therapy."},{"id":"B8.22","c":8,"q":"Autoimmune pulmonary alveolar proteinosis is associated with antibodies against:","o":["Acetylcholine receptor","Granulocyte-macrophage colony-stimulating factor","Cardiolipin","Nuclear antigens","Tissue transglutaminase"],"a":1,"e":"Anti-GM-CSF antibodies cause most adult cases."},{"id":"B8.23","c":8,"q":"A patient with Goodpasture disease has hemoptysis and kidney failure with anti-glomerular basement membrane antibodies. The key treatment is:","o":["Bronchodilators","Oxygen only","Antibiotics only","Plasma exchange with immunosuppression","Observation"],"a":3,"e":"Urgent therapy is needed to preserve kidney function."},{"id":"B8.24","c":8,"q":"A patient with Sjogren syndrome has cystic lung disease and lymphocytic infiltration. This is:","o":["Pulmonary embolism","Lymphocytic interstitial pneumonia","Silicosis","Usual interstitial pneumonia","Sarcoidosis"],"a":1,"e":"It is associated with Sjogren syndrome."},{"id":"B8.25","c":8,"q":"The best test to screen interstitial lung disease in a patient with scleroderma is:","o":["High-resolution CT","Chest radiograph alone","Urinalysis","Allergy testing","Sputum culture"],"a":0,"e":"HRCT is more sensitive than radiograph."},{"id":"B8.26","c":8,"q":"A patient with systemic lupus erythematosus has acute pleuritic chest pain, dyspnea, and hypoxemia with clear lungs. The cause to consider is:","o":["Asthma","Shrinking lung syndrome or pulmonary embolism with antiphospholipid antibodies","Pneumonia only","COPD","Pneumothorax only"],"a":1,"e":"Lupus carries a thrombotic risk."},{"id":"B8.27","c":8,"q":"A patient with mixed connective tissue disease has pulmonary hypertension. The test best for screening is:","o":["Spirometry","Echocardiography with natriuretic peptide","Chest radiograph","Skin biopsy","ECG only"],"a":1,"e":"Screening is important in connective tissue disease."},{"id":"B8.28","c":8,"q":"Which finding supports connective tissue disease over idiopathic pulmonary fibrosis?","o":["Cough","Smoking history","Dyspnea","Raynaud phenomenon, rash, or positive serology","Basal crackles"],"a":3,"e":"Extrapulmonary features point to systemic disease."},{"id":"B8.29","c":8,"q":"A patient has nonspecific interstitial pneumonia with subpleural sparing. The most likely underlying condition is:","o":["Asthma","Lung cancer","A connective tissue disease or drug reaction","Pneumothorax","Silicosis"],"a":2,"e":"NSIP is often secondary."},{"id":"B8.30","c":8,"q":"Which test is most useful to evaluate for hypersensitivity pneumonitis?","o":["Colonoscopy","Spirometry alone","Detailed exposure history, serum precipitins, and HRCT","Echocardiography","Skin biopsy"],"a":2,"e":"Exposure assessment is key."},{"id":"B8.31","c":8,"q":"A patient with end-stage fibrotic sarcoidosis has hypoxemia. Which referral is appropriate?","o":["Observation","Steroid only","Antibiotics","Surgery for nodules","Evaluation for lung transplantation"],"a":4,"e":"Advanced fibrotic disease may warrant transplant."},{"id":"B8.32","c":8,"q":"A patient with radiation exposure to the lung develops cough and infiltrates conforming to the field 8 weeks later. The diagnosis is:","o":["Tuberculosis","Radiation pneumonitis","Pulmonary embolism","Asthma","Sarcoidosis"],"a":1,"e":"Timing and field distribution guide the diagnosis."},{"id":"B8.33","c":8,"q":"A patient with chronic aspiration has recurrent infiltrates in dependent segments and bronchiolitis. The management includes:","o":["Surgery","Swallow evaluation and aspiration precautions","Steroids","Nothing","Oxygen only"],"a":1,"e":"Address the cause."},{"id":"B8.34","c":8,"q":"A patient with a new interstitial lung disease takes several medications. The first diagnostic step related to drugs is:","o":["Stop everything without review","Ignore drugs","Order a biopsy first","Review all current and past drugs, including over-the-counter agents","Only review antibiotics"],"a":3,"e":"A systematic drug history is essential."},{"id":"B8.35","c":8,"q":"Sarcoidosis commonly involves which organs besides the lung?","o":["Only the brain","None","Only the thyroid","Skin, eyes, lymph nodes, liver, and heart","Only the foot"],"a":3,"e":"A multi-organ screen is recommended."},{"id":"B8.36","c":8,"q":"The main reason to obtain a multidisciplinary discussion in interstitial lung disease is:","o":["To reduce visits","To replace the history","To delay care","To combine clinical, radiologic, and pathologic data into the best diagnosis","To avoid imaging"],"a":3,"e":"It improves diagnostic confidence."},{"id":"B4.1","c":4,"q":"A 24-year-old woman has recurrent wheeze and cough at night. Spirometry shows an FEV1 of 2.4 L before and 2.8 L after bronchodilator. By the adult criteria, this response is:","o":["Diagnostic of COPD","Diagnostic of restriction","Positive, because the rise is at least 12% and at least 200 mL","Not interpretable","Negative"],"a":2,"e":"A rise of 400 mL is about 17%, which exceeds both thresholds."},{"id":"B4.2","c":4,"q":"A patient's morning and evening peak flows differ by 14% on average over 2 weeks. In an adult, this variability is:","o":["Meaningless","Diagnostic of COPD","Above the 10% threshold and supports asthma","Normal","Diagnostic of heart failure"],"a":2,"e":"More than 10% diurnal variability supports variable airflow limitation."},{"id":"B4.3","c":4,"q":"A child has diurnal peak flow variability of 11% over 2 weeks. By the pediatric threshold, this is:","o":["Not measurable","Above the threshold","Diagnostic","Excluded","Below the 13% threshold"],"a":4,"e":"The pediatric threshold is more than 13%."},{"id":"B4.4","c":4,"q":"Bronchial provocation testing with methacholine supports asthma when the FEV1 falls by at least:","o":["40%","10%","8%","5%","20%"],"a":4,"e":"A fall of 20% or more is positive for methacholine."},{"id":"B4.5","c":4,"q":"Before bronchodilator testing, how long should a long-acting beta agonist such as formoterol be withheld?","o":["Not at all","7 days","24 hours","4 hours","1 hour"],"a":2,"e":"Formoterol and salmeterol should be held 24 hours."},{"id":"B4.6","c":4,"q":"A fractional exhaled nitric oxide of 62 ppb in an adult with chronic cough:","o":["Proves COPD","Indicates infection","Excludes asthma","Supports type 2 inflammation but does not make or exclude asthma","Proves asthma"],"a":3,"e":"Above 50 ppb supports type 2 inflammation but is not diagnostic."},{"id":"B4.7","c":4,"q":"A 30-year-old man with new asthma symptoms has not started treatment. Why is it best to document variability before treatment?","o":["Steroids damage the test equipment","Spirometry only works untreated","Variability fades once anti-inflammatory therapy begins","Treatment prevents the test from being valid forever","Insurance requires it"],"a":2,"e":"Treatment can mask variable airflow limitation."},{"id":"B4.8","c":4,"q":"Which patient best matches a type 2 high phenotype?","o":["Asthma with no inflammation","Obesity-related late-onset neutrophilic asthma","Early-onset allergic asthma with raised eosinophils and exhaled nitric oxide","Pure vocal cord dysfunction","Smoking-related asthma"],"a":2,"e":"Type 2 high disease is allergic or eosinophilic."},{"id":"B4.9","c":4,"q":"In the GINA 2026 report, the preferred reliever for adults and adolescents is:","o":["Theophylline","Oral steroid","Low-dose inhaled corticosteroid plus formoterol (Track 1)","Short-acting beta agonist alone","Montelukast"],"a":2,"e":"The anti-inflammatory reliever lowers severe exacerbations."},{"id":"B4.10","c":4,"q":"A short-acting beta agonist used alone at Step 1 is:","o":["Recommended at all steps","Preferred at Step 1","No longer the treatment of choice at any step","Required","Better than ICS-formoterol"],"a":2,"e":"GINA no longer endorses SABA-only treatment."},{"id":"B4.11","c":4,"q":"What is new in the Track 2 reliever options in GINA 2026?","o":["Anticholinergic reliever","Oral steroid reliever","Montelukast reliever","Antihistamine reliever","A combination of inhaled corticosteroid and short-acting beta agonist"],"a":4,"e":"The combination reliever was added."},{"id":"B4.12","c":4,"q":"A patient in Track 1 has symptoms twice a week and takes as-needed low-dose ICS-formoterol. Which Step is this?","o":["Steps 1 to 2","Step 4","Step 5","Step 3","Step 0"],"a":0,"e":"As-needed ICS-formoterol is the preferred approach at Steps 1 and 2."},{"id":"B4.13","c":4,"q":"At Step 3 in Track 1, the treatment is:","o":["Low-dose ICS-formoterol as maintenance and reliever therapy","Oral steroid","SABA alone","High-dose ICS","Biologic"],"a":0,"e":"Maintenance and reliever therapy applies at Step 3."},{"id":"B4.14","c":4,"q":"In maintenance and reliever therapy, the low-dose regimen is:","o":["One inhalation twice daily plus one as needed","Four inhalations daily only","One inhalation weekly","Ten inhalations daily","Two inhalations twice daily plus one as needed"],"a":0,"e":"Medium dose is two inhalations twice daily."},{"id":"B4.15","c":4,"q":"With budesonide-formoterol, one inhalation delivers:","o":["80 mcg budesonide and 9 mcg formoterol","400 mcg budesonide and 12 mcg formoterol","800 mcg budesonide and 4.5 mcg formoterol","50 mcg of each","160 mcg budesonide and 4.5 mcg formoterol"],"a":4,"e":"This is the delivered dose per inhalation."},{"id":"B4.16","c":4,"q":"A patient on maintenance and reliever therapy has used 14 inhalations in 24 hours. The correct action is:","o":["Seek medical care, because more than 12 inhalations exceeds the safe limit","Continue","Ignore","Switch to oral steroid at home","Double the dose"],"a":0,"e":"More than 12 total inhalations or 54 mcg of formoterol in 24 hours needs medical review."},{"id":"B4.17","c":4,"q":"GINA does not recommend which regimen in Track 1 Step 4?","o":["Referral","Add-on LAMA","High-dose ICS-formoterol maintenance","Biologic evaluation","Medium-dose maintenance and reliever therapy"],"a":2,"e":"High-dose maintenance is not recommended in Track 1."},{"id":"B4.18","c":4,"q":"A daily budesonide dose of 600 mcg in an adult is:","o":["High","Medium","Not an inhaled steroid","Very low","Low"],"a":1,"e":"More than 400 to 800 mcg is medium."},{"id":"B4.19","c":4,"q":"A daily fluticasone propionate dry powder dose of 600 mcg is:","o":["High","Low","Equivalent to budesonide 600 mcg","Very low","Medium"],"a":0,"e":"More than 500 mcg is high; doses are not potency-equivalent across drugs."},{"id":"B4.20","c":4,"q":"A daily beclometasone dipropionate dose of 300 mcg is:","o":["High","Low","Very high","Medium","Not a steroid"],"a":1,"e":"The low band is 200 to 500 mcg."},{"id":"B4.21","c":4,"q":"A patient has poorly controlled asthma on medium-dose ICS-LABA. What should be checked first?","o":["Surgery","Oral steroids","Thermoplasty","Biologic eligibility","Inhaler technique, adherence, triggers, and comorbidities"],"a":4,"e":"Many cases of uncontrolled asthma are not truly severe."},{"id":"B4.22","c":4,"q":"A patient on medication for rhinitis and reflux has poorly controlled asthma. Why treat these conditions?","o":["They cure asthma","They are unrelated","They are irrelevant","They cause cancer","Untreated comorbidities worsen control"],"a":4,"e":"Treating comorbid disease improves asthma control."},{"id":"B4.23","c":4,"q":"A patient on beta-blockers has worsening asthma. The best step is:","o":["Add oral steroid","Increase beta-blocker","Add antibiotics","Review and stop non-selective beta-blockers if possible","Ignore"],"a":3,"e":"Beta-blockers can precipitate bronchospasm."},{"id":"B4.24","c":4,"q":"When stepping down therapy after good control, the advice is to:","o":["Switch to oral steroid","Stop ICS at once","Stop all drugs","Double the ICS dose","Reduce the ICS dose in modest steps and not stop it completely in adults"],"a":4,"e":"Complete withdrawal raises the risk of exacerbation."},{"id":"B4.25","c":4,"q":"Step-down should be most cautious:","o":["When the patient is on vacation","In young adults only","During winter holidays only","Never","After a recent exacerbation, in pregnancy, or in peak allergen season"],"a":4,"e":"These periods carry higher risk."},{"id":"B4.26","c":4,"q":"Add-on options at Step 5 include:","o":["No options","A trial of high-dose ICS-LABA, a LAMA, azithromycin after referral, and biologics","Antibiotics for all","Surgery for all","Oral steroids as first choice"],"a":1,"e":"Specialist assessment guides add-on therapy."},{"id":"B4.27","c":4,"q":"The maximum low-dose oral prednisone-equivalent suggested as a last resort in severe asthma is:","o":["7.5 mg per day","2 mg per day","100 mg per day","40 mg per day","60 mg per day"],"a":0,"e":"Low-dose oral corticosteroid carries cumulative risks."},{"id":"B4.28","c":4,"q":"Which biologic class is aimed at IgE?","o":["Anti-TSLP","Anti-IgE","Anti-TNF","Anti-IL4 receptor","Anti-IL5"],"a":1,"e":"Anti-IgE helps allergic asthma."},{"id":"B4.29","c":4,"q":"A patient with eosinophilic asthma, nasal polyps, and oral steroid dependence is best matched to:","o":["Antibiotics","Bronchial thermoplasty first in all cases","Anti-TNF therapy","Dupilumab or an anti-IL-5 agent, chosen by phenotype and comorbidity","Antifungals"],"a":3,"e":"Type 2 pathway biologics fit this phenotype."},{"id":"B4.30","c":4,"q":"Before an anti-IL-5 biologic in a patient from an endemic area, which check is advised?","o":["Screen for helminth infection","Obtain an echocardiogram","Obtain a bone scan","Check cholesterol","Check thyroid"],"a":0,"e":"Helminth infection should be treated before eosinophil-lowering therapy."},{"id":"B4.31","c":4,"q":"Which statement about the general screen for refractory type 2 inflammation in a patient on high-dose inhaled steroid is correct? (This screen is provisional; confirm in the current GINA text.)","o":["IgE only","Any value is fine","Eosinophils below 10","Blood eosinophils of 150 per microliter or more, or FeNO of 20 ppb or more on high-dose ICS or daily oral steroid, suggests refractory type 2 inflammation","FeNO below 5"],"a":3,"e":"The product-specific criteria still vary and must be read in the label."},{"id":"B4.32","c":4,"q":"In a severe asthma patient, the label for any biologic must be checked because:","o":["Only brand names differ","Labels do not matter","Age limits and eosinophil, IgE, and exacerbation criteria differ between products","All labels are the same","Only price differs"],"a":2,"e":"Eligibility is product-specific."},{"id":"B4.33","c":4,"q":"A 27-year-old man has an acute exacerbation after a cold, saturation of 91%, and speaks in short phrases. The first drug is:","o":["Antibiotics","Chest radiograph first","Sedation","Magnesium alone","A short-acting beta agonist, repeated during the first hour"],"a":4,"e":"Rapid-acting bronchodilator is first-line."},{"id":"B4.34","c":4,"q":"In primary care, the initial short-acting beta agonist regimen for a mild to moderate flare is:","o":["A single puff daily","Four puffs by spacer, one at a time, repeated as needed in the first hour","Twenty puffs at once","One puff weekly","No bronchodilator"],"a":1,"e":"Repeat dosing in the first hour is standard."},{"id":"B4.35","c":4,"q":"Ipratropium in an acute exacerbation is added for:","o":["Mild cases only","Moderate to severe presentations, up to three times with the beta agonist","Maintenance therapy","Outpatient prevention","Children under 2 only"],"a":1,"e":"It gives no extra benefit after the first one to two hours."},{"id":"B4.36","c":4,"q":"Systemic corticosteroid for an adult exacerbation is:","o":["10 mg weekly","5 mg once","Not recommended","Prednisone or prednisolone 1 mg/kg daily up to 50 mg, for 5 to 7 days","200 mg daily for 30 days"],"a":3,"e":"Early dosing shortens the exacerbation."},{"id":"B4.37","c":4,"q":"Oxygen in an acute asthma exacerbation is given:","o":["Never","Only if saturation is below 92%, aiming for no more than 95%","Only after intubation","To keep saturation at 100%","At 15 L/min always"],"a":1,"e":"Controlled oxygen is targeted."},{"id":"B4.38","c":4,"q":"Intravenous magnesium sulfate in a severe exacerbation that fails initial treatment is:","o":["2 g over 20 minutes","200 mg over 5 minutes","Nebulized only","2 g over 24 hours","20 g over 1 minute"],"a":0,"e":"Nebulized magnesium has not shown a significant benefit."},{"id":"B4.39","c":4,"q":"An asthmatic with anaphylaxis features should receive:","o":["Antibiotics","Steroid only","Magnesium","Antihistamine only","Epinephrine first"],"a":4,"e":"Epinephrine is the first-line drug."},{"id":"B4.40","c":4,"q":"A drowsy asthmatic with a silent chest and rising PaCO2 needs:","o":["Sedation","Observation only","Intensive care assessment for ventilatory support","More fluids","Discharge"],"a":2,"e":"These are signs of impending respiratory failure."},{"id":"B4.41","c":4,"q":"Routine chest radiograph in an acute exacerbation is indicated:","o":["Never","To adjust steroids","To measure FEV1","Only for a specific reason such as suspected pneumonia or pneumothorax","Always"],"a":3,"e":"Routine imaging is not needed."},{"id":"B4.42","c":4,"q":"At discharge after an exacerbation, the best step is:","o":["Defer follow-up for a year","Switch to a preferred anti-inflammatory reliever plan, check technique, and arrange follow-up within a week","Prescribe oral steroids long term","Stop all inhalers","Prescribe only a SABA"],"a":1,"e":"Discharge is an opportunity to optimize care."},{"id":"B4.43","c":4,"q":"A 38-year-old bakery worker has symptoms that improve on holidays. The best next step is:","o":["Reassure","Serial peak flow at work and away from work and review of exposures","Stop inhalers","Start antibiotics","Increase steroids"],"a":1,"e":"Occupational asthma is suspected."},{"id":"B4.44","c":4,"q":"Which agent is a classic sensitizer causing occupational asthma?","o":["Sugar","Salt","Pure water","Isocyanates","Nitrogen"],"a":3,"e":"Isocyanates, flour, latex, and animal proteins are common."},{"id":"B4.45","c":4,"q":"The most effective management of occupational asthma is:","o":["Continuing exposure","Early removal from exposure plus standard therapy","Steroids alone","Antibiotics","Surgery"],"a":1,"e":"Early removal gives the best chance of recovery."},{"id":"B4.46","c":4,"q":"A pregnant woman with asthma is worried about inhaled steroids. The correct advice is:","o":["Use only oral steroids","Stop all inhalers","Uncontrolled asthma poses greater risk than controller drugs, so continue the inhaled steroid","Switch to antibiotics","Avoid treatment"],"a":2,"e":"Control protects mother and baby."},{"id":"B4.47","c":4,"q":"A patient has episodic noisy inspiration, abrupt onset, and a normal saturation that does not respond to bronchodilators. The diagnosis is:","o":["Vocal cord dysfunction","Pneumonia","Heart failure","Pulmonary embolism","Severe asthma"],"a":0,"e":"Laryngoscopy during symptoms confirms it."},{"id":"B4.48","c":4,"q":"The treatment of vocal cord dysfunction is:","o":["Surgery","Speech therapy and breathing retraining, with attention to reflux and rhinitis","Higher-dose inhaled steroids","Antibiotics","Biologics"],"a":1,"e":"Escalating asthma therapy does not help."},{"id":"B4.49","c":4,"q":"A flattened inspiratory limb on a flow-volume loop points to:","o":["Variable extrathoracic obstruction","Restriction","Fixed intrathoracic obstruction","Normal","Emphysema"],"a":0,"e":"This is the classic loop for vocal cord dysfunction."},{"id":"B4.50","c":4,"q":"A teenager moving to adult care has a risk of dropping out. The best step is:","o":["No planning","Delay care","Discharge without records","Stopping medications","A written action plan and a named adult clinic before transfer"],"a":4,"e":"Transition planning reduces loss to follow-up."},{"id":"B5.1","c":5,"q":"A 64-year-old former smoker has dyspnea (mMRC 3), CAT of 18, and no exacerbations in the past year. Under GOLD 2026, the group and first-line therapy are:","o":["Group B, LABA plus LAMA","Group A, a single bronchodilator","Group A, ICS alone","Group E, triple therapy","No treatment"],"a":0,"e":"High symptoms and no exacerbations place the patient in group B."},{"id":"B5.2","c":5,"q":"A man had two moderate exacerbations last year and has mild symptoms. His GOLD 2026 group is:","o":["B","C","A","E","D"],"a":3,"e":"Any exacerbation history of one or more moderate events places the patient in group E."},{"id":"B5.3","c":5,"q":"The 2026 report changed group E to include:","o":["Two severe events","Cough alone","Low FEV1 alone","Only hospitalized exacerbations","A single moderate exacerbation in the past year"],"a":4,"e":"Older versions required two moderate events or one hospitalization."},{"id":"B5.4","c":5,"q":"A patient with COPD has FEV1 of 38% predicted but no exacerbations and few symptoms. Under GOLD 2026, treatment choice depends mainly on:","o":["Age","Symptoms and exacerbation history","Body mass index","FEV1 alone","Smoking pack-years"],"a":1,"e":"FEV1 is not the primary driver of group assignment."},{"id":"B5.5","c":5,"q":"Post-bronchodilator spirometry confirms COPD when:","o":["DLCO is normal","Total lung capacity is low","Airflow limitation persists after bronchodilator","FEV1 rises by 15%","The radiograph is clear"],"a":2,"e":"Persistent post-bronchodilator airflow limitation is required."},{"id":"B5.6","c":5,"q":"GOLD and the ATS/ERS differ on the spirometric definition because GOLD uses:","o":["A different test","Different drugs","A fixed ratio threshold, whereas the societies favor the lower limit of normal","Different symptoms","Different units"],"a":2,"e":"The two approaches can disagree in older and younger adults."},{"id":"B5.7","c":5,"q":"A LABA plus ICS without a LAMA in COPD is:","o":["The best choice for group B","Preferred over LABA plus LAMA","Required in all patients","Not recommended; use triple therapy when an inhaled steroid is indicated","First-line"],"a":3,"e":"LABA plus LAMA is the dual bronchodilator, and ICS goes on top as triple therapy."},{"id":"B5.8","c":5,"q":"A group E patient has a blood eosinophil count of 380 cells per microliter. The best addition to dual bronchodilators is:","o":["Theophylline","Antibiotics","Inhaled corticosteroid","Nothing","Oral steroid long term"],"a":2,"e":"Eosinophils at 300 or more favor adding ICS."},{"id":"B5.9","c":5,"q":"A blood eosinophil count below 100 cells per microliter suggests:","o":["Infection","Asthma","Less benefit from adding ICS","Heart failure","Strong benefit from ICS"],"a":2,"e":"Low eosinophils argue against ICS."},{"id":"B5.10","c":5,"q":"A patient on triple therapy with repeated pneumonias is likely to benefit from:","o":["Doubling the ICS","Stopping all inhalers","Considering withdrawal of the ICS if eosinophils are low","Starting oral steroid","Adding a second ICS"],"a":2,"e":"ICS increases pneumonia risk."},{"id":"B5.11","c":5,"q":"Roflumilast is most appropriate for a patient with:","o":["FEV1 below 50% predicted, chronic bronchitis, and exacerbations","Asthma only","Weight loss and depression as first choice","Normal spirometry","Mild COPD without exacerbations"],"a":0,"e":"Weight loss and psychiatric effects limit its use."},{"id":"B5.12","c":5,"q":"A former smoker has frequent exacerbations on triple therapy. Before azithromycin, which step is required?","o":["Rest","Oxygen","Add steroids","Surgery","Screen for nontuberculous mycobacteria and consider QT and hearing"],"a":4,"e":"Long-term macrolide use can promote mycobacterial resistance and has cardiac and ototoxic effects."},{"id":"B5.13","c":5,"q":"In GOLD 2026, a biologic is considered for a patient with:","o":["Normal eosinophils","Cough alone","An eosinophilic phenotype and exacerbations despite triple therapy, using the current label criteria","No exacerbations","Mild disease"],"a":2,"e":"Dupilumab and mepolizumab are in the follow-up algorithm for selected patients."},{"id":"B5.14","c":5,"q":"Dupilumab in COPD is aimed at patients with:","o":["Asthma only","Emphysema without exacerbations","Lung cancer","Chronic bronchitis, raised blood eosinophils, and continuing exacerbations","Mild disease"],"a":3,"e":"The label criteria should be checked before prescribing."},{"id":"B5.15","c":5,"q":"A patient hospitalized for a COPD exacerbation has pH 7.27, PaCO2 of 72 mm Hg, and is awake. The correct step is:","o":["Sedation","Observation","Intubation at once","High-flow oxygen at 100%","Noninvasive ventilation"],"a":4,"e":"Acute respiratory acidosis is the strongest indication."},{"id":"B5.16","c":5,"q":"The standard drug treatment of a moderate to severe exacerbation includes:","o":["Diuretics","Antibiotics only","Short-acting bronchodilators, a short systemic steroid course, and antibiotics when indicated","Steroids long term","Sedatives"],"a":2,"e":"These form the core treatment."},{"id":"B5.17","c":5,"q":"Antibiotics in an exacerbation are most indicated when:","o":["Any wheeze","A normal radiograph with no change in sputum","Sputum purulence plus increased dyspnea or volume, or when ventilatory support is needed","Cough alone","Mild symptoms"],"a":2,"e":"Purulent sputum and severity guide use."},{"id":"B5.18","c":5,"q":"A patient with an exacerbation becomes drowsy with a headache after oxygen is raised to 6 L/min. The first action is:","o":["Discharge","Observe","Raise oxygen","Add a sedative","Lower oxygen to the target range, check a blood gas, and consider ventilation"],"a":4,"e":"Uncontrolled oxygen worsens carbon dioxide retention."},{"id":"B5.19","c":5,"q":"An exacerbation of COPD can be triggered or mimicked by:","o":["Pulmonary embolism, pneumothorax, heart failure, pneumonia, and arrhythmia","Only smoking","Only infection","Sleep","Diet"],"a":0,"e":"Always look for the cause."},{"id":"B5.20","c":5,"q":"Routine tests on admission for an exacerbation include:","o":["Lung biopsy","Sleep study","Bronchoscopy","Chest radiograph and electrocardiogram","PET scan"],"a":3,"e":"These help exclude mimics."},{"id":"B5.21","c":5,"q":"After discharge from a COPD exacerbation, the best step is:","o":["Prescribe long-term steroids","No review","Review technique, optimize maintenance therapy, vaccinations, rehabilitation, and early follow-up","Delay follow-up for a year","Stop inhalers"],"a":2,"e":"The admission is a chance to change the regimen."},{"id":"B5.22","c":5,"q":"Pulmonary rehabilitation is recommended for:","o":["Every symptomatic patient and soon after an exacerbation","Only the mildest cases","Only young patients","Only those on oxygen","No one"],"a":0,"e":"It improves symptoms and exercise capacity."},{"id":"B5.23","c":5,"q":"Long-term oxygen therapy is prescribed for:","o":["Mild disease","Chronic severe resting hypoxemia, or hypoxemia with right heart strain or polycythemia, by the current criteria","Moderate hypoxemia alone","Dyspnea without hypoxemia","Exertional breathlessness only"],"a":1,"e":"It is not given for moderate hypoxemia alone."},{"id":"B5.24","c":5,"q":"Home noninvasive ventilation may help patients with:","o":["Asthma only","Pronounced daytime hypercapnia and a recent hospitalization","Mild disease","Normal gases","No symptoms"],"a":1,"e":"It is offered to a selected group through a clinic that can follow the patient."},{"id":"B5.25","c":5,"q":"Lung volume reduction is considered in patients with:","o":["Chronic bronchitis only","Mild disease","Restriction","Severe emphysema limited by breathlessness despite full treatment and rehabilitation","Asthma"],"a":3,"e":"Careful selection is required."},{"id":"B5.26","c":5,"q":"Lung volume reduction options include:","o":["Steroids","Antibiotics","Surgery and bronchoscopic valves or coils","Radiation","Oxygen"],"a":2,"e":"Selection depends on emphysema pattern and fissure integrity."},{"id":"B5.27","c":5,"q":"Alpha-1 antitrypsin deficiency should be suspected in:","o":["Pneumonia","Sleep apnea","Elderly smokers only","Early-onset emphysema, basal predominance, or a family history","Asthma only"],"a":3,"e":"Screen all patients with COPD once."},{"id":"B5.28","c":5,"q":"Which vaccine is part of routine COPD care?","o":["Typhoid","None","Influenza and pneumococcal, with others per the current schedule","Rabies","Yellow fever"],"a":2,"e":"Vaccination reduces exacerbations and pneumonia."},{"id":"B5.29","c":5,"q":"The intervention that slows decline in lung function in COPD is:","o":["Inhaled steroid","Rehabilitation","Smoking cessation","Antibiotics","Oxygen"],"a":2,"e":"It is the only intervention shown to slow decline."},{"id":"B5.30","c":5,"q":"A patient asks whether the inhaler should be taken when he feels well. The correct answer is:","o":["Only when symptomatic","Never","Only during infections","Only at night","Maintenance bronchodilators are taken regularly to prevent symptoms and exacerbations"],"a":4,"e":"Maintenance therapy works by regular use."},{"id":"B5.31","c":5,"q":"An older COPD patient has poor hand strength and cannot use a dry powder inhaler. The best step is:","o":["Match the device to the patient's ability and check technique","Add oral steroid","Continue the same device","Stop therapy","Ignore"],"a":0,"e":"Device choice affects drug delivery."},{"id":"B5.32","c":5,"q":"A patient has COPD and a CAT score of 24. This indicates:","o":["Heart failure","Normal findings","High symptom burden","Low symptom burden","Asthma"],"a":2,"e":"A score of 10 or more is high."},{"id":"B5.33","c":5,"q":"A patient with COPD and an mMRC grade 1 has symptoms only when hurrying. This is:","o":["High symptom burden","Asthma","Low symptom burden","Disability","Respiratory failure"],"a":2,"e":"mMRC 0 to 1 is low."},{"id":"B5.34","c":5,"q":"Disease activity as a target in GOLD 2026 refers to:","o":["Aiming for stability and prevention of exacerbations and deterioration","Stopping therapy","Ignoring symptoms","Increasing exacerbations","Using FEV1 only"],"a":0,"e":"Treatment should aim to keep the disease stable."},{"id":"B5.35","c":5,"q":"Palliative care in advanced COPD is:","o":["Used instead of rehabilitation","Not appropriate","Replaces inhalers","Reserved for the last days","Part of core therapy for symptom relief and planning"],"a":4,"e":"Early palliative support improves quality of life."},{"id":"B5.36","c":5,"q":"A patient with
