t":"Anterior mediastinum: thymoma, teratoma, thyroid, lymphoma."},{"id":"B15.10","c":15,"q":"A patient has a hilar mass and enlarged mediastinal nodes. The best minimally invasive tool to sample both is:","o":["Endobronchial ultrasound with needle aspiration","Rigid bronchoscopy","Skin biopsy","Chest tube","Thoracentesis"],"a":0,"e":"Endobronchial ultrasound with needle aspiration is the best minimally invasive tool to sample both hilar and mediastinal nodes. Rigid bronchoscopy, skin biopsy, chest tube and thoracentesis do not sample nodes.","t":"EBUS-TBNA samples hilar and mediastinal nodes."},{"id":"B15.11","c":15,"q":"A patient has a central airway obstruction from an endobronchial tumor with severe dyspnea. A rapid therapeutic option is:","o":["Inhalers","Steroids only","Antibiotics","Rigid bronchoscopy with debulking or stent placement","Observation"],"a":3,"e":"A central airway obstruction from an endobronchial tumor with severe dyspnea needs rapid interventional bronchoscopy, such as rigid bronchoscopy with debulking or stent placement. Inhalers, steroids alone, antibiotics or observation do not restore the airway.","t":"Critical central airway obstruction: rigid bronchoscopy, debulking or stent."},{"id":"B15.12","c":15,"q":"A patient is scheduled for airway stent placement. A key complication to counsel on is:","o":["Cataract","Stent migration, granulation tissue, and mucus plugging","Alopecia","Gout","Hearing loss"],"a":1,"e":"Airway stents can migrate, develop granulation tissue and become blocked with mucus, so counsel on these. Cataract, alopecia, gout and hearing loss are unrelated.","t":"Stent complications: migration, granulation tissue, mucus plugging."},{"id":"B15.13","c":15,"q":"What is the main advantage of pleural ultrasound before thoracentesis?","o":["Saving time only","Stopping anticoagulation","Sedation","Lower risk of pneumothorax","Staging cancer"],"a":3,"e":"Ultrasound guidance before thoracentesis lowers the risk of pneumothorax by locating fluid and the safe site. It does not stop anticoagulation, provide sedation or stage cancer.","t":"Ultrasound-guided thoracentesis reduces pneumothorax."},{"id":"B15.14","c":15,"q":"A patient develops re-expansion pulmonary edema after drainage of a large effusion. Prevention includes:","o":["Applying high suction","Ignoring symptoms","Removing everything at once","Limiting the volume removed and stopping if cough or chest tightness develops","Draining faster"],"a":3,"e":"To prevent re-expansion pulmonary edema, limit the volume removed (often 1 to 1.5 L) and stop if cough or chest tightness develops. High suction, ignoring symptoms, removing everything at once or draining faster raise the risk.","t":"Limit volume and stop for cough or chest tightness to avoid re-expansion edema."},{"id":"B15.15","c":15,"q":"Which tumor is the most common primary malignant tumor of the pleura?","o":["Lipoma","Fibrous tumor","Lymphoma","Thymoma","Malignant pleural mesothelioma"],"a":4,"e":"Malignant pleural mesothelioma is the most common primary malignant tumor of the pleura and is strongly linked to asbestos. Lipoma, solitary fibrous tumor, lymphoma and thymoma are less common or not primary malignant pleural tumors.","t":"Most common primary pleural malignancy: mesothelioma."},{"id":"B15.16","c":15,"q":"Typical latency between asbestos exposure and mesothelioma is:","o":["Weeks","One year","Decades","Days","Months"],"a":2,"e":"Mesothelioma emerges decades after asbestos exposure, typically 20 to 50 years. Latency is not days, weeks, months or one year.","t":"Mesothelioma latency: 20 to 50 years."},{"id":"B15.17","c":15,"q":"A 35-year-old nonsmoker has a slow-growing endobronchial lesion with hemoptysis. The likely tumor is:","o":["Lymphoma only","Squamous cell cancer only","Hamartoma only","Small cell cancer","Carcinoid tumor"],"a":4,"e":"A slow-growing endobronchial lesion with hemoptysis in a young nonsmoker is most likely a bronchial carcinoid tumor. Small cell and squamous cancers affect older smokers, and hamartoma and lymphoma have different patterns.","t":"Young nonsmoker with endobronchial lesion: carcinoid."},{"id":"B15.18","c":15,"q":"A patient with a carcinoid tumor and flushing and diarrhea has:","o":["Possible carcinoid syndrome","Sarcoidosis","Emphysema","Tuberculosis","Asthma"],"a":0,"e":"Flushing and diarrhea in a patient with a carcinoid tumor suggest carcinoid syndrome, which usually requires liver metastases because the liver clears the secreted hormones. Sarcoidosis, emphysema, tuberculosis and asthma do not cause this combination.","t":"Carcinoid syndrome: flushing and diarrhea, usually with liver metastases."},{"id":"B15.19","c":15,"q":"A patient with a hamartoma on CT shows:","o":["Honeycombing","Spiculation and cavitation","Fat and popcorn calcification","A tree-in-bud pattern","A halo sign"],"a":2,"e":"A pulmonary hamartoma is classically a well-defined nodule with fat and popcorn calcification. Honeycombing, spiculation with cavitation, tree-in-bud and halo sign indicate other diseases.","t":"Hamartoma: fat plus popcorn calcification."},{"id":"B15.20","c":15,"q":"A patient with a chylous pleural effusion has pleural fluid triglycerides above 110 mg/dL. The condition is:","o":["Hemothorax","Pseudochylothorax only","Chylothorax","Empyema","Transudate"],"a":2,"e":"Pleural fluid triglycerides above 110 mg/dL confirm chylothorax. Hemothorax, empyema and transudate do not have high triglycerides, and pseudochylothorax has high cholesterol with low triglycerides.","t":"Triglycerides above 110 mg/dL = chylothorax."},{"id":"B15.21","c":15,"q":"What is the usual cause of chylothorax in adults?","o":["Pneumonia","Heart failure","Lymphoma or thoracic duct injury","Pulmonary embolism","Cirrhosis"],"a":2,"e":"In adults, chylothorax is usually caused by lymphoma or thoracic duct injury, which disrupts lymphatic flow. Pneumonia, heart failure, embolism and cirrhosis do not.","t":"Chylothorax: lymphoma or thoracic duct injury."},{"id":"B15.22","c":15,"q":"A patient on a plan for pleural catheter placement needs counseling about:","o":["Hair loss","Renal failure","Visual loss","Weight gain","Infection risk and catheter care"],"a":4,"e":"Patients getting a pleural catheter need counseling about infection risk and catheter care, because infection is the key complication. Hair loss, renal failure, visual loss and weight gain are not catheter effects.","t":"Pleural catheter: counsel on infection and care."},{"id":"B15.23","c":15,"q":"A patient has a pulmonary nodule and a known thymoma. Which test helps assess myasthenia gravis?","o":["Cortisol","Troponin","Alpha-fetoprotein","Acetylcholine receptor antibodies","Urine culture"],"a":3,"e":"Acetylcholine receptor antibodies support the diagnosis of myasthenia gravis in a patient with thymoma. Cortisol, troponin, alpha-fetoprotein and urine culture are unrelated.","t":"Thymoma: check acetylcholine receptor antibodies for myasthenia."},{"id":"B15.24","c":15,"q":"A patient needs a diagnosis of a peripheral lung lesion not reachable by standard bronchoscopy. Which approach is suitable?","o":["Skin biopsy","Navigational bronchoscopy or CT-guided needle biopsy","Pleural tap","Gastroscopy","Thyroid scan"],"a":1,"e":"A peripheral lung lesion not reachable by standard bronchoscopy can be sampled by navigational bronchoscopy or CT-guided needle biopsy, chosen by lesion location. Skin biopsy, pleural tap, gastroscopy and thyroid scan do not sample the lung.","t":"Peripheral lesion: navigational bronchoscopy or CT-guided biopsy."},{"id":"B15.25","c":15,"q":"Whole-lung lavage is a therapy for:","o":["Emphysema","Pneumonia","Asthma","Pulmonary alveolar proteinosis","Pulmonary embolism"],"a":3,"e":"Whole-lung lavage is a therapy for pulmonary alveolar proteinosis, removing the proteinaceous material. It does not treat emphysema, pneumonia, asthma or pulmonary embolism.","t":"Whole-lung lavage treats alveolar proteinosis."},{"id":"B16.1","c":16,"q":"A 70-year-old man with heart failure has bilateral effusions. Pleural fluid protein is 2.0 g/dL, with a serum protein of 6.8 g/dL. The fluid is most likely:","o":["A parapneumonic effusion","An exudate from tuberculosis","A transudate","A hemothorax","A chylothorax"],"a":2,"e":"A pleural fluid protein of 2.0 g/dL against a serum protein of 6.8 g/dL gives a ratio of about 0.3, below 0.5, which fits a transudate from heart failure. Parapneumonic effusion, tuberculosis, hemothorax and chylothorax are exudates or other fluids.","t":"Low pleural-to-serum protein ratio = transudate."},{"id":"B16.2","c":16,"q":"Which of the following meets Light criteria for an exudate?","o":["Pleural-to-serum LDH ratio below 0.3","Low cell count","pH of 7.5","Pleural-to-serum protein ratio above 0.5","Pleural LDH below one third of the upper limit of normal"],"a":3,"e":"A pleural-to-serum protein ratio above 0.5 is one of Light's criteria for an exudate. A low LDH ratio, a low cell count, a normal pH or a low pleural LDH point to a transudate.","t":"Light: protein ratio above 0.5 means exudate."},{"id":"B16.3","c":16,"q":"Another criterion for an exudate is a pleural-to-serum LDH ratio above:","o":["0.05","0.1","0.2","0.3","0.6"],"a":4,"e":"Another Light criterion is a pleural-to-serum LDH ratio above 0.6. The third is pleural LDH above two thirds of the upper limit of normal serum LDH.","t":"Light LDH ratio above 0.6 means exudate."},{"id":"B16.4","c":16,"q":"A patient on aggressive diuretics for heart failure has an effusion that meets Light criteria for an exudate by a small margin. The next test is:","o":["Radiation","Bronchoscopy","Serum-pleural albumin gradient or NT-proBNP in the fluid","Biopsy at once","Antibiotics"],"a":2,"e":"Aggressive diuretics can make a transudate appear exudative by a small margin. Check the serum-pleural albumin gradient or fluid NT-proBNP to reclassify it. Radiation, bronchoscopy, immediate biopsy or antibiotics are not indicated.","t":"Diuretic-treated effusion that barely meets exudate: use albumin gradient or NT-proBNP."},{"id":"B16.5","c":16,"q":"A parapneumonic effusion has a pH of 6.9 and a loculated appearance. The next step is:","o":["Diuretics","Chest tube drainage","Observation","Steroids","Bronchoscopy"],"a":1,"e":"A parapneumonic effusion with pH 6.9 and loculation is complicated and needs chest tube drainage. Diuretics, observation, steroids or bronchoscopy do not clear infected pleural fluid.","t":"pH below 7.2 or loculation: drain the parapneumonic effusion."},{"id":"B16.6","c":16,"q":"A loculated empyema is draining poorly through a chest tube. A reasonable next step is:","o":["Observe 2 weeks","Remove the tube","Intrapleural enzyme and DNase therapy, or surgery","Add steroids alone","Diuretics"],"a":2,"e":"A loculated empyema draining poorly through a chest tube needs intrapleural enzyme (tissue plasminogen activator) with DNase, or surgery. Observing, removing the tube, steroids or diuretics leave infected fluid behind.","t":"Poorly draining empyema: tPA plus DNase, or surgery."},{"id":"B16.7","c":16,"q":"Which pleural fluid finding strongly suggests tuberculosis?","o":["Neutrophil predominance","Lymphocyte-predominant exudate with high adenosine deaminase","Low LDH","Transudate","Milky fluid"],"a":1,"e":"A lymphocyte-predominant exudate with high adenosine deaminase strongly suggests tuberculous pleurisy. Neutrophil predominance suggests bacterial infection, and a transudate, milky fluid or low LDH do not.","t":"Lymphocytic exudate with high ADA = tuberculous pleurisy."},{"id":"B16.8","c":16,"q":"A pleural fluid glucose below 60 mg/dL is seen in all EXCEPT:","o":["Malignancy","Tuberculosis","Heart failure","Empyema","Rheumatoid effusion"],"a":2,"e":"A low pleural glucose is seen in malignancy, tuberculosis, empyema and rheumatoid effusion, but not in heart failure, because transudates keep normal glucose.","t":"Transudates have normal glucose."},{"id":"B16.9","c":16,"q":"A pleural fluid hematocrit more than half of the blood hematocrit defines:","o":["Chylothorax","Hemothorax","Bloody effusion without hemothorax","Transudate","Empyema"],"a":1,"e":"A pleural fluid hematocrit more than half of the blood hematocrit defines hemothorax. Chylothorax, transudate and empyema do not have that ratio, and a bloody effusion without hemothorax has a lower ratio.","t":"Pleural-to-blood hematocrit above 0.5 = hemothorax."},{"id":"B16.10","c":16,"q":"A young tall man develops sudden pleuritic chest pain and dyspnea. A radiograph shows a moderate pneumothorax with no lung disease. This is:","o":["Primary spontaneous pneumothorax","Hemothorax","Secondary pneumothorax","Tension pneumothorax","Empyema"],"a":0,"e":"Sudden pleuritic pain and dyspnea in a tall young man with a pneumothorax and no lung disease is primary spontaneous pneumothorax. Secondary requires underlying lung disease, and hemothorax, tension and empyema are different.","t":"No underlying lung disease = primary spontaneous pneumothorax."},{"id":"B16.11","c":16,"q":"A 65-year-old with COPD has a 3 cm pneumothorax and is breathless. The best approach is:","o":["Observation at home","Discharge without follow-up","Antibiotics","Reassurance","Drainage and admission"],"a":4,"e":"A 3 cm pneumothorax with breathlessness in a patient with COPD is a secondary pneumothorax, which is riskier and usually needs drainage and admission. Observation at home, discharge, antibiotics or reassurance are unsafe.","t":"Secondary pneumothorax with symptoms: drain and admit."},{"id":"B16.12","c":16,"q":"A ventilated patient is hypotensive with a unilateral absent breath sound and tracheal deviation. The immediate action is:","o":["Wait for a radiograph","Sedation","Fluid only","Needle decompression followed by a chest tube","CT scan"],"a":3,"e":"A ventilated patient with hypotension, absent breath sounds on one side and tracheal deviation has tension pneumothorax, a clinical diagnosis. Perform needle decompression followed by a chest tube without waiting for a radiograph or CT.","t":"Tension pneumothorax: decompress immediately."},{"id":"B16.13","c":16,"q":"Recurrent pneumothorax is best prevented by:","o":["Antibiotics","Pleurodesis or surgical intervention","Observation only","Oral steroids","Bed rest"],"a":1,"e":"Recurrent pneumothorax is prevented by pleurodesis or surgical intervention, which adheres the pleura. Antibiotics, observation, steroids or bed rest do not prevent recurrence.","t":"Recurrent pneumothorax: pleurodesis or surgery."},{"id":"B16.14","c":16,"q":"A patient with cirrhosis and ascites has a large right pleural effusion. This is:","o":["Mesothelioma","Hemothorax","Empyema","Hepatic hydrothorax","Chylothorax"],"a":3,"e":"A large right effusion in a patient with cirrhosis and ascites is hepatic hydrothorax, since ascitic fluid passes through diaphragmatic defects. Mesothelioma, hemothorax, empyema and chylothorax have other causes.","t":"Cirrhosis plus right effusion = hepatic hydrothorax."},{"id":"B16.15","c":16,"q":"A patient with a hepatic hydrothorax should be treated with:","o":["Repeated chest tube drainage","Sodium restriction, diuretics, and transplant evaluation; avoid chest tubes","Pleurodesis first","Radiation","Antibiotics alone"],"a":1,"e":"Hepatic hydrothorax is treated with sodium restriction, diuretics and transplant evaluation, and chest tubes are avoided because of large fluid and protein losses. Repeated drainage, pleurodesis first, radiation or antibiotics alone are poor choices.","t":"Hepatic hydrothorax: sodium restriction, diuretics, transplant evaluation; no chest tube."},{"id":"B16.16","c":16,"q":"A woman with rheumatoid arthritis has a low-glucose, low-pH exudate with high LDH. The likely diagnosis is:","o":["Heart failure","Pulmonary embolism","Nephrotic syndrome","Rheumatoid pleural effusion","Cirrhosis"],"a":3,"e":"A low-glucose, low-pH exudate with high LDH in a woman with rheumatoid arthritis is a rheumatoid pleural effusion, which has characteristically very low glucose. Heart failure, embolism, nephrotic syndrome and cirrhosis cause transudates.","t":"Very low glucose exudate in rheumatoid arthritis: rheumatoid effusion."},{"id":"B16.17","c":16,"q":"Which diagnosis is suggested by an effusion after cardiac surgery, fever, and a pleural-pericardial syndrome?","o":["Sarcoidosis","Postcardiac injury syndrome","Asthma","Pulmonary embolism","Pneumonia"],"a":1,"e":"An effusion with fever and pleuropericarditis after cardiac surgery suggests postcardiac injury syndrome. Sarcoidosis, asthma, embolism and pneumonia do not follow cardiac injury this way.","t":"Pleuropericarditis weeks after cardiac injury: postcardiac injury syndrome."},{"id":"B16.18","c":16,"q":"A patient with pulmonary embolism has an exudative effusion. The effusion is:","o":["Common and can be exudative","Always bloody","Impossible","Always transudative","Always chylous"],"a":0,"e":"Pulmonary embolism with infarction can cause an effusion that is commonly exudative, and sometimes bloody. It is not impossible, always transudative, always bloody or always chylous.","t":"Pulmonary embolism effusions are often exudative."},{"id":"B16.19","c":16,"q":"Which pleural fluid cell count suggests an eosinophilic effusion?","o":["No cells","Only red cells","More than 90% lymphocytes","More than 10% eosinophils, often from air or blood in the pleural space","More than 90% neutrophils"],"a":3,"e":"An eosinophilic effusion has more than 10% eosinophils and is often caused by air or blood in the pleural space. A lymphocyte-predominant fluid suggests tuberculosis or malignancy, and neutrophil predominance suggests infection.","t":"Pleural eosinophils above 10%: air or blood in the pleural space."},{"id":"B16.20","c":16,"q":"An uncomplicated parapneumonic effusion is small and free-flowing. The management is:","o":["Antibiotics for pneumonia with monitoring","Pleurodesis","Chest tube","Immediate surgery","No treatment ever"],"a":0,"e":"An uncomplicated parapneumonic effusion is small and free-flowing and is managed with antibiotics for the pneumonia and monitoring. Pleurodesis, a chest tube or surgery is unnecessary, and no treatment at all is unsafe.","t":"Small free-flowing parapneumonic effusion: antibiotics and monitoring."},{"id":"B16.21","c":16,"q":"Which effusion type is characterized by a low pleural fluid triglyceride level, a high cholesterol level, and cholesterol crystals?","o":["Hemothorax","Chylothorax","Pseudochylothorax","Transudate","Empyema"],"a":2,"e":"A pseudochylothorax has low triglycerides, high cholesterol and cholesterol crystals, and arises in long-standing effusions. Chylothorax has high triglycerides, and hemothorax, transudate and empyema do not show cholesterol crystals.","t":"Cholesterol crystals and low triglycerides: pseudochylothorax."},{"id":"B16.22","c":16,"q":"A patient has recurrent benign effusion that is trapped by a fibrous peel. The treatment is:","o":["Decortication","Observation only","Steroids","Antibiotics","Diuretics"],"a":0,"e":"A recurrent benign effusion trapped by a fibrous peel (trapped lung) is treated by decortication, which removes the restricting peel. Observation, steroids, antibiotics or diuretics do not remove it.","t":"Fibrous peel trapping the lung: decortication."},{"id":"B16.23","c":16,"q":"A patient with chest trauma has a large hemothorax. The initial treatment is:","o":["Steroids","Antibiotics only","Thoracentesis weekly","Large-bore chest tube","Observation"],"a":3,"e":"A large hemothorax after chest trauma is treated with a large-bore chest tube, which drains blood, monitors bleeding and prevents trapped lung. Steroids, antibiotics alone, weekly thoracentesis and observation are inadequate.","t":"Large traumatic hemothorax: large-bore chest tube."},{"id":"B16.24","c":16,"q":"Thoracentesis should usually be paused if the patient develops:","o":["A headache only","Hunger","Itching","Thirst","Chest tightness, cough, or pain"],"a":4,"e":"Pause thoracentesis if the patient develops chest tightness, cough or pain, which suggest excessive negative pleural pressure and risk of re-expansion edema. Headache alone, hunger, itching or thirst are not stop signals.","t":"Stop thoracentesis for chest tightness, cough or pain."},{"id":"B16.25","c":16,"q":"Which complication is most important to exclude after thoracentesis with new dyspnea?","o":["Cataract","Diabetes","Gout","Pneumothorax","Pericarditis"],"a":3,"e":"New dyspnea after thoracentesis should prompt exclusion of pneumothorax, the most important complication, with imaging. Cataract, diabetes, gout and pericarditis are not complications.","t":"New dyspnea after thoracentesis: image for pneumothorax."},{"id":"B16.26","c":16,"q":"A patient has a chronic, stable asymptomatic pleural plaque on CT and asbestos exposure. The management is:","o":["Radiation","Surgery","Reassurance and exposure counseling","Chemotherapy","Steroids"],"a":2,"e":"A chronic, stable, asymptomatic pleural plaque with asbestos exposure is a marker of exposure, not cancer, so management is reassurance and exposure counseling. Radiation, surgery, chemotherapy and steroids are not indicated.","t":"Pleural plaques mark exposure and need no treatment."},{"id":"B16.27","c":16,"q":"Ultrasound findings of septations and echogenic fluid suggest:","o":["Pneumothorax","Normal pleura","Emphysema","A complicated or exudative effusion","A transudate"],"a":3,"e":"Ultrasound septations and echogenic fluid suggest a complicated or exudative effusion, which can progress to empyema. They are not typical of pneumothorax, normal pleura, emphysema or a transudate, which appears anechoic.","t":"Septations on ultrasound favor an exudate or empyema."},{"id":"B14.1","c":14,"q":"A 62-year-old woman has a 40 pack-year smoking history and quit 8 years ago. Under the 2021 USPSTF recommendation, annual low-dose CT screening applies to adults aged:","o":["All adults over 40","65 to 90 regardless of smoking","30 to 50 with 10 pack-years","40 to 60 with any smoking history","50 to 80 with at least a 20 pack-year history who currently smoke or quit within the past 15 years"],"a":4,"e":"The 2021 USPSTF recommends annual low-dose CT for adults aged 50 to 80 with at least a 20 pack-year history who currently smoke or quit within the past 15 years. This 62-year-old, with 40 pack-years and quitting 8 years ago, meets every element. The other age and smoking ranges are not the recommendation.","t":"USPSTF: age 50 to 80, 20 pack-years, quit within 15 years."},{"id":"B14.2","c":14,"q":"A 56-year-old man smoked 25 pack-years and quit 20 years ago. Under the 2023 American Cancer Society guideline, he is:","o":["Eligible only with a family history","Ineligible, because he quit more than 15 years ago","Ineligible because of age","Eligible, because the guideline no longer limits eligibility by years since quitting","Eligible only if he has a cough"],"a":3,"e":"The 2023 American Cancer Society guideline removed the years-since-quitting limit, so a 56-year-old with 25 pack-years who quit 20 years ago is eligible. The USPSTF 15-year rule would exclude him, but the ACS does not, and family history or cough is not required.","t":"ACS 2023: no limit on years since quitting."},{"id":"B14.3","c":14,"q":"A 58-year-old with a 30 pack-year history and COPD is eligible for screening but has severe disease that limits life expectancy and would not tolerate surgery. The best approach is:","o":["Do not screen if he could not undergo curative treatment","Screen anyway","Use sputum cytology","Use chest radiograph","Screen every 6 months"],"a":0,"e":"Screening is for people who could undergo and benefit from curative treatment. A patient with severe disease that limits life expectancy and cannot tolerate surgery should not be screened. Screening him anyway, using sputum cytology or radiograph, or screening every 6 months adds harm without benefit.","t":"Do not screen patients who could not receive curative treatment."},{"id":"B14.4","c":14,"q":"A patient has a single solid 5 mm nodule found incidentally, and is at low risk. Under the 2017 Fleischner guidance, follow-up is:","o":["PET scan","Resection","CT in 3 months","No routine follow-up","Biopsy"],"a":3,"e":"Under the 2017 Fleischner guidance, a single solid nodule smaller than 6 mm in a low-risk patient needs no routine follow-up. PET, biopsy, resection and a 3-month CT are unnecessary for such a small nodule.","t":"Solid nodule under 6 mm, low risk: no routine follow-up."},{"id":"B14.5","c":14,"q":"A patient has a single 7 mm solid nodule and is at low risk. Fleischner guidance suggests:","o":["CT at 6 to 12 months, then consider CT at 18 to 24 months","PET/CT now","No follow-up","Surgery","Immediate biopsy"],"a":0,"e":"A single solid nodule of 6 to 8 mm in a low-risk patient gets CT at 6 to 12 months, then consider CT at 18 to 24 months. No follow-up under-treats it, and PET/CT, biopsy or surgery is premature.","t":"6 to 8 mm solid, low risk: CT at 6 to 12 months, then 18 to 24 months."},{"id":"B14.6","c":14,"q":"A solid nodule larger than 8 mm in a high-risk patient should prompt:","o":["No follow-up","Repeat CT in 3 years","Consider CT at 3 months, PET/CT, or tissue sampling","Reassurance","Steroids"],"a":2,"e":"A solid nodule larger than 8 mm in a high-risk patient should prompt consideration of CT at 3 months, PET/CT or tissue sampling, because larger nodules need prompt evaluation. No follow-up, a 3-year repeat, reassurance or steroids is inappropriate.","t":"Solid nodule over 8 mm, high risk: CT at 3 months, PET/CT or biopsy."},{"id":"B14.7","c":14,"q":"A PET scan of a 12 mm nodule shows low uptake. Compared with a high-uptake nodule, this:","o":["Requires no follow-up","Is irrelevant","Proves cancer","Lowers but does not exclude malignancy","Excludes cancer"],"a":3,"e":"Low uptake on PET lowers but does not exclude malignancy, because small or indolent tumors such as carcinoid or adenocarcinoma in situ may have low uptake. It does not prove cancer or exclude it, and it is not irrelevant or a reason to skip follow-up.","t":"Low PET uptake does not exclude lung cancer."},{"id":"B14.8","c":14,"q":"Which nodule feature suggests a benign process?","o":["Spiculation","Rapid growth","Large size","Upper lobe location","Central, diffuse, or popcorn calcification"],"a":4,"e":"Central, diffuse, laminated or popcorn calcification suggests a benign nodule. Spiculation, rapid growth, large size and upper lobe location all increase malignancy risk.","t":"Central, diffuse or popcorn calcification suggests benign disease."},{"id":"B14.9","c":14,"q":"A patient has a ground-glass nodule 10 mm that persists for 3 months. The next step is:","o":["Follow-up CT, with attention to a solid component","Repeat in 5 years","Discharge","Immediate surgery","Antibiotics"],"a":0,"e":"A persistent ground-glass nodule needs follow-up CT with attention to a solid component, because persistent lesions can be indolent adenocarcinoma. Repeating in 5 years, discharge, immediate surgery or antibiotics do not suit it.","t":"Persistent ground-glass nodule: surveillance CT, watching for solid growth."},{"id":"B14.10","c":14,"q":"A nonsmoker with stage IV adenocarcinoma has an EGFR mutation. Which treatment class is first-line?","o":["Platinum chemotherapy alone","EGFR tyrosine kinase inhibitor","Radiation alone","Immunotherapy alone","Observation"],"a":1,"e":"Stage IV adenocarcinoma with an EGFR mutation is treated first with an EGFR tyrosine kinase inhibitor, because targeted therapy is first-line for actionable mutations. Chemotherapy, radiation, immunotherapy alone or observation are not preferred.","t":"Actionable EGFR mutation: first-line EGFR inhibitor."},{"id":"B14.11","c":14,"q":"Before starting treatment for newly diagnosed advanced non-small cell lung cancer, which testing is needed?","o":["No testing","Spirometry only","Cardiac stress test only","Sputum culture","Comprehensive biomarker testing, including PD-L1"],"a":4,"e":"Before treating newly diagnosed advanced non-small cell lung cancer, order comprehensive biomarker testing, including PD-L1, because results determine therapy. Spirometry, a stress test or sputum culture do not.","t":"Biomarkers and PD-L1 before treating advanced NSCLC."},{"id":"B14.12","c":14,"q":"Limited-stage small cell lung cancer is treated with:","o":["Chemotherapy and thoracic radiation","Observation","Steroids","Surgery alone always","Antibiotics"],"a":0,"e":"Limited-stage small cell lung cancer is treated with chemotherapy plus thoracic radiation, with curative intent. Observation, steroids, antibiotics or surgery alone are not standard.","t":"Limited-stage SCLC: chemotherapy plus thoracic radiation."},{"id":"B14.13","c":14,"q":"A patient with small cell lung cancer has hyponatremia and low serum osmolality with concentrated urine. The syndrome is:","o":["Inappropriate antidiuretic hormone secretion","Hypothyroidism","Diabetes insipidus","Adrenal failure","Heart failure"],"a":0,"e":"Small cell lung cancer with hyponatremia, low serum osmolality and concentrated urine is the syndrome of inappropriate antidiuretic hormone secretion, since small cell tumors secrete antidiuretic hormone. Diabetes insipidus gives dilute urine, and hypothyroidism, adrenal failure and heart failure have other features.","t":"SCLC plus low sodium and concentrated urine = SIADH."},{"id":"B14.14","c":14,"q":"A patient with squamous cell carcinoma has hypercalcemia. The likely mechanism is:","o":["Bone metastases only","Hyperparathyroidism","Parathyroid hormone-related peptide","Vitamin D toxicity","Sarcoidosis"],"a":2,"e":"Squamous cell carcinoma often causes hypercalcemia through parathyroid hormone-related peptide, rather than bone metastases alone, hyperparathyroidism, vitamin D toxicity or sarcoidosis.","t":"Squamous carcinoma hypercalcemia: PTHrP."},{"id":"B14.15","c":14,"q":"A patient has a stage I non-small cell lung cancer but is not a surgical candidate. A curative option is:","o":["Steroids","Palliative care only","Observation","Antibiotics","Stereotactic body radiotherapy"],"a":4,"e":"For stage I non-small cell lung cancer in a patient who is not a surgical candidate, stereotactic body radiotherapy is an effective curative alternative. Steroids, antibiotics, observation and palliative care only do not treat the cancer.","t":"Medically inoperable stage I NSCLC: stereotactic body radiotherapy."},{"id":"B14.16","c":14,"q":"Mediastinal staging is recommended before surgery in a patient with:","o":["A pneumonia","No tumor","A benign nodule","A peripheral small stage I tumor with normal PET","A central tumor or enlarged mediastinal nodes"],"a":4,"e":"Mediastinal staging before surgery is recommended for a central tumor or enlarged mediastinal nodes, because invasive staging is used for higher-risk disease. A small peripheral stage I tumor with a normal PET is low risk, and pneumonia, benign nodules or no tumor need none.","t":"Stage the mediastinum for central tumors or enlarged nodes."},{"id":"B14.17","c":14,"q":"A patient has unexplained hoarseness and a left lung tumor with an aortopulmonary window mass. The likely cause is:","o":["Asthma","Reflux","Vocal cord dysfunction","Allergy","Recurrent laryngeal nerve involvement"],"a":4,"e":"Hoarseness with a left lung tumor and an aortopulmonary window mass points to recurrent laryngeal nerve involvement, since the left nerve loops under the aortic arch. Asthma, reflux, vocal cord dysfunction and allergy do not explain it.","t":"Left lung mass plus hoarseness: left recurrent laryngeal nerve palsy."},{"id":"B14.18","c":14,"q":"Which condition is a paraneoplastic neurologic syndrome linked with small cell lung cancer?","o":["Lambert-Eaton myasthenic syndrome","Guillain-Barre syndrome","Parkinson disease","Multiple sclerosis","Myasthenia gravis"],"a":0,"e":"Lambert-Eaton myasthenic syndrome is the paraneoplastic neurologic syndrome linked with small cell lung cancer, causing proximal weakness that improves with exercise. Myasthenia gravis, Guillain-Barre, Parkinson disease and multiple sclerosis are not typical paraneoplastic associations.","t":"SCLC: Lambert-Eaton syndrome."},{"id":"B14.19","c":14,"q":"A patient with hypertrophic osteoarthropathy has clubbing and painful long bones. Which lung disease is most often linked?","o":["Non-small cell lung cancer","Emphysema","Asthma","Sleep apnea","Pulmonary embolism"],"a":0,"e":"Hypertrophic osteoarthropathy with clubbing and painful long bones is most often linked to non-small cell lung cancer, and also to chronic suppurative lung disease. Emphysema, asthma, sleep apnea and embolism do not cause it.","t":"Hypertrophic osteoarthropathy: think non-small cell lung cancer."},{"id":"B14.20","c":14,"q":"A patient receiving immune checkpoint therapy develops new cough, hypoxemia, and ground-glass opacities. The diagnosis to suspect is:","o":["Pleural effusion only","Asthma","Pulmonary embolism only","Immune-related pneumonitis","Sarcoidosis"],"a":3,"e":"New cough, hypoxemia and ground-glass opacities on checkpoint therapy suggest immune-related pneumonitis, which needs prompt evaluation and often steroids. Effusion alone, asthma, embolism alone or sarcoidosis are less likely.","t":"Checkpoint inhibitor plus new ground-glass: immune-related pneumonitis."},{"id":"B14.21","c":14,"q":"A patient with a pulmonary nodule has a risk model estimating a 3% chance of malignancy. The approach is:","o":["Surveillance with serial CT","PET only","Radiation","Immediate resection","Chemotherapy"],"a":0,"e":"A nodule with a 3% estimated chance of malignancy is low probability and is followed with serial CT. PET, radiation, resection and chemotherapy are not justified.","t":"Low malignancy probability: serial CT surveillance."},{"id":"B14.22","c":14,"q":"A pulmonary nodule has an estimated 70% malignancy probability and the patient is a surgical candidate. The approach is:","o":["Steroids","Reassurance","Antibiotics","Repeat CT in 1 year","Proceed toward resection"],"a":4,"e":"A nodule with a 70% chance of malignancy in a surgical candidate warrants proceeding toward tissue diagnosis or resection. Steroids, reassurance, antibiotics or waiting a year are inappropriate.","t":"High-probability nodule in a surgical candidate: proceed to resection."},{"id":"B14.23","c":14,"q":"A shared decision-making visit is required before lung cancer screening. It should include:","o":["Only the cost","Only a signature","Benefits, harms, false positives, and smoking cessation counseling","Nothing","Sedation"],"a":2,"e":"The shared decision-making visit before lung cancer screening should cover benefits, harms, false positives and smoking cessation counseling. It is not only a cost discussion or signature, and it does not involve sedation.","t":"Shared decision-making covers benefits, harms and cessation."},{"id":"B14.24","c":14,"q":"What is the main harm of low-dose CT screening?","o":["Skin disease","Diabetes","Hearing loss","False-positive results leading to further testing","Kidney failure"],"a":3,"e":"The main harm of low-dose CT screening is false-positive results that lead to further imaging and procedures. Skin disease, diabetes, hearing loss and kidney failure are not caused by screening.","t":"Main harm of LDCT: false positives and follow-up procedures."},{"id":"B14.25","c":14,"q":"Lung cancer screening results are categorized using:","o":["Lung-RADS","GOLD","BI-RADS","TI-RADS","PI-RADS"],"a":0,"e":"Lung cancer screening CT results are categorized with Lung-RADS, which standardizes reporting. GOLD is for COPD, BI-RADS for breast, TI-RADS for thyroid and PI-RADS for prostate.","t":"Lung-RADS categorizes screening CT."},{"id":"B14.26","c":14,"q":"Which smoking-related finding in a patient with a solid nodule increases malignancy risk the most?","o":["Calcification","Fat density","Upper lobe location and spiculated margin","Lower lobe and smooth margin","Small size alone"],"a":2,"e":"Upper lobe location and a spiculated margin raise the chance that a solid nodule is malignant. Calcification, fat density, lower lobe location, a smooth margin and small size alone lower or do not raise risk.","t":"Spiculation and upper lobe location raise malignancy risk."},{"id":"B14.27","c":14,"q":"After resection of stage I lung cancer, the best long-term advice includes:","o":["Antibiotics","Daily steroids","No follow-up","Smoking cessation and surveillance imaging","Annual bronchoscopy only"],"a":3,"e":"After resection of stage I lung cancer, advise smoking cessation and surveillance imaging, which detects recurrence and second primaries. Antibiotics, steroids, no follow-up or annual bronchoscopy alone are inappropriate.","t":"After resection: stop smoking and keep up surveillance."},{"id":"B18.1","c":18,"q":"A patient with amyotrophic lateral sclerosis has orthopnea, morning headache, and a falling forced vital capacity. The best next step is:","o":["Sedatives","Discharge","Oxygen alone","Reassure","Evaluate for noninvasive ventilation"],"a":4,"e":"Orthopnea, morning headache and a falling forced vital capacity in amyotrophic lateral sclerosis indicate respiratory muscle weakness with nocturnal hypoventilation, so evaluate for noninvasive ventilation, which improves symptoms and survival. Sedatives, oxygen alone, reassurance or discharge worsen hypoventilation or miss it.","t":"ALS with orthopnea and falling FVC: noninvasive ventilation."},{"id":"B18.2","c":18,"q":"A patient with Guillain-Barre syndrome has a falling forced vital capacity and weak cough. The best monitoring setting is:","o":["Primary care","Home","Observation without testing","Outpatient clinic in a month","Intensive care or step-down with serial measurements"],"a":4,"e":"Guillain-Barre syndrome with a falling vital capacity and weak cough can progress to respiratory failure quickly, so monitor in intensive care or step-down with serial measurements. Primary care, home, observation without testing or a month-later clinic visit are unsafe.","t":"GBS with falling FVC: ICU or step-down monitoring."},{"id":"B18.3","c":18,"q":"In Guillain-Barre syndrome, the \"20/30/40\" rule suggests ventilatory support is needed when:","o":["FVC above 60 mL/kg","Heart rate below 60","Oxygen saturation above 98%","FVC is below 20 mL/kg, MIP is weaker than minus 30 cm H2O, or MEP is below 40 cm H2O","Normal measurements"],"a":3,"e":"The 20/30/40 rule for Guillain-Barre suggests ventilatory support when FVC is below 20 mL/kg, maximal inspiratory pressure is weaker than minus 30 cm H2O, or maximal expiratory pressure is below 40 cm H2O. Normal measurements and high FVC do not predict failure.","t":"GBS 20/30/40: FVC under 20 mL/kg, MIP weaker than -30, MEP under 40."},{"id":"B18.4","c":18,"q":"A patient with myasthenic crisis has a weak cough and difficulty clearing secretions. The respiratory measure most useful to follow is:","o":["Oxygen saturation alone","Troponin","D-dimer","Forced vital capacity and negative inspiratory force","Peak flow"],"a":3,"e":"In myasthenic crisis follow forced vital capacity and negative inspiratory force, because oxygen saturation falls late. Troponin, D-dimer and peak flow do not measure respiratory muscle strength.","t":"Myasthenic crisis: monitor FVC and negative inspiratory force, not saturation."},{"id":"B18.5","c":18,"q":"A patient with Duchenne muscular dystrophy has nocturnal hypoventilation. First-line therapy is:","o":["Oxygen only","Sedatives","Nocturnal noninvasive ventilation","Opioids","Steroids only"],"a":2,"e":"Nocturnal hypoventilation in Duchenne muscular dystrophy is treated first with nocturnal noninvasive ventilation. Oxygen only, sedatives, opioids and steroids alone do not treat hypoventilation.","t":"Neuromuscular hypoventilation: nocturnal NIV."},{"id":"B18.6","c":18,"q":"Which test helps detect diaphragm weakness?","o":["Supine and upright vital capacity, and diaphragm ultrasound","Blood count","Sputum culture","Chest radiograph only","Peak flow only"],"a":0,"e":"Diaphragm weakness is suggested by a fall in vital capacity when supine compared with upright, and diaphragm ultrasound shows reduced thickening or movement. Blood count, sputum culture, radiograph only and peak flow do not detect it well.","t":"Supine-upright FVC fall above 20% suggests diaphragm weakness."},{"id":"B18.7","c":18,"q":"A neuromuscular patient with weak cough is at risk of mucus plugging. A useful measure is:","o":["Sedatives","Bed rest","Fluid restriction","Opioid cough suppressants","Mechanical insufflation-exsufflation"],"a":4,"e":"A neuromuscular patient with weak cough benefits from mechanical insufflation-exsufflation, an assisted cough device that clears secretions. Sedatives, bed rest, fluid restriction and cough suppressants worsen plugging.","t":"Weak cough: mechanical insufflation-exsufflation."},{"id":"B18.8","c":18,"q":"A patient with severe kyphoscoliosis has hypercapnia. The type of respiratory failure is:","o":["Primary lung fibrosis","Hypoventilation from restrictive chest wall disease","Obstructive","Anemia","Shunt"],"a":1,"e":"Severe kyphoscoliosis with hypercapnia is hypoventilation from restrictive chest wall disease, which reduces ventilatory capacity. It is not primary lung fibrosis, obstruction, anemia or shunt.","t":"Chest wall restriction causes hypoventilation."},{"id":"B18.9","c":18,"q":"Obesity hypoventilation syndrome is defined by:","o":["Low bicarbonate","Obesity, daytime hypercapnia, and sleep-disordered breathing, after excluding other causes","Obesity alone","Snoring alone","Hypoxemia alone"],"a":1,"e":"Obesity hypoventilation syndrome is defined by obesity, daytime hypercapnia and sleep-disordered breathing, after excluding other causes of hypoventilation. Obesity, snoring or hypoxemia alone does not define it, and bicarbonate is raised, not low.","t":"OHS: obesity plus daytime hypercapnia plus sleep-disordered breathing."},{"id":"B18.10","c":18,"q":"A patient with obesity hypoventilation has a serum bicarbonate of 36 mEq/L. This reflects:","o":["Chronic respiratory acidosis with metabolic compensation","Dehydration","Normal findings","Renal failure only","Metabolic alkalosis only"],"a":0,"e":"A serum bicarbonate of 36 mEq/L in obesity hypoventilation reflects chronic respiratory acidosis with metabolic compensation, since chronic carbon dioxide retention raises bicarbonate. It does not point to dehydration, renal failure only or metabolic alkalosis only.","t":"High bicarbonate in a hypoventilating patient = chronic CO2 retention."},{"id":"B18.11","c":18,"q":"Central congenital hypoventilation and other primary hypoventilation syndromes are characterized by:","o":["Obstructive apnea only","Hyperventilation","Isolated cough","Normal ventilation","Failure of automatic breathing, worse in sleep"],"a":4,"e":"Central congenital hypoventilation and other primary hypoventilation syndromes involve failure of automatic breathing, which is worse in sleep. They are not obstructive apnea only, hyperventilation, isolated cough or normal ventilation.","t":"Primary hypoventilation: failure of automatic breathing, worse in sleep."},{"id":"B18.12","c":18,"q":"A patient has sudden loss of muscle tone with laughter, excessive sleepiness, and hypnagogic hallucinations. The diagnosis is:","o":["Restless legs syndrome","Insomnia","Epilepsy","Narcolepsy type 1","Obstructive sleep apnea"],"a":3,"e":"Sudden loss of muscle tone with laughter (cataplexy), excessive sleepiness and hypnagogic hallucinations define narcolepsy type 1. Restless legs, insomnia, epilepsy and sleep apnea do not include cataplexy.","t":"Cataplexy defines narcolepsy type 1."},{"id":"B18.13","c":18,"q":"A patient has an urge to move the legs in the evening that is relieved by movement. Which laboratory test should be checked?","o":["Ferritin","Troponin","Amylase","Sodium only","Calcium"],"a":0,"e":"An evening urge to move the legs, relieved by movement, describes restless legs syndrome, and a ferritin level should be checked because iron deficiency is a treatable contributor. Troponin, amylase, sodium and calcium do not assess it.","t":"Restless legs: check ferritin."},{"id":"B18.14","c":18,"q":"A patient acts out dreams, with loss of REM atonia on polysomnography. The condition is:","o":["Sleep apnea","Narcolepsy","REM sleep behavior disorder","Restless legs syndrome","Sleepwalking"],"a":2,"e":"Dream enactment with loss of REM atonia on polysomnography is REM sleep behavior disorder, which may precede synucleinopathies. Sleep apnea, narcolepsy, restless legs and sleepwalking (a non-REM disorder) differ.","t":"Dream enactment with REM without atonia: REM sleep behavior disorder."},{"id":"B18.15","c":18,"q":"First-line treatment for chronic insomnia is:","o":["Cognitive behavioral therapy for insomnia","Long-term sedatives","Antibiotics","Steroids","Alcohol"],"a":0,"e":"Cognitive behavioral therapy for insomnia is the first-line treatment for chronic insomnia. Long-term sedatives, antibiotics, steroids and alcohol are not recommended.","t":"CBT-I is first-line for chronic insomnia."},{"id":"B18.16","c":18,"q":"A patient with chronic obstructive pulmonary disease and obesity hypoventilation has prolonged hypercapnia on room air. A major mistake in therapy is:","o":["Weight loss counseling","Giving uncontrolled high-flow oxygen","Treating sleep apnea","Using noninvasive ventilation","Monitoring gases"],"a":1,"e":"Uncontrolled high-flow oxygen is a major mistake in patients with chronic hypercapnia from COPD or obesity hypoventilation, since it can worsen carbon dioxide retention. Weight loss counseling, treating sleep apnea, noninvasive ventilation and gas monitoring are appropriate.","t":"Never give uncontrolled oxygen to chronic hypercapnic patients."},{"id":"B18.17","c":18,"q":"A patient has a spinal cord injury at C4. Which respiratory problem is expected?","o":["Asthma","Emphysema","Hyperventilation","Normal breathing","Hypoventilation from diaphragm and intercostal weakness"],"a":4,"e":"A C4 spinal cord injury impairs diaphragm (C3 to C5) and intercostal function and causes hypoventilation. It does not cause asthma, emphysema or hyperventilation, and breathing is not normal.","t":"High cervical injury: hypoventilation from respiratory muscle weakness."},{"id":"B18.18","c":18,"q":"Phrenic nerve palsy after cardiac surgery typically shows:","o":["Cavitation","Bilateral effusions only","A normal diaphragm","An elevated hemidiaphragm on radiograph","A pneumothorax"],"a":3,"e":"Phrenic nerve palsy after cardiac surgery typically shows an elevated hemidiaphragm on radiograph, because unilateral paralysis raises the diaphragm. It does not cause cavitation, bilateral effusions only, a normal diaphragm or pneumothorax.","t":"Phrenic palsy: elevated hemidiaphragm."},{"id":"B18.19","c":18,"q":"Which medication class should be avoided in patients with hypoventilation because it worsens central drive?","o":["Statins","Inhaled steroids","Vitamins","Opioids and benzodiazepines","Antibiotics"],"a":3,"e":"Opioids and benzodiazepines blunt central respiratory drive and should be avoided in patients with hypoventilation. Statins, inhaled steroids, vitamins and antibiotics do not depress drive.","t":"Avoid opioids and benzodiazepines in hypoventilation."},{"id":"B23.1","c":23,"q":"A 58-year-old sandblaster has nodular upper lobe opacities with eggshell calcification of hilar nodes. The diagnosis is:","o":["Silicosis","Tuberculosis","Sarcoidosis","Asbestosis","Berylliosis"],"a":0,"e":"Nodular upper lobe opacities with eggshell calcification of hilar nodes in a sandblaster is classic for silicosis. Tuberculosis, sarcoidosis, asbestosis and berylliosis can mimic parts but eggshell calcification with silica exposure points to silicosis.","t":"Eggshell nodal calcification plus sandblasting: silicosis."},{"id":"B23.2","c":23,"q":"Silica exposure increases the risk of which infection?","o":["Histoplasmosis only","Legionella","Influenza only","Pneumocystis only","Tuberculosis"],"a":4,"e":"Silica exposure raises the risk of tuberculosis, since silicosis impairs macrophage defenses against mycobacteria. Histoplasmosis only, Legionella, influenza only and Pneumocystis only are not the classic association.","t":"Silicosis raises tuberculosis risk."},{"id":"B23.3","c":23,"q":"A shipyard worker has basal fibrosis, pleural plaques, and restrictive physiology. The diagnosis is:","o":["Silicosis","Berylliosis","Sarcoidosis","Coal workers' pneumoconiosis","Asbestosis"],"a":4,"e":"Basal fibrosis, pleural plaques and restrictive physiology in a shipyard worker indicate asbestosis. Silicosis and coal pneumoconiosis favor upper zones, and berylliosis and sarcoidosis are granulomatous without plaques.","t":"Pleural plaques plus basal fibrosis: asbestosis."},{"id":"B23.4","c":23,"q":"A coal miner has small rounded opacities on radiograph. The diagnosis is:","o":["Pneumonia","Lung cancer","Heart failure","Coal workers' pneumoconiosis","Asbestosis"],"a":3,"e":"Small rounded upper zone opacities in a coal miner indicate coal workers' pneumoconiosis (simple). Pneumonia, cancer, heart failure and asbestosis differ.","t":"Coal miner with small upper zone nodules: coal workers' pneumoconiosis."},{"id":"B23.5","c":23,"q":"A worker in aerospace has granulomas on lung biopsy and a positive beryllium lymphocyte proliferation test. The diagnosis is:","o":["Tuberculosis","Asbestosis","Silicosis","Sarcoidosis","Chronic beryllium disease"],"a":4,"e":"Granulomas on lung biopsy with a positive beryllium lymphocyte proliferation test in an aerospace worker confirm chronic beryllium disease. Sarcoidosis looks similar but has a negative test, and tuberculosis, asbestosis and silicosis differ.","t":"Granulomas plus positive BeLPT: chronic beryllium disease."},{"id":"B23.6","c":23,"q":"The single most important intervention in occupational asthma is:","o":["Surgery","Antibiotics","Increasing steroids","Oxygen","Removing the worker from the exposure"],"a":4,"e":"Removing the worker from the exposure is the most important intervention in occupational asthma, since early removal improves outcomes. Surgery, antibiotics, more steroids and oxygen do not address the cause.","t":"Occupational asthma: remove the exposure early."},{"id":"B23.7","c":23,"q":"A patient with asthma has symptoms that improve on weekends and holidays. This suggests:","o":["Anemia","Reflux","Cardiac disease","Work-related asthma","Allergic rhinitis only"],"a":3,"e":"Asthma symptoms that improve on weekends and holidays suggest work-related asthma, supported by serial peak flow monitoring at work and away. Anemia, reflux, heart disease and allergic rhinitis alone do not follow work patterns.","t":"Symptoms better away from work: work-related asthma."},{"id":"B23.8","c":23,"q":"Which exposure is associated with mesothelioma?","o":["Wood dust","Asbestos","Cotton","Silica","Coal"],"a":1,"e":"Asbestos is strongly and dose-relatedly linked to mesothelioma. Wood dust, cotton, silica and coal are not.","t":"Mesothelioma: asbestos."},{"id":"B23.9","c":23,"q":"Which patient has the highest risk for lung cancer from asbestos?","o":["A smoker with no exposure","A smoker with asbestos exposure","A nonsmoker with exposure","A nonsmoker with no exposure","All equal"],"a":1,"e":"A smoker with asbestos exposure has the highest lung cancer risk, since the effects of smoking and asbestos are multiplicative. Exposure alone or smoking alone gives lower risk, and the risks are not equal.","t":"Smoking and asbestos multiply lung cancer risk."},{"id":"B23.10","c":23,"q":"An effective approach to treating tobacco dependence combines:","o":["No treatment","Willpower alone","Hospitalization","Behavioral counseling and pharmacotherapy","Advice only"],"a":3,"e":"Tobacco dependence is best treated with behavioral counseling plus pharmacotherapy, which increases quit rates. No treatment, willpower alone, hospitalization or advice only is less effective.","t":"Combine counseling and medication to quit smoking."},{"id":"B23.11","c":23,"q":"Which medication can be combined with a nicotine patch to improve abstinence?","o":["Short-acting nicotine replacement such as gum or lozenge","An opioid","A sedative","A diuretic","A stimulant"],"a":0,"e":"Short-acting nicotine replacement such as gum or lozenge added to a patch improves abstinence, because combination replacement outperforms one product. Opioids, sedatives, diuretics and stimulants do not.","t":"Patch plus gum or lozenge beats one product."},{"id":"B6.1","c":6,"q":"A 45-year-old woman has daily purulent sputum for years and dilated, thick-walled airways on CT. What is the single most important first-line daily measure?","o":["Oxygen","Lifelong antifungals","Airway clearance","Continuous oral steroids","Opioid cough suppressants"],"a":2,"e":"Daily productive cough with purulent sputum and dilated, thick-walled airways on CT describes bronchiectasis, and regular airway clearance is the foundation of care. Oxygen, lifelong antifungals, continuous oral steroids and cough suppressants do not remove retained secretions and some do harm.","t":"Airway clearance is first-line daily care in bronchiectasis."},{"id":"B6.2","c":6,"q":"A patient with bronchiectasis has Pseudomonas aeruginosa on sputum culture and frequent exacerbations. Which preventive strategy may be considered?","o":["Antifungals","Long-term inhaled antibiotic therapy","Opioids","No treatment","Daily systemic steroids"],"a":1,"e":"In bronchiectasis with chronic Pseudomonas infection and frequent exacerbations, long-term inhaled antibiotic therapy may be considered to suppress infection and reduce exacerbations. Antifungals, opioids and daily systemic steroids do not address the problem, and doing nothing is not appropriate for frequent exacerbators.","t":"Chronic Pseudomonas with frequent exacerbations: consider long-term inhaled antibiotics."},{"id":"B6.3","c":6,"q":"A young man has bronchiectasis, chronic sinusitis, infertility, and situs inversus. The diagnosis is:","o":["Sarcoidosis","Primary ciliary dyskinesia","Alpha-1 antitrypsin deficiency","Asthma","Cystic fibrosis only"],"a":1,"e":"Bronchiectasis with chronic sinusitis, infertility and situs inversus is the Kartagener triad, a form of primary ciliary dyskinesia in which ciliary motion is defective. Cystic fibrosis causes infertility and sinus disease but not situs inversus, and sarcoidosis, alpha-1 antitrypsin deficiency and asthma do not fit.","t":"Situs inversus plus bronchiectasis plus sinusitis = primary ciliary dyskinesia."},{"id":"B6.4","c":6,"q":"Which test is the best initial screen for primary ciliary dyskinesia in an adult with suggestive features?","o":["Sweat chloride","Nasal nitric oxide","D-dimer","Chest radiograph","Spirometry"],"a":1,"e":"Nasal nitric oxide is characteristically very low in primary ciliary dyskinesia and is the best initial screen in an adult with suggestive features. Sweat chloride tests for cystic fibrosis, and D-dimer, radiograph and spirometry do not screen for ciliary disease.","t":"Low nasal nitric oxide screens for primary ciliary dyskinesia."},{"id":"B6.5","c":6,"q":"A 25-year-old with recurrent sinopulmonary infection, pancreatic insufficiency, and a sweat chloride of 90 mmol/L has:","o":["Sarcoidosis","Asthma","Immunoglobulin deficiency","Primary ciliary dyskinesia","Cystic fibrosis"],"a":4,"e":"Recurrent sinopulmonary infection, pancreatic insufficiency and a sweat chloride of 90 mmol/L (diagnostic above 60) confirm cystic fibrosis. Primary ciliary dyskinesia, immunoglobulin deficiency, sarcoidosis and asthma do not produce a raised sweat chloride.","t":"Sweat chloride above 60 mmol/L confirms cystic fibrosis."},{"id":"B6.6","c":6,"q":"Highly effective CFTR modulator therapy has changed adult cystic fibrosis care by:","o":["Preventing all infections","Eliminating the need for follow-up","Improving lung function and survival, so many adults now age with the disease","Curing the disease","Replacing airway clearance in all cases"],"a":2,"e":"Highly effective CFTR modulators correct the underlying defect, improve lung function and survival, and mean many adults now age with the disease. They do not cure it, prevent all infections or remove the need for follow-up and airway clearance.","t":"CFTR modulators improve lung function and survival but are not a cure."},{"id":"B6.7","c":6,"q":"An asthmatic patient has fleeting infiltrates, central bronchiectasis, and a high total IgE with positive Aspergillus testing. The diagnosis is:","o":["Allergic bronchopulmonary aspergillosis","Tuberculosis","Aspergilloma","Invasive aspergillosis","Cystic fibrosis only"],"a":0,"e":"An asthmatic with fleeting infiltrates, central bronchiectasis, a very high total IgE and positive Aspergillus testing has allergic bronchopulmonary aspergillosis. Aspergilloma is a fungus ball in a cavity, invasive aspergillosis occurs in immunocompromised hosts, and tuberculosis or cystic fibrosis do not explain the pattern alone.","t":"Asthma plus central bronchiectasis plus high IgE and Aspergillus sensitization = ABPA."},{"id":"B6.8","c":6,"q":"A patient with bronchiectasis and recurrent infections has low immunoglobulin G. The next step is:","o":["Surgery","Ignore it","Oxygen","Evaluate for an immune deficiency and consider replacement therapy","Start steroids"],"a":3,"e":"Recurrent infections with low IgG suggest antibody deficiency, which is a treatable cause of bronchiectasis. Evaluate for immune deficiency and consider immunoglobulin replacement. Surgery, oxygen or steroids do not address it.","t":"Low IgG with bronchiectasis: evaluate and treat the immune deficiency."},{"id":"B6.9","c":6,"q":"A patient has episodic inspiratory stridor and throat tightness during exercise, with normal spirometry between episodes. The diagnosis to consider is:","o":["Tracheal tumor","Anaphylaxis only","Pulmonary embolism","Severe asthma","Inducible laryngeal obstruction (vocal cord dysfunction)"],"a":4,"e":"Episodic inspiratory stridor and throat tightness during exercise with normal spirometry between episodes suggests inducible laryngeal obstruction (vocal cord dysfunction). A flattened inspiratory loop during symptoms and laryngoscopy confirm it. Severe asthma would wheeze and respond to bronchodilator, and tracheal tumor or embolism would not be episodic like this.","t":"Exercise-induced inspiratory stridor with normal spirometry: inducible laryngeal obstruction."},{"id":"B6.10","c":6,"q":"A patient previously intubated has progressive dyspnea and a flattened inspiratory and expiratory flow-volume loop. The likely cause is:","o":["Emphysema","Restriction","Pneumonia","Asthma","Fixed tracheal stenosis"],"a":4,"e":"Progressive dyspnea after prior intubation with flattening of both limbs of the flow-volume loop indicates a fixed central airway lesion, most likely post-intubation tracheal stenosis. Emphysema, restriction, pneumonia and asthma do not give this loop.","t":"Prior intubation plus flat inspiratory and expiratory loop = tracheal stenosis."},{"id":"B6.11","c":6,"q":"Constrictive bronchiolitis after hematopoietic cell transplant presents with:","o":["Progressive obstruction that does not respond to bronchodilators","Pleural effusion","Normal spirometry","Restriction","Pulmonary edema"],"a":0,"e":"Constrictive bronchiolitis after hematopoietic cell transplant is a manifestation of chronic graft-versus-host disease and presents with progressive airflow obstruction that does not respond to bronchodilators. Spirometry is not normal, and effusion, restriction and pulmonary edema are not the pattern.","t":"Post-transplant bronchiolitis obliterans: fixed, progressive obstruction."},{"id":"B10.1","c":10,"q":"Under the 2022 ESC/ERS definition, pulmonary hypertension is defined by a mean pulmonary artery pressure above:","o":["10 mm Hg","50 mm Hg","20 mm Hg","60 mm Hg","35 mm Hg"],"a":2,"e":"Under the 2022 ESC/ERS definition, pulmonary hypertension is a mean pulmonary artery pressure above 20 mm Hg at rest, lowered from 25. Values of 35, 50 or 60 describe more severe disease, and 10 is normal.","t":"Pulmonary hypertension: mean PAP above 20 mm Hg."},{"id":"B10.2","c":10,"q":"A patient has mean pulmonary artery pressure of 38 mm Hg, pulmonary artery wedge pressure of 10 mm Hg, and pulmonary vascular resistance of 6 Wood units. This is:","o":["Isolated post-capillary pulmonary hypertension","Combined post- and pre-capillary disease","Pre-capillary pulmonary hypertension","Normal","Exercise-induced only"],"a":2,"e":"A mean pulmonary artery pressure of 38 with a wedge of 10 and pulmonary vascular resistance of 6 Wood units is pre-capillary pulmonary hypertension: a wedge of 15 or less with PVR above 2 defines it. Post-capillary disease requires a wedge above 15, and the study is not normal.","t":"Wedge 15 or less with PVR above 2 = pre-capillary PH."},{"id":"B10.3","c":10,"q":"Which test is the best screen for chronic thromboembolic pulmonary hypertension?","o":["Chest radiograph","Bronchoscopy","Ventilation-perfusion scan","Echocardiography alone","Spirometry"],"a":2,"e":"A ventilation-perfusion scan is the best screen for chronic thromboembolic pulmonary hypertension, and a normal scan effectively excludes it. Chest radiograph, bronchoscopy, echocardiography alone and spirometry lack sensitivity for chronic thromboembolic disease.","t":"V/Q scan screens for CTEPH; a normal scan excludes it."},{"id":"B10.4","c":10,"q":"A patient with systemic sclerosis has new exertional dyspnea and a reduced DLCO. Which screening test is recommended?","o":["Bone scan","Echocardiography with natriuretic peptide and pulmonary function tests","Sleep study only","Colonoscopy","Allergy testing"],"a":1,"e":"Systemic sclerosis carries a high risk of pulmonary arterial hypertension, so screen annually with echocardiography, natriuretic peptide and pulmonary function tests, including DLCO. Bone scan, sleep study alone, colonoscopy and allergy testing do not screen for it.","t":"Screen systemic sclerosis annually for PAH."},{"id":"B10.5","c":10,"q":"Right heart catheterization is required to:","o":["Diagnose asthma","Treat the patient","Confirm the diagnosis and classify hemodynamics","Replace echocardiography","Measure FEV1"],"a":2,"e":"Right heart catheterization confirms the diagnosis and classifies the hemodynamics of pulmonary hypertension. It is the diagnostic standard and does not replace echocardiography screening, treat the patient or measure FEV1.","t":"Right heart catheterization confirms pulmonary hypertension."},{"id":"B10.6","c":10,"q":"A patient with idiopathic pulmonary arterial hypertension has vasoreactivity testing. A positive response predicts benefit from:","o":["Beta-blockers","High-dose calcium channel blockers","Antibiotics","Bronchodilators","Steroids"],"a":1,"e":"A positive vasoreactivity test in idiopathic pulmonary arterial hypertension predicts benefit from high-dose calcium channel blockers, though only a small group responds. Beta-blockers, antibiotics, bronchodilators and steroids have no role.","t":"Vasoreactive responders can be treated with high-dose calcium channel blockers."},{"id":"B10.7","c":10,"q":"A patient with low-risk pulmonary arterial hypertension has WHO functional class II, 6-minute walk distance of 480 m, and BNP of 40 ng/L. Under the ESC/ERS table, these meet:","o":["Low-risk criteria","High-risk criteria","Group 2 disease","Intermediate-risk criteria","Not interpretable"],"a":0,"e":"The ESC/ERS low-risk criteria include WHO functional class I or II, 6-minute walk distance above 440 m and BNP under 50 ng/L, which this patient meets. These values are not intermediate or high risk, and the table is interpretable.","t":"Low risk: class I-II, walk above 440 m, BNP below 50."},{"id":"B10.8","c":10,"q":"A patient has WHO functional class IV, a 6-minute walk of 120 m, and BNP of 1,000 ng/L. The estimated one-year mortality is:","o":["Unknown","5 to 20%","Under 5%","Zero","Above 20%"],"a":4,"e":"Functional class IV, a 6-minute walk of 120 m and BNP of 1,000 ng/L meet high-risk criteria with an estimated one-year mortality above 20%. Low risk is under 5% and intermediate 5 to 20%.","t":"High-risk PAH: one-year mortality above 20%."},{"id":"B10.9","c":10,"q":"For idiopathic pulmonary arterial hypertension without cardiopulmonary comorbidities, the guideline recommends initial:","o":["Combination therapy with an endothelin receptor antagonist and a PDE5 inhibitor","Steroids","Observation","Monotherapy with a diuretic","Anticoagulation alone"],"a":0,"e":"For idiopathic pulmonary arterial hypertension without cardiopulmonary comorbidities, the guideline recommends initial combination therapy with an endothelin receptor antagonist and a PDE5 inhibitor. Steroids, diuretic monotherapy, anticoagulation alone and observation are not standard.","t":"Initial dual oral therapy (ERA plus PDE5 inhibitor) for low-comorbidity IPAH."},{"id":"B10.10","c":10,"q":"A patient at high risk on initial assessment should be considered for:","o":["Diuretics alone","Triple therapy including a parenteral prostacyclin analogue","A single oral drug","Monotherapy","Observation"],"a":1,"e":"High-risk disease at assessment warrants triple therapy including a parenteral prostacyclin analogue. Diuretics alone, a single oral drug, monotherapy or observation under-treat.","t":"High-risk PAH: add a parenteral prostacyclin."},{"id":"B10.11","c":10,"q":"An older patient with pulmonary arterial hypertension and multiple cardiopulmonary comorbidities is more likely to start on:","o":["Intravenous therapy","Triple therapy","Lung transplant","No treatment","Monotherapy with close follow-up"],"a":4,"e":"An older patient with pulmonary arterial hypertension and multiple cardiopulmonary comorbidities is more likely to start monotherapy with close follow-up, because comorbidity favors a stepwise approach. Intravenous triple therapy and transplant are for high-risk, younger patients.","t":"Comorbid, older PAH patients: start with monotherapy and follow closely."},{"id":"B10.12","c":10,"q":"At follow-up, the target of therapy is:","o":["An intermediate-risk profile","Any improvement","A low-risk profile","High-risk profile","No change"],"a":2,"e":"The target of therapy is a low-risk profile, achieved and maintained. Merely improving or staying intermediate-risk is not enough, and a high-risk profile is the opposite of the goal.","t":"Treat PAH to reach and keep a low-risk profile."},{"id":"B10.13","c":10,"q":"A patient with pulmonary fibrosis has pulmonary hypertension. Which group is this?","o":["Group 5","Group 1","Group 4","Group 2","Group 3"],"a":4,"e":"Pulmonary hypertension from pulmonary fibrosis is group 3, due to lung disease or hypoxia. Group 1 is pulmonary arterial hypertension, group 2 left heart disease, group 4 chronic thromboembolic disease and group 5 multifactorial causes.","t":"Group 3 = lung disease or hypoxia."},{"id":"B10.14","c":10,"q":"A patient with left heart failure has mean pulmonary artery pressure of 32 mm Hg and wedge pressure of 22 mm Hg. This is:","o":["Post-capillary pulmonary hypertension","Pre-capillary disease","Normal","Group 1","Group 4"],"a":0,"e":"A mean pulmonary artery pressure of 32 mm Hg with a wedge pressure of 22 mm Hg is post-capillary pulmonary hypertension from left heart disease, group 2. A raised wedge indicates the left heart is the cause, so it is not pre-capillary, normal, group 1 or group 4.","t":"Wedge above 15 = post-capillary PH from left heart disease."},{"id":"B10.15","c":10,"q":"A patient has hemoptysis, glomerulonephritis, and sinusitis with a positive PR3 antineutrophil cytoplasmic antibody. The diagnosis is:","o":["Granulomatosis with polyangiitis","Goodpasture disease","Lupus","Eosinophilic granulomatosis with polyangiitis","Sarcoidosis"],"a":0,"e":"Hemoptysis, glomerulonephritis and sinusitis with a positive PR3 ANCA describe granulomatosis with polyangiitis. Goodpasture disease has anti-GBM antibodies, eosinophilic granulomatosis has asthma and eosinophilia, and lupus and sarcoidosis do not give a PR3 pattern.","t":"PR3-ANCA with sinus, lung and kidney disease = granulomatosis with polyangiitis."},{"id":"B10.16","c":10,"q":"A patient with asthma, eosinophilia, and mononeuritis multiplex has:","o":["Churg disease only","Granulomatosis with polyangiitis","Eosinophilic granulomatosis with polyangiitis","Sarcoidosis","Polyarteritis only"],"a":2,"e":"Asthma, eosinophilia and mononeuritis multiplex fit eosinophilic granulomatosis with polyangiitis (formerly Churg-Strauss). Granulomatosis with polyangiitis lacks the asthma and eosinophilia, and sarcoidosis and polyarteritis alone do not combine them.","t":"Asthma plus eosinophilia plus vasculitic neuropathy = EGPA."},{"id":"B10.17","c":10,"q":"Diffuse alveolar hemorrhage typically shows on bronchoscopy:","o":["Milky fluid","Pus","Clear lavage","Normal return","Progressively bloodier lavage return"],"a":4,"e":"In diffuse alveolar hemorrhage, serial lavage aliquots return progressively bloodier fluid. Milky fluid suggests proteinosis, pus infection, and clear or normal return would not support hemorrhage.","t":"Progressively bloodier lavage = alveolar hemorrhage."},{"id":"B10.18","c":10,"q":"A patient with recurrent epistaxis, telangiectasias, and a pulmonary arteriovenous malformation should be advised to:","o":["Receive antibiotic prophylaxis before dental procedures and consider embolization","Avoid all care","Take steroids","Fly more often","Undergo lobectomy"],"a":0,"e":"Epistaxis and telangiectasias with a pulmonary arteriovenous malformation indicate hereditary hemorrhagic telangiectasia. Advise antibiotic prophylaxis before dental procedures and consider embolization, because the right-to-left shunt allows paradoxical emboli and brain abscess. Avoiding care, steroids, flying more or lobectomy are not appropriate.","t":"Pulmonary AVM: embolize and give antibiotic prophylaxis for dental work."},{"id":"B10.19","c":10,"q":"Hepatopulmonary syndrome presents with:","o":["Platypnea and orthodeoxia in liver disease","Cough","Pleurisy","Hemoptysis","Wheeze"],"a":0,"e":"Hepatopulmonary syndrome presents with platypnea and orthodeoxia in liver disease, because intrapulmonary vascular dilation causes worse hypoxemia upright. Cough, pleurisy, hemoptysis and wheeze are not typical.","t":"Platypnea and orthodeoxia in cirrhosis = hepatopulmonary syndrome."},{"id":"B13.1","c":13,"q":"A patient on prolonged high-dose corticosteroids has subacute dyspnea, hypoxemia with exertion, and bilateral ground-glass opacities. The infection to exclude is:","o":["Bacterial lobar pneumonia only","Pneumocystis pneumonia","Viral croup","Tuberculosis only","Legionella only"],"a":1,"e":"Prolonged high-dose corticosteroids raise the risk of Pneumocystis pneumonia, which presents subacutely with exertional hypoxemia and bilateral ground-glass opacities. Bacterial lobar pneumonia is more acute and lobar, and croup, tuberculosis alone or Legionella alone do not fit this pattern as well.","t":"Steroids plus subacute hypoxemia and ground-glass: exclude Pneumocystis."},{"id":"B13.2","c":13,"q":"A patient with HIV and Pneumocystis pneumonia and moderate to severe hypoxemia should receive trimethoprim-sulfamethoxazole plus:","o":["Bronchodilators","Antivirals","Antifungals only","Adjunctive corticosteroids","No additional therapy"],"a":3,"e":"Moderate to severe Pneumocystis pneumonia in HIV is treated with trimethoprim-sulfamethoxazole plus adjunctive corticosteroids, which reduce mortality. Bronchodilators, antivirals, antifungals alone or no additional therapy are inadequate.","t":"Moderate to severe PCP: add steroids to trimethoprim-sulfamethoxazole."},{"id":"B13.3","c":13,"q":"A neutropenic patient with persistent fever has nodules with a halo sign. The test most useful for aspergillosis is:","o":["D-dimer","Spirometry","Urine culture","Blood count","Serum or lavage galactomannan"],"a":4,"e":"Serum or lavage galactomannan supports the diagnosis of invasive aspergillosis in a neutropenic patient with halo-sign nodules. D-dimer, spirometry, urine culture and blood count do not.","t":"Galactomannan supports invasive aspergillosis."},{"id":"B13.4","c":13,"q":"A hematopoietic transplant recipient has pneumonia 6 weeks after transplant with fever and hypoxemia. A common viral cause is:","o":["Measles","Cytomegalovirus","Mumps","Rhinovirus only","Rubella"],"a":1,"e":"Cytomegalovirus is a leading viral cause of pneumonia in the weeks after hematopoietic transplant. Measles, mumps, rubella and rhinovirus alone are less common in this period.","t":"CMV pneumonia peaks 1 to 4 months after transplant."},{"id":"B13.5","c":13,"q":"Which vaccine is recommended for patients with chronic lung disease each year?","o":["Typhoid","Rabies","Yellow fever","Influenza","Hepatitis A only"],"a":3,"e":"Annual influenza vaccination is standard for patients with chronic lung disease. Typhoid, rabies, yellow fever and hepatitis A alone are not routine annual vaccines.","t":"Yearly influenza vaccine for chronic lung disease."},{"id":"B13.6","c":13,"q":"Which pairing is correct for pneumococcal protection in chronic lung disease?","o":["Only antibiotics","Only in childhood","Never repeated","No vaccination","Vaccination according to the current schedule"],"a":4,"e":"Pneumococcal protection in chronic lung disease is vaccination according to the current schedule from the national authority. Antibiotics alone, childhood-only vaccination or no vaccination leave patients exposed.","t":"Follow the current pneumococcal vaccine schedule."},{"id":"B13.7","c":13,"q":"Live vaccines are generally avoided in:","o":["Nobody","Children","Pregnant women only","Healthy adults","Patients on high-dose immunosuppression"],"a":4,"e":"Live vaccines are generally avoided in patients on high-dose immunosuppression because they can cause disease in immunocompromised hosts. They are not avoided in everyone, in healthy adults or in all children.","t":"Avoid live vaccines in high-dose immunosuppression."},{"id":"B13.8","c":13,"q":"A patient on tumor necrosis factor inhibitors has fever and a lobar infiltrate. Which unusual pathogens should be considered?","o":["No infections","Only common bacteria","Parasites only","Only viruses","Mycobacteria, Legionella, and endemic fungi"],"a":4,"e":"Tumor necrosis factor inhibitors raise the risk of granulomatous infections, so consider mycobacteria, Legionella and endemic fungi in addition to common pathogens. The other options wrongly limit the differential.","t":"Anti-TNF therapy: think mycobacteria, Legionella, endemic fungi."},{"id":"B13.9","c":13,"q":"A patient with a central line in the ICU has fever, and blood cultures grow Staphylococcus aureus. Which action is essential?","o":["Oral antibiotics only","Observe","Steroids","Remove the catheter and treat with appropriate antibiotics","Retain the line"],"a":3,"e":"Staphylococcus aureus bacteremia with a central line requires removing the catheter and appropriate antibiotics for source control. Oral antibiotics alone, observation, steroids or retaining the line risks relapse and endocarditis.","t":"S. aureus line infection: remove the catheter and treat."},{"id":"B13.10","c":13,"q":"The key step in preventing ventilator-associated pneumonia includes:","o":["Head-of-bed elevation, oral care, and minimizing sedation","Supine position","Routine antibiotics","Deep sedation","Avoiding extubation"],"a":0,"e":"Ventilator-associated pneumonia is reduced by a bundle: head-of-bed elevation, oral care and minimizing sedation. Supine position, routine antibiotics, deep sedation and avoiding extubation raise risk.","t":"VAP bundle: head up, oral care, less sedation."},{"id":"B13.11","c":13,"q":"A patient with a rapidly progressing infiltrate over hours after chemotherapy-induced neutropenia is most likely to have:","o":["Cytomegalovirus","Bacterial pneumonia","Pneumocystis pneumonia","Sarcoidosis","Radiation pneumonitis"],"a":1,"e":"Rapid progression over hours in a neutropenic patient suggests bacterial pneumonia. Cytomegalovirus, Pneumocystis and fungi evolve over days to weeks, and sarcoidosis and radiation pneumonitis do not appear this way.","t":"Tempo helps: hours suggests bacteria, weeks suggests fungus or Pneumocystis."},{"id":"B13.12","c":13,"q":"An immunocompromised patient has nonproductive cough and ground-glass opacities, and sputum induction is unrevealing. The next diagnostic step is:","o":["Observation","Chest radiograph in a year","Discharge","Bronchoalveolar lavage","Steroids first"],"a":3,"e":"When sputum induction is unrevealing in an immunocompromised patient with ground-glass opacities, perform bronchoalveolar lavage, which is high yield. Observation, discharge, delayed imaging or steroids first lose time.","t":"Immunocompromised, non-diagnostic sputum: bronchoalveolar lavage."},{"id":"B13.13","c":13,"q":"Clostridioides difficile infection risk rises in the ICU because of:","o":["Antibiotic exposure","Early mobility","Hand hygiene","Enteral feeding","Light sedation"],"a":0,"e":"Clostridioides difficile infection in the ICU is driven by antibiotic exposure, which disrupts gut flora. Early mobility, hand hygiene, enteral feeding and light sedation do not raise risk.","t":"Antibiotics are the main risk factor for C. difficile."},{"id":"B13.14","c":13,"q":"The best approach to antimicrobial stewardship in the ICU is:","o":["No cultures","Culture-guided de-escalation and defined duration","Continue unchanged","Longest possible therapy","Broadest agent always"],"a":1,"e":"ICU antimicrobial stewardship means culture-guided de-escalation and a defined duration, which reduces resistance and harm. No cultures, continuing unchanged, the longest therapy or always the broadest agent promote resistance.","t":"Stewardship: de-escalate on cultures and set a duration."},{"id":"B13.15","c":13,"q":"An immunocompromised patient has a positive serum cryptococcal antigen and a lung nodule. The next test is:","o":["Colonoscopy","Skin test","Spirometry","Lumbar puncture","No test"],"a":3,"e":"A positive cryptococcal antigen with a lung nodule in an immunocompromised patient requires a lumbar puncture to evaluate for meningeal involvement. Colonoscopy, skin test, spirometry or no test misses it.","t":"Positive cryptococcal antigen: lumbar puncture."},{"id":"B13.16","c":13,"q":"Which statement about respiratory syncytial virus vaccination is correct?","o":["It is not available","It replaces influenza vaccine","Vaccination is available for older adults and selected high-risk adults according to the current schedule","It is live and given to everyone","It is only for children"],"a":2,"e":"RSV vaccination is available for older adults and selected high-risk adults according to the current schedule. It does not replace the influenza vaccine, it is not live for everyone, and it is not only for children.","t":"RSV vaccine: older and selected high-risk adults per the current schedule."},{"id":"B24.1","c":24,"q":"A patient with advanced fibrosis has a rapidly declining forced vital capacity and DLCO despite treatment. The right time for referral to a transplant center is:","o":["Early, before the patient is too ill","When transplant is already contraindicated","Never","After one year of bed rest","Only when ventilated"],"a":0,"e":"Refer for lung transplant early, before the patient is too ill, when fibrosis declines quickly despite treatment, since early referral allows evaluation and optimization. Referring when contraindicated, never, after bed rest or only when ventilated is too late.","t":"Refer early for transplant evaluation."},{"id":"B24.2","c":24,"q":"Which factor is a usual contraindication to lung transplantation?","o":["Hypertension","Active malignancy or untreated chronic infection","Age of 40","Mild anemia","Prior pneumonia"],"a":1,"e":"Active malignancy or untreated chronic infection is a usual contraindication to lung tra
