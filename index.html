nsplantation, because immunosuppression makes the risk outweigh the benefit. Hypertension, age 40, mild anemia and prior pneumonia are not.","t":"Active cancer or untreated infection contraindicates transplant."},{"id":"B24.3","c":24,"q":"Primary graft dysfunction occurs:","o":["After 1 year","After 6 months","Only in recipients of living donors","After 5 years","In the first 72 hours after transplant"],"a":4,"e":"Primary graft dysfunction occurs in the first 72 hours after transplant, as an early ischemia-reperfusion injury. It is not a 6-month, 1-year or 5-year problem, and it is not restricted to living donors.","t":"Primary graft dysfunction: first 72 hours."},{"id":"B24.4","c":24,"q":"A transplant recipient 3 weeks after surgery has fever, dyspnea, and a declining FEV1. The first approach is:","o":["Increase steroids without testing","Oxygen only","Discharge","Bronchoscopy with biopsy to differentiate rejection from infection","Reassurance"],"a":3,"e":"Fever, dyspnea and falling FEV1 three weeks after transplant need bronchoscopy with biopsy and cultures to separate rejection from infection, since they overlap. Increasing steroids without testing, oxygen only, discharge or reassurance is unsafe.","t":"Early posttransplant decline: bronchoscopy with biopsy."},{"id":"B24.5","c":24,"q":"Chronic lung allograft dysfunction manifested as obstruction is called:","o":["Restrictive allograft syndrome","Bronchiolitis obliterans syndrome","Acute cellular rejection","Hyperacute rejection","Primary graft dysfunction"],"a":1,"e":"Chronic lung allograft dysfunction with obstruction is bronchiolitis obliterans syndrome. Restrictive allograft syndrome is the restrictive form, and acute rejection, hyperacute rejection and primary graft dysfunction differ.","t":"Obstructive CLAD = bronchiolitis obliterans syndrome."},{"id":"B24.6","c":24,"q":"Restrictive allograft syndrome is characterized by:","o":["Improvement with steroids","Obstruction only","Restriction with upper lobe fibrosis and pleural thickening","Pleural effusion alone","Normal physiology"],"a":2,"e":"Restrictive allograft syndrome shows restriction with upper lobe fibrosis and pleural thickening and has a worse prognosis than the obstructive form. It does not respond to steroids, is not obstructive only or normal.","t":"RAS: restriction with upper lobe fibrosis; poor prognosis."},{"id":"B24.7","c":24,"q":"A transplant recipient has a rising creatinine and tremor. A likely culprit is:","o":["An antibiotic only","Oxygen","A calcineurin inhibitor","A statin","A diuretic only"],"a":2,"e":"A rising creatinine and tremor in a transplant recipient point to a calcineurin inhibitor, which causes nephrotoxicity and neurotoxicity. Oxygen, statins and diuretics are less likely.","t":"Calcineurin inhibitors: kidney injury and tremor."},{"id":"B24.8","c":24,"q":"Which infection is most associated with the first month after lung transplantation?","o":["No infections","Pneumocystis only","Bacterial and fungal infections","Tuberculosis only","Late viral infections only"],"a":2,"e":"Bacterial and fungal infections dominate the first month after lung transplantation, from surgical and ventilator-related causes. Pneumocystis, tuberculosis and late viral infections appear later.","t":"First month: bacterial and fungal infection."},{"id":"B24.9","c":24,"q":"Cytomegalovirus risk is highest when:","o":["Both are positive","The donor is positive and the recipient is negative","Neither is tested","Recipient is positive and donor negative","Both are negative"],"a":1,"e":"Cytomegalovirus risk is highest when the donor is positive and the recipient negative, and it prompts prophylaxis. Both positive, both negative or recipient positive with donor negative carry lower risk.","t":"CMV D+/R- is the highest risk."},{"id":"B24.10","c":24,"q":"A recipient with new airway stricture at the anastomosis presents with:","o":["Rash","Cough only","Normal breathing","Effusion only","Wheeze, stridor, and obstruction"],"a":4,"e":"An anastomotic airway stricture presents with wheeze, stridor and obstruction, and is treated with bronchoscopic dilation or stenting. Rash, isolated cough and normal breathing do not fit.","t":"Anastomotic stricture: wheeze, stridor, obstruction."},{"id":"B24.11","c":24,"q":"Posttransplant lymphoproliferative disorder is linked to:","o":["Epstein-Barr virus and immunosuppression","Tuberculosis","Smoking","Sleep apnea","Asthma"],"a":0,"e":"Posttransplant lymphoproliferative disorder is a B-cell proliferation linked to Epstein-Barr virus and immunosuppression. It is not tied to tuberculosis, smoking, sleep apnea or asthma.","t":"PTLD: EBV plus immunosuppression."},{"id":"B7.1","c":7,"q":"A 70-year-old former smoker has 18 months of dry cough, exertional dyspnea, bibasilar inspiratory crackles, and clubbing. HRCT shows subpleural basal honeycombing with traction bronchiectasis and no atypical features. The most likely diagnosis is:","o":["Organizing pneumonia","Sarcoidosis","Asthma","Idiopathic pulmonary fibrosis","Hypersensitivity pneumonitis"],"a":3,"e":"Age over 60, chronic dry cough, bibasilar crackles, clubbing and a UIP pattern (subpleural basal honeycombing with traction bronchiectasis and no atypical features) establish idiopathic pulmonary fibrosis without biopsy. Hypersensitivity pneumonitis, organizing pneumonia, sarcoidosis and asthma have different imaging or features.","t":"UIP on HRCT in the right setting diagnoses IPF without biopsy."},{"id":"B7.2","c":7,"q":"Which HRCT finding is most atypical for a usual interstitial pneumonia pattern?","o":["Basal subpleural predominance","Reticulation","Honeycombing","Extensive mosaic attenuation with three-density sign","Traction bronchiectasis"],"a":3,"e":"Extensive mosaic attenuation with the three-density sign reflects air trapping and points to hypersensitivity pneumonitis, so it is atypical for UIP. Basal subpleural predominance, reticulation, honeycombing and traction bronchiectasis are all typical UIP features.","t":"Three-density sign and mosaic attenuation suggest hypersensitivity pneumonitis, not UIP."},{"id":"B7.3","c":7,"q":"The best next step for a patient with an indeterminate HRCT pattern and a suspected interstitial lung disease is:","o":["Multidisciplinary discussion, with biopsy considered if still unresolved","Antibiotics","Immediate lobectomy","Immediate steroids","Observation without review"],"a":0,"e":"An indeterminate HRCT pattern in suspected interstitial lung disease should go to multidisciplinary discussion of clinical, radiologic and, if needed, pathologic data, with biopsy considered if still unresolved. Antibiotics, immediate steroids or lobectomy skip diagnosis, and observation without review delays care.","t":"Unclear ILD: multidisciplinary discussion, then biopsy if needed."},{"id":"B7.4","c":7,"q":"Nintedanib for a patient with idiopathic pulmonary fibrosis is dosed at:","o":["150 mg once daily","300 mg twice daily","600 mg three times daily","150 mg twice daily with food","50 mg daily"],"a":3,"e":"Nintedanib for idiopathic pulmonary fibrosis is 150 mg twice daily with food, reduced to 100 mg twice daily for adverse effects. The other doses are not the label dose.","t":"Nintedanib: 150 mg twice daily with food."},{"id":"B7.5","c":7,"q":"A patient taking nintedanib develops diarrhea and elevated liver enzymes. Which action is correct?","o":["Dose reduction, treatment interruption, and monitoring","Stop all follow-up","Double the dose","Add steroids","Ignore the results"],"a":0,"e":"Diarrhea and raised liver enzymes on nintedanib are managed with dose reduction, interruption, supportive treatment and monitoring, rather than stopping follow-up, doubling the dose or adding steroids. Liver tests should be checked regularly.","t":"Nintedanib adverse effects: reduce or interrupt, treat diarrhea, monitor liver tests."},{"id":"B7.6","c":7,"q":"A patient with mild hepatic impairment (Child-Pugh A) starts nintedanib. The label dose is:","o":["100 mg twice daily","200 mg twice daily","300 mg twice daily","No dose","150 mg twice daily"],"a":0,"e":"In mild hepatic impairment (Child-Pugh A) the nintedanib dose is reduced to 100 mg twice daily, and it is not recommended in moderate or severe impairment. The full 150 mg dose is for normal liver function.","t":"Child-Pugh A: nintedanib 100 mg twice daily."},{"id":"B7.7","c":7,"q":"In a patient who smokes, nintedanib exposure is:","o":["Unmeasurable","Unchanged","Contraindicated","Higher","Lower, so cessation should be encouraged"],"a":4,"e":"Smoking lowers nintedanib exposure, so patients should be encouraged to stop. It is not contraindicated and its levels are measurable, not unchanged or higher.","t":"Smoking lowers nintedanib exposure."},{"id":"B7.8","c":7,"q":"Pirfenidone is started with which titration?","o":["801 mg once daily","267 mg three times daily for the first week, then 534 mg three times daily for the second week, then 801 mg three times daily","2,403 mg once daily","100 mg daily","Full dose at once"],"a":1,"e":"Pirfenidone is titrated over 14 days: 267 mg three times daily in week 1, 534 mg three times daily in week 2, then 801 mg three times daily. Starting at full dose causes more nausea and photosensitivity.","t":"Pirfenidone titrates over 14 days to 801 mg three times daily."},{"id":"B7.9","c":7,"q":"The maximum daily dose of pirfenidone is:","o":["801 mg","2,403 mg","4,806 mg","1,200 mg","3,000 mg"],"a":1,"e":"The maximum daily pirfenidone dose is 2,403 mg a day, given as 801 mg three times daily with food. The other totals are not label doses.","t":"Pirfenidone maximum: 2,403 mg a day."},{"id":"B7.10","c":7,"q":"A patient stops pirfenidone for 3 weeks because of an illness. How should it be restarted?","o":["At full dose","Repeat the titration schedule","Never restart","At double dose","At a random dose"],"a":1,"e":"After an interruption of 14 consecutive days or more, pirfenidone should be restarted with the full titration schedule rather than the maintenance dose. Restarting at full or double dose increases adverse effects, and it should not be abandoned.","t":"Gap of 14 days or more: re-titrate pirfenidone."},{"id":"B7.11","c":7,"q":"A patient on pirfenidone is prescribed ciprofloxacin, a moderate CYP1A2 inhibitor, 750 mg twice daily. Per the label, the pirfenidone dose becomes:","o":["267 mg once daily","801 mg three times daily","No change","534 mg three times daily","Contraindicated"],"a":3,"e":"Ciprofloxacin 750 mg twice daily is a moderate CYP1A2 inhibitor, and the label reduces pirfenidone to 534 mg three times daily. Staying at 801 mg three times daily risks overexposure, and it is not contraindicated.","t":"With moderate CYP1A2 inhibitors, reduce pirfenidone to 534 mg three times daily."},{"id":"B7.12","c":7,"q":"Which adverse effect of pirfenidone should be specifically counseled?","o":["Hyperthyroidism","Photosensitivity and nausea","Gingival hyperplasia","Hearing loss","Alopecia"],"a":1,"e":"Pirfenidone causes photosensitivity and nausea, so counsel on sun protection and taking it with food. Hyperthyroidism, gingival hyperplasia, hearing loss and alopecia are not its typical adverse effects.","t":"Pirfenidone: photosensitivity and nausea; take with food, use sunscreen."},{"id":"B7.13","c":7,"q":"According to the 2022 guideline, progressive pulmonary fibrosis is identified by:","o":["A single abnormal radiograph","Cough alone","Worsening symptoms, physiology, or imaging within the past year in a patient with a non-IPF fibrosing disease","Smoking history","Age over 65"],"a":2,"e":"The 2022 guideline identifies progressive pulmonary fibrosis by worsening symptoms, physiology or imaging within the past year in a patient with a non-IPF fibrosing disease. A single radiograph, cough, smoking or age alone does not define it.","t":"Progressive pulmonary fibrosis: worsening within a year in non-IPF fibrosing ILD."},{"id":"B7.14","c":7,"q":"Nintedanib is approved for which of these indications?","o":["Cystic fibrosis","Sarcoidosis alone","Asthma","Pneumonia","Idiopathic pulmonary fibrosis, chronic fibrosing interstitial lung disease with a progressive phenotype, and systemic sclerosis-associated interstitial lung disease"],"a":4,"e":"Nintedanib is approved for idiopathic pulmonary fibrosis, chronic fibrosing interstitial lung disease with a progressive phenotype, and systemic sclerosis-associated interstitial lung disease. It is not approved for cystic fibrosis, asthma, pneumonia or sarcoidosis alone.","t":"Nintedanib: IPF, progressive fibrosing ILD, SSc-ILD."},{"id":"B7.15","c":7,"q":"Which treatment is recommended against in idiopathic pulmonary fibrosis because of harm in a trial?","o":["Pulmonary rehabilitation","Antifibrotic therapy","Oxygen for hypoxemia","Vaccination","Combination prednisone, azathioprine, and N-acetylcysteine"],"a":4,"e":"The combination of prednisone, azathioprine and N-acetylcysteine increased deaths and hospitalizations in IPF and is recommended against. Rehabilitation, antifibrotics, oxygen for hypoxemia and vaccination are all appropriate.","t":"Never use prednisone-azathioprine-NAC for IPF."},{"id":"B7.16","c":7,"q":"A patient with idiopathic pulmonary fibrosis has acute worsening over 3 weeks with new bilateral ground-glass opacities and no infection or heart failure. This is:","o":["Pleural effusion","Asthma","Pneumothorax","Acute exacerbation of idiopathic pulmonary fibrosis","Pulmonary embolism"],"a":3,"e":"Acute worsening over weeks with new bilateral ground-glass opacities and no infection or heart failure is an acute exacerbation of IPF. It is a diagnosis of exclusion and carries a poor prognosis. Pneumothorax, effusion, embolism and asthma have different imaging.","t":"New bilateral ground-glass in IPF without infection or heart failure: acute exacerbation."},{"id":"B7.17","c":7,"q":"Which supportive care measure improves quality of life in fibrotic interstitial lung disease?","o":["Bed rest","Opioid avoidance without discussion","Pulmonary rehabilitation and appropriate oxygen","No vaccination","Smoking"],"a":2,"e":"Pulmonary rehabilitation and appropriate oxygen improve exercise capacity, symptoms and quality of life in fibrotic interstitial lung disease. Bed rest, withholding opioids without discussion, omitting vaccines and smoking do the opposite.","t":"Rehabilitation and oxygen improve quality of life in fibrotic ILD."},{"id":"B7.18","c":7,"q":"A patient with idiopathic pulmonary fibrosis is considered for transplant. The best time to refer is:","o":["Early after diagnosis, if age and comorbidities allow","After ventilation","After age 90","At respiratory failure only","Never"],"a":0,"e":"Patients with IPF who are potential transplant candidates should be referred early after diagnosis, if age and comorbidities allow, so evaluation and planning can proceed. Waiting until ventilation or respiratory failure is too late.","t":"Refer for transplant evaluation early in IPF."},{"id":"B7.19","c":7,"q":"Which idiopathic interstitial pneumonia is strongly tied to smoking and shows pigmented macrophages in alveoli?","o":["Acute interstitial pneumonia","Desquamative interstitial pneumonia","Usual interstitial pneumonia","Lymphoid interstitial pneumonia","Organizing pneumonia"],"a":1,"e":"Desquamative interstitial pneumonia is strongly tied to smoking and shows pigmented macrophages filling alveoli. Acute interstitial pneumonia, UIP, lymphoid interstitial pneumonia and organizing pneumonia have different pathology and associations.","t":"DIP: smoking-related, pigmented alveolar macrophages."},{"id":"B8.1","c":8,"q":"A woman with systemic sclerosis has a decline in forced vital capacity and a nonspecific interstitial pneumonia pattern. Which antifibrotic has an indication for systemic sclerosis interstitial lung disease?","o":["Methotrexate","Azithromycin","Montelukast","Pirfenidone for systemic sclerosis specifically","Nintedanib"],"a":4,"e":"Nintedanib carries an indication for systemic sclerosis-associated interstitial lung disease, so it is the antifibrotic to use when forced vital capacity declines. Pirfenidone is labeled for IPF, not for systemic sclerosis specifically, and methotrexate, azithromycin and montelukast are not antifibrotics.","t":"Nintedanib is the antifibrotic labeled for SSc-ILD."},{"id":"B8.2","c":8,"q":"Which interstitial pattern is typical of systemic sclerosis?","o":["Granulomatous","Nonspecific interstitial pneumonia","Pleural plaques","Usual interstitial pneumonia only","Cavitary"],"a":1,"e":"Nonspecific interstitial pneumonia is the most common interstitial pattern in systemic sclerosis, with ground-glass and reticulation sparing the subpleural region. Granulomatous, pleural plaque and cavitary patterns suggest other diseases, and UIP is less common in this setting.","t":"Systemic sclerosis: NSIP pattern."},{"id":"B8.3","c":8,"q":"A patient with rheumatoid arthritis has an interstitial lung disease. The most common pattern is:","o":["Cystic disease","Alveolar proteinosis","Pleural plaques","Granulomatous disease only","Usual interstitial pneumonia"],"a":4,"e":"Rheumatoid arthritis-associated interstitial lung disease most often shows a usual interstitial pneumonia pattern, which carries a worse prognosis, though NSIP also occurs. Cystic disease, proteinosis and pleural plaques are not typical.","t":"Rheumatoid ILD: UIP is the most common pattern."},{"id":"B8.4","c":8,"q":"A patient with proximal weakness, mechanic's hands, and interstitial lung disease has antisynthetase antibodies. The syndrome is:","o":["Sarcoidosis","Lupus","Antisynthetase syndrome","Scleroderma","Sjogren syndrome"],"a":2,"e":"Proximal weakness, mechanic's hands and interstitial lung disease with antisynthetase antibodies define antisynthetase syndrome: myositis, interstitial lung disease and arthritis. Sarcoidosis, lupus, scleroderma and Sjogren syndrome have different antibody profiles.","t":"Antisynthetase antibodies: myositis, ILD, mechanic's hands, arthritis."},{"id":"B8.5","c":8,"q":"A patient with rapidly progressive interstitial lung disease and amyopathic dermatomyositis has anti-MDA5 antibodies. The expected course is:","o":["Benign","Rapid progression with high mortality","No lung disease","Slow progression","Spontaneous resolution"],"a":1,"e":"Anti-MDA5 dermatomyositis with amyopathic skin disease causes rapidly progressive interstitial lung disease with high mortality, so early aggressive evaluation and treatment are needed. It is not benign, slow or self-resolving.","t":"Anti-MDA5: rapidly progressive ILD with high mortality."},{"id":"B8.6","c":8,"q":"A 35-year-old woman has bilateral hilar adenopathy, erythema nodosum, and arthralgia. The diagnosis is:","o":["Tuberculosis","Lymphoma","Histoplasmosis","Silicosis","Lofgren syndrome (sarcoidosis)"],"a":4,"e":"Bilateral hilar adenopathy with erythema nodosum and arthralgia in a young woman is Lofgren syndrome, an acute form of sarcoidosis with a good prognosis. Tuberculosis, lymphoma, histoplasmosis and silicosis do not usually combine these features.","t":"Hilar nodes plus erythema nodosum plus arthralgia = Lofgren syndrome."},{"id":"B8.7","c":8,"q":"A patient with sarcoidosis has hypercalcemia and a high ACE level. Which statement is correct?","o":["ACE predicts response","ACE is diagnostic","ACE excludes disease","Serum ACE is neither sensitive nor specific for diagnosis","ACE replaces biopsy"],"a":3,"e":"Serum ACE is neither sensitive nor specific for sarcoidosis, so it cannot confirm or exclude disease and does not replace biopsy. Noncaseating granulomas in the right clinical context remain central to diagnosis. A raised ACE does not predict treatment response.","t":"ACE does not diagnose or exclude sarcoidosis."},{"id":"B8.8","c":8,"q":"A sarcoidosis patient has cardiac palpitations and a conduction block. What should be done?","o":["Stop all follow-up","Reassure","Give antibiotics","Treat as anxiety","Evaluate for cardiac sarcoidosis with ECG, imaging, and specialist input"],"a":4,"e":"Palpitations and a conduction block in a patient with sarcoidosis raise cardiac sarcoidosis, which can cause arrhythmia and sudden death. Evaluate with ECG, imaging (cardiac MRI or PET) and specialist input. Reassurance, antibiotics or treating it as anxiety misses a life-threatening complication.","t":"Conduction block in sarcoidosis: evaluate for cardiac involvement."},{"id":"B8.9","c":8,"q":"In sarcoidosis, the main indication to start treatment is:","o":["Elevated ACE alone","Threatened organ function or severe symptoms","Asymptomatic stage I disease","Hilar adenopathy alone on radiograph","A patient request without findings"],"a":1,"e":"Treatment of sarcoidosis is reserved for threatened organ function or severe symptoms. Raised ACE, hilar nodes on radiograph and asymptomatic stage I disease are usually observed, and a patient request alone is not an indication.","t":"Treat sarcoidosis only for organ-threatening or severe disease."},{"id":"B8.10","c":8,"q":"A patient with a bird hobby has cough, dyspnea, crackles, and HRCT with centrilobular nodules and mosaic attenuation with air trapping. The diagnosis is:","o":["Sarcoidosis","Pneumonia","Idiopathic pulmonary fibrosis","Hypersensitivity pneumonitis","Lung cancer"],"a":3,"e":"A bird exposure with centrilobular nodules and mosaic attenuation with air trapping is hypersensitivity pneumonitis. Sarcoidosis, pneumonia, IPF and cancer do not combine this exposure and imaging.","t":"Bird exposure plus mosaic attenuation and air trapping = hypersensitivity pneumonitis."},{"id":"B8.11","c":8,"q":"The most important treatment in hypersensitivity pneumonitis is:","o":["Surgery","Antigen avoidance","Chronic antibiotics","Oxygen alone","Diuretics"],"a":1,"e":"Identifying and removing the exposure is the most important treatment in hypersensitivity pneumonitis. Steroids can be added for severe disease, but antibiotics, surgery, oxygen alone or diuretics do not treat the cause.","t":"Antigen avoidance is the key treatment for hypersensitivity pneumonitis."},{"id":"B8.12","c":8,"q":"A patient on long-term amiodarone develops dyspnea, a reduced DLCO, and new opacities. The first step is:","o":["Evaluate for amiodarone pulmonary toxicity and discuss stopping","Surgery","Increase the dose","Ignore","Start antifungals"],"a":0,"e":"Dyspnea, a reduced DLCO and new opacities in a patient on long-term amiodarone should prompt evaluation for amiodarone pulmonary toxicity and a discussion about stopping the drug. Increasing the dose or ignoring it is harmful, and antifungals or surgery do not apply.","t":"Amiodarone plus new lung opacities: suspect toxicity and review the drug."},{"id":"B8.13","c":8,"q":"A patient treated with bleomycin develops dry cough and fibrosis. A risk factor for toxicity is:","o":["Vegetarian diet","High cumulative dose and supplemental oxygen exposure","Young age only","Low dose","No risk factors"],"a":1,"e":"Bleomycin lung toxicity risk rises with a high cumulative dose and supplemental oxygen exposure, as well as age, renal impairment and radiation. Diet and low dose are not risk factors.","t":"Bleomycin toxicity: high cumulative dose and oxygen exposure raise risk."},{"id":"B8.14","c":8,"q":"Nitrofurantoin can cause:","o":["Acute hypersensitivity pneumonitis and chronic fibrosis","Thyroid disease","Only rash","Hearing loss","Cataracts"],"a":0,"e":"Nitrofurantoin can cause an acute hypersensitivity pneumonitis and, with long-term use, chronic interstitial fibrosis. It is not associated with thyroid disease, hearing loss or cataracts, and the reaction is more than a rash.","t":"Nitrofurantoin: acute hypersensitivity reaction and chronic fibrosis."},{"id":"B8.15","c":8,"q":"A patient on methotrexate has fever, dry cough, and hypoxemia with diffuse ground-glass opacities. The diagnosis to consider is:","o":["Aspiration","Pneumothorax","Pulmonary embolism only","Asthma","Methotrexate pneumonitis"],"a":4,"e":"Fever, dry cough, hypoxemia and diffuse ground-glass opacities on methotrexate suggest methotrexate pneumonitis, an idiosyncratic hypersensitivity reaction that can occur at any time. Aspiration, pneumothorax, embolism and asthma do not produce this picture.","t":"Methotrexate pneumonitis: fever, cough, hypoxemia, diffuse ground-glass."},{"id":"B8.16","c":8,"q":"A patient on a checkpoint inhibitor has new cough and ground-glass opacities. The correct approach is:","o":["Hold the drug, exclude infection, and treat as immune-related pneumonitis","Continue unchanged","Add antibiotics only","Increase the dose","Ignore"],"a":0,"e":"New cough and ground-glass opacities on a checkpoint inhibitor should lead to holding the drug, excluding infection and treating as immune-related pneumonitis, with grade determining steroid use. Continuing or increasing the drug, antibiotics alone or ignoring it is dangerous.","t":"Checkpoint inhibitor pneumonitis: hold the drug, exclude infection, grade, give steroids."},{"id":"B8.17","c":8,"q":"A patient has fever, dry cough, and peripheral eosinophilia with peripheral \"photographic negative\" opacities. The diagnosis is:","o":["Pulmonary edema","Sarcoidosis","Chronic eosinophilic pneumonia","Pneumocystis pneumonia","Fibrosis"],"a":2,"e":"Fever, dry cough, peripheral eosinophilia and peripheral \"photographic negative\" opacities describe chronic eosinophilic pneumonia, which responds quickly to corticosteroids. Edema, sarcoidosis, Pneumocystis and fibrosis lack eosinophilia and that pattern.","t":"Peripheral photographic-negative opacities plus eosinophilia = chronic eosinophilic pneumonia."},{"id":"B8.18","c":8,"q":"A patient has migratory peripheral opacities, a reverse halo sign, and subacute fever. The diagnosis to consider is:","o":["Emphysema","Cryptogenic organizing pneumonia","Pneumonia only","Sarcoidosis","Idiopathic pulmonary fibrosis"],"a":1,"e":"Migratory peripheral opacities with a reverse halo sign and subacute fever suggest cryptogenic organizing pneumonia, which causes migrating opacities and responds to steroids. Emphysema, sarcoidosis and IPF do not behave this way, and routine pneumonia would not migrate off antibiotics.","t":"Migrating opacities plus reverse halo = organizing pneumonia."},{"id":"B8.19","c":8,"q":"A young woman has cystic lung disease, recurrent pneumothorax, and renal angiomyolipoma. The diagnosis is:","o":["Sarcoidosis","Birt-Hogg-Dube syndrome","Pulmonary Langerhans cell histiocytosis","Emphysema","Lymphangioleiomyomatosis"],"a":4,"e":"A young woman with thin-walled cysts, recurrent pneumothorax and renal angiomyolipoma has lymphangioleiomyomatosis, which often occurs with tuberous sclerosis. Birt-Hogg-Dube causes cysts and renal carcinoma rather than angiomyolipoma, and Langerhans histiocytosis and sarcoidosis are different.","t":"Cysts plus pneumothorax plus angiomyolipoma = LAM."},{"id":"B8.20","c":8,"q":"A smoker has upper lobe nodules and cysts with sparing of the costophrenic angles. The diagnosis is:","o":["Cystic fibrosis","Lymphangioleiomyomatosis","Asthma","Bronchiectasis","Pulmonary Langerhans cell histiocytosis"],"a":4,"e":"A smoker with upper lobe nodules and cysts that spare the costophrenic angles has pulmonary Langerhans cell histiocytosis, and smoking cessation is the cornerstone of treatment. Lymphangioleiomyomatosis causes diffuse cysts in women, and cystic fibrosis, asthma and bronchiectasis differ.","t":"Upper-lobe nodules and cysts in a smoker: Langerhans cell histiocytosis; stop smoking."},{"id":"B8.21","c":8,"q":"A patient has crazy-paving on CT, a milky lavage fluid, and slowly progressive dyspnea. The diagnosis is:","o":["Pulmonary alveolar proteinosis","Pneumonia","Asthma","Heart failure","Fibrosis"],"a":0,"e":"Crazy-paving on CT, milky lavage fluid and slowly progressive dyspnea describe pulmonary alveolar proteinosis, and whole-lung lavage is a standard therapy. Pneumonia, asthma, heart failure and fibrosis do not give milky lavage.","t":"Crazy-paving plus milky lavage = alveolar proteinosis; treat with whole-lung lavage."},{"id":"B8.22","c":8,"q":"Autoimmune pulmonary alveolar proteinosis is associated with antibodies against:","o":["Acetylcholine receptor","Granulocyte-macrophage colony-stimulating factor","Cardiolipin","Nuclear antigens","Tissue transglutaminase"],"a":1,"e":"Autoimmune pulmonary alveolar proteinosis is caused by autoantibodies against granulocyte-macrophage colony-stimulating factor, which impair alveolar macrophage clearance of surfactant. The other antibodies belong to myasthenia, antiphospholipid syndrome, lupus and celiac disease.","t":"Autoimmune PAP: anti-GM-CSF antibodies."},{"id":"B8.23","c":8,"q":"A patient with Goodpasture disease has hemoptysis and kidney failure with anti-glomerular basement membrane antibodies. The key treatment is:","o":["Bronchodilators","Oxygen only","Antibiotics only","Plasma exchange with immunosuppression","Observation"],"a":3,"e":"Goodpasture disease (anti-glomerular basement membrane) with hemoptysis and kidney failure needs urgent plasma exchange with immunosuppression to preserve kidney function. Bronchodilators, oxygen alone, antibiotics or observation allow irreversible damage.","t":"Anti-GBM disease: plasma exchange plus immunosuppression, urgently."},{"id":"B8.24","c":8,"q":"A patient with Sjogren syndrome has cystic lung disease and lymphocytic infiltration. This is:","o":["Pulmonary embolism","Lymphocytic interstitial pneumonia","Silicosis","Usual interstitial pneumonia","Sarcoidosis"],"a":1,"e":"Cystic lung disease with lymphocytic infiltration in Sjogren syndrome is lymphocytic interstitial pneumonia, which is associated with that disease. UIP, silicosis, sarcoidosis and embolism do not fit.","t":"Sjogren with cysts and lymphocytic infiltrate: lymphocytic interstitial pneumonia."},{"id":"B8.25","c":8,"q":"The best test to screen interstitial lung disease in a patient with scleroderma is:","o":["High-resolution CT","Chest radiograph alone","Urinalysis","Allergy testing","Sputum culture"],"a":0,"e":"High-resolution CT is the best screen for interstitial lung disease in scleroderma, because it is much more sensitive than the chest radiograph, which can be normal. Urinalysis, allergy testing and sputum culture are not screens for ILD.","t":"Screen scleroderma ILD with HRCT."},{"id":"B8.26","c":8,"q":"A patient with systemic lupus erythematosus has acute pleuritic chest pain, dyspnea, and hypoxemia with clear lungs. The cause to consider is:","o":["Asthma","Shrinking lung syndrome or pulmonary embolism with antiphospholipid antibodies","Pneumonia only","COPD","Pneumothorax only"],"a":1,"e":"Acute pleuritic pain, dyspnea and hypoxemia with clear lungs in lupus suggest shrinking lung syndrome or pulmonary embolism, since antiphospholipid antibodies raise thrombotic risk. Asthma, COPD and simple pneumonia would not leave the lungs clear.","t":"Lupus with pleuritic pain and clear lungs: shrinking lung or embolism with antiphospholipid antibodies."},{"id":"B8.27","c":8,"q":"A patient with mixed connective tissue disease has pulmonary hypertension. The test best for screening is:","o":["Spirometry","Echocardiography with natriuretic peptide","Chest radiograph","Skin biopsy","ECG only"],"a":1,"e":"Screening for pulmonary hypertension in connective tissue disease uses echocardiography with natriuretic peptide, and right heart catheterization confirms. Spirometry, radiograph, skin biopsy or ECG alone are not adequate screens.","t":"Screen CTD for pulmonary hypertension with echocardiography and BNP."},{"id":"B8.28","c":8,"q":"Which finding supports connective tissue disease over idiopathic pulmonary fibrosis?","o":["Cough","Smoking history","Dyspnea","Raynaud phenomenon, rash, or positive serology","Basal crackles"],"a":3,"e":"Extrapulmonary features such as Raynaud phenomenon, rash or positive serology support a connective tissue disease rather than IPF. Cough, smoking history, dyspnea and basal crackles occur in both.","t":"Raynaud, rash or positive serology point away from IPF toward CTD-ILD."},{"id":"B8.29","c":8,"q":"A patient has nonspecific interstitial pneumonia with subpleural sparing. The most likely underlying condition is:","o":["Asthma","Lung cancer","A connective tissue disease or drug reaction","Pneumothorax","Silicosis"],"a":2,"e":"Nonspecific interstitial pneumonia with subpleural sparing is often secondary to a connective tissue disease or drug reaction. It is not typical of asthma, cancer, pneumothorax or silicosis.","t":"NSIP is usually secondary: look for connective tissue disease or drugs."},{"id":"B8.30","c":8,"q":"Which test is most useful to evaluate for hypersensitivity pneumonitis?","o":["Colonoscopy","Spirometry alone","Detailed exposure history, serum precipitins, and HRCT","Echocardiography","Skin biopsy"],"a":2,"e":"Evaluating hypersensitivity pneumonitis needs a detailed exposure history, serum precipitins and HRCT. Colonoscopy, spirometry alone, echocardiography and skin biopsy do not identify the antigen or pattern.","t":"Exposure history is the key to hypersensitivity pneumonitis."},{"id":"B8.31","c":8,"q":"A patient with end-stage fibrotic sarcoidosis has hypoxemia. Which referral is appropriate?","o":["Observation","Steroid only","Antibiotics","Surgery for nodules","Evaluation for lung transplantation"],"a":4,"e":"End-stage fibrotic sarcoidosis with hypoxemia warrants evaluation for lung transplantation. Observation, steroids alone, antibiotics or surgery for nodules do not address advanced fibrosis.","t":"Advanced fibrotic sarcoidosis: refer for transplant evaluation."},{"id":"B8.32","c":8,"q":"A patient with radiation exposure to the lung develops cough and infiltrates conforming to the field 8 weeks later. The diagnosis is:","o":["Tuberculosis","Radiation pneumonitis","Pulmonary embolism","Asthma","Sarcoidosis"],"a":1,"e":"Cough and infiltrates conforming to the radiation field about 8 weeks after lung irradiation are radiation pneumonitis. Timing and the field distribution make the diagnosis, and tuberculosis, embolism, asthma and sarcoidosis would not respect the field.","t":"Infiltrates confined to the radiation field weeks later = radiation pneumonitis."},{"id":"B8.33","c":8,"q":"A patient with chronic aspiration has recurrent infiltrates in dependent segments and bronchiolitis. The management includes:","o":["Surgery","Swallow evaluation and aspiration precautions","Steroids","Nothing","Oxygen only"],"a":1,"e":"Recurrent infiltrates in dependent segments with bronchiolitis suggest chronic aspiration, so management is a swallow evaluation and aspiration precautions to address the cause. Steroids, oxygen or surgery do not.","t":"Chronic aspiration: swallow evaluation and precautions."},{"id":"B8.34","c":8,"q":"A patient with a new interstitial lung disease takes several medications. The first diagnostic step related to drugs is:","o":["Stop everything without review","Ignore drugs","Order a biopsy first","Review all current and past drugs, including over-the-counter agents","Only review antibiotics"],"a":3,"e":"In a new interstitial lung disease, review all current and past drugs, including over-the-counter agents, because drug-induced disease is common and treatable. Stopping everything without review, ignoring drugs or biopsying first skips the simplest step.","t":"Take a systematic drug history in every new ILD."},{"id":"B8.35","c":8,"q":"Sarcoidosis commonly involves which organs besides the lung?","o":["Only the brain","None","Only the thyroid","Skin, eyes, lymph nodes, liver, and heart","Only the foot"],"a":3,"e":"Sarcoidosis is a multi-organ disease that commonly involves skin, eyes, lymph nodes, liver and heart, so a multi-organ screen is recommended. It is not limited to one organ.","t":"Screen sarcoidosis for skin, eye, liver, nodal and cardiac involvement."},{"id":"B8.36","c":8,"q":"The main reason to obtain a multidisciplinary discussion in interstitial lung disease is:","o":["To reduce visits","To replace the history","To delay care","To combine clinical, radiologic, and pathologic data into the best diagnosis","To avoid imaging"],"a":3,"e":"Multidisciplinary discussion combines clinical, radiologic and pathologic data into the most confident diagnosis and improves diagnostic confidence. It does not replace history, delay care or avoid imaging.","t":"MDD improves diagnostic confidence in ILD."},{"id":"B4.1","c":4,"q":"A 24-year-old woman has recurrent wheeze and cough at night. Spirometry shows an FEV1 of 2.4 L before and 2.8 L after bronchodilator. By the adult criteria, this response is:","o":["Diagnostic of COPD","Diagnostic of restriction","Positive, because the rise is at least 12% and at least 200 mL","Not interpretable","Negative"],"a":2,"e":"Adult bronchodilator responsiveness is an FEV1 rise of at least 12% and at least 200 mL from baseline. Here the rise is 400 mL, about 17%, so both thresholds are met and the response is positive. It supports variable airflow limitation and fits asthma; it is not diagnostic of COPD or restriction, and the result is fully interpretable.","t":"Positive reversibility in adults: FEV1 up at least 12% and 200 mL."},{"id":"B4.2","c":4,"q":"A patient's morning and evening peak flows differ by 14% on average over 2 weeks. In an adult, this variability is:","o":["Meaningless","Diagnostic of COPD","Above the 10% threshold and supports asthma","Normal","Diagnostic of heart failure"],"a":2,"e":"Average diurnal peak flow variability above 10% in an adult supports variable airflow limitation and therefore asthma. A value of 14% crosses that line. It does not indicate COPD or heart failure, and it is not a normal result.","t":"Adult peak flow variability above 10% supports asthma."},{"id":"B4.3","c":4,"q":"A child has diurnal peak flow variability of 11% over 2 weeks. By the pediatric threshold, this is:","o":["Not measurable","Above the threshold","Diagnostic","Excluded","Below the 13% threshold"],"a":4,"e":"The pediatric threshold for diurnal peak flow variability is above 13%, higher than the adult 10%. An 11% value in a child is below it, so it does not by itself support asthma, although it does not exclude it either.","t":"Children need more than 13% diurnal variability; adults more than 10%."},{"id":"B4.4","c":4,"q":"Bronchial provocation testing with methacholine supports asthma when the FEV1 falls by at least:","o":["40%","10%","8%","5%","20%"],"a":4,"e":"A methacholine challenge is positive when FEV1 falls by 20% or more from baseline (the PC20). Smaller falls of 5%, 8% or 10% are within normal variation. A positive test is sensitive, so it is most useful for ruling asthma out when it is negative.","t":"Methacholine is positive at a 20% fall in FEV1."},{"id":"B4.5","c":4,"q":"Before bronchodilator testing, how long should a long-acting beta agonist such as formoterol be withheld?","o":["Not at all","7 days","24 hours","4 hours","1 hour"],"a":2,"e":"Long-acting beta agonists such as formoterol and salmeterol should be withheld for 24 hours before bronchodilator or challenge testing, because residual bronchodilation hides reversibility. Short-acting agents need only 4 to 6 hours, so 1 or 4 hours is too short and 7 days is unnecessary.","t":"Hold LABA 24 hours; SABA 4 to 6 hours."},{"id":"B4.6","c":4,"q":"A fractional exhaled nitric oxide of 62 ppb in an adult with chronic cough:","o":["Proves COPD","Indicates infection","Excludes asthma","Supports type 2 inflammation but does not make or exclude asthma","Proves asthma"],"a":3,"e":"A FeNO of 62 ppb is above 50, which points to type 2 (eosinophilic) airway inflammation and predicts steroid response. It does not prove asthma, since atopy and eosinophilic bronchitis also raise it, and a normal value does not exclude asthma. It is not a marker of infection or COPD.","t":"FeNO above 50 ppb supports type 2 inflammation but cannot confirm or exclude asthma."},{"id":"B4.7","c":4,"q":"A 30-year-old man with new asthma symptoms has not started treatment. Why is it best to document variability before treatment?","o":["Steroids damage the test equipment","Spirometry only works untreated","Variability fades once anti-inflammatory therapy begins","Treatment prevents the test from being valid forever","Insurance requires it"],"a":2,"e":"Variable airflow limitation is easiest to document before anti-inflammatory therapy starts, because treatment makes spirometry and peak flow more normal and can mask the variability that defines asthma. The test equipment and validity are not damaged by steroids, and insurance rules are not the reason.","t":"Document variability before starting inhaled steroid whenever possible."},{"id":"B4.8","c":4,"q":"Which patient best matches a type 2 high phenotype?","o":["Asthma with no inflammation","Obesity-related late-onset neutrophilic asthma","Early-onset allergic asthma with raised eosinophils and exhaled nitric oxide","Pure vocal cord dysfunction","Smoking-related asthma"],"a":2,"e":"A type 2 high phenotype shows allergic or eosinophilic inflammation: early-onset allergic asthma with raised eosinophils and FeNO is the textbook example. Late-onset obesity-related neutrophilic disease, smoking-related asthma and vocal cord dysfunction are type 2 low or non-asthma, and asthma without any inflammation is not a defined phenotype.","t":"Type 2 high = allergic or eosinophilic, with high eosinophils and FeNO."},{"id":"B4.9","c":4,"q":"In the GINA 2026 report, the preferred reliever for adults and adolescents is:","o":["Theophylline","Oral steroid","Low-dose inhaled corticosteroid plus formoterol (Track 1)","Short-acting beta agonist alone","Montelukast"],"a":2,"e":"GINA prefers low-dose inhaled corticosteroid plus formoterol as the reliever (Track 1), because treating inflammation with every rescue dose lowers severe exacerbations compared with a short-acting beta agonist alone. Theophylline, oral steroids and montelukast are not recommended relievers.","t":"Preferred reliever: as-needed low-dose ICS-formoterol (Track 1)."},{"id":"B4.10","c":4,"q":"A short-acting beta agonist used alone at Step 1 is:","o":["Recommended at all steps","Preferred at Step 1","No longer the treatment of choice at any step","Required","Better than ICS-formoterol"],"a":2,"e":"GINA no longer endorses short-acting beta agonist as the sole treatment at any step, because it treats symptoms without controlling inflammation and is linked to exacerbations and death when overused. Combination ICS-formoterol is better at every step.","t":"SABA-only treatment is not recommended at any step."},{"id":"B4.11","c":4,"q":"What is new in the Track 2 reliever options in GINA 2026?","o":["Anticholinergic reliever","Oral steroid reliever","Montelukast reliever","Antihistamine reliever","A combination of inhaled corticosteroid and short-acting beta agonist"],"a":4,"e":"The Track 2 reliever options now include an inhaled corticosteroid plus short-acting beta agonist combination in a single inhaler. Anticholinergic, oral steroid, montelukast and antihistamine relievers are not in the guideline. Track 2 remains the alternative when ICS-formoterol is not possible.","t":"Track 2 reliever options include a combined ICS-SABA inhaler."},{"id":"B4.12","c":4,"q":"A patient in Track 1 has symptoms twice a week and takes as-needed low-dose ICS-formoterol. Which Step is this?","o":["Steps 1 to 2","Step 4","Step 5","Step 3","Step 0"],"a":0,"e":"Symptoms about twice a week fall in Steps 1 and 2, where Track 1 uses as-needed low-dose ICS-formoterol with no daily maintenance. Step 3 and above add maintenance therapy, and Step 0 does not apply to a patient already symptomatic.","t":"As-needed ICS-formoterol is the Track 1 plan for Steps 1 and 2."},{"id":"B4.13","c":4,"q":"At Step 3 in Track 1, the treatment is:","o":["Low-dose ICS-formoterol as maintenance and reliever therapy","Oral steroid","SABA alone","High-dose ICS","Biologic"],"a":0,"e":"At Step 3 in Track 1 the plan is low-dose ICS-formoterol as maintenance and reliever therapy, in a single inhaler. Oral steroid, SABA alone, high-dose ICS and biologics are not Step 3 treatments.","t":"Step 3, Track 1 = low-dose maintenance and reliever therapy."},{"id":"B4.14","c":4,"q":"In maintenance and reliever therapy, the low-dose regimen is:","o":["One inhalation twice daily plus one as needed","Four inhalations daily only","One inhalation weekly","Ten inhalations daily","Two inhalations twice daily plus one as needed"],"a":0,"e":"Low-dose maintenance and reliever therapy with budesonide-formoterol is one inhalation twice daily plus one as needed. Two inhalations twice daily is the medium-dose regimen, and the other options do not reflect the approved schedule.","t":"Low-dose MART: one inhalation twice daily plus one as needed."},{"id":"B4.15","c":4,"q":"With budesonide-formoterol, one inhalation delivers:","o":["80 mcg budesonide and 9 mcg formoterol","400 mcg budesonide and 12 mcg formoterol","800 mcg budesonide and 4.5 mcg formoterol","50 mcg of each","160 mcg budesonide and 4.5 mcg formoterol"],"a":4,"e":"Budesonide-formoterol in the common 160/4.5 inhaler delivers 160 mcg of budesonide and 4.5 mcg of formoterol per inhalation. The other combinations listed are not the standard maintenance and reliever inhaler strength.","t":"Budesonide-formoterol 160/4.5 mcg per inhalation."},{"id":"B4.16","c":4,"q":"A patient on maintenance and reliever therapy has used 14 inhalations in 24 hours. The correct action is:","o":["Seek medical care, because more than 12 inhalations exceeds the safe limit","Continue","Ignore","Switch to oral steroid at home","Double the dose"],"a":0,"e":"With budesonide-formoterol 160/4.5, the maximum is 12 total inhalations in 24 hours, so 14 exceeds the safe limit. Needing that many puffs means the asthma is out of control and urgent medical review is required. Continuing, doubling the dose or taking home oral steroids on their own is not safe.","t":"More than 12 inhalations a day means seek care."},{"id":"B4.17","c":4,"q":"GINA does not recommend which regimen in Track 1 Step 4?","o":["Referral","Add-on LAMA","High-dose ICS-formoterol maintenance","Biologic evaluation","Medium-dose maintenance and reliever therapy"],"a":2,"e":"In Track 1 Step 4 the recommendation is medium-dose maintenance and reliever therapy, with specialist referral and phenotype assessment. High-dose ICS-formoterol maintenance is not recommended in this step, because the extra steroid adds side effects for little extra benefit. Add-on LAMA, medium-dose MART, referral and biologic evaluation are all acceptable.","t":"Do not escalate to high-dose ICS-formoterol maintenance at Track 1 Step 4."},{"id":"B4.18","c":4,"q":"A daily budesonide dose of 600 mcg in an adult is:","o":["High","Medium","Not an inhaled steroid","Very low","Low"],"a":1,"e":"Adult budesonide daily dose bands are low 200 to 400, medium above 400 to 800, and high above 800 mcg. A dose of 600 mcg is therefore medium.","t":"Budesonide: low 200-400, medium 400-800, high above 800 mcg."},{"id":"B4.19","c":4,"q":"A daily fluticasone propionate dry powder dose of 600 mcg is:","o":["High","Low","Equivalent to budesonide 600 mcg","Very low","Medium"],"a":0,"e":"For fluticasone propionate dry powder, above 500 mcg a day is high dose, so 600 mcg is high. Doses of different inhaled steroids are not potency-equivalent, so 600 mcg of fluticasone is not the same as 600 mcg of budesonide.","t":"Fluticasone propionate above 500 mcg is high dose; do not compare mcg across drugs."},{"id":"B4.20","c":4,"q":"A daily beclometasone dipropionate dose of 300 mcg is:","o":["High","Low","Very high","Medium","Not a steroid"],"a":1,"e":"The low-dose band for beclometasone dipropionate is about 200 to 500 mcg a day, so 300 mcg is low dose. It is an inhaled corticosteroid, and it is not medium, high or very high.","t":"Beclometasone 200-500 mcg is low dose."},{"id":"B4.21","c":4,"q":"A patient has poorly controlled asthma on medium-dose ICS-LABA. What should be checked first?","o":["Surgery","Oral steroids","Thermoplasty","Biologic eligibility","Inhaler technique, adherence, triggers, and comorbidities"],"a":4,"e":"Before labeling asthma severe, check the basics: inhaler technique, adherence, triggers and comorbidities. A large share of uncontrolled cases improve once these are fixed. Biologics, thermoplasty, surgery or oral steroids come after that review.","t":"Check technique, adherence, triggers and comorbidity before escalating."},{"id":"B4.22","c":4,"q":"A patient on medication for rhinitis and reflux has poorly controlled asthma. Why treat these conditions?","o":["They cure asthma","They are unrelated","They are irrelevant","They cause cancer","Untreated comorbidities worsen control"],"a":4,"e":"Untreated comorbidities such as rhinitis, reflux, obesity and sleep apnea worsen asthma control, so treating them improves control. They do not cure asthma and they are not unrelated, nor do they cause cancer.","t":"Treat comorbidities to improve asthma control."},{"id":"B4.23","c":4,"q":"A patient on beta-blockers has worsening asthma. The best step is:","o":["Add oral steroid","Increase beta-blocker","Add antibiotics","Review and stop non-selective beta-blockers if possible","Ignore"],"a":3,"e":"Non-selective beta-blockers can precipitate bronchospasm and blunt the effect of rescue agonists, so they should be reviewed and stopped if possible. Adding steroid or antibiotics treats the symptom, and raising the beta-blocker would make the problem worse.","t":"Review and stop non-selective beta-blockers in asthma."},{"id":"B4.24","c":4,"q":"When stepping down therapy after good control, the advice is to:","o":["Switch to oral steroid","Stop ICS at once","Stop all drugs","Double the ICS dose","Reduce the ICS dose in modest steps and not stop it completely in adults"],"a":4,"e":"When stepping down, reduce the inhaled steroid dose in modest steps, usually by 25 to 50% every 3 months, and do not stop it entirely in adults, since complete withdrawal raises the risk of exacerbation. Switching to oral steroid or doubling the dose goes the wrong way.","t":"Step down gradually; do not stop ICS completely in adults."},{"id":"B4.25","c":4,"q":"Step-down should be most cautious:","o":["When the patient is on vacation","In young adults only","During winter holidays only","Never","After a recent exacerbation, in pregnancy, or in peak allergen season"],"a":4,"e":"Step-down should be most cautious after a recent exacerbation, during pregnancy or in peak allergen season, when relapse risk is higher. Vacations and winter holidays are not specific risk periods, and the advice does not apply only to young adults.","t":"Avoid stepping down after an exacerbation, in pregnancy or in allergen season."},{"id":"B4.26","c":4,"q":"Add-on options at Step 5 include:","o":["No options","A trial of high-dose ICS-LABA, a LAMA, azithromycin after referral, and biologics","Antibiotics for all","Surgery for all","Oral steroids as first choice"],"a":1,"e":"Step 5 add-ons are chosen after specialist assessment: a trial of high-dose ICS-LABA, a LAMA, azithromycin after referral, and biologics. Antibiotics for all, surgery for all and oral steroids as a first choice are not appropriate.","t":"Step 5 needs specialist phenotype assessment before add-ons."},{"id":"B4.27","c":4,"q":"The maximum low-dose oral prednisone-equivalent suggested as a last resort in severe asthma is:","o":["7.5 mg per day","2 mg per day","100 mg per day","40 mg per day","60 mg per day"],"a":0,"e":"If maintenance oral corticosteroid cannot be avoided, the goal is the lowest dose, generally at or below 7.5 mg a day of prednisone equivalent. Higher doses carry growing cumulative risks of bone loss, diabetes, cataract and adrenal suppression.","t":"Keep maintenance oral steroid at or below about 7.5 mg prednisone a day."},{"id":"B4.28","c":4,"q":"Which biologic class is aimed at IgE?","o":["Anti-TSLP","Anti-IgE","Anti-TNF","Anti-IL4 receptor","Anti-IL5"],"a":1,"e":"Anti-IgE therapy (omalizumab) targets IgE and is used for allergic asthma. Anti-IL-5 targets eosinophils, anti-IL-4 receptor blocks IL-4 and IL-13, anti-TSLP acts upstream, and anti-TNF has no role in asthma.","t":"Omalizumab is the anti-IgE biologic for allergic asthma."},{"id":"B4.29","c":4,"q":"A patient with eosinophilic asthma, nasal polyps, and oral steroid dependence is best matched to:","o":["Antibiotics","Bronchial thermoplasty first in all cases","Anti-TNF therapy","Dupilumab or an anti-IL-5 agent, chosen by phenotype and comorbidity","Antifungals"],"a":3,"e":"Eosinophilic asthma with nasal polyps and steroid dependence fits type 2 pathway biologics, dupilumab or an anti-IL-5 agent, chosen by phenotype and comorbidity. Antibiotics, antifungals, anti-TNF and thermoplasty do not match this profile.","t":"Eosinophilic asthma with polyps: dupilumab or anti-IL-5."},{"id":"B4.30","c":4,"q":"Before an anti-IL-5 biologic in a patient from an endemic area, which check is advised?","o":["Screen for helminth infection","Obtain an echocardiogram","Obtain a bone scan","Check cholesterol","Check thyroid"],"a":0,"e":"Eosinophils help control helminths, so patients from endemic areas should be screened and treated before eosinophil-lowering therapy such as an anti-IL-5 agent. An echocardiogram, bone scan, lipid or thyroid check does not address this risk.","t":"Screen for helminth infection before anti-IL-5 therapy in endemic areas."},{"id":"B4.31","c":4,"q":"Which statement about the general screen for refractory type 2 inflammation in a patient on high-dose inhaled steroid is correct? (This screen is provisional; confirm in the current GINA text.)","o":["IgE only","Any value is fine","Eosinophils below 10","Blood eosinophils of 150 per microliter or more, or FeNO of 20 ppb or more on high-dose ICS or daily oral steroid, suggests refractory type 2 inflammation","FeNO below 5"],"a":3,"e":"A blood eosinophil count of at least 150 per microliter or FeNO of at least 20 ppb while on high-dose inhaled steroid or daily oral steroid suggests refractory type 2 inflammation. This screen is provisional, and each biologic has its own label criteria, so the current guideline and label must be confirmed.","t":"Eosinophils 150 or more, or FeNO 20 ppb or more, on high-dose therapy suggests type 2 disease."},{"id":"B4.32","c":4,"q":"In a severe asthma patient, the label for any biologic must be checked because:","o":["Only brand names differ","Labels do not matter","Age limits and eosinophil, IgE, and exacerbation criteria differ between products","All labels are the same","Only price differs"],"a":2,"e":"Biologic labels differ in age limits and in the eosinophil, IgE and exacerbation criteria, so eligibility must be checked for each product. Labels are not identical, and price is not the only difference.","t":"Biologic eligibility is product-specific."},{"id":"B4.33","c":4,"q":"A 27-year-old man has an acute exacerbation after a cold, saturation of 91%, and speaks in short phrases. The first drug is:","o":["Antibiotics","Chest radiograph first","Sedation","Magnesium alone","A short-acting beta agonist, repeated during the first hour"],"a":4,"e":"A short-acting beta agonist, repeated during the first hour, is the first-line drug for an acute exacerbation. Antibiotics, sedation and magnesium alone are wrong first moves, and imaging should not delay bronchodilator treatment.","t":"First treatment in an exacerbation: repeated rapid-acting bronchodilator."},{"id":"B4.34","c":4,"q":"In primary care, the initial short-acting beta agonist regimen for a mild to moderate flare is:","o":["A single puff daily","Four puffs by spacer, one at a time, repeated as needed in the first hour","Twenty puffs at once","One puff weekly","No bronchodilator"],"a":1,"e":"For a mild to moderate flare, give four puffs of short-acting beta agonist by spacer, one at a time, repeated as needed during the first hour. Once-daily, once-weekly or very large single doses are not the standard, and bronchodilator should not be omitted.","t":"Repeat SABA by spacer during the first hour."},{"id":"B4.35","c":4,"q":"Ipratropium in an acute exacerbation is added for:","o":["Mild cases only","Moderate to severe presentations, up to three times with the beta agonist","Maintenance therapy","Outpatient prevention","Children under 2 only"],"a":1,"e":"Ipratropium is added to the beta agonist in moderate to severe exacerbations, up to three doses, and it adds little after the first one to two hours. It is not used for mild disease, maintenance or outpatient prevention.","t":"Add ipratropium early in moderate to severe exacerbations only."},{"id":"B4.36","c":4,"q":"Systemic corticosteroid for an adult exacerbation is:","o":["10 mg weekly","5 mg once","Not recommended","Prednisone or prednisolone 1 mg/kg daily up to 50 mg, for 5 to 7 days","200 mg daily for 30 days"],"a":3,"e":"An adult exacerbation is treated with prednisone or prednisolone 1 mg/kg a day up to 50 mg for 5 to 7 days. Early dosing shortens the exacerbation, and 30-day courses or tiny doses are not recommended.","t":"Prednisolone 1 mg/kg up to 50 mg for 5 to 7 days."},{"id":"B4.37","c":4,"q":"Oxygen in an acute asthma exacerbation is given:","o":["Never","Only if saturation is below 92%, aiming for no more than 95%","Only after intubation","To keep saturation at 100%","At 15 L/min always"],"a":1,"e":"Give controlled oxygen only if saturation is below 92%, aiming for 93 to 95%, and avoid hyperoxia. High flows to reach 100% are unnecessary and can raise PaCO2.","t":"Oxygen in asthma: target saturation 93 to 95%."},{"id":"B4.38","c":4,"q":"Intravenous magnesium sulfate in a severe exacerbation that fails initial treatment is:","o":["2 g over 20 minutes","200 mg over 5 minutes","Nebulized only","2 g over 24 hours","20 g over 1 minute"],"a":0,"e":"Intravenous magnesium sulfate 2 g over 20 minutes is used for a severe exacerbation that fails initial treatment, and it lowers admissions. Nebulized magnesium has not shown significant benefit, and the other doses and rates are not recommended.","t":"IV magnesium 2 g over 20 minutes for severe, refractory attacks."},{"id":"B4.39","c":4,"q":"An asthmatic with anaphylaxis features should receive:","o":["Antibiotics","Steroid only","Magnesium","Antihistamine only","Epinephrine first"],"a":4,"e":"An asthmatic with features of anaphylaxis needs epinephrine first, since it treats both airway and circulatory collapse. Antihistamines, steroids and magnesium are adjuncts and must not delay it.","t":"Anaphylaxis: epinephrine first."},{"id":"B4.40","c":4,"q":"A drowsy asthmatic with a silent chest and rising PaCO2 needs:","o":["Sedation","Observation only","Intensive care assessment for ventilatory support","More fluids","Discharge"],"a":2,"e":"Drowsiness, a silent chest and a rising PaCO2 mean respiratory muscle fatigue and impending respiratory failure. The patient needs intensive care assessment for ventilatory support. Sedation, observation, fluids or discharge are dangerous.","t":"Drowsy, silent chest and rising CO2 is near-fatal asthma."},{"id":"B4.41","c":4,"q":"Routine chest radiograph in an acute exacerbation is indicated:","o":["Never","To adjust steroids","To measure FEV1","Only for a specific reason such as suspected pneumonia or pneumothorax","Always"],"a":3,"e":"A routine chest radiograph is not needed in an acute exacerbation. Order it only for a specific reason such as suspected pneumonia or pneumothorax. It does not measure FEV1 or guide steroid dosing.","t":"Image only when pneumonia or pneumothorax is suspected."},{"id":"B4.42","c":4,"q":"At discharge after an exacerbation, the best step is:","o":["Defer follow-up for a year","Switch to a preferred anti-inflammatory reliever plan, check technique, and arrange follow-up within a week","Prescribe oral steroids long term","Stop all inhalers","Prescribe only a SABA"],"a":1,"e":"Discharge is the chance to optimize care: switch to the preferred anti-inflammatory reliever plan, check technique, and arrange follow-up within a week. Delaying follow-up for a year, stopping inhalers, or giving only a SABA or long-term oral steroid is poor practice.","t":"Follow up within a week after an exacerbation."},{"id":"B4.43","c":4,"q":"A 38-year-old bakery worker has symptoms that improve on holidays. The best next step is:","o":["Reassure","Serial peak flow at work and away from work and review of exposures","Stop inhalers","Start antibiotics","Increase steroids"],"a":1,"e":"Symptoms that improve on holidays suggest work-related asthma. The best step is serial peak flow at work and away from work together with a careful exposure review. Reassuring the patient or escalating steroids without checking the cause misses the diagnosis.","t":"Work-related asthma: compare peak flow at work and off work."},{"id":"B4.44","c":4,"q":"Which agent is a classic sensitizer causing occupational asthma?","o":["Sugar","Salt","Pure water","Isocyanates","Nitrogen"],"a":3,"e":"Isocyanates are classic sensitizers that cause occupational asthma, along with flour, latex, wood dust and animal proteins. Sugar, salt, water and nitrogen are not sensitizers.","t":"Isocyanates are a classic cause of occupational asthma."},{"id":"B4.45","c":4,"q":"The most effective management of occupational asthma is:","o":["Continuing exposure","Early removal from exposure plus standard therapy","Steroids alone","Antibiotics","Surgery"],"a":1,"e":"The most effective management of occupational asthma is early removal from exposure together with standard asthma therapy, since early removal gives the best chance of recovery. Continued exposure leads to permanent disease, and steroids alone or antibiotics do not fix the cause.","t":"Remove the sensitizer early."},{"id":"B4.46","c":4,"q":"A pregnant woman with asthma is worried about inhaled steroids. The correct advice is:","o":["Use only oral steroids","Stop all inhalers","Uncontrolled asthma poses greater risk than controller drugs, so continue the inhaled steroid","Switch to antibiotics","Avoid treatment"],"a":2,"e":"Uncontrolled asthma poses more risk to mother and baby than inhaled controller drugs, so the inhaled steroid should be continued in pregnancy. Stopping inhalers or avoiding treatment is harmful, and antibiotics or oral-only steroids are not appropriate substitutes.","t":"Continue inhaled steroid in pregnancy; poor control is the bigger risk."},{"id":"B4.47","c":4,"q":"A patient has episodic noisy inspiration, abrupt onset, and a normal saturation that does not respond to bronchodilators. The diagnosis is:","o":["Vocal cord dysfunction","Pneumonia","Heart failure","Pulmonary embolism","Severe asthma"],"a":0,"e":"Abrupt, episodic noisy inspiration with normal saturation and no response to bronchodilators points to vocal cord dysfunction (inducible laryngeal obstruction). Laryngoscopy during symptoms confirms it. Severe asthma would cause wheeze, hypoxemia and responds to bronchodilator, while pneumonia, heart failure and embolism have other features.","t":"Vocal cord dysfunction: inspiratory noise, normal saturation, no bronchodilator response."},{"id":"B4.48","c":4,"q":"The treatment of vocal cord dysfunction is:","o":["Surgery","Speech therapy and breathing retraining, with attention to reflux and rhinitis","Higher-dose inhaled steroids","Antibiotics","Biologics"],"a":1,"e":"Treatment of vocal cord dysfunction is speech therapy and breathing retraining, with attention to reflux and rhinitis. Escalating asthma drugs, antibiotics, biologics or surgery does not help and adds risk.","t":"Treat vocal cord dysfunction with speech therapy, not more asthma drugs."},{"id":"B4.49","c":4,"q":"A flattened inspiratory limb on a flow-volume loop points to:","o":["Variable extrathoracic obstruction","Restriction","Fixed intrathoracic obstruction","Normal","Emphysema"],"a":0,"e":"A flattened inspiratory limb on the flow-volume loop is the classic sign of variable extrathoracic obstruction, as in vocal cord dysfunction, where the airway narrows during inspiration. Fixed lesions flatten both limbs, and emphysema and restriction have different shapes.","t":"Flat inspiratory limb = variable extrathoracic obstruction."},{"id":"B4.50","c":4,"q":"A teenager moving to adult care has a risk of dropping out. The best step is:","o":["No planning","Delay care","Discharge without records","Stopping medications","A written action plan and a named adult clinic before transfer"],"a":4,"e":"A teenager moving to adult care is at risk of dropping out. A written action plan and a named adult clinic before transfer reduce loss to follow-up. No planning, delaying care or stopping medicines raises the risk of poor control.","t":"Plan the transition: written action plan and a named adult clinic."},{"id":"B5.1","c":5,"q":"A 64-year-old former smoker has dyspnea (mMRC 3), CAT of 18, and no exacerbations in the past year. Under GOLD 2026, the group and first-line therapy are:","o":["Group B, LABA plus LAMA","Group A, a single bronchodilator","Group A, ICS alone","Group E, triple therapy","No treatment"],"a":0,"e":"Group assignment uses exacerbation history and symptoms. This patient has high symptoms (mMRC 3, CAT 18) and no exacerbations, which is group B, and the first-line therapy is a LABA plus a LAMA. A single bronchodilator is for low-symptom group A, triple therapy is for group E with high eosinophils, and untreated symptomatic COPD is not acceptable.","t":"Group B (symptomatic, no exacerbations): LABA plus LAMA."},{"id":"B5.2","c":5,"q":"A man had two moderate exacerbations last year and has mild symptoms. His GOLD 2026 group is:","o":["B","C","A","E","D"],"a":3,"e":"In the version of GOLD the Handbook follows, one or more moderate exacerbations in the past year place the patient in group E regardless of symptoms. Two moderate events clearly qualify. Groups A, B and C are not used for patients with a recent exacerbation history, and group D was merged into E.","t":"Any recent moderate or severe exacerbation = group E."},{"id":"B5.3","c":5,"q":"The 2026 report changed group E to include:","o":["Two severe events","Cough alone","Low FEV1 alone","Only hospitalized exacerbations","A single moderate exacerbation in the past year"],"a":4,"e":"Older versions required two moderate exacerbations or one that led to hospitalization to reach group E. The 2026 report lowered the bar so that a single moderate exacerbation counts. Cough, low FEV1 alone, or hospitalization-only definitions do not describe the change. Confirm the exact wording in the current report.","t":"2026 group E: even one moderate exacerbation counts."},{"id":"B5.4","c":5,"q":"A patient with COPD has FEV1 of 38% predicted but no exacerbations and few symptoms. Under GOLD 2026, treatment choice depends mainly on:","o":["Age","Symptoms and exacerbation history","Body mass index","FEV1 alone","Smoking pack-years"],"a":1,"e":"Group and treatment choice depend mainly on symptoms and exacerbation history, not FEV1 alone. FEV1 describes airflow severity and prognosis, but a patient with an FEV1 of 38% who has few symptoms and no exacerbations still falls in a low-risk group. Age, BMI and pack-years do not set the group.","t":"GOLD group = symptoms plus exacerbations, not FEV1."},{"id":"B5.5","c":5,"q":"Post-bronchodilator spirometry confirms COPD when:","o":["DLCO is normal","Total lung capacity is low","Airflow limitation persists after bronchodilator","FEV1 rises by 15%","The radiograph is clear"],"a":2,"e":"COPD requires airflow limitation that persists after bronchodilator, shown by a post-bronchodilator ratio below the threshold. A clear radiograph, normal DLCO or a 15% FEV1 rise does not confirm it, and a low total lung capacity indicates restriction.","t":"Diagnose COPD on post-bronchodilator spirometry."},{"id":"B5.6","c":5,"q":"GOLD and the ATS/ERS differ on the spirometric definition because GOLD uses:","o":["A different test","Different drugs","A fixed ratio threshold, whereas the societies favor the lower limit of normal","Different symptoms","Different units"],"a":2,"e":"GOLD defines obstruction with a fixed post-bronchodilator FEV1/FVC below 0.70, whereas the ATS/ERS favor the lower limit of normal. The fixed ratio can over-diagnose in older adults and under-diagnose in younger ones. The societies do not use different drugs, symptoms or units.","t":"GOLD uses a fixed 0.70 ratio; ATS/ERS use the lower limit of normal."},{"id":"B5.7","c":5,"q":"A LABA plus ICS without a LAMA in COPD is:","o":["The best choice for group B","Preferred over LABA plus LAMA","Required in all patients","Not recommended; use triple therapy when an inhaled steroid is indicated","First-line"],"a":3,"e":"LABA plus ICS without a LAMA is not recommended in COPD. The dual bronchodilator LABA plus LAMA is the base, and if an inhaled steroid is indicated it is added to that as triple therapy. It is not first-line for group B, not preferred over LABA plus LAMA, and not required for everyone.","t":"Add ICS to LABA plus LAMA (triple), not in place of the LAMA."},{"id":"B5.8","c":5,"q":"A group E patient has a blood eosinophil count of 380 cells per microliter. The best addition to dual bronchodilators is:","o":["Theophylline","Antibiotics","Inhaled corticosteroid","Nothing","Oral steroid long term"],"a":2,"e":"In group E, blood eosinophils at 300 cells per microliter or higher favor adding an inhaled corticosteroid to the dual bronchodilator, because these patients are more likely to benefit in exacerbation reduction. Theophylline and antibiotics are not the next step, and long-term oral steroid is harmful.","t":"Eosinophils 300 or more favor adding ICS in group E."},{"id":"B5.9","c":5,"q":"A blood eosinophil count below 100 cells per microliter suggests:","o":["Infection","Asthma","Less benefit from adding ICS","Heart failure","Strong benefit from ICS"],"a":2,"e":"Blood eosinophils below 100 cells per microliter predict little benefit from adding an inhaled steroid and a higher pneumonia risk. They do not indicate infection, asthma or heart failure, and they do not predict strong benefit from ICS.","t":"Eosinophils below 100: little ICS benefit."},{"id":"B5.10","c":5,"q":"A patient on triple therapy with repeated pneumonias is likely to benefit from:","o":["Doubling the ICS","Stopping all inhalers","Considering withdrawal of the ICS if eosinophils are low","Starting oral steroid","Adding a second ICS"],"a":2,"e":"Inhaled steroids raise pneumonia risk in COPD. In a patient on triple therapy with repeated pneumonias, consider withdrawing the ICS, especially when eosinophils are low and exacerbations are not driving the regimen. Doubling or duplicating ICS or adding oral steroid raises the risk further.","t":"Repeated pneumonia on triple therapy: consider stopping ICS if eosinophils are low."},{"id":"B5.11","c":5,"q":"Roflumilast is most appropriate for a patient with:","o":["FEV1 below 50% predicted, chronic bronchitis, and exacerbations","Asthma only","Weight loss and depression as first choice","Normal spirometry","Mild COPD without exacerbations"],"a":0,"e":"Roflumilast is a PDE4 inhibitor used for patients with FEV1 below 50% predicted, chronic bronchitis and exacerbations despite maintenance therapy. Weight loss and psychiatric effects limit its use, so it is not a first choice in those patients. It has no role in asthma or mild COPD without exacerbations.","t":"Roflumilast: severe COPD with chronic bronchitis and exacerbations."},{"id":"B5.12","c":5,"q":"A former smoker has frequent exacerbations on triple therapy. Before azithromycin, which step is required?","o":["Rest","Oxygen","Add steroids","Surgery","Screen for nontuberculous mycobacteria and consider QT and hearing"],"a":4,"e":"Long-term azithromycin reduces exacerbations but can select for resistant nontuberculous mycobacteria and has cardiac (QT) and hearing effects. Before starting, screen for mycobacterial infection and consider the ECG and hearing. Rest, oxygen, steroids or surgery do not address the risk.","t":"Before chronic azithromycin: screen for NTM, check QT and hearing."},{"id":"B5.13","c":5,"q":"In GOLD 2026, a biologic is considered for a patient with:","o":["Normal eosinophils","Cough alone","An eosinophilic phenotype and exacerbations despite triple therapy, using the current label criteria","No exacerbations","Mild disease"],"a":2,"e":"A biologic is considered in GOLD 2026 for an eosinophilic phenotype with exacerbations despite triple therapy, using the label criteria. It is not for mild disease, normal eosinophils, cough alone or patients without exacerbations.","t":"Biologics for COPD: eosinophilic phenotype with exacerbations on triple therapy."},{"id":"B5.14","c":5,"q":"Dupilumab in COPD is aimed at patients with:","o":["Asthma only","Emphysema without exacerbations","Lung cancer","Chronic bronchitis, raised blood eosinophils, and continuing exacerbations","Mild disease"],"a":3,"e":"Dupilumab in COPD is aimed at patients with chronic bronchitis, raised blood eosinophils and continuing exacerbations. It is not for asthma-only disease, emphysema without exacerbations, lung cancer or mild disease. Check the current label criteria before prescribing.","t":"Dupilumab: chronic bronchitis plus eosinophilia plus exacerbations."},{"id":"B5.15","c":5,"q":"A patient hospitalized for a COPD exacerbation has pH 7.27, PaCO2 of 72 mm Hg, and is awake. The correct step is:","o":["Sedation","Observation","Intubation at once","High-flow oxygen at 100%","Noninvasive ventilation"],"a":4,"e":"An awake patient with acute respiratory acidosis (pH 7.27, PaCO2 72) in a COPD exacerbation should receive noninvasive ventilation, which lowers intubation and mortality. Sedation, observation or 100% oxygen is dangerous, and intubation is reserved for NIV failure or contraindications.","t":"pH below 7.35 with high PaCO2 in COPD exacerbation: noninvasive ventilation."},{"id":"B5.16","c":5,"q":"The standard drug treatment of a moderate to severe exacerbation includes:","o":["Diuretics","Antibiotics only","Short-acting bronchodilators, a short systemic steroid course, and antibiotics when indicated","Steroids long term","Sedatives"],"a":2,"e":"Moderate to severe exacerbations are treated with short-acting bronchodilators, a short systemic steroid course, and antibiotics when indicated. Antibiotics alone, long-term steroids, diuretics or sedatives are not the core regimen.","t":"Core exacerbation therapy: bronchodilators, a short steroid course, antibiotics when indicated."},{"id":"B5.17","c":5,"q":"Antibiotics in an exacerbation are most indicated when:","o":["Any wheeze","A normal radiograph with no change in sputum","Sputum purulence plus increased dyspnea or volume, or when ventilatory support is needed","Cough alone","Mild symptoms"],"a":2,"e":"Antibiotics are most indicated when sputum is purulent plus either more dyspnea or more sputum volume, or when ventilatory support is needed. Wheeze, cough alone, mild symptoms or unchanged sputum with a clear radiograph do not justify them.","t":"Purulent sputum plus another cardinal symptom, or ventilated patient: give antibiotics."},{"id":"B5.18","c":5,"q":"A patient with an exacerbation becomes drowsy with a headache after oxygen is raised to 6 L/min. The first action is:","o":["Discharge","Observe","Raise oxygen","Add a sedative","Lower oxygen to the target range, check a blood gas, and consider ventilation"],"a":4,"e":"Drowsiness and headache after high-flow oxygen suggest carbon dioxide retention. Lower oxygen to the target range, check a blood gas and consider ventilation. Raising oxygen, sedating or discharging the patient worsens or ignores hypercapnia.","t":"Titrate oxygen to 88 to 92% in COPD exacerbation."},{"id":"B5.19","c":5,"q":"An exacerbation of COPD can be triggered or mimicked by:","o":["Pulmonary embolism, pneumothorax, heart failure, pneumonia, and arrhythmia","Only smoking","Only infection","Sleep","Diet"],"a":0,"e":"Exacerbations can be triggered or mimicked by pulmonary embolism, pneumothorax, heart failure, pneumonia and arrhythmia, so always look for a cause. Smoking and infection are not the only possibilities, and sleep or diet are not typical triggers.","t":"Look for mimics: embolism, pneumothorax, heart failure, pneumonia, arrhythmia."},{"id":"B5.20","c":5,"q":"Routine tests on admission for an exacerbation include:","o":["Lung biopsy","Sleep study","Bronchoscopy","Chest radiograph and electrocardiogram","PET scan"],"a":3,"e":"A chest radiograph and electrocardiogram on admission help exclude mimics such as pneumonia, pneumothorax, heart failure and arrhythmia. Lung biopsy, sleep study, bronchoscopy and PET scan are not routine.","t":"Admission tests: chest radiograph and ECG."},{"id":"B5.21","c":5,"q":"After discharge from a COPD exacerbation, the best step is:","o":["Prescribe long-term steroids","No review","Review technique, optimize maintenance therapy, vaccinations, rehabilitation, and early follow-up","Delay follow-up for a year","Stop inhalers"],"a":2,"e":"Discharge after an exacerbation is the chance to change the regimen: review technique, optimize maintenance therapy, vaccinate, refer to rehabilitation and arrange early follow-up. Long-term steroids, no review or delayed follow-up leave the patient at high risk of readmission.","t":"After discharge: technique, maintenance therapy, vaccines, rehabilitation, early follow-up."},{"id":"B5.22","c":5,"q":"Pulmonary rehabilitation is recommended for:","o":["Every symptomatic patient and soon after an exacerbation","Only the mildest cases","Only young patients","Only those on oxygen","No one"],"a":0,"e":"Pulmonary rehabilitation improves symptoms and exercise capacity and is recommended for every symptomatic patient and soon after an exacerbation. It is not limited to the mildest cases, young patients or those on oxygen.","t":"Rehabilitation for every symptomatic patient, early after an exacerbation."},{"id":"B5.23","c":5,"q":"Long-term oxygen therapy is prescribed for:","o":["Mild disease","Chronic severe resting hypoxemia, or hypoxemia with right heart strain or polycythemia, by the current criteria","Moderate hypoxemia alone","Dyspnea without hypoxemia","Exertional breathlessness only"],"a":1,"e":"Long-term oxygen is given for chronic severe resting hypoxemia, or for hypoxemia with right heart strain or polycythemia, by current criteria. It is not given for mild disease, moderate hypoxemia alone, or breathlessness without hypoxemia.","t":"Long-term oxygen: severe resting hypoxemia or hypoxemia with cor pulmonale or polycythemia."},{"id":"B5.24","c":5,"q":"Home noninvasive ventilation may help patients with:","o":["Asthma only","Pronounced daytime hypercapnia and a recent hospitalization","Mild disease","Normal gases","No symptoms"],"a":1,"e":"Home noninvasive ventilation may help selected patients with pronounced daytime hypercapnia and a recent hospitalization, through a clinic that can follow them. It is not for mild disease, normal gases or asymptomatic patients.","t":"Home NIV: persistent daytime hypercapnia after hospitalization."},{"id":"B5.25","c":5,"q":"Lung volume reduction is considered in patients with:","o":["Chronic bronchitis only","Mild disease","Restriction","Severe emphysema limited by breathlessness despite full treatment and rehabilitation","Asthma"],"a":3,"e":"Lung volume reduction is considered for severe emphysema limited by breathlessness despite full treatment and rehabilitation, with careful selection. It is not for chronic bronchitis alone, mild disease, restriction or asthma.","t":"Lung volume reduction: severe emphysema that stays limiting despite full care."},{"id":"B5.26","c":5,"q":"Lung volume reduction options include:","o":["Steroids","Antibiotics","Surgery and bronchoscopic valves or coils","Radiation","Oxygen"],"a":2,"e":"Lung volume reduction can be done surgically or bronchoscopically with valves or coils, depending on emphysema pattern and f
