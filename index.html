<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;font-size:calc(16px*var(--fs,1))}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--hf);-webkit-font-smoothing:antialiased}
.rm *{transition:none!important;animation:none!important}

button{cursor:pointer}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:none}
header{position:sticky;top:0;z-index:20;background:var(--hd);color:#fff;padding-top:env(safe-area-inset-top)}
.hin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;background:none;border:0;padding:0;text-align:left}

main{max-width:1120px;margin:0 auto;padding:22px 20px 90px;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero .eye{color:#E9C987}.hero h1{color:#fff;font-size:clamp(24px,3.6vw,32px)}

.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--ind);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
:root[data-t=dark] .btn{color:#04140F}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:linear-gradient(145deg,#F1C36D,#D9A03A);color:#2B1B00}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}

.tile .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--gold2);color:var(--wa);margin-bottom:10px}
.tile b{font-family:var(--hf);font-size:28px;line-height:1.1}.tile b small{font-size:15px;color:var(--mu);font-weight:400}
.tile .l{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-top:4px}.tile .d{font-size:13px;color:var(--mu)}
.bar{height:7px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--oce);border-radius:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.focus{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:var(--r);padding:16px;box-shadow:var(--sh);width:100%}
.focus:hover{border-color:var(--oce);box-shadow:var(--sh2)}.focus b{font-family:var(--hf);font-size:16.5px;line-height:1.3}.focus span{font-size:13px;color:var(--mu)}
.pill{display:inline-block;align-self:flex-start;border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:700;background:var(--bg2);color:var(--mu)}
.pill.r{background:var(--bad2);color:var(--bad)}.pill.a{background:var(--gold2);color:var(--wa)}.pill.b{background:var(--oce2);color:var(--oce)}.pill.g{background:var(--ok2);color:var(--ok)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cm{position:relative;text-align:left;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ln);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.cm:hover{box-shadow:var(--sh2)}.cm.k1{border-left-color:var(--bad)}.cm.k2{border-left-color:var(--gold)}.cm.k3{border-left-color:var(--oce)}.cm.k4{border-left-color:var(--ok)}
.cm .n{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--mu)}.cm b{display:block;font-family:var(--hf);font-size:14.5px;line-height:1.3;margin:2px 0 6px}.cm small{color:var(--mu);font-size:12.5px}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--mu)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.bg{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.bg .e{font-size:26px;filter:grayscale(1);opacity:.4}.bg.on .e{filter:none;opacity:1}.bg.on{border-color:var(--gold);background:var(--gold2)}
.bg b{display:block;font-size:14px}.bg span{font-size:12.5px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}:root[data-t=dark] .chip.on{background:var(--ind);color:#04140F;border-color:var(--ind)}
.lab{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:11px;padding:10px 12px;font-size:15px}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--sf)}
.seg button{flex:1;border:0;background:none;padding:10px 8px;font-weight:600;font-size:14px;border-right:1px solid var(--ln)}.seg button:last-child{border:0}
.seg button.on{background:var(--hd);color:#fff}:root[data-t=dark] .seg button.on{background:var(--ind);color:#04140F}
.opt2{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.opt2.on{border-color:var(--hd);box-shadow:0 0 0 2px var(--hd) inset}.opt2 b{display:block}.opt2 span{font-size:13px;color:var(--mu)}
.sticky{position:sticky;bottom:78px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 16px;box-shadow:var(--sh2);margin-top:14px}
.sticky .cnt{font-size:15px;color:var(--mu)}.sticky .cnt b{font-size:22px;color:var(--ink);font-family:var(--hf)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .q{font-weight:600}.top .q span{color:var(--mu);font-weight:400}.top .sp{flex:1}
.clk{font-family:var(--hf);font-weight:700;font-size:21px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 14px;min-width:96px;text-align:center}
.clk.low{color:var(--bad);border-color:var(--bad)}
.pb{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-bottom:16px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--oce),var(--ind2));transition:width .3s}
.run{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.stem{font-family:var(--serif);font-size:1.22rem;line-height:1.55;margin:14px 0 18px}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:4px 10px;background:var(--gold2);color:var(--wa)}.tag.g{background:var(--bg2);color:var(--mu)}
.flag{margin-left:auto;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600}
.flag.on{background:#FBE4EE;border-color:#C2417A;color:#A8305E}
.orow{display:flex;gap:8px;margin-bottom:10px}
.o{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--ln);background:var(--sf);border-radius:13px;padding:12px 14px;line-height:1.45}
.o:hover{border-color:var(--oce)}
.o .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font-weight:800;font-size:13px}
.o.sel{border-color:var(--hd);background:var(--oce2)}.o.sel .L{background:var(--hd);color:#fff}
:root[data-t=dark] .o.sel .L{background:var(--ind);color:#04140F}
.o.ok{border-color:var(--ok);background:var(--ok2)}.o.ok .L{background:var(--ok);color:#fff}
.o.no{border-color:var(--bad);background:var(--bad2)}.o.no .L{background:var(--bad);color:#fff}
.o.dim{opacity:.55}.o.cut .t{text-decoration:line-through;opacity:.5}
.xo{flex:none;width:44px;border:1.5px dashed var(--ln);background:none;border-radius:13px;color:var(--mu)}.xo.on{background:var(--bg2);color:var(--ink)}
.conf{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}.conf .lab{margin:0 6px 0 0}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;color:var(--mu);font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.fb{border-radius:14px;padding:16px 18px;margin-top:12px;border:1px solid}
.fb.ok{background:var(--ok2);border-color:var(--ok)}.fb.no{background:var(--bad2);border-color:var(--bad)}
.fb h3{font-size:18px;display:flex;gap:10px;align-items:center;margin-bottom:6px}.fb h3 span{font:700 12px "Segoe UI",sans-serif;background:var(--sf);color:var(--mu);border-radius:8px;padding:3px 9px}
.fb p{margin:0}
.side{position:sticky;top:78px}
.navg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.nq{aspect-ratio:1;border:1.5px solid var(--ln);background:var(--sf);border-radius:10px;font-weight:700;font-size:13px;color:var(--mu);position:relative}
.nq.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;color:var(--ink)}.nq.ans{background:var(--bg2);color:var(--ink)}
.nq.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.nq.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.nq.fl:after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#C2417A}
.kl{display:flex;gap:12px;font-size:12px;color:var(--mu);margin:2px 0 12px;flex-wrap:wrap}.kl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.pace{font-size:13.5px;color:var(--mu);margin:0 0 12px}.pace b{color:var(--ink)}
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.big{font-family:var(--hf);font-size:58px;font-weight:700;line-height:1}
.rowbar{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}.rowbar:last-child{border:0}
.rowbar .bar{margin:5px 0 0}.rowbar .v{text-align:right;font-weight:700}
.rv{border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;background:var(--sf)}.rv summary{padding:12px 14px;display:flex;gap:10px}.rv .bd{padding:0 14px 14px}
.cardx{background:var(--sf);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--sh2);min-height:340px;padding:30px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}

.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}

.chart{width:100%;height:auto}

.foot{margin-top:36px;font-size:12.5px;color:var(--mu);border-top:1px solid var(--ln);padding-top:14px;max-width:80ch}
.over{position:fixed;inset:0;z-index:50;background:rgba(15,17,32,.85);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.empty{color:var(--mu);padding:12px 0}

.run>*,.two>*,.three>*,.grid3>*{min-width:0}html,body{overflow-x:hidden}nav button span{white-space:nowrap}
@media(max-width:720px){
 .hin{padding:10px 14px}.bt small{display:none}
 nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--hd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.2);gap:0}
 nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;flex:1}.top{gap:8px}.clk{font-size:18px;min-width:80px;padding:4px 10px}.stem{overflow-wrap:anywhere}nav button svg{width:22px;height:22px}
 main{padding:16px 14px 100px}.hero{grid-template-columns:1fr;padding:22px}.ring{margin:0 auto}.rwrap{margin:0 auto}

}

.logo{background:none!important;width:42px;height:42px;display:block}

<script id="bank" type="application/json">{"chapters":[{"n":1,"t":"Respiratory Physiology and the Pulmonary Consultation","p":"Part I. Foundations of Pulmonary Practice"},{"n":2,"t":"Approach to Dyspnea, Cough, Hemoptysis, and Chest Pain","p":"Part I. Foundations of Pulmonary Practice"},{"n":3,"t":"Pulmonary Function Testing, Chest Imaging, and Bronchoscopy","p":"Part I. Foundations of Pulmonary Practice"},{"n":4,"t":"Asthma","p":"Part II. Airway Disease"},{"n":5,"t":"Chronic Obstructive Pulmonary Disease","p":"Part II. Airway Disease"},{"n":6,"t":"Bronchiectasis, Cystic Fibrosis, and Other Obstructive and Upper Airway Disease","p":"Part II. Airway Disease"},{"n":7,"t":"Idiopathic Interstitial Pneumonias and Progressive Fibrosis","p":"Part III. Parenchymal Lung Disease"},{"n":8,"t":"Interstitial Lung Disease in Systemic Disease, Granulomatous, Drug-Induced, and Rare Diffuse Lung Disease","p":"Part III. Parenchymal Lung Disease"},{"n":9,"t":"Pulmonary Embolism and Venous Thromboembolism","p":"Part IV. Pulmonary Vascular Disease"},{"n":10,"t":"Pulmonary Hypertension, Vasculitis, and Vascular Malformations","p":"Part IV. Pulmonary Vascular Disease"},{"n":11,"t":"Pneumonia and Common Pulmonary Infection Syndromes","p":"Part V. Pulmonary Infection"},{"n":12,"t":"Tuberculosis, Nontuberculous Mycobacteria, and Fungal Infection","p":"Part V. Pulmonary Infection"},{"n":13,"t":"Host Defense, the Immunocompromised Host, Vaccination, and Infections in the ICU","p":"Part V. Pulmonary Infection"},{"n":14,"t":"Lung Cancer, Pulmonary Nodules, and Screening","p":"Part VI. Thoracic Neoplasia and Pleural Disease"},{"n":15,"t":"Other Thoracic Tumors, Malignant Pleural Disease, and Interventional Pulmonology","p":"Part VI. Thoracic Neoplasia and Pleural Disease"},{"n":16,"t":"Pleural Disease","p":"Part VI. Thoracic Neoplasia and Pleural Disease"},{"n":17,"t":"Obstructive Sleep Apnea and Sleep-Related Breathing Disorders","p":"Part VII. Sleep and Ventilatory Control"},{"n":18,"t":"Hypoventilation, Neuromuscular and Chest Wall Disease, and Non-Respiratory Sleep Disorders","p":"Part VII. Sleep and Ventilatory Control"},{"n":19,"t":"Respiratory Failure, Oxygen Therapy, and Noninvasive Ventilation","p":"Part VIII. Critical Care Medicine"},{"n":20,"t":"Mechanical Ventilation and Acute Respiratory Distress Syndrome","p":"Part VIII. Critical Care Medicine"},{"n":21,"t":"Shock, Sepsis, and Nonrespiratory Critical Care","p":"Part VIII. Critical Care Medicine"},{"n":22,"t":"ICU Monitoring, Sedation, Complications, and Liberation","p":"Part VIII. Critical Care Medicine"},{"n":23,"t":"Occupational and Environmental Lung Disease and Tobacco Treatment","p":"Part IX. Special Topics and Professional Practice"},{"n":24,"t":"Lung Transplantation and Transplant Complications","p":"Part IX. Special Topics and Professional Practice"},{"n":25,"t":"Quality, Safety, Ethics, Evidence Interpretation, and Pandemic Response","p":"Part IX. Special Topics and Professional Practice"}],"questions":[{"id":"B1.1","c":1,"q":"A 62-year-old woman with myasthenia gravis has an arterial oxygen level of 58 mm Hg and a carbon dioxide level of 68 mm Hg on room air. The alveolar-arterial gradient is normal. Which mechanism best explains her hypoxemia?","o":["Low inspired oxygen","Shunt","Ventilation-perfusion mismatch","Diffusion limitation","Hypoventilation"],"a":4,"e":"A normal alveolar-arterial gradient together with a raised PaCO2 means the lung itself is working and the problem is too little alveolar ventilation, which fits weak respiratory muscles in myasthenia gravis. Shunt, ventilation-perfusion mismatch and diffusion limitation all widen the gradient. Low inspired oxygen would also leave the gradient normal, but it would lower PaCO2 through the extra breathing it provokes, not raise it.","t":"Hypoxemia with high PaCO2 and a normal A-a gradient is hypoventilation."},{"id":"B1.2","c":1,"q":"A 30-year-old man with a congenital right-to-left intracardiac communication has a saturation of 82% that rises to 85% on 100% oxygen. What is the mechanism?","o":["Diffusion limitation","Mild ventilation-perfusion mismatch","Hypoventilation","Dead space","Shunt"],"a":4,"e":"Blood moving through a right-to-left communication never meets ventilated alveoli, so it stays desaturated no matter how much oxygen the patient breathes. A rise from 82% to only 85% on 100% oxygen is the classic shunt response. Diffusion limitation and mild V/Q mismatch correct substantially with oxygen, and hypoventilation or dead space would not produce this fixed-fraction pattern.","t":"A poor response to 100% oxygen means true shunt."},{"id":"B1.3","c":1,"q":"A hiker develops breathlessness at high altitude. Her arterial oxygen is low, the gradient is normal, and her carbon dioxide is low. The mechanism is:","o":["Dead space","Diffusion limitation","Shunt","Low inspired oxygen pressure","Hypoventilation"],"a":3,"e":"At altitude the barometric pressure falls, so the inspired oxygen pressure falls and arterial oxygen drops with a normal gradient. The hypoxemia drives faster breathing, which is why PaCO2 is low. Shunt, diffusion limitation and dead space all widen the gradient, and hypoventilation would raise PaCO2, not lower it.","t":"Normal A-a gradient with low PaCO2 at altitude is low inspired oxygen pressure."},{"id":"B1.4","c":1,"q":"A smoker with severe emphysema has hypoxemia that corrects with 2 L/min of nasal oxygen. The dominant mechanism is:","o":["Ventilation-perfusion mismatch","Pulmonary arteriovenous malformation","Right-to-left shunt","Anemia","Alveolar hypoventilation"],"a":0,"e":"Emphysema produces many low V/Q units, and these respond well to a small amount of supplemental oxygen because the alveoli still receive some ventilation. True shunt, such as a pulmonary arteriovenous malformation, does not correct with oxygen. Anemia lowers oxygen content, not PaO2, and hypoventilation would show hypercapnia.","t":"Hypoxemia that corrects easily with low-flow oxygen is V/Q mismatch, not shunt."},{"id":"B1.5","c":1,"q":"A man in a house fire has a pulse oximeter reading of 99% and is confused. Arterial blood gas shows a normal PaO2. The most useful next test is:","o":["Co-oximetry for carboxyhemoglobin","Chest radiograph","Spirometry","D-dimer","Repeat pulse oximetry"],"a":0,"e":"Standard pulse oximetry reads carboxyhemoglobin as if it were oxyhemoglobin, so a smoke-inhalation patient can read 99% while severely poisoned. A normal PaO2 on the blood gas does not exclude carbon monoxide either. Co-oximetry measures the actual hemoglobin species and gives the diagnosis; repeating oximetry only repeats the same error.","t":"Pulse oximetry and PaO2 are falsely normal in carbon monoxide poisoning; order co-oximetry."},{"id":"B1.6","c":1,"q":"A patient has fever, acidosis, and raised 2,3-diphosphoglycerate. How is the oxyhemoglobin dissociation curve shifted, and what is the effect?","o":["Right shift; oxygen is held more tightly","Left shift; oxygen is released more easily","No shift","Right shift; hemoglobin releases oxygen more easily","Left shift; hemoglobin holds oxygen more tightly"],"a":3,"e":"Fever, acidosis and raised 2,3-diphosphoglycerate all shift the oxyhemoglobin curve to the right. At a given PaO2 the saturation is lower, which means hemoglobin gives up oxygen more readily to the tissues. A left shift does the opposite and holds oxygen more tightly, so options describing a left shift or a tighter hold are wrong.","t":"Right shift (acid, CO2, heat, 2,3-DPG) increases oxygen unloading."},{"id":"B1.7","c":1,"q":"A 24-year-old with severe asthma exacerbation breathes quickly. Arterial carbon dioxide is 42 mm Hg and he is tiring. The correct interpretation is:","o":["Metabolic compensation","Laboratory error","Hyperventilation","A warning sign, because a patient in this state would be expected to have a low value","Normal and reassuring"],"a":3,"e":"In a severe asthma attack the patient should be blowing off carbon dioxide, so a PaCO2 of 42 mm Hg is already inappropriately normal. In a tiring patient it means the respiratory muscles are failing and ventilatory failure is close. It is not reassuring, not hyperventilation and not metabolic compensation.","t":"A normal or rising PaCO2 in severe asthma is an ominous sign of fatigue."},{"id":"B1.8","c":1,"q":"A patient has a large pulmonary embolus. Compared with before, the physiologic dead space fraction is expected to:","o":["Fall","Become zero","Rise","Equal the shunt fraction","Stay the same"],"a":2,"e":"A large embolus leaves lung that is ventilated but poorly perfused, and that adds wasted ventilation. Physiologic dead space fraction therefore rises, and the end-tidal to arterial CO2 gap widens. It does not fall, stay unchanged or equal the shunt fraction, because shunt is perfusion without ventilation, the opposite problem.","t":"Pulmonary embolism raises dead space, not shunt."},{"id":"B1.9","c":1,"q":"A 70-year-old man with hypercapnic COPD is given a high oxygen fraction in the ambulance and becomes drowsy with a carbon dioxide of 85 mm Hg. Which mechanism contributes most to the worsening hypercapnia?","o":["Increased dead space and release of hypoxic vasoconstriction, plus the Haldane effect","Loss of hypoxic ventilatory drive alone","Pneumothorax","Bronchospasm","Alkalosis"],"a":0,"e":"High-flow oxygen in hypercapnic COPD raises PaCO2 mainly by worsening V/Q matching (release of hypoxic vasoconstriction increases perfusion of poorly ventilated units, which raises dead space) and by the Haldane effect, in which oxygenated hemoglobin binds less carbon dioxide. Loss of hypoxic drive contributes but is the smaller part. Bronchospasm, pneumothorax and alkalosis do not explain the pattern.","t":"Oxygen-induced hypercapnia is mostly V/Q change plus the Haldane effect; titrate to 88 to 92%."},{"id":"B1.10","c":1,"q":"A consultant is asked whether a patient with chronic cough \"needs a bronchoscopy.\" What is the first step in a good pulmonary consultation?","o":["Start empiric antibiotics","Refer to surgery","Repeat the radiograph","Clarify the question and review the history, exposures, and medications","Order bronchoscopy"],"a":3,"e":"A good consultation starts by clarifying exactly what the referring clinician is asking, then taking a focused history that includes exposures and medications. Ordering bronchoscopy, antibiotics or surgery referral before that risks treating the wrong problem, and repeating the radiograph adds little.","t":"Clarify the question and take the history before choosing tests."},{"id":"B1.11","c":1,"q":"A 55-year-old woman has a low FEV1 and a low DLCO with a normal total lung capacity. Which statement about her gas transfer is correct?","o":["DLCO always rises with emphysema","DLCO measures airway resistance","DLCO is unaffected by anemia","DLCO falls when alveolar-capillary surface or hemoglobin falls","DLCO is the same as FEV1/FVC"],"a":3,"e":"DLCO reflects alveolar-capillary surface area, membrane thickness and hemoglobin concentration, so it falls with emphysema, interstitial disease, pulmonary vascular disease and anemia. It does not measure airway resistance and is not the same as the FEV1/FVC ratio. Emphysema lowers it, it does not raise it, and anemia must be corrected for.","t":"Low DLCO means loss of gas-exchange surface, thickened membrane or low hemoglobin."},{"id":"B2.1","c":2,"q":"A 58-year-old former smoker has had exertional dyspnea for 4 months. Examination, radiograph, and spirometry are normal. The next step to separate cardiac, pulmonary, and deconditioning causes is:","o":["Reassurance","Bronchoscopy","Lung biopsy","Cardiopulmonary exercise testing","Empiric steroids"],"a":3,"e":"When history, examination, radiograph and spirometry are normal but breathlessness persists, cardiopulmonary exercise testing identifies the limiting system: ventilatory, cardiac, vascular, or deconditioning. Reassurance leaves the symptom unexplained, and bronchoscopy, lung biopsy or empiric steroids have no target.","t":"Unexplained dyspnea after normal first-line tests calls for cardiopulmonary exercise testing."},{"id":"B2.2","c":2,"q":"A nonsmoker on an angiotensin-converting enzyme inhibitor has a dry cough for 3 months and a clear chest radiograph. The best first step is:","o":["Bronchoscopy","Stop or change the drug and reassess","Antibiotics","CT of the chest","High-dose inhaled steroid"],"a":1,"e":"Angiotensin-converting enzyme inhibitors cause a dry cough in a sizable minority of patients, and it resolves within weeks of stopping the drug. With a clear radiograph and no alarm features, stopping or switching the drug is the correct first step. Imaging, bronchoscopy, antibiotics and inhaled steroids are not indicated.","t":"ACE inhibitor cough resolves after stopping the drug; switch to an angiotensin receptor blocker."},{"id":"B2.3","c":2,"q":"A 66-year-old man has cough with a small volume of hemoptysis and has lost weight. Which feature most strongly argues for early imaging and bronchoscopy?","o":["Cough at night","Heartburn","Hemoptysis with weight loss in a smoker","Normal spirometry","Nasal congestion"],"a":2,"e":"Hemoptysis with weight loss in a smoker is the combination that raises the chance of lung cancer and justifies early CT and bronchoscopy. Night cough, heartburn, nasal congestion and normal spirometry are common and do not by themselves change the urgency of imaging.","t":"Hemoptysis plus weight loss in a smoker needs early imaging and bronchoscopy."},{"id":"B2.4","c":2,"q":"A man has massive hemoptysis from the right lung. The best positioning is:","o":["Trendelenburg only","Sitting upright","Supine","Right side down","Left side down"],"a":3,"e":"In massive hemoptysis the bleeding lung is placed down, so blood does not spill into the healthy lung and gas exchange is protected. Sitting up, lying supine or head-down positioning without regard to the side risks aspiration into the good lung.","t":"Bleeding side down in massive hemoptysis."},{"id":"B2.5","c":2,"q":"A 40-year-old woman has pleuritic chest pain and a pulse of 110 after a long flight. The first step is to:","o":["Assign clinical probability and test accordingly","Order a bone scan","Reassure","Start steroids","Perform bronchoscopy"],"a":0,"e":"Pleuritic pain and tachycardia after a long flight raise the possibility of pulmonary embolism, and the standard approach is to estimate clinical probability first and then choose D-dimer or imaging accordingly. Bone scan, steroids, bronchoscopy or simple reassurance skip that step.","t":"Estimate pretest probability first in suspected pulmonary embolism."},{"id":"B2.6","c":2,"q":"A patient with chronic cough has an eosinophil-predominant sputum and normal imaging. The most likely diagnosis is:","o":["Bronchiectasis","Lung cancer","Pulmonary fibrosis","Eosinophilic bronchitis or cough-variant asthma","Tuberculosis"],"a":3,"e":"Eosinophil-predominant sputum with a normal radiograph points to eosinophilic airway inflammation, so eosinophilic bronchitis or cough-variant asthma. Bronchiectasis, cancer, fibrosis and tuberculosis would show imaging abnormalities or different sputum findings.","t":"Eosinophilic bronchitis causes cough with airway eosinophils but no airflow variability."},{"id":"B3.1","c":3,"q":"A man has FEV1 60% predicted, FVC 85% predicted, a low FEV1/FVC ratio, and a high residual volume. The pattern is:","o":["Mixed restriction","Neuromuscular weakness","Obstruction with air trapping","Normal","Restriction"],"a":2,"e":"A low FEV1/FVC ratio defines obstruction, and a high residual volume shows air trapping. FVC is relatively preserved here. Restriction needs a low total lung capacity, and a neuromuscular process would not typically raise residual volume in this way.","t":"Low ratio plus high residual volume is obstruction with air trapping."},{"id":"B3.2","c":3,"q":"Which change on pulmonary function testing best supports a restrictive process?","o":["High residual volume","Normal DLCO in all cases","High FEV1/FVC with a normal TLC","Low total lung capacity","Low ratio"],"a":3,"e":"Restriction is defined by a reduced total lung capacity, not by spirometry alone. A high residual volume or low ratio points to obstruction, and DLCO can be normal or low in restriction depending on the cause.","t":"Restriction is a low TLC."},{"id":"B3.3","c":3,"q":"A patient has a normal spirometry and a very low DLCO with exertional desaturation. The most likely explanation is:","o":["Pulmonary vascular disease or early interstitial disease","Vocal cord dysfunction","Asthma","Chronic bronchitis","Obesity"],"a":0,"e":"With normal spirometry and an isolated, very low DLCO plus exertional desaturation, think of disease that removes gas-exchange surface without airway obstruction: pulmonary vascular disease or early interstitial disease. Asthma, vocal cord dysfunction, bronchitis and obesity do not lower DLCO to this degree.","t":"Normal spirometry with low DLCO suggests pulmonary vascular or early interstitial disease."},{"id":"B3.4","c":3,"q":"Under the 2023 ATS interpretation standard, which reference approach should laboratories use?","o":["Race-neutral reference equations (such as GLI Global)","Race-based correction factors","Fixed 80% predicted threshold","Fixed ratio of 0.70 only","No reference equations"],"a":0,"e":"The 2023 ATS interpretation standard recommends race-neutral reference equations such as GLI Global and use of the lower limit of normal, instead of race-based correction, a fixed 80% predicted cutoff or a fixed 0.70 ratio.","t":"Use race-neutral equations and the lower limit of normal."},{"id":"B3.5","c":3,"q":"A flow-volume loop shows flattening of both the inspiratory and expiratory limbs. This suggests:","o":["Asthma","Emphysema","Variable extrathoracic obstruction","Restriction","Fixed upper airway obstruction"],"a":4,"e":"Flattening of both inspiratory and expiratory limbs of the loop means flow is limited in both phases, which is the signature of a fixed upper airway obstruction such as tracheal stenosis. Variable extrathoracic lesions flatten only inspiration, and asthma, emphysema and restriction have different loop shapes.","t":"A flat inspiratory and expiratory loop means fixed upper airway obstruction."},{"id":"B3.6","c":3,"q":"Which procedure has the highest diagnostic yield for mediastinal lymph node sampling with the least invasiveness?","o":["Bronchoalveolar lavage","Open thoracotomy","Blind transbronchial biopsy","Thoracentesis","Endobronchial ultrasound with needle aspiration"],"a":4,"e":"Endobronchial ultrasound-guided transbronchial needle aspiration samples mediastinal and hilar nodes with high yield and little invasiveness. Lavage and thoracentesis do not sample nodes, blind transbronchial biopsy has low yield for nodes, and open thoracotomy is far more invasive.","t":"EBUS-TBNA is the first-line way to sample mediastinal nodes."},{"id":"B9.1","c":9,"q":"A 35-year-old woman has pleuritic chest pain two weeks after a long flight. Her clinical probability for pulmonary embolism is low. What is the best first test?","o":["Ventilation-perfusion scan","CT pulmonary angiography","D-dimer","Pulmonary angiography","Echocardiography"],"a":2,"e":"With a low clinical probability of pulmonary embolism, a D-dimer is the first test, and imaging follows only if it is elevated. A negative D-dimer in this group excludes embolism safely. Going straight to CT angiography, a ventilation-perfusion scan, pulmonary angiography or echocardiography exposes the patient to unnecessary radiation or cost.","t":"Low or intermediate probability: D-dimer first; imaging only if positive."},{"id":"B9.2","c":9,"q":"A 60-year-old man has a high clinical probability of pulmonary embolism. He is hemodynamically stable with a normal creatinine. The best next step is:","o":["Stress test","D-dimer alone","Observation","Chest radiograph only","Imaging with CT pulmonary angiography"],"a":4,"e":"When clinical probability is high, go straight to imaging, here CT pulmonary angiography in a stable patient with normal renal function. A D-dimer is not used to exclude embolism at high probability because a negative result does not make it safe. Observation, a stress test or radiograph alone are inadequate.","t":"High pretest probability: image directly; do not rely on D-dimer."},{"id":"B9.3","c":9,"q":"A patient with suspected pulmonary embolism has a severe contrast allergy and a reduced eGFR. Which test is the best alternative to CT angiography?","o":["Chest radiograph","Spirometry","D-dimer repeated","Bronchoscopy","Ventilation-perfusion scan"],"a":4,"e":"With a severe contrast allergy and reduced eGFR, a ventilation-perfusion scan avoids iodinated contrast and works best when the chest radiograph is clear. A radiograph, spirometry, repeat D-dimer or bronchoscopy cannot diagnose embolism.","t":"Contrast not possible: ventilation-perfusion scan."},{"id":"B9.4","c":9,"q":"A 28-year-old woman at 30 weeks of gestation has suspected pulmonary embolism. Which anticoagulant is preferred for the acute phase?","o":["Aspirin","A direct oral anticoagulant","Low-molecular-weight heparin","Rivaroxaban plus aspirin","Warfarin"],"a":2,"e":"Low-molecular-weight heparin is the preferred anticoagulant for acute pulmonary embolism in pregnancy, because warfarin crosses the placenta and direct oral anticoagulants are not recommended. Aspirin is not treatment for embolism.","t":"Pregnancy: use low-molecular-weight heparin, not warfarin or DOACs."},{"id":"B9.5","c":9,"q":"A hypotensive patient with a large pulmonary embolus and right ventricular dysfunction has no contraindication to thrombolysis. If alteplase is chosen, the labeled regimen is:","o":["50 mg over 6 hours","100 mg over 2 hours, with parenteral anticoagulation started near the end of or right after the infusion","100 mg over 10 minutes with no anticoagulation","10 mg bolus only","0.9 mg/kg as a single bolus"],"a":1,"e":"The labeled regimen of alteplase for pulmonary embolism is 100 mg intravenously over 2 hours, with parenteral anticoagulation started near the end of or right after the infusion. The other doses and the one-bolus, no-anticoagulation or 6-hour schedules are not the label.","t":"Alteplase for PE: 100 mg over 2 hours."},{"id":"B9.6","c":9,"q":"A patient had a first unprovoked pulmonary embolism and completed 3 months of anticoagulation. The best next decision is:","o":["Discuss extended anticoagulation, weighing bleeding risk","Start thrombolysis","Place a permanent filter","Stop all therapy permanently","Switch to aspirin without discussion"],"a":0,"e":"After 3 months of anticoagulation for a first unprovoked embolism, discuss extended therapy, weighing bleeding risk against the high recurrence risk. Stopping permanently, adding a permanent filter, thrombolysis or switching to aspirin without discussion are not appropriate.","t":"Unprovoked PE: consider extended anticoagulation after 3 months."},{"id":"B9.7","c":9,"q":"A patient is discharged after a pulmonary embolism. When should the first follow-up contact occur?","o":["At 5 years","Within 1 week of discharge","Only if symptoms recur","No follow-up is needed","At 1 year"],"a":1,"e":"The first follow-up contact after discharge for pulmonary embolism should occur within 1 week, by communication or clinic evaluation, to check adherence, bleeding and symptoms. Waiting 1 or 5 years, or only for recurrent symptoms, misses early problems.","t":"Contact patients within 1 week after PE discharge."},{"id":"B9.8","c":9,"q":"At the 3-month visit after pulmonary embolism, a patient still has exertional breathlessness and a mismatched perfusion defect on a ventilation-perfusion scan. The next step is to:","o":["Repeat the same scan in a year","Evaluate for chronic thromboembolic disease and pulmonary hypertension","Reassure","Stop anticoagulation","Start steroids"],"a":1,"e":"Persistent breathlessness at 3 months with a mismatched perfusion defect on a ventilation-perfusion scan raises concern for chronic thromboembolic disease and pulmonary hypertension, so evaluate for both. Repeating the scan in a year, reassuring, stopping anticoagulation or starting steroids delays diagnosis.","t":"Persistent dyspnea plus mismatched defects after PE: look for CTEPH."},{"id":"B9.9","c":9,"q":"A hospitalized patient develops sudden breathlessness. Heart rate is 120 and blood pressure is 85/50 mm Hg. Bedside ultrasound shows a dilated right ventricle. The most likely category is:","o":["High-risk (massive) pulmonary embolism","Pneumothorax only","Pneumonia","Low-risk pulmonary embolism","Asthma"],"a":0,"e":"Sudden breathlessness with hypotension, tachycardia and a dilated right ventricle in a hospitalized patient is high-risk (massive) pulmonary embolism. Hypotension with right ventricular strain is the highest-risk presentation, and it is not low-risk embolism, pneumonia, asthma or an isolated pneumothorax.","t":"Hypotension plus right ventricular strain = high-risk pulmonary embolism."},{"id":"B9.10","c":9,"q":"Which finding raises clinical probability the most in a patient with suspected pulmonary embolism?","o":["Fever","Age under 30","Wheezing","Active cancer and unilateral leg swelling","Productive cough"],"a":3,"e":"Active cancer and unilateral leg swelling raise clinical probability the most, since scores weight malignancy and signs of deep vein thrombosis. Fever, young age, wheezing and productive cough do not raise embolism probability.","t":"Cancer and signs of DVT raise PE probability the most."},{"id":"B9.11","c":9,"q":"A patient on a direct oral anticoagulant for pulmonary embolism needs a procedure. Which factor most influences the interruption plan?","o":["Previous radiograph","Bleeding risk of the procedure and renal function","Hair color","Time of day","Patient height"],"a":1,"e":"The interruption plan for a direct oral anticoagulant depends on the bleeding risk of the procedure and renal function, along with the specific drug. Previous radiographs, hair color, time of day and height are irrelevant.","t":"DOAC interruption depends on procedural bleeding risk and renal function."},{"id":"B9.12","c":9,"q":"A patient with a pulmonary embolus has a contraindication to anticoagulation. A temporary inferior vena cava filter is placed. What must the team do?","o":["Remove it the same day regardless","Leave it permanently without review","Plan to retrieve it once anticoagulation is safe","Start thrombolysis","Stop all follow-up"],"a":2,"e":"A temporary inferior vena cava filter placed for a contraindication to anticoagulation must be tracked, and retrieval planned once anticoagulation is safe. Removing it the same day regardless, leaving it permanently without review or stopping follow-up risks complications.","t":"Plan retrieval of temporary vena cava filters."},{"id":"B9.13","c":9,"q":"A patient asks why bleeding risk matters when choosing the duration of anticoagulation. The best answer is:","o":["Bleeding risk is irrelevant","Duration is fixed at 1 month","Everyone needs lifelong therapy","Duration depends only on the platelet count","Long therapy benefits only if the recurrence risk outweighs the bleeding risk"],"a":4,"e":"Anticoagulation duration balances recurrence against bleeding, so long therapy benefits only if the recurrence risk outweighs the bleeding risk. Bleeding risk is not irrelevant, the duration is not fixed at 1 month or lifelong for everyone, and platelet count alone does not decide it.","t":"Duration balances recurrence risk against bleeding risk."},{"id":"B9.14","c":9,"q":"A young patient has unprovoked deep vein thrombosis. Which question is most important in the history?","o":["Shoe size","Occupation only","Favorite food","Family history and prior clots","Height"],"a":3,"e":"In a young patient with unprovoked deep vein thrombosis, ask first about family history and prior clots, because personal and family history of thrombosis informs risk and duration. Shoe size, occupation alone, food and height are not relevant.","t":"Ask about family history and prior clots in unprovoked VTE."},{"id":"B11.1","c":11,"q":"A 72-year-old man has pneumonia, needs mechanical ventilation, and is on vasopressors. According to the ATS/IDSA criteria, how is his disease classified?","o":["Mild","Not pneumonia","Moderate","Needs 3 minor criteria first","Severe, because he meets a major criterion"],"a":4,"e":"The ATS/IDSA criteria define severe community-acquired pneumonia by one major criterion (septic shock needing vasopressors, or respiratory failure needing mechanical ventilation) or three minor criteria. This patient meets two major criteria, so he is severe. Mild or moderate disease would not need ventilation, and waiting for minor criteria is unnecessary.","t":"One major criterion makes pneumonia severe: vasopressors or mechanical ventilation."},{"id":"B11.2","c":11,"q":"A patient with pneumonia has a respiratory rate of 34, confusion, multilobar infiltrates, and a PaO2/FiO2 ratio of 220. How many minor criteria does she meet?","o":["Two","Zero","Four","Three major criteria","One"],"a":2,"e":"Minor criteria for severe pneumonia include a respiratory rate of 30 or more, confusion, multilobar infiltrates and a PaO2/FiO2 ratio of 250 or less. This patient meets all four. She does not meet any major criterion, as those are shock needing vasopressors and respiratory failure needing ventilation.","t":"Minor criteria: RR 30 or more, confusion, multilobar infiltrates, P/F 250 or less, uremia, leukopenia, thrombocytopenia, hypothermia, hypotension."},{"id":"B11.3","c":11,"q":"A patient meets three minor criteria for severe community-acquired pneumonia. The disposition is:","o":["Discharge","Intensive care evaluation","Outpatient care","Observation at home","Routine ward without monitoring"],"a":1,"e":"Three or more minor criteria define severe pneumonia, so the patient needs intensive care evaluation. Discharge, outpatient care, home observation or an unmonitored ward bed under-treat a high-risk patient.","t":"Three minor criteria = ICU evaluation."},{"id":"B11.4","c":11,"q":"Which finding is a minor criterion for severe pneumonia?","o":["Blood urea nitrogen of 20 mg/dL or more","Low-grade fever only","Pleuritic pain","Cough","Leukocytosis alone"],"a":0,"e":"A blood urea nitrogen of 20 mg/dL or more (uremia) is a minor criterion for severe pneumonia, along with platelets under 100,000 per microliter. Low-grade fever, pleuritic pain, cough and leukocytosis alone are not criteria.","t":"BUN 20 or more is a minor severity criterion."},{"id":"B11.5","c":11,"q":"A 55-year-old with community-acquired pneumonia has a pleural effusion on ultrasound. Fluid pH is 7.0. The best management is:","o":["Steroids","Repeat chest radiograph in 1 year","Observation only","Chest tube drainage","Diuretics"],"a":3,"e":"A parapneumonic effusion with a fluid pH of 7.0 is complicated and needs chest tube drainage, since a pH under 7.2 predicts failure of antibiotics alone. Steroids, observation, diuretics or a delayed radiograph risk progression to empyema.","t":"Parapneumonic effusion with pH below 7.2: drain it."},{"id":"B11.6","c":11,"q":"A patient with pneumonia has been treated for 4 days and remains febrile. The first step is to:","o":["Double the antibiotic dose without review","Stop all care","Order a bone scan","Discharge","Reassess the diagnosis, complications, and culture data"],"a":4,"e":"Persistent fever after 4 days of treated pneumonia calls for reassessment of the diagnosis, complications such as empyema, resistant organisms and culture data. Simply doubling the dose, discharging or ordering unrelated tests does not look for the cause.","t":"Nonresponding pneumonia: re-examine diagnosis, complications and cultures."},{"id":"B11.7","c":11,"q":"Which sepsis timing statement matches the 2026 Surviving Sepsis Campaign guideline?","o":["Give them only after intensive care admission","Give antimicrobials within 24 hours","Withhold antimicrobials","Give antimicrobials ideally within 1 hour for septic shock or probable or definite sepsis","Wait 12 hours for cultures"],"a":3,"e":"The 2026 Surviving Sepsis Campaign guideline advises antimicrobials ideally within 1 hour for septic shock and for probable or definite sepsis. Waiting for ICU admission, 12 or 24 hours, or withholding therapy delays treatment and raises mortality.","t":"Septic shock or probable sepsis: antimicrobials within 1 hour."},{"id":"B11.8","c":11,"q":"For possible sepsis without shock, the 2026 guideline suggests:","o":["Immediate vasopressors","No treatment ever","A time-limited investigation with antimicrobials within 3 hours if concern persists","Steroids only","Antimicrobials in 24 hours"],"a":2,"e":"For possible sepsis without shock, the guideline suggests a time-limited investigation with antimicrobials within 3 hours if concern for infection persists. Immediate vasopressors, steroids alone, no treatment or 24-hour delay are not appropriate.","t":"Possible sepsis without shock: time-limited work-up, antimicrobials within 3 hours if still concerning."},{"id":"B11.9","c":11,"q":"In the first 3 hours of septic shock resuscitation, the 2026 guideline suggests at least how much crystalloid?","o":["None","30 mL/kg","10 mL/kg","5 mL/kg","100 mL/kg"],"a":1,"e":"The 2026 guideline suggests at least 30 mL/kg of crystalloid in the first 3 hours of septic shock resuscitation, with low certainty of evidence. Smaller volumes of 5 or 10 mL/kg are inadequate, and 100 mL/kg is excessive.","t":"Initial sepsis resuscitation: at least 30 mL/kg crystalloid in 3 hours."},{"id":"B11.10","c":11,"q":"What mean arterial pressure target does the 2026 guideline suggest for septic shock?","o":["90 mm Hg","40 mm Hg","65 mm Hg","No target","110 mm Hg"],"a":2,"e":"The guideline suggests a mean arterial pressure target of 65 mm Hg in septic shock. Targets of 40 or 90 to 110 mm Hg are unsafe or unnecessary, and having no target is not recommended.","t":"Septic shock MAP target: 65 mm Hg."},{"id":"B11.11","c":11,"q":"A nursing-home resident has pneumonia after a witnessed large-volume vomit. Which term describes the event?","o":["Asthma","Sarcoidosis","Aspiration pneumonia","Pulmonary embolism","Hypersensitivity pneumonitis"],"a":2,"e":"A witnessed large-volume vomit followed by an infiltrate in a dependent segment in a nursing-home resident is aspiration pneumonia. Asthma, sarcoidosis, embolism and hypersensitivity pneumonitis do not follow vomiting.","t":"Witnessed aspiration plus dependent infiltrate = aspiration pneumonia."},{"id":"B11.12","c":11,"q":"A patient with community-acquired pneumonia has no risk factors for resistant organisms. What principle guides empiric therapy?","o":["Use the broadest agent for everyone","Use antifungal therapy first","Cover typical and atypical pathogens according to the local guideline","Withhold therapy until culture results","Use steroids alone"],"a":2,"e":"Empiric therapy for community-acquired pneumonia without risk factors for resistant organisms covers typical and atypical pathogens according to the local guideline, severity and resistance patterns. The broadest agent for everyone, antifungals first, withholding therapy or steroids alone are not the standard.","t":"Cover typical and atypical pathogens per the local guideline."},{"id":"B11.13","c":11,"q":"Which test result would best support de-escalation from broad antibiotics?","o":["A falling hematocrit only","A negative MRSA nasal polymerase chain reaction in a pneumonia patient","A larger infiltrate","A new rash","A raised temperature"],"a":1,"e":"A negative MRSA nasal polymerase chain reaction has a high negative predictive value for MRSA pneumonia, so it supports de-escalation of anti-MRSA therapy. A falling hematocrit, larger infiltrate, rash or rising temperature do not.","t":"Negative MRSA nasal PCR supports stopping anti-MRSA coverage."},{"id":"B11.14","c":11,"q":"A 30-year-old with pneumonia has a normal oxygen level, normal vital signs, and reliable follow-up. The best site of care is:","o":["Step-down unit","Operating room","Hospice","Intensive care","Outpatient"],"a":4,"e":"A 30-year-old with normal oxygenation and vital signs and reliable follow-up has low-severity pneumonia and can be treated as an outpatient. Intensive care, step-down units, an operating room or hospice are not indicated.","t":"Low-severity pneumonia with safe follow-up: treat as an outpatient."},{"id":"B11.15","c":11,"q":"A patient with pneumonia has pleural fluid that is thick pus. The diagnosis is:","o":["Hemothorax","Transudate","Pneumothorax","Empyema","Chylothorax"],"a":3,"e":"Grossly purulent pleural fluid is an empyema and needs drainage. Hemothorax is blood, a transudate is clear fluid from systemic causes, pneumothorax is air, and chylothorax is milky.","t":"Pus in the pleural space = empyema; drain it."},{"id":"B11.16","c":11,"q":"After discharge for pneumonia, which counseling is most important?","o":["Avoid all exercise","No counseling","Vaccination and smoking cessation","Lifelong antibiotics","Daily steroids"],"a":2,"e":"After pneumonia, the most important counseling is vaccination and smoking cessation, because both reduce recurrence. Avoiding all exercise, no counseling, lifelong antibiotics or daily steroids are not appropriate.","t":"Counsel on vaccination and tobacco treatment after pneumonia."},{"id":"B11.17","c":11,"q":"A patient has pneumonia and a new rash after starting an antibiotic. The best response is:","o":["Ignore the rash","Stop all monitoring","Add a second same-class drug","Continue unchanged","Recognize a possible drug reaction and change therapy"],"a":4,"e":"A new rash after starting an antibiotic may be a drug reaction. Reassess and change therapy rather than ignoring it, continuing unchanged, adding a same-class drug or stopping monitoring.","t":"New rash on an antibiotic: consider drug reaction and switch."},{"id":"B11.18","c":11,"q":"Which prevention step reduces ventilator-associated pneumonia?","o":["Delayed extubation","Avoiding oral care","Routine antibiotics for all","Continuous deep sedation","Head-of-bed elevation and daily sedation interruption"],"a":4,"e":"Ventilator-associated pneumonia prevention bundles include head-of-bed elevation, daily sedation interruption, and oral care. Delayed extubation, avoiding oral care, continuous deep sedation or routine antibiotics increase risk or resistance.","t":"VAP prevention: head-of-bed up, sedation holidays, oral care."},{"id":"B11.19","c":11,"q":"A patient with a lung abscess is stable. The usual first-line approach is:","o":["Radiation","Prolonged antibiotics with drainage only if needed","Steroids","Observation without antibiotics","Immediate lobectomy"],"a":1,"e":"A stable patient with a lung abscess is treated first with prolonged antibiotics, with drainage only if needed because most abscesses respond. Radiation, steroids, observation without antibiotics or immediate lobectomy are not first-line.","t":"Lung abscess: prolonged antibiotics; drain only if refractory."},{"id":"B11.20","c":11,"q":"A young adult has fever, dry cough, and patchy infiltrates after exposure to a group with similar symptoms. Which pathogen is classically considered?","o":["Cytomegalovirus","Mycoplasma pneumoniae","Aspergillus","Pneumocystis jirovecii","Nocardia"],"a":1,"e":"Fever, dry cough and patchy infiltrates in a young adult after exposure to a group with similar symptoms suggest atypical pneumonia, classically Mycoplasma pneumoniae. Cytomegalovirus, Aspergillus, Pneumocystis and Nocardia affect immunocompromised hosts.","t":"Young adults in groups: think Mycoplasma pneumoniae."},{"id":"B11.21","c":11,"q":"Hospitalized pneumonia patient: which finding should prompt consideration of influenza or other viral testing in season?","o":["Isolated back pain","Fever, cough, and community circulation","Normal chest radiograph and no cough","Normal vital signs","Age 20 and no symptoms"],"a":1,"e":"In season, a hospitalized pneumonia patient with fever, cough and community circulation of influenza should be tested for influenza or other viruses, since the result affects treatment. Isolated back pain, no symptoms or normal vital signs do not prompt testing.","t":"Test for influenza when symptoms fit and virus is circulating."},{"id":"B11.22","c":11,"q":"The best summary of the main purpose of severity criteria in pneumonia is:","o":["To predict color of sputum","To decide intensive care need and site of care","To replace clinical judgment","To measure vaccine response","To pick the brand of antibiotic"],"a":1,"e":"Severity criteria support, but do not replace, clinical judgment in deciding intensive care need and site of care. They do not predict sputum color, vaccine response or antibiotic brand.","t":"Severity scores guide disposition; they do not replace judgment."},{"id":"B17.1","c":17,"q":"A 52-year-old man with obesity, loud snoring, witnessed apneas, and hypertension has a high pretest probability of moderate to severe obstructive sleep apnea and no major cardiopulmonary disease. The best diagnostic test is:","o":["Home sleep apnea testing","Multiple sleep latency test","Chest radiograph","Overnight oximetry alone","Spirometry"],"a":0,"e":"A middle-aged man with obesity, loud snoring, witnessed apneas and hypertension has a high pretest probability of moderate to severe obstructive sleep apnea, and with no major cardiopulmonary disease, an unattended home sleep apnea test is appropriate. A multiple sleep latency test evaluates sleepiness disorders, and a radiograph, spirometry or oximetry alone cannot diagnose sleep apnea.","t":"High pretest probability, uncomplicated adult: home sleep apnea testing."},{"id":"B17.2","c":17,"q":"A patient with heart failure, chronic opioid use, and suspected sleep apnea needs testing. The best test is:","o":["No testing","Home test","Pulse oximetry at clinic","In-laboratory polysomnography","Questionnaire only"],"a":3,"e":"Heart failure and chronic opioid use raise the chance of central events and hypoventilation, which a home test can miss. In-laboratory polysomnography is the right test. No testing, a home test, clinic oximetry or a questionnaire alone is inadequate.","t":"Cardiopulmonary disease or opioids: attended polysomnography."},{"id":"B17.3","c":17,"q":"A polysomnogram shows an apnea-hypopnea index of 22 events per hour. The severity category is:","o":["Normal","Primary snoring only","Moderate","Mild","Severe"],"a":2,"e":"An apnea-hypopnea index of 15 to 30 events per hour is moderate sleep apnea, so 22 is moderate. Normal is under 5, mild is 5 to 15 and severe is above 30.","t":"AHI: normal below 5, mild 5-15, moderate 15-30, severe above 30."},{"id":"B17.4","c":17,"q":"An apnea-hypopnea index of 3 events per hour in an asymptomatic person is:","o":["Central apnea","Normal","Severe","Mild","Moderate"],"a":1,"e":"An apnea-hypopnea index under 5 events per hour is considered normal in adults, so 3 in an asymptomatic person is normal. It is not mild, moderate, severe or central apnea.","t":"AHI under 5 is normal in adults."},{"id":"B17.5","c":17,"q":"Which first-line therapy has the strongest evidence for symptom and blood pressure benefit in moderate to severe obstructive sleep apnea?","o":["Sedative hypnotics","Nasal steroid alone","Alcohol before bed","Continuous positive airway pressure","Daytime stimulant alone"],"a":3,"e":"Continuous positive airway pressure remains the first-line therapy with the strongest evidence for symptom and blood pressure benefit in moderate to severe obstructive sleep apnea. Sedatives and alcohol worsen it, and nasal steroid or stimulants alone do not treat the airway.","t":"CPAP is first-line therapy for moderate to severe OSA."},{"id":"B17.6","c":17,"q":"A patient uses CPAP only 2 hours a night. Which first step best improves adherence?","o":["Stop therapy","Increase pressure without review","Start sedatives","Mask refitting, humidification, and early follow-up","Discharge from care"],"a":3,"e":"Poor CPAP use is best improved by mask refitting, humidification and early follow-up, since early troubleshooting and support increase adherence. Stopping therapy, raising pressure without review, sedatives or discharge do not help.","t":"Support early: refit the mask, add humidification, follow up."},{"id":"B17.7","c":17,"q":"A 45-year-old with severe obstructive sleep apnea and obesity asks about medication. In December 2024 the FDA approved which agent for moderate to severe obstructive sleep apnea in adults with obesity?","o":["Zolpidem","Sildenafil","Tirzepatide","Metformin","Modafinil alone"],"a":2,"e":"Tirzepatide was approved by the FDA on 20 December 2024 for moderate to severe obstructive sleep apnea in adults with obesity, alongside diet and exercise. Zolpidem, sildenafil, metformin and modafinil alone are not approved for this indication.","t":"Tirzepatide: approved December 2024 for OSA with obesity."},{"id":"B17.8","c":17,"q":"A patient cannot tolerate CPAP and has a mild jaw deficiency. A reasonable alternative is:","o":["Sedatives","A mandibular advancement device","A cervical collar","Alcohol","Opioids"],"a":1,"e":"When CPAP is not tolerated, a mandibular advancement device is a reasonable alternative, especially for mild to moderate disease or jaw deficiency. Sedatives, a cervical collar, alcohol and opioids worsen or do not treat sleep apnea.","t":"CPAP intolerance, mild to moderate OSA: mandibular advancement device."},{"id":"B17.9","c":17,"q":"Hypoglossal nerve stimulation is most appropriate for a patient with:","o":["Central sleep apnea only","Severe obesity with any pattern","CPAP intolerance, a limited BMI range, and favorable airway collapse pattern on drug-induced sleep endoscopy","Untreated heart failure only","Complete concentric collapse"],"a":2,"e":"Hypoglossal nerve stimulation suits patients with CPAP intolerance, a limited BMI range and a favorable collapse pattern on drug-induced sleep endoscopy, since complete concentric collapse is a contraindication. Central apnea alone, severe obesity with any pattern and untreated heart failure are poor candidates.","t":"Hypoglossal stimulation: CPAP failure, limited BMI, no complete concentric collapse."},{"id":"B17.10","c":17,"q":"A man is a commercial truck driver with severe untreated sleep apnea and an episode of near-miss crashes. What is the right management emphasis?","o":["No action","Daytime stimulants only","Continue driving unchanged","Delay evaluation for a year","Prompt treatment and documented adherence before return to duty"],"a":4,"e":"A commercial driver with severe untreated sleep apnea and near-miss crashes needs prompt treatment and documented adherence before returning to duty. Taking no action, using stimulants only, continuing to drive or delaying evaluation endangers the public.","t":"Safety-sensitive work: treat promptly and document adherence."},{"id":"B17.11","c":17,"q":"A patient with suspected obstructive sleep apnea has a negative home test, but suspicion remains high. The next step is:","o":["Start steroids","Lung biopsy","In-laboratory polysomnography","Repeat nothing","Discharge"],"a":2,"e":"A negative home test does not exclude sleep apnea when suspicion is high, because home tests underestimate disease. Proceed to in-laboratory polysomnography. Steroids, lung biopsy, no further testing or discharge miss the diagnosis.","t":"Negative home test with high suspicion: in-laboratory polysomnography."},{"id":"B17.12","c":17,"q":"A woman with severe obstructive sleep apnea has a morning headache and a serum bicarbonate of 34 mEq/L. What should be suspected?","o":["Anemia","Obesity hypoventilation syndrome","Hypothyroidism alone","Asthma","Sarcoidosis"],"a":1,"e":"Severe obstructive sleep apnea with morning headache and a serum bicarbonate of 34 mEq/L suggests obesity hypoventilation syndrome, since daytime hypercapnia raises bicarbonate. Anemia, hypothyroidism alone, asthma and sarcoidosis do not explain it.","t":"Raised bicarbonate in OSA: think obesity hypoventilation."},{"id":"B17.13","c":17,"q":"Complex (treatment-emergent) central sleep apnea emerges after starting CPAP. The first approach is:","o":["Stop all therapy","Prescribe sedatives","Start steroids","Continue CPAP with monitoring, since many cases resolve","Add opioids"],"a":3,"e":"Treatment-emergent central sleep apnea after starting CPAP often resolves with continued use, so continue CPAP with monitoring. Persistent cases need adaptive modes. Stopping therapy, sedatives, steroids or opioids are wrong.","t":"Complex sleep apnea: continue CPAP; many cases fade."},{"id":"B17.14","c":17,"q":"Cheyne-Stokes respiration is most often seen in patients with:","o":["Obesity alone","Interstitial lung disease only","Asthma","Chronic sinusitis","Heart failure"],"a":4,"e":"Cheyne-Stokes respiration, a crescendo-decrescendo breathing pattern, is most often seen in heart failure, and also in stroke. Obesity alone, interstitial lung disease, asthma and sinusitis do not cause it.","t":"Cheyne-Stokes breathing: heart failure."},{"id":"B17.15","c":17,"q":"Adaptive servo-ventilation is contraindicated in central sleep apnea with:","o":["Symptomatic heart failure with reduced ejection fraction","Opioid-related central apnea","High-altitude periodic breathing","Age under 40","Normal heart function"],"a":0,"e":"Adaptive servo-ventilation is contraindicated in central sleep apnea with symptomatic heart failure with reduced ejection fraction, because trial data showed increased mortality. It may be used in opioid-related central apnea, periodic breathing at altitude and when heart function is normal.","t":"No adaptive servo-ventilation in HFrEF with central apnea."},{"id":"B17.16","c":17,"q":"Opioid use is associated with which sleep-disordered breathing pattern?","o":["No effect","Isolated snoring","Central apnea and ataxic breathing","Only obstructive hypopnea","Narcolepsy"],"a":2,"e":"Opioids blunt respiratory drive and cause central apnea and ataxic (irregular) breathing. They do not cause only obstructive hypopnea, isolated snoring or narcolepsy, and they do have an effect.","t":"Opioids: central apnea and ataxic breathing."},{"id":"B17.17","c":17,"q":"A patient with obstructive sleep apnea scheduled for surgery should be told to:","o":["Bring the CPAP device and use it postoperatively","Leave it at home","Take extra sedatives","Skip anesthesia review","Avoid monitoring"],"a":0,"e":"A patient with obstructive sleep apnea having surgery should bring the CPAP device and use it postoperatively, since perioperative CPAP reduces respiratory events. Leaving it at home, extra sedatives, skipping anesthesia review or avoiding monitoring raises risk.","t":"Bring and use CPAP perioperatively."},{"id":"B17.18","c":17,"q":"Which feature is the best predictor of excessive daytime sleepiness from a sleep disorder, rather than simple fatigue?","o":["Unintended dozing in passive situations","Muscle ache","Mild tiredness after exertion","Dry mouth","Weight gain"],"a":0,"e":"Unintended dozing in passive situations such as reading or watching television is the best indicator of true sleepiness, rather than simple fatigue after exertion, muscle ache, dry mouth or weight gain.","t":"True sleepiness means dozing when passive."},{"id":"B17.19","c":17,"q":"Obstructive sleep apnea is linked to which cardiovascular condition?","o":["None","Mitral valve prolapse only","Aortic dissection only","Congenital heart disease only","Resistant hypertension"],"a":4,"e":"Obstructive sleep apnea is classically linked to resistant hypertension, as well as arrhythmia, heart failure and stroke. Mitral valve prolapse, aortic dissection alone and congenital heart disease are not its classic associations, and there is certainly an association.","t":"OSA: resistant hypertension."},{"id":"B17.20","c":17,"q":"A 50-year-old man with a narrow retropalatal airway snores and has obstructive events that are worst in the supine position. Which mechanism best explains airway collapse during sleep?","o":["A wider airway at sleep onset","Loss of lung elastic recoil alone","Increased upper airway muscle tone","Reduced upper airway dilator muscle activity in an anatomically narrow airway","Pleural fluid"],"a":3,"e":"Sleep lowers upper airway dilator muscle activity, and in an anatomically narrow airway this lets the airway collapse, worst when supine. A wider airway, loss of lung recoil, increased muscle tone or pleural fluid does not explain it.","t":"Sleep reduces dilator tone; a narrow airway collapses."},{"id":"B17.21","c":17,"q":"A 60-year-old man has loud snoring and an Epworth Sleepiness Scale score of 4. Which statement about screening questionnaires such as STOP-Bang is correct?","o":["Questionnaires are never useful","Questionnaires estimate probability and do not replace testing","Questionnaires equal polysomnography","A high score proves disease","A low score proves no disease"],"a":1,"e":"Questionnaires such as STOP-Bang estimate the probability of sleep apnea and help triage, but they do not replace testing. A high score does not prove disease and a low score does not exclude it, and they are useful, not equal to polysomnography.","t":"Questionnaires triage; they do not diagnose."},{"id":"B17.22","c":17,"q":"A sleep laboratory switches its hypopnea scoring rule from one requiring a 3% desaturation or arousal to one requiring a 4% desaturation. What is the usual effect on a patient's reported apnea-hypopnea index?","o":["It falls, and some patients move to a lower severity category","It rises in every patient","It converts to the respiratory disturbance index only","It is unchanged in every patient","It becomes a central apnea index"],"a":0,"e":"A stricter hypopnea rule (4% desaturation instead of 3% or arousal) scores fewer hypopneas, so the reported apnea-hypopnea index falls, and some patients move to a lower severity category. It does not rise in every patient, convert to another index or become a central apnea index.","t":"Stricter hypopnea scoring lowers the AHI."},{"id":"B17.23","c":17,"q":"A weight-loss program in a patient with obesity and obstructive sleep apnea typically:","o":["Causes central apnea","Worsens apnea","Has no effect","Reduces severity and sometimes resolves disease","Eliminates the need for follow-up"],"a":3,"e":"Weight loss in obesity with sleep apnea reduces severity and sometimes resolves disease, and may allow lower pressures. It does not cause central apnea or worsen disease, and follow-up is still needed.","t":"Weight loss reduces OSA severity and may resolve it."},{"id":"B17.24","c":17,"q":"A child with adenotonsillar hypertrophy and snoring has apneas. The first-line treatment is:","o":["CPAP in all cases","Observation forever","Adenotonsillectomy","Oral appliance","Steroids only"],"a":2,"e":"Adenotonsillectomy is first-line therapy for most children with adenotonsillar hypertrophy and sleep apnea. CPAP is for those who are not surgical candidates or fail surgery, and observation forever, oral appliances or steroids alone are not standard.","t":"Children with adenotonsillar hypertrophy: adenotonsillectomy first."},{"id":"B17.25","c":17,"q":"A patient on CPAP has persistent residual events and mask leak. The best first measure is:","o":["Double pressure","Start a sedative","Ignore the data","Stop therapy","Download the device data and address leak"],"a":4,"e":"With persistent residual events and mask leak on CPAP, download the device data and address the leak first. Doubling pressure, sedatives, ignoring the data or stopping therapy do not fix the cause.","t":"Download CPAP data and fix leak first."},{"id":"B17.26","c":17,"q":"A patient with hypercapnic obesity hypoventilation and obstructive sleep apnea should first be treated with:","o":["Steroids","Sedatives","Oxygen alone","Positive airway pressure with attention to hypoventilation","Opioids"],"a":3,"e":"Hypercapnic obesity hypoventilation with obstructive sleep apnea is treated first with positive airway pressure, with attention to hypoventilation, since oxygen alone can worsen it. Steroids, sedatives and opioids depress ventilation.","t":"Obesity hypoventilation: positive airway pressure, not oxygen alone."},{"id":"B17.27","c":17,"q":"Which statement about alcohol is correct?","o":["Evening alcohol can worsen obstructive events","It prevents central events","Alcohol improves apnea","It increases muscle tone","It has no effect"],"a":0,"e":"Evening alcohol relaxes upper airway muscles and can worsen obstructive events. It does not prevent central events, improve apnea, increase muscle tone, or have no effect.","t":"Alcohol worsens obstructive events."},{"id":"B17.28","c":17,"q":"A patient has REM-related obstructive sleep apnea. Compared with non-REM disease:","o":["REM has no effect","Events occur only in deep sleep","Treatment is never needed","Events cluster in REM sleep when muscle tone is lowest","Events never occur in REM"],"a":3,"e":"In REM-related obstructive sleep apnea, events cluster in REM sleep when muscle tone is lowest, because REM atonia worsens collapse. Events occur in REM, not only in deep sleep, and treatment can still be needed.","t":"REM atonia worsens airway collapse."},{"id":"B17.29","c":17,"q":"Supine-predominant obstructive sleep apnea may respond to:","o":["Bronchodilators","Diuretics only","Steroids","Positional therapy","Antibiotics"],"a":3,"e":"Supine-predominant obstructive sleep apnea may respond to positional therapy, which avoids the supine position in selected patients. Bronchodilators, diuretics only, steroids and antibiotics do not treat it.","t":"Supine-predominant OSA: positional therapy."},{"id":"B17.30","c":17,"q":"After starting CPAP, which symptom change is most expected within weeks?","o":["Less daytime sleepiness","Hearing loss","More snoring","Worse blood pressure","Weight gain from therapy alone"],"a":0,"e":"After starting CPAP, daytime sleepiness usually improves within weeks. Hearing loss, more snoring, worse blood pressure and weight gain from therapy alone are not expected effects.","t":"CPAP reduces sleepiness within weeks."},{"id":"B17.31","c":17,"q":"Which test would best exclude narcolepsy as a cause of persistent sleepiness after treated apnea?","o":["Echocardiography","Multiple sleep latency test after adequate sleep","Chest CT","Arterial gas","Spirometry"],"a":1,"e":"The multiple sleep latency test measures sleep latency and REM onset across naps after adequate sleep, so it is the best test to exclude narcolepsy when sleepiness persists after treated apnea. Echocardiography, chest CT, arterial gas and spirometry do not assess it.","t":"Persistent sleepiness after treated OSA: multiple sleep latency test."},{"id":"B17.32","c":17,"q":"In a patient with treated sleep apnea and ongoing sleepiness, the first step is to:","o":["Ignore symptoms","Add a stimulant at once","Stop CPAP","Confirm CPAP adherence and rule out insufficient sleep","Order lung biopsy"],"a":3,"e":"In treated sleep apnea with ongoing sleepiness, first confirm CPAP adherence and rule out insufficient sleep, since undertreatment and behavioral causes are most common. Ignoring symptoms, adding a stimulant at once, stopping CPAP or lung biopsy skips that step.","t":"Residual sleepiness: check adherence and sleep time first."},{"id":"B17.33","c":17,"q":"A patient is concerned about pregnancy and sleep apnea. Untreated disease may be associated with:","o":["No outcomes","Lower blood pressure","Hypertensive disorders of pregnancy","Improved fetal growth","Less snoring"],"a":2,"e":"Untreated sleep apnea in pregnancy is associated with hypertensive disorders of pregnancy, including gestational hypertension and preeclampsia. It does not lower blood pressure, improve fetal growth or have no outcomes.","t":"OSA in pregnancy raises hypertensive disorder risk."},{"id":"B17.34","c":17,"q":"Upper airway surgery for adults is most useful when:","o":["It is the first step in all patients","The airway is normal","A child has tonsil disease only","The patient is asymptomatic","A specific anatomic target is identified and CPAP fails"],"a":4,"e":"Upper airway surgery in adults is most useful when a specific anatomic target is identified and CPAP fails, with an individualized plan. It is not first for everyone, and it is not useful for a normal airway or an asymptomatic patient.","t":"Adult airway surgery: identified target plus CPAP failure."},{"id":"B17.35","c":17,"q":"Which finding on a polysomnogram supports upper airway resistance rather than classic apnea?","o":["REM behavior","Respiratory effort-related arousals","Cheyne-Stokes pattern","Absent effort","Seizure"],"a":1,"e":"Respiratory effort-related arousals mark flow limitation without full apneas or hypopneas and support upper airway resistance. REM behavior, Cheyne-Stokes pattern, absent effort and seizure do not.","t":"RERAs indicate upper airway resistance."},{"id":"B17.36","c":17,"q":"A patient with obstructive sleep apnea and insomnia is told to:","o":["Treat both conditions, since insomnia can limit CPAP use","Take sedatives only","Stop CPAP","Avoid all treatment","Ignore insomnia"],"a":0,"e":"Comorbid insomnia can limit CPAP use, so treat both conditions, often with cognitive behavioral therapy for insomnia. Sedatives only, stopping CPAP, avoiding treatment or ignoring insomnia is wrong.","t":"OSA with insomnia: treat both; CBT-I helps CPAP use."},{"id":"B12.1","c":12,"q":"A 38-year-old man from an endemic region has 6 weeks of cough, night sweats, and an upper lobe cavity. He is awaiting sputum results. Where should he be managed?","o":["In a droplet-precaution room","In an airborne isolation room","In a hallway bed","At home with no precautions","In a standard room with a mask on staff only"],"a":1,"e":"Suspected pulmonary tuberculosis, with cough, night sweats and an upper lobe cavity, needs an airborne isolation room until proven otherwise. Droplet precautions, a hallway bed, home with no precautions or masks on staff only do not contain airborne spread.","t":"Suspected pulmonary TB: airborne isolation."},{"id":"B12.2","c":12,"q":"A patient with drug-susceptible pulmonary tuberculosis is to receive standard therapy. Which regimen is correct?","o":["Moxifloxacin alone","Ethambutol and pyrazinamide for 9 months","Two months of isoniazid, rifampin, pyrazinamide, and ethambutol, then four months of isoniazid and rifampin","Isoniazid alone for 6 months","Rifampin alone for 2 months"],"a":2,"e":"Standard therapy for drug-susceptible pulmonary tuberculosis is 2 months of isoniazid, rifampin, pyrazinamide and ethambutol, then 4 months of isoniazid and rifampin (2HRZE/4HR). Single drugs or short two-drug courses lead to resistance and relapse.","t":"Standard TB regimen: 2HRZE/4HR."},{"id":"B12.3","c":12,"q":"A patient with cavitary tuberculosis still has positive cultures at 2 months. Which change is typically considered?","o":["Stopping therapy","Adding steroids only","Stopping rifampin","A longer continuation phase of 7 months, for 9 months total","Switching to isoniazid alone"],"a":3,"e":"Cavitary tuberculosis with positive cultures at 2 months is a risk factor for relapse, so extend the continuation phase to 7 months for 9 months in total. Stopping therapy, steroids alone, stopping rifampin or isoniazid alone is inadequate.","t":"Cavity plus positive 2-month culture: 9 months of therapy."},{"id":"B12.4","c":12,"q":"A 55 kg adult is started on pyrazinamide and ethambutol. Using the weight-band table (40 to 55 kg), the daily doses are:","o":["Pyrazinamide 1,000 mg and ethambutol 800 mg","Pyrazinamide 2,000 mg and ethambutol 1,600 mg","Pyrazinamide 3,000 mg and ethambutol 2,400 mg","Pyrazinamide 1,500 mg and ethambutol 1,200 mg","Pyrazinamide 500 mg and ethambutol 400 mg"],"a":0,"e":"In the 40 to 55 kg weight band, daily pyrazinamide is 1,000 mg and ethambutol 800 mg. The other doses belong to heavier bands or are too high or too low.","t":"40 to 55 kg: pyrazinamide 1,000 mg, ethambutol 800 mg."},{"id":"B12.5","c":12,"q":"A 70 kg adult starts standard daily therapy. The pyrazinamide dose from the weight-band table is:","o":["2,000 mg","3,000 mg","1,500 mg","1,000 mg","500 mg"],"a":2,"e":"The 56 to 75 kg band uses pyrazinamide 1,500 mg and ethambutol 1,200 mg daily, so a 70 kg adult gets 1,500 mg of pyrazinamide. Doses of 1,000 or 2,000 mg match other bands.","t":"56 to 75 kg: pyrazinamide 1,500 mg, ethambutol 1,200 mg."},{"id":"B12.6","c":12,"q":"A diabetic patient starts isoniazid. Which supplement is recommended to lower the risk of neuropathy?","o":["Iron","Pyridoxine (vitamin B6)","Vitamin C","Vitamin A","Vitamin K"],"a":1,"e":"Pyridoxine (vitamin B6) is given with isoniazid to prevent peripheral neuropathy in at-risk patients such as those with diabetes, alcohol use, malnutrition or pregnancy. Iron, vitamins C, A or K do not prevent isoniazid neuropathy.","t":"Give pyridoxine with isoniazid in patients at risk of neuropathy."},{"id":"B12.7","c":12,"q":"A patient on tuberculosis therapy develops dark urine, jaundice, and persistent vomiting. The immediate step is to:","o":["Ignore the symptoms","Stop the drugs and seek evaluation promptly","Take extra doses","Add alcohol","Wait one month"],"a":1,"e":"Dark urine, jaundice and persistent vomiting on tuberculosis therapy suggest hepatotoxicity, so stop the drugs and seek prompt evaluation. Ignoring symptoms, taking extra doses, adding alcohol or waiting a month is dangerous.","t":"Hepatitis symptoms on TB drugs: stop and evaluate promptly."},{"id":"B12.8","c":12,"q":"A patient reports blurred vision and difficulty seeing red-green colors on ethambutol. The most likely cause is:","o":["Retinal detachment","Glaucoma","Optic neuritis","Migraine","Cataract"],"a":2,"e":"Blurred vision and red-green color difficulty on ethambutol point to optic neuritis, a dose-related toxicity that needs review. Retinal detachment, glaucoma, migraine and cataract do not cause red-green color loss in this setting.","t":"Ethambutol causes optic neuritis; check color vision and acuity."},{"id":"B12.9","c":12,"q":"A 25-year-old with drug-susceptible pulmonary tuberculosis is eligible for a shorter regimen. The CDC 4-month option is:","o":["Streptomycin alone","Isoniazid alone","Rifampin for 4 months","Linezolid alone","Isoniazid, rifapentine, pyrazinamide, and moxifloxacin for 8 weeks, then isoniazid, rifapentine, and moxifloxacin for 9 weeks"],"a":4,"e":"The CDC 4-month option for drug-susceptible pulmonary tuberculosis in people aged 12 and older is isoniazid, rifapentine, pyrazinamide and moxifloxacin for 8 weeks, then isoniazid, rifapentine and moxifloxacin for 9 weeks (17 weeks). Single-drug regimens are inadequate.","t":"Four-month regimen: HPZM for 8 weeks then HPM for 9 weeks."},{"id":"B12.10","c":12,"q":"In rifampin-resistant tuberculosis, which all-oral regimen is now used?","o":["Bedaquiline, pretomanid, linezolid, and moxifloxacin","Isoniazid alone","Rifampin plus ethambutol","Ethambutol alone","Streptomycin alone"],"a":0,"e":"Rifampin-resistant tuberculosis is now treated with an all-oral regimen of bedaquiline, pretomanid, linezolid and moxifloxacin (BPaLM, or BPaL), following current guidance. Isoniazid, rifampin, ethambutol or streptomycin alone are ineffective.","t":"Rifampin-resistant TB: BPaLM or BPaL."},{"id":"B12.11","c":12,"q":"Why is directly observed therapy standard in tuberculosis?","o":["It avoids monitoring","It replaces notification","It is required only for children","It supports adherence and prevents resistance and relapse","It reduces the number of drugs"],"a":3,"e":"Directly observed therapy supports adherence and prevents resistance and relapse. It does not avoid monitoring, replace notification, apply only to children or reduce the number of drugs.","t":"DOT prevents resistance and relapse by ensuring completion."},{"id":"B12.12","c":12,"q":"A
