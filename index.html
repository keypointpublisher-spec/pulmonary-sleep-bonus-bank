":"Light sedation targets are preferred."},{"id":"B22.16","c":22,"q":"Which monitoring tool screens for delirium?","o":["The Glasgow Coma Scale alone","A chest radiograph","The Epworth scale","The APACHE score","The Confusion Assessment Method for the ICU"],"a":4,"e":"The tool is validated in ventilated patients."},{"id":"B22.17","c":22,"q":"A ventilated patient develops hypotension and tachycardia after intubation. Which cause should be excluded first?","o":["Tension pneumothorax","Hypothermia","Anemia only","Pain","Hypoglycemia only"],"a":0,"e":"Positive pressure can cause or worsen pneumothorax."},{"id":"B22.18","c":22,"q":"Which strategy reduces ventilator days?","o":["Avoiding trials","Daily paired spontaneous awakening and breathing trials","Deep sedation","Maximal tidal volumes","Paralysis"],"a":1,"e":"Coordinated trials shorten ventilation."},{"id":"B22.19","c":22,"q":"Which factor is most associated with failed extubation?","o":["Good cough","Weak cough and excessive secretions","Short ventilation","Young age","Light sedation"],"a":1,"e":"Secretion clearance matters."},{"id":"B22.20","c":22,"q":"A patient with a prolonged ICU stay asks about follow-up. The best plan includes:","o":["Annual chest radiograph only","Post-ICU clinic review for physical, cognitive, and psychological recovery","No follow-up","A phone call in a year","Sleep medication only"],"a":1,"e":"Follow-up addresses post-intensive care syndrome."},{"id":"B22.21","c":22,"q":"A patient has an arterial line trace with marked respiratory variation in systolic pressure. This suggests:","o":["Tamponade only","Normal findings only","Hypervolemia","Fluid responsiveness in a ventilated patient without arrhythmia","Pulmonary embolism"],"a":3,"e":"Pulse pressure variation predicts response to volume."},{"id":"B22.22","c":22,"q":"A ventilated patient on a continuous infusion of a sedative is ready for a daily awakening trial. The first step is to:","o":["Stop or reduce the infusion and assess","Increase it","Do nothing","Start another sedative","Paralyze"],"a":0,"e":"The trial reveals the lowest dose needed."},{"id":"B22.23","c":22,"q":"Hospital-acquired pressure injury in ICU patients is best prevented by:","o":["Ignoring skin","Heavy sedation","Bed rest without turns","Tight restraints","Turning, support surfaces, and skin checks"],"a":4,"e":"Routine skin care prevents injury."},{"id":"B22.24","c":22,"q":"An ICU team plans a family meeting. The main goal is to:","o":["Assign blame","Reduce visits","Avoid discussion","Obtain a signature","Share prognosis, understand values, and align care with them"],"a":4,"e":"Family communication improves care and reduces distress."},{"id":"B22.25","c":22,"q":"Early enteral nutrition in ventilated patients is generally:","o":["Delayed for a week always","Preferred over parenteral nutrition when the gut works","Replaced by fasting","Given only to the obese","Contraindicated"],"a":1,"e":"The enteral route is preferred."},{"id":"B15.1","c":15,"q":"A 66-year-old man with a prior asbestos exposure has progressive dyspnea and a large right pleural effusion with nodular pleural thickening on CT. Cytology is negative twice. The best next step is:","o":["Repeat chest radiograph only","Antibiotics","Diuretics","Pleural biopsy by thoracoscopy or image guidance","Observation for 6 months"],"a":3,"e":"Mesothelioma often needs tissue; cytology has limited sensitivity."},{"id":"B15.2","c":15,"q":"A patient with a malignant pleural effusion has recurrent dyspnea after each drainage, and the lung re-expands fully. Which option allows home drainage?","o":["Open thoracotomy","Chest tube for 6 weeks","Indwelling pleural catheter","Diuretics","Repeat thoracentesis every week"],"a":2,"e":"Indwelling catheters avoid repeated procedures."},{"id":"B15.3","c":15,"q":"A patient with a malignant effusion has a trapped lung after drainage. Pleurodesis is likely to:","o":["Be unnecessary for any","Be required","Fail","Cause immediate cure","Succeed in all cases"],"a":2,"e":"Pleurodesis needs the lung to expand to appose the pleura."},{"id":"B15.4","c":15,"q":"Which pleural fluid finding in a malignant effusion predicts a shorter survival and lower pleurodesis success?","o":["Low pH and low glucose","High pH","Low protein","Low LDH","Normal glucose"],"a":0,"e":"A low pH marks a heavy tumor burden."},{"id":"B15.5","c":15,"q":"A 55-year-old woman has facial swelling, distended neck veins, and a mediastinal mass. The most likely syndrome is:","o":["Superior vena cava syndrome","Pneumothorax","Pancoast syndrome","Tamponade","Horner syndrome only"],"a":0,"e":"Obstruction of the superior vena cava causes this presentation."},{"id":"B15.6","c":15,"q":"A patient with superior vena cava syndrome has stridor. The priority is:","o":["Secure the airway and arrange urgent therapy","Large fluid bolus","Lie flat","Delay evaluation","Elevate legs"],"a":0,"e":"Airway compromise changes the urgency."},{"id":"B15.7","c":15,"q":"A tumor at the lung apex causes shoulder pain, hand weakness, and ptosis with miosis. The syndrome is:","o":["Pancoast syndrome with Horner involvement","Cervical rib","Guillain-Barre syndrome","Lambert-Eaton syndrome","Superior vena cava syndrome"],"a":0,"e":"Apical tumors invade the brachial plexus and sympathetic chain."},{"id":"B15.8","c":15,"q":"A young woman has an anterior mediastinal mass, ptosis, and fatigable weakness. The likely diagnosis is:","o":["Thymoma with myasthenia gravis","Goiter","Bronchogenic cyst","Teratoma only","Lymphoma only"],"a":0,"e":"Thymoma associates with myasthenia gravis."},{"id":"B15.9","c":15,"q":"Which mediastinal compartment most commonly holds a thymoma, teratoma, thyroid mass, or lymphoma?","o":["Pleural","Middle","Posterior","Retroperitoneal","Anterior"],"a":4,"e":"The four Ts live in the anterior mediastinum."},{"id":"B15.10","c":15,"q":"A patient has a hilar mass and enlarged mediastinal nodes. The best minimally invasive tool to sample both is:","o":["Endobronchial ultrasound with needle aspiration","Rigid bronchoscopy","Skin biopsy","Chest tube","Thoracentesis"],"a":0,"e":"EBUS samples hilar and mediastinal nodes."},{"id":"B15.11","c":15,"q":"A patient has a central airway obstruction from an endobronchial tumor with severe dyspnea. A rapid therapeutic option is:","o":["Inhalers","Steroids only","Antibiotics","Rigid bronchoscopy with debulking or stent placement","Observation"],"a":3,"e":"Interventional bronchoscopy restores the airway."},{"id":"B15.12","c":15,"q":"A patient is scheduled for airway stent placement. A key complication to counsel on is:","o":["Cataract","Stent migration, granulation tissue, and mucus plugging","Alopecia","Gout","Hearing loss"],"a":1,"e":"These are the typical stent problems."},{"id":"B15.13","c":15,"q":"What is the main advantage of pleural ultrasound before thoracentesis?","o":["Saving time only","Stopping anticoagulation","Sedation","Lower risk of pneumothorax","Staging cancer"],"a":3,"e":"Ultrasound guidance reduces complications."},{"id":"B15.14","c":15,"q":"A patient develops re-expansion pulmonary edema after drainage of a large effusion. Prevention includes:","o":["Applying high suction","Ignoring symptoms","Removing everything at once","Limiting the volume removed and stopping if cough or chest tightness develops","Draining faster"],"a":3,"e":"Slow, limited drainage lowers the risk."},{"id":"B15.15","c":15,"q":"Which tumor is the most common primary malignant tumor of the pleura?","o":["Lipoma","Fibrous tumor","Lymphoma","Thymoma","Malignant pleural mesothelioma"],"a":4,"e":"It is strongly linked to asbestos."},{"id":"B15.16","c":15,"q":"Typical latency between asbestos exposure and mesothelioma is:","o":["Weeks","One year","Decades","Days","Months"],"a":2,"e":"Mesothelioma emerges 20 to 50 years after exposure."},{"id":"B15.17","c":15,"q":"A 35-year-old nonsmoker has a slow-growing endobronchial lesion with hemoptysis. The likely tumor is:","o":["Lymphoma only","Squamous cell cancer only","Hamartoma only","Small cell cancer","Carcinoid tumor"],"a":4,"e":"Bronchial carcinoids often present in younger nonsmokers."},{"id":"B15.18","c":15,"q":"A patient with a carcinoid tumor and flushing and diarrhea has:","o":["Possible carcinoid syndrome","Sarcoidosis","Emphysema","Tuberculosis","Asthma"],"a":0,"e":"Hormone secretion causes the syndrome, usually with liver metastases."},{"id":"B15.19","c":15,"q":"A patient with a hamartoma on CT shows:","o":["Honeycombing","Spiculation and cavitation","Fat and popcorn calcification","A tree-in-bud pattern","A halo sign"],"a":2,"e":"The combination is classic for hamartoma."},{"id":"B15.20","c":15,"q":"A patient with a chylous pleural effusion has pleural fluid triglycerides above 110 mg/dL. The condition is:","o":["Hemothorax","Pseudochylothorax only","Chylothorax","Empyema","Transudate"],"a":2,"e":"High triglycerides confirm chyle."},{"id":"B15.21","c":15,"q":"What is the usual cause of chylothorax in adults?","o":["Pneumonia","Heart failure","Lymphoma or thoracic duct injury","Pulmonary embolism","Cirrhosis"],"a":2,"e":"Lymphatic disruption causes it."},{"id":"B15.22","c":15,"q":"A patient on a plan for pleural catheter placement needs counseling about:","o":["Hair loss","Renal failure","Visual loss","Weight gain","Infection risk and catheter care"],"a":4,"e":"Catheter infection is the key complication."},{"id":"B15.23","c":15,"q":"A patient has a pulmonary nodule and a known thymoma. Which test helps assess myasthenia gravis?","o":["Cortisol","Troponin","Alpha-fetoprotein","Acetylcholine receptor antibodies","Urine culture"],"a":3,"e":"Antibodies support the diagnosis."},{"id":"B15.24","c":15,"q":"A patient needs a diagnosis of a peripheral lung lesion not reachable by standard bronchoscopy. Which approach is suitable?","o":["Skin biopsy","Navigational bronchoscopy or CT-guided needle biopsy","Pleural tap","Gastroscopy","Thyroid scan"],"a":1,"e":"Targeted biopsy is chosen by lesion location."},{"id":"B15.25","c":15,"q":"Whole-lung lavage is a therapy for:","o":["Emphysema","Pneumonia","Asthma","Pulmonary alveolar proteinosis","Pulmonary embolism"],"a":3,"e":"The procedure removes proteinaceous material."},{"id":"B16.1","c":16,"q":"A 70-year-old man with heart failure has bilateral effusions. Pleural fluid protein is 2.0 g/dL, with a serum protein of 6.8 g/dL. The fluid is most likely:","o":["A parapneumonic effusion","An exudate from tuberculosis","A transudate","A hemothorax","A chylothorax"],"a":2,"e":"A low protein ratio fits a transudate."},{"id":"B16.2","c":16,"q":"Which of the following meets Light criteria for an exudate?","o":["Pleural-to-serum LDH ratio below 0.3","Low cell count","pH of 7.5","Pleural-to-serum protein ratio above 0.5","Pleural LDH below one third of the upper limit of normal"],"a":3,"e":"A protein ratio above 0.5 is one criterion."},{"id":"B16.3","c":16,"q":"Another criterion for an exudate is a pleural-to-serum LDH ratio above:","o":["0.05","0.1","0.2","0.3","0.6"],"a":4,"e":"The LDH ratio threshold is 0.6."},{"id":"B16.4","c":16,"q":"A patient on aggressive diuretics for heart failure has an effusion that meets Light criteria for an exudate by a small margin. The next test is:","o":["Radiation","Bronchoscopy","Serum-pleural albumin gradient or NT-proBNP in the fluid","Biopsy at once","Antibiotics"],"a":2,"e":"Diuretics can make a transudate appear exudative."},{"id":"B16.5","c":16,"q":"A parapneumonic effusion has a pH of 6.9 and a loculated appearance. The next step is:","o":["Diuretics","Chest tube drainage","Observation","Steroids","Bronchoscopy"],"a":1,"e":"A low pH marks complicated effusion."},{"id":"B16.6","c":16,"q":"A loculated empyema is draining poorly through a chest tube. A reasonable next step is:","o":["Observe 2 weeks","Remove the tube","Intrapleural enzyme and DNase therapy, or surgery","Add steroids alone","Diuretics"],"a":2,"e":"Intrapleural fibrinolytic therapy or surgical referral is used."},{"id":"B16.7","c":16,"q":"Which pleural fluid finding strongly suggests tuberculosis?","o":["Neutrophil predominance","Lymphocyte-predominant exudate with high adenosine deaminase","Low LDH","Transudate","Milky fluid"],"a":1,"e":"Adenosine deaminase supports tuberculous pleurisy."},{"id":"B16.8","c":16,"q":"A pleural fluid glucose below 60 mg/dL is seen in all EXCEPT:","o":["Malignancy","Tuberculosis","Heart failure","Empyema","Rheumatoid effusion"],"a":2,"e":"Transudates keep normal glucose."},{"id":"B16.9","c":16,"q":"A pleural fluid hematocrit more than half of the blood hematocrit defines:","o":["Chylothorax","Hemothorax","Bloody effusion without hemothorax","Transudate","Empyema"],"a":1,"e":"A ratio of more than 0.5 indicates hemothorax."},{"id":"B16.10","c":16,"q":"A young tall man develops sudden pleuritic chest pain and dyspnea. A radiograph shows a moderate pneumothorax with no lung disease. This is:","o":["Primary spontaneous pneumothorax","Hemothorax","Secondary pneumothorax","Tension pneumothorax","Empyema"],"a":0,"e":"No underlying lung disease defines primary."},{"id":"B16.11","c":16,"q":"A 65-year-old with COPD has a 3 cm pneumothorax and is breathless. The best approach is:","o":["Observation at home","Discharge without follow-up","Antibiotics","Reassurance","Drainage and admission"],"a":4,"e":"Secondary pneumothorax is riskier and usually needs admission."},{"id":"B16.12","c":16,"q":"A ventilated patient is hypotensive with a unilateral absent breath sound and tracheal deviation. The immediate action is:","o":["Wait for a radiograph","Sedation","Fluid only","Needle decompression followed by a chest tube","CT scan"],"a":3,"e":"Tension pneumothorax is a clinical diagnosis requiring immediate decompression."},{"id":"B16.13","c":16,"q":"Recurrent pneumothorax is best prevented by:","o":["Antibiotics","Pleurodesis or surgical intervention","Observation only","Oral steroids","Bed rest"],"a":1,"e":"Procedures that adhere the pleura prevent recurrence."},{"id":"B16.14","c":16,"q":"A patient with cirrhosis and ascites has a large right pleural effusion. This is:","o":["Mesothelioma","Hemothorax","Empyema","Hepatic hydrothorax","Chylothorax"],"a":3,"e":"Ascitic fluid passes through diaphragmatic defects."},{"id":"B16.15","c":16,"q":"A patient with a hepatic hydrothorax should be treated with:","o":["Repeated chest tube drainage","Sodium restriction, diuretics, and transplant evaluation; avoid chest tubes","Pleurodesis first","Radiation","Antibiotics alone"],"a":1,"e":"Chest tubes risk large fluid and protein losses."},{"id":"B16.16","c":16,"q":"A woman with rheumatoid arthritis has a low-glucose, low-pH exudate with high LDH. The likely diagnosis is:","o":["Heart failure","Pulmonary embolism","Nephrotic syndrome","Rheumatoid pleural effusion","Cirrhosis"],"a":3,"e":"Rheumatoid effusions have very low glucose."},{"id":"B16.17","c":16,"q":"Which diagnosis is suggested by an effusion after cardiac surgery, fever, and a pleural-pericardial syndrome?","o":["Sarcoidosis","Postcardiac injury syndrome","Asthma","Pulmonary embolism","Pneumonia"],"a":1,"e":"Pleuropericarditis can follow cardiac injury."},{"id":"B16.18","c":16,"q":"A patient with pulmonary embolism has an exudative effusion. The effusion is:","o":["Common and can be exudative","Always bloody","Impossible","Always transudative","Always chylous"],"a":0,"e":"Infarction can cause exudative effusions."},{"id":"B16.19","c":16,"q":"Which pleural fluid cell count suggests an eosinophilic effusion?","o":["No cells","Only red cells","More than 90% lymphocytes","More than 10% eosinophils, often from air or blood in the pleural space","More than 90% neutrophils"],"a":3,"e":"Air or blood in the pleural space is a common cause."},{"id":"B16.20","c":16,"q":"An uncomplicated parapneumonic effusion is small and free-flowing. The management is:","o":["Antibiotics for pneumonia with monitoring","Pleurodesis","Chest tube","Immediate surgery","No treatment ever"],"a":0,"e":"Small effusions often resolve with treatment of the pneumonia."},{"id":"B16.21","c":16,"q":"Which effusion type is characterized by a low pleural fluid triglyceride level, a high cholesterol level, and cholesterol crystals?","o":["Hemothorax","Chylothorax","Pseudochylothorax","Transudate","Empyema"],"a":2,"e":"Long-standing effusions can show cholesterol crystals."},{"id":"B16.22","c":16,"q":"A patient has recurrent benign effusion that is trapped by a fibrous peel. The treatment is:","o":["Decortication","Observation only","Steroids","Antibiotics","Diuretics"],"a":0,"e":"Surgery removes the restricting peel."},{"id":"B16.23","c":16,"q":"A patient with chest trauma has a large hemothorax. The initial treatment is:","o":["Steroids","Antibiotics only","Thoracentesis weekly","Large-bore chest tube","Observation"],"a":3,"e":"Drainage monitors bleeding and prevents trapped lung."},{"id":"B16.24","c":16,"q":"Thoracentesis should usually be paused if the patient develops:","o":["A headache only","Hunger","Itching","Thirst","Chest tightness, cough, or pain"],"a":4,"e":"These symptoms suggest excessive negative pleural pressure."},{"id":"B16.25","c":16,"q":"Which complication is most important to exclude after thoracentesis with new dyspnea?","o":["Cataract","Diabetes","Gout","Pneumothorax","Pericarditis"],"a":3,"e":"Post-procedure imaging is indicated when symptoms develop."},{"id":"B16.26","c":16,"q":"A patient has a chronic, stable asymptomatic pleural plaque on CT and asbestos exposure. The management is:","o":["Radiation","Surgery","Reassurance and exposure counseling","Chemotherapy","Steroids"],"a":2,"e":"Plaques are markers of exposure, not cancer."},{"id":"B16.27","c":16,"q":"Ultrasound findings of septations and echogenic fluid suggest:","o":["Pneumothorax","Normal pleura","Emphysema","A complicated or exudative effusion","A transudate"],"a":3,"e":"Septations favor exudate or empyema."},{"id":"B14.1","c":14,"q":"A 62-year-old woman has a 40 pack-year smoking history and quit 8 years ago. Under the 2021 USPSTF recommendation, annual low-dose CT screening applies to adults aged:","o":["All adults over 40","65 to 90 regardless of smoking","30 to 50 with 10 pack-years","40 to 60 with any smoking history","50 to 80 with at least a 20 pack-year history who currently smoke or quit within the past 15 years"],"a":4,"e":"She is eligible under these criteria."},{"id":"B14.2","c":14,"q":"A 56-year-old man smoked 25 pack-years and quit 20 years ago. Under the 2023 American Cancer Society guideline, he is:","o":["Eligible only with a family history","Ineligible, because he quit more than 15 years ago","Ineligible because of age","Eligible, because the guideline no longer limits eligibility by years since quitting","Eligible only if he has a cough"],"a":3,"e":"The ACS 2023 update removed the years-since-quitting criterion."},{"id":"B14.3","c":14,"q":"A 58-year-old with a 30 pack-year history and COPD is eligible for screening but has severe disease that limits life expectancy and would not tolerate surgery. The best approach is:","o":["Do not screen if he could not undergo curative treatment","Screen anyway","Use sputum cytology","Use chest radiograph","Screen every 6 months"],"a":0,"e":"Screening requires fitness for treatment."},{"id":"B14.4","c":14,"q":"A patient has a single solid 5 mm nodule found incidentally, and is at low risk. Under the 2017 Fleischner guidance, follow-up is:","o":["PET scan","Resection","CT in 3 months","No routine follow-up","Biopsy"],"a":3,"e":"Solid nodules smaller than 6 mm in low-risk patients need no routine follow-up."},{"id":"B14.5","c":14,"q":"A patient has a single 7 mm solid nodule and is at low risk. Fleischner guidance suggests:","o":["CT at 6 to 12 months, then consider CT at 18 to 24 months","PET/CT now","No follow-up","Surgery","Immediate biopsy"],"a":0,"e":"Solid nodules of 6 to 8 mm get interval CT follow-up."},{"id":"B14.6","c":14,"q":"A solid nodule larger than 8 mm in a high-risk patient should prompt:","o":["No follow-up","Repeat CT in 3 years","Consider CT at 3 months, PET/CT, or tissue sampling","Reassurance","Steroids"],"a":2,"e":"Larger nodules need prompt evaluation."},{"id":"B14.7","c":14,"q":"A PET scan of a 12 mm nodule shows low uptake. Compared with a high-uptake nodule, this:","o":["Requires no follow-up","Is irrelevant","Proves cancer","Lowers but does not exclude malignancy","Excludes cancer"],"a":3,"e":"Small or indolent tumors, such as carcinoid or adenocarcinoma in situ, may have low uptake."},{"id":"B14.8","c":14,"q":"Which nodule feature suggests a benign process?","o":["Spiculation","Rapid growth","Large size","Upper lobe location","Central, diffuse, or popcorn calcification"],"a":4,"e":"Certain calcification patterns suggest benign disease."},{"id":"B14.9","c":14,"q":"A patient has a ground-glass nodule 10 mm that persists for 3 months. The next step is:","o":["Follow-up CT, with attention to a solid component","Repeat in 5 years","Discharge","Immediate surgery","Antibiotics"],"a":0,"e":"Persistent ground-glass nodules need surveillance because of indolent adenocarcinoma."},{"id":"B14.10","c":14,"q":"A nonsmoker with stage IV adenocarcinoma has an EGFR mutation. Which treatment class is first-line?","o":["Platinum chemotherapy alone","EGFR tyrosine kinase inhibitor","Radiation alone","Immunotherapy alone","Observation"],"a":1,"e":"Targeted therapy is first-line for actionable mutations."},{"id":"B14.11","c":14,"q":"Before starting treatment for newly diagnosed advanced non-small cell lung cancer, which testing is needed?","o":["No testing","Spirometry only","Cardiac stress test only","Sputum culture","Comprehensive biomarker testing, including PD-L1"],"a":4,"e":"Biomarker results determine therapy."},{"id":"B14.12","c":14,"q":"Limited-stage small cell lung cancer is treated with:","o":["Chemotherapy and thoracic radiation","Observation","Steroids","Surgery alone always","Antibiotics"],"a":0,"e":"Combined therapy is standard."},{"id":"B14.13","c":14,"q":"A patient with small cell lung cancer has hyponatremia and low serum osmolality with concentrated urine. The syndrome is:","o":["Inappropriate antidiuretic hormone secretion","Hypothyroidism","Diabetes insipidus","Adrenal failure","Heart failure"],"a":0,"e":"Small cell tumors secrete antidiuretic hormone."},{"id":"B14.14","c":14,"q":"A patient with squamous cell carcinoma has hypercalcemia. The likely mechanism is:","o":["Bone metastases only","Hyperparathyroidism","Parathyroid hormone-related peptide","Vitamin D toxicity","Sarcoidosis"],"a":2,"e":"Squamous tumors produce this peptide."},{"id":"B14.15","c":14,"q":"A patient has a stage I non-small cell lung cancer but is not a surgical candidate. A curative option is:","o":["Steroids","Palliative care only","Observation","Antibiotics","Stereotactic body radiotherapy"],"a":4,"e":"It is an effective alternative for early disease."},{"id":"B14.16","c":14,"q":"Mediastinal staging is recommended before surgery in a patient with:","o":["A pneumonia","No tumor","A benign nodule","A peripheral small stage I tumor with normal PET","A central tumor or enlarged mediastinal nodes"],"a":4,"e":"Invasive staging is used for higher-risk disease."},{"id":"B14.17","c":14,"q":"A patient has unexplained hoarseness and a left lung tumor with an aortopulmonary window mass. The likely cause is:","o":["Asthma","Reflux","Vocal cord dysfunction","Allergy","Recurrent laryngeal nerve involvement"],"a":4,"e":"The left recurrent laryngeal nerve loops under the aortic arch."},{"id":"B14.18","c":14,"q":"Which condition is a paraneoplastic neurologic syndrome linked with small cell lung cancer?","o":["Lambert-Eaton myasthenic syndrome","Guillain-Barre syndrome","Parkinson disease","Multiple sclerosis","Myasthenia gravis"],"a":0,"e":"The syndrome causes proximal weakness that improves with exercise."},{"id":"B14.19","c":14,"q":"A patient with hypertrophic osteoarthropathy has clubbing and painful long bones. Which lung disease is most often linked?","o":["Non-small cell lung n loss of muscle tone with laughter, excessive sleepiness, and hypnagogic hallucinations. The diagnosis is:","o":["Restless legs syndrome","Insomnia","Epilepsy","Narcolepsy type 1","Obstructive sleep apnea"],"a":3,"e":"Cataplexy characterizes type 1."},{"id":"B18.13","c":18,"q":"A patient has an urge to move the legs in the evening that is relieved by movement. Which laboratory test should be checked?","o":["Ferritin","Troponin","Amylase","Sodium only","Calcium"],"a":0,"e":"Iron deficiency is a treatable contributor."},{"id":"B18.14","c":18,"q":"A patient acts out dreams, with loss of REM atonia on polysomnography. The condition is:","o":["Sleep apnea","Narcolepsy","REM sleep behavior disorder","Restless legs syndrome","Sleepwalking"],"a":2,"e":"It may precede synucleinopathies."},{"id":"B18.15","c":18,"q":"First-line treatment for chronic insomnia is:","o":["Cognitive behavioral therapy for insomnia","Long-term sedatives","Antibiotics","Steroids","Alcohol"],"a":0,"e":"Behavioral therapy is first-line."},{"id":"B18.16","c":18,"q":"A patient with chronic obstructive pulmonary disease and obesity hypoventilation has prolonged hypercapnia on room air. A major mistake in therapy is:","o":["Weight loss counseling","Giving uncontrolled high-flow oxygen","Treating sleep apnea","Using noninvasive ventilation","Monitoring gases"],"a":1,"e":"Uncontrolled oxygen can worsen hypercapnia."},{"id":"B18.17","c":18,"q":"A patient has a spinal cord injury at C4. Which respiratory problem is expected?","o":["Asthma","Emphysema","Hyperventilation","Normal breathing","Hypoventilation from diaphragm and intercostal weakness"],"a":4,"e":"High cervical injuries impair ventilation."},{"id":"B18.18","c":18,"q":"Phrenic nerve palsy after cardiac surgery typically shows:","o":["Cavitation","Bilateral effusions only","A normal diaphragm","An elevated hemidiaphragm on radiograph","A pneumothorax"],"a":3,"e":"Unilateral paralysis raises the diaphragm."},{"id":"B18.19","c":18,"q":"Which medication sis to consider is:","o":["Tracheal tumor","Anaphylaxis only","Pulmonary embolism","Severe asthma","Inducible laryngeal obstruction (vocal cord dysfunction)"],"a":4,"e":"A flattened inspiratory loop and laryngoscopy during symptoms confirm it."},{"id":"B6.10","c":6,"q":"A patient previously intubated has progressive dyspnea and a flattened inspiratory and expiratory flow-volume loop. The likely cause is:","o":["Emphysema","Restriction","Pneumonia","Asthma","Fixed tracheal stenosis"],"a":4,"e":"Both phases are limited in fixed central obstruction."},{"id":"B6.11","c":6,"q":"Constrictive bronchiolitis after hematopoietic cell transplant presents with:","o":["Progressive obstruction that does not respond to bronchodilators","Pleural effusion","Normal spirometry","Restriction","Pulmonary edema"],"a":0,"e":"Chronic graft-versus-host disease can cause bronchiolitis obliterans."},{"id":"B10.1","c":10,"q":"Under the 2022 ESC/ERS definition, pulmonary hypertension is defined by a mean pulmonary artery pressure above:","o":["10 mm Hg","50 mm Hg","20 mm Hg","60 mm Hg","35 mm Hg"],"a":2,"e":"The threshold was lowered to 20 mm Hg."},{"id":"B10.2","c":10,"q":"A patient has mean pulmonary artery pressure of 38 mm Hg, pulmonary artery wedge pressure of 10 mm Hg, and pulmonary vascular resistance of 6 Wood units. This is:","o":["Isolated post-capillary pulmonary hypertension","Combined post- and pre-capillary disease","Pre-capillary pulmonary hypertension","Normal","Exercise-induced only"],"a":2,"e":"A wedge pressure of 15 or less with PVR above 2 defines pre-capillary disease."},{"id":"B10.3","c":10,"q":"Which test is the best screen for chronic thromboembolic pulmonary hypertension?","o":["Chest radiograph","Bronchoscopy","Ventilation-perfusion scan","Echocardiography alone","Spirometry"],"a":2,"e":"A normal scan effectively excludes the disease."},{"id":"B10.4","c":10,"q":"A patient with systemic sclerosis has new exertional dyspnea and a reduced DLCO. Which screening test is recommended?","o":["Bone scan","Echocardiography with natriuretic peptide and pulmonary function tests","Sleep study only","Colonoscopy","Allergy testing"],"a":1,"e":"Annual screening is advised in this group."},{"id":"B10.5","c":10,"q":"Right heart catheterization is required to:","o":["Diagnose asthma","Treat the patient","Confirm the diagnosis and classify hemodynamics","Replace echocardiography","Measure FEV1"],"a":2,"e":"Catheterization is the diagnostic standard."},{"id":"B10.6","c":10,"q":"A patient with idiopathic pulmonary arterial hypertension has vasoreactivity testing. A positive response predicts benefit from:","o":["Beta-blockers","High-dose calcium channel blockers","Antibiotics","Bronchodilators","Steroids"],"a":1,"e":"Only a small group of responders benefit."},{"id":"B10.7","c":10,"q":"A patient with low-risk pulmonary arterial hypertension has WHO functional class II, 6-minute walk distance of 480 m, and BNP of 40 ng/L. Under the ESC/ERS table, these meet:","o":["Low-risk criteria","High-risk criteria","Group 2 disease","Intermediate-risk criteria","Not interpretable"],"a":0,"e":"Class I or II, walk above 440 m, and BNP under 50 are low risk."},{"id":"B10.8","c":10,"q":"A patient has WHO functional class IV, a 6-minute walk of 120 m, and BNP of 1,000 ng/L. The estimated one-year mortality is:","o":["Unknown","5 to 20%","Under 5%","Zero","Above 20%"],"a":4,"e":"These values meet high-risk criteria."},{"id":"B10.9","c":10,"q":"For idiopathic pulmonary arterial hypertension without cardiopulmonary comorbidities, the guideline recommends initial:","o":["Combination therapy with an endothelin receptor antagonist and a PDE5 inhibitor","Steroids","Observation","Monotherapy with a diuretic","Anticoagulation alone"],"a":0,"e":"Initial dual oral therapy is recommended."},{"id":"B10.10","c":10,"q":"A patient at high risk on initial assessment should be considered for:","o":["Diuretics alone","Triple therapy including a parenteral prostacyclin analogue","A single oral drug","Monotherapy","Observation"],"a":1,"e":"High-risk disease warrants aggressive therapy."},{"id":"B10.11","c":10,"q":"An older patient with pulmonary arterial hypertension and multiple cardiopulmonary comorbidities is more likely to start on:","o":["Intravenous therapy","Triple therapy","Lung transplant","No treatment","Monotherapy with close follow-up"],"a":4,"e":"Comorbidity favors a stepwise approach."},{"id":"B10.12","c":10,"q":"At follow-up, the target of therapy is:","o":["An intermediate-risk profile","Any improvement","A low-risk profile","High-risk profile","No change"],"a":2,"e":"Achieving and maintaining low risk is the goal."},{"id":"B10.13","c":10,"q":"A patient with pulmonary fibrosis has pulmonary hypertension. Which group is this?","o":["Group 5","Group 1","Group 4","Group 2","Group 3"],"a":4,"e":"Lung disease or hypoxia defines group 3."},{"id":"B10.14","c":10,"q":"A patient with left heart failure has mean pulmonary artery pressure of 32 mm Hg and wedge pressure of 22 mm Hg. This is:","o":["Post-capillary pulmonary hypertension","Pre-capillary disease","Normal","Group 1","Group 4"],"a":0,"e":"An elevated wedge indicates left heart disease."},{"id":"B10.15","c":10,"q":"A patient has hemoptysis, glomerulonephritis, and sinusitis with a positive PR3 antineutrophil cytoplasmic antibody. The diagnosis is:","o":["Granulomatosis with polyangiitis","Goodpasture disease","Lupus","Eosinophilic granulomatosis with polyangiitis","Sarcoidosis"],"a":0,"e":"The PR3 pattern with sinus, lung, and kidney disease fits."},{"id":"B10.16","c":10,"q":"A patient with asthma, eosinophilia, and mononeuritis multiplex has:","o":["Churg disease only","Granulomatosis with polyangiitis","Eosinophilic granulomatosis with polyangiitis","Sarcoidosis","Polyarteritis only"],"a":2,"e":"Asthma, eosinophilia, and vasculitic neuropathy fit."},{"id":"B10.17","c":10,"q":"Diffuse alveolar hemorrhage typically shows on bronchoscopy:","o":["Milky fluid","Pus","Clear lavage","Norma
