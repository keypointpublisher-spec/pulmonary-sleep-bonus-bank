ntilation, Neuromuscular and Chest Wall Disease, and Non-Respiratory Sleep Disorders","p":"Part VII. Sleep and Ventilatory Control"},{"n":19,"t":"Respiratory Failure, Oxygen Therapy, and Noninvasive Ventilation","p":"Part VIII. Critical Care Medicine"},{"n":20,"t":"Mechanical Ventilation and Acute Respiratory Distress Syndrome","p":"Part VIII. Critical Care Medicine"},{"n":21,"t":"Shock, Sepsis, and Nonrespiratory Critical Care","p":"Part VIII. Critical Care Medicine"},{"n":22,"t":"ICU Monitoring, Sedation, Complications, and Liberation","p":"Part VIII. Critical Care Medicine"},{"n":23,"t":"Occupational and Environmental Lung Disease and Tobacco Treatment","p":"Part IX. Special Topics and Professional Practice"},{"n":24,"t":"Lung Transplantation and Transplant Complications","p":"Part IX. Special Topics and Professional Practice"},{"n":25,"t":"Quality, Safety, Ethics, Evidence Interpretation, and Pandemic Response","p":"Part IX. Special Topics and Professional Practice"}],"questions":[{"id":"B1.1","c":1,"q":"A 62-year-old woman with myasthenia gravis has an arterial oxygen level of 58 mm Hg and a carbon dioxide level of 68 mm Hg on room air. The alveolar-arterial gradient is normal. Which mechanism best explains her hypoxemia?","o":["Low inspired oxygen","Shunt","Ventilation-perfusion mismatch","Diffusion limitation","Hypoventilation"],"a":4,"e":"A normal gradient with raised carbon dioxide means inadequate alveolar ventilation, here from weak respiratory muscles."},{"id":"B1.2","c":1,"q":"A 30-year-old man with a congenital right-to-left intracardiac communication has a saturation of 82% that rises to 85% on 100% oxygen. What is the mechanism?","o":["Diffusion limitation","Mild ventilation-perfusion mismatch","Hypoventilation","Dead space","Shunt"],"a":4,"e":"Blood bypasses ventilated alveoli, so extra oxygen barely helps."},{"id":"B1.3","c":1,"q":"A hiker develops breathlessness at high altitude. Her arterial oxygen is low, the gradient is normal, and her carbon dioxide is low. The mechanism is:","o":["Dead space","Diffusion limitation","Shunt","Low inspired oxygen pressure","Hypoventilation"],"a":3,"e":"Low barometric pressure lowers inspired oxygen; the gradient stays normal and breathing increases."},{"id":"B1.4","c":1,"q":"A smoker with severe emphysema has hypoxemia that corrects with 2 L/min of nasal oxygen. The dominant mechanism is:","o":["Ventilation-perfusion mismatch","Pulmonary arteriovenous malformation","Right-to-left shunt","Anemia","Alveolar hypoventilation"],"a":0,"e":"Low V/Q units respond to oxygen; true shunt does not."},{"id":"B1.5","c":1,"q":"A man in a house fire has a pulse oximeter reading of 99% and is confused. Arterial blood gas shows a normal PaO2. The most useful next test is:","o":["Co-oximetry for carboxyhemoglobin","Chest radiograph","Spirometry","D-dimer","Repeat pulse oximetry"],"a":0,"e":"Standard oximetry cannot tell carboxyhemoglobin from oxyhemoglobin."},{"id":"B1.6","c":1,"q":"A patient has fever, acidosis, and raised 2,3-diphosphoglycerate. How is the oxyhemoglobin dissociation curve shifted, and what is the effect?","o":["Right shift; oxygen is held more tightly","Left shift; oxygen is released more easily","No shift","Right shift; hemoglobin releases oxygen more easily","Left shift; hemoglobin holds oxygen more tightly"],"a":3,"e":"Acidosis, fever, and 2,3-diphosphoglycerate shift the curve right and increase oxygen unloading."},{"id":"B1.7","c":1,"q":"A 24-year-old with severe asthma exacerbation breathes quickly. Arterial carbon dioxide is 42 mm Hg and he is tiring. The correct interpretation is:","o":["Metabolic compensation","Laboratory error","Hyperventilation","A warning sign, because a patient in this state would be expected to have a low value","Normal and reassuring"],"a":3,"e":"A normal or rising carbon dioxide in a patient with severe airflow obstruction signals fatigue and impending failure."},{"id":"B1.8","c":1,"q":"A patient has a large pulmonary embolus. Compared with before, the physiologic dead space fraction is expected to:","o":["Fall","Become zero","Rise","Equal the shunt fraction","Stay the same"],"a":2,"e":"Ventilated but poorly perfused lung adds dead space."},{"id":"B1.9","c":1,"q":"A 70-year-old man with hypercapnic COPD is given a high oxygen fraction in the ambulance and becomes drowsy with a carbon dioxide of 85 mm Hg. Which mechanism contributes most to the worsening hypercapnia?","o":["Increased dead space and release of hypoxic vasoconstriction, plus the Haldane effect","Loss of hypoxic ventilatory drive alone","Pneumothorax","Bronchospasm","Alkalosis"],"a":0,"e":"Oxygen worsens V/Q matching and shifts carbon dioxide off hemoglobin; loss of drive is only one part."},{"id":"B1.10","c":1,"q":"A consultant is asked whether a patient with chronic cough \"needs a bronchoscopy.\" What is the first step in a good pulmonary consultation?","o":["Start empiric antibiotics","Refer to surgery","Repeat the radiograph","Clarify the question and review the history, exposures, and medications","Order bronchoscopy"],"a":3,"e":"The consult begins with the referring question and a focused history that includes exposures and drugs."},{"id":"B1.11","c":1,"q":"A 55-year-old woman has a low FEV1 and a low DLCO with a normal total lung capacity. Which statement about her gas transfer is correct?","o":["DLCO always rises with emphysema","DLCO measures airway resistance","DLCO is unaffected by anemia","DLCO falls when alveolar-capillary surface or hemoglobin falls","DLCO is the same as FEV1/FVC"],"a":3,"e":"DLCO reflects surface area, membrane, and hemoglobin; anemia lowers it unless corrected."},{"id":"B2.1","c":2,"q":"A 58-year-old former smoker has had exertional dyspnea for 4 months. Examination, radiograph, and spirometry are normal. The next step to separate cardiac, pulmonary, and deconditioning causes is:","o":["Reassurance","Bronchoscopy","Lung biopsy","Cardiopulmonary exercise testing","Empiric steroids"],"a":3,"e":"When first-line tests are normal, exercise testing helps define the limiting system."},{"id":"B2.2","c":2,"q":"A nonsmoker on an angiotensin-converting enzyme inhibitor has a dry cough for 3 months and a clear chest radiograph. The best first step is:","o":["Bronchoscopy","Stop or change the drug and reassess","Antibiotics","CT of the chest","High-dose inhaled steroid"],"a":1,"e":"Medication-related cough is common and resolves after stopping the drug."},{"id":"B2.3","c":2,"q":"A 66-year-old man has cough with a small volume of hemoptysis and has lost weight. Which feature most strongly argues for early imaging and bronchoscopy?","o":["Cough at night","Heartburn","Hemoptysis with weight loss in a smoker","Normal spirometry","Nasal congestion"],"a":2,"e":"Hemoptysis with weight loss in a smoker raises concern for malignancy."},{"id":"B2.4","c":2,"q":"A man has massive hemoptysis from the right lung. The best positioning is:","o":["Trendelenburg only","Sitting upright","Supine","Right side down","Left side down"],"a":3,"e":"Place the bleeding lung down to protect the good lung from aspiration."},{"id":"B2.5","c":2,"q":"A 40-year-old woman has pleuritic chest pain and a pulse of 110 after a long flight. The first step is to:","o":["Assign clinical probability and test accordingly","Order a bone scan","Reassure","Start steroids","Perform bronchoscopy"],"a":0,"e":"Probability-guided testing for pulmonary embolism is the standard approach."},{"id":"B2.6","c":2,"q":"A patient with chronic cough has an eosinophil-predominant sputum and normal imaging. The most likely diagnosis is:","o":["Bronchiectasis","Lung cancer","Pulmonary fibrosis","Eosinophilic bronchitis or cough-variant asthma","Tuberculosis"],"a":3,"e":"Airway eosinophilia without airflow variability fits eosinophilic bronchitis; consider cough-variant asthma."},{"id":"B3.1","c":3,"q":"A man has FEV1 60% predicted, FVC 85% predicted, a low FEV1/FVC ratio, and a high residual volume. The pattern is:","o":["Mixed restriction","Neuromuscular weakness","Obstruction with air trapping","Normal","Restriction"],"a":2,"e":"A low ratio defines obstruction; a high residual volume shows air trapping."},{"id":"B3.2","c":3,"q":"Which change on pulmonary function testing best supports a restrictive process?","o":["High residual volume","Normal DLCO in all cases","High FEV1/FVC with a normal TLC","Low total lung capacity","Low ratio"],"a":3,"e":"Restriction requires a reduced total lung capacity."},{"id":"B3.3","c":3,"q":"A patient has a normal spirometry and a very low DLCO with exertional desaturation. The most likely explanation is:","o":["Pulmonary vascular disease or early interstitial disease","Vocal cord dysfunction","Asthma","Chronic bronchitis","Obesity"],"a":0,"e":"An isolated low DLCO points to vascular or early parenchymal disease."},{"id":"B3.4","c":3,"q":"Under the 2023 ATS interpretation standard, which reference approach should laboratories use?","o":["Race-neutral reference equations (such as GLI Global)","Race-based correction factors","Fixed 80% predicted threshold","Fixed ratio of 0.70 only","No reference equations"],"a":0,"e":"The 2023 ATS standard recommends race-neutral equations and the lower limit of normal."},{"id":"B3.5","c":3,"q":"A flow-volume loop shows flattening of both the inspiratory and expiratory limbs. This suggests:","o":["Asthma","Emphysema","Variable extrathoracic obstruction","Restriction","Fixed upper airway obstruction"],"a":4,"e":"A fixed lesion limits flow in both phases."},{"id":"B3.6","c":3,"q":"Which procedure has the highest diagnostic yield for mediastinal lymph node sampling with the least invasiveness?","o":["Bronchoalveolar lavage","Open thoracotomy","Blind transbronchial biopsy","Thoracentesis","Endobronchial ultrasound with needle aspiration"],"a":4,"e":"Endobronchial ultrasound-guided needle aspiration samples mediastinal and hilar nodes."},{"id":"B9.1","c":9,"q":"A 35-year-old woman has pleuritic chest pain two weeks after a long flight. Her clinical probability for pulmonary embolism is low. What is the best first test?","o":["Ventilation-perfusion scan","CT pulmonary angiography","D-dimer","Pulmonary angiography","Echocardiography"],"a":2,"e":"With low or intermediate probability, a D-dimer comes first, and imaging follows only if it is elevated."},{"id":"B9.2","c":9,"q":"A 60-year-old man has a high clinical probability of pulmonary embolism. He is hemodynamically stable with a normal creatinine. The best next step is:","o":["Stress test","D-dimer alone","Observation","Chest radiograph only","Imaging with CT pulmonary angiography"],"a":4,"e":"When probability is high, go straight to imaging; a negative D-dimer is not used to exclude."},{"id":"B9.3","c":9,"q":"A patient with suspected pulmonary embolism has a severe contrast allergy and a reduced eGFR. Which test is the best alternative to CT angiography?","o":["Chest radiograph","Spirometry","D-dimer repeated","Bronchoscopy","Ventilation-perfusion scan"],"a":4,"e":"A ventilation-perfusion scan avoids iodinated contrast and works best with a clear radiograph."},{"id":"B9.4","c":9,"q":"A 28-year-old woman at 30 weeks of gestation has suspected pulmonary embolism. Which anticoagulant is preferred for the acute phase?","o":["Aspirin","A direct oral anticoagulant","Low-molecular-weight heparin","Rivaroxaban plus aspirin","Warfarin"],"a":2,"e":"Low-molecular-weight heparin is used in pregnancy because warfarin crosses the placenta and direct oral agents are not recommended."},{"id":"B9.5","c":9,"q":"A hypotensive patient with a large pulmonary embolus and right ventricular dysfunction has no contraindication to thrombolysis. If alteplase is chosen, the labeled regimen is:","o":["50 mg over 6 hours","100 mg over 2 hours, with parenteral anticoagulation started near the end of or right after the infusion","100 mg over 10 minutes with no anticoagulation","10 mg bolus only","0.9 mg/kg as a single bolus"],"a":1,"e":"The label gives 100 mg intravenously over 2 hours."},{"id":"B9.6","c":9,"q":"A patient had a first unprovoked pulmonary embolism and completed 3 months of anticoagulation. The best next decision is:","o":["Discuss extended anticoagulation, weighing bleeding risk","Start thrombolysis","Place a permanent filter","Stop all therapy permanently","Switch to aspirin without discussion"],"a":0,"e":"Extended therapy beyond 3 to 6 months is considered after a first event without a major reversible risk factor."},{"id":"B9.7","c":9,"q":"A patient is discharged after a pulmonary embolism. When should the first follow-up contact occur?","o":["At 5 years","Within 1 week of discharge","Only if symptoms recur","No follow-up is needed","At 1 year"],"a":1,"e":"The 2026 guideline summaries call for communication or a clinic evaluation within 1 week."},{"id":"B9.8","c":9,"q":"At the 3-month visit after pulmonary embolism, a patient still has exertional breathlessness and a mismatched perfusion defect on a ventilation-perfusion scan. The next step is to:","o":["Repeat the same scan in a year","Evaluate for chronic thromboembolic disease and pulmonary hypertension","Reassure","Stop anticoagulation","Start steroids"],"a":1,"e":"Persistent symptoms with perfusion defects raise concern for chronic thromboembolic disease."},{"id":"B9.9","c":9,"q":"A hospitalized patient develops sudden breathlessness. Heart rate is 120 and blood pressure is 85/50 mm Hg. Bedside ultrasound shows a dilated right ventricle. The most likely category is:","o":["High-risk (massive) pulmonary embolism","Pneumothorax only","Pneumonia","Low-risk pulmonary embolism","Asthma"],"a":0,"e":"Hypotension with right ventricular strain defines the highest-risk presentation."},{"id":"B9.10","c":9,"q":"Which finding raises clinical probability the most in a patient with suspected pulmonary embolism?","o":["Fever","Age under 30","Wheezing","Active cancer and unilateral leg swelling","Productive cough"],"a":3,"e":"Clinical scores weight cancer and signs of deep vein thrombosis."},{"id":"B9.11","c":9,"q":"A patient on a direct oral anticoagulant for pulmonary embolism needs a procedure. Which factor most influences the interruption plan?","o":["Previous radiograph","Bleeding risk of the procedure and renal function","Hair color","Time of day","Patient height"],"a":1,"e":"The drug, renal function, and procedural bleeding risk set the hold time."},{"id":"B9.12","c":9,"q":"A patient with a pulmonary embolus has a contraindication to anticoagulation. A temporary inferior vena cava filter is placed. What must the team do?","o":["Remove it the same day regardless","Leave it permanently without review","Plan to retrieve it once anticoagulation is safe","Start thrombolysis","Stop all follow-up"],"a":2,"e":"Temporary filters should be tracked and retrieved."},{"id":"B9.13","c":9,"q":"A patient asks why bleeding risk matters when choosing the duration of anticoagulation. The best answer is:","o":["Bleeding risk is irrelevant","Duration is fixed at 1 month","Everyone needs lifelong therapy","Duration depends only on the platelet count","Long therapy benefits only if the recurrence risk outweighs the bleeding risk"],"a":4,"e":"Duration balances recurrence against bleeding."},{"id":"B9.14","c":9,"q":"A young patient has unprovoked deep vein thrombosis. Which question is most important in the history?","o":["Shoe size","Occupation only","Favorite food","Family history and prior clots","Height"],"a":3,"e":"Personal and family history of thrombosis informs risk and duration."},{"id":"B11.1","c":11,"q":"A 72-year-old man has pneumonia, needs mechanical ventilation, and is on vasopressors. According to the ATS/IDSA criteria, how is his disease classified?","o":["Mild","Not pneumonia","Moderate","Needs 3 minor criteria first","Severe, because he meets a major criterion"],"a":4,"e":"Septic shock needing vasopressors or respiratory failure needing ventilation is a major criterion."},{"id":"B11.2","c":11,"q":"A patient with pneumonia has a respiratory rate of 34, confusion, multilobar infiltrates, and a PaO2/FiO2 ratio of 220. How many minor criteria does she meet?","o":["Two","Zero","Four","Three major criteria","One"],"a":2,"e":"Respiratory rate of 30 or more, confusion, multilobar infiltrates, and a ratio of 250 or lower are all minor criteria."},{"id":"B11.3","c":11,"q":"A patient meets three minor criteria for severe community-acquired pneumonia. The disposition is:","o":["Discharge","Intensive care evaluation","Outpatient care","Observation at home","Routine ward without monitoring"],"a":1,"e":"One major or three minor criteria define severe disease and prompt intensive care."},{"id":"B11.4","c":11,"q":"Which finding is a minor criterion for severe pneumonia?","o":["Blood urea nitrogen of 20 mg/dL or more","Low-grade fever only","Pleuritic pain","Cough","Leukocytosis alone"],"a":0,"e":"Uremia is a minor criterion, along with platelets under 100,000 per microliter."},{"id":"B11.5","c":11,"q":"A 55-year-old with community-acquired pneumonia has a pleural effusion on ultrasound. Fluid pH is 7.0. The best management is:","o":["Steroids","Repeat chest radiograph in 1 year","Observation only","Chest tube drainage","Diuretics"],"a":3,"e":"A low pH marks complicated parapneumonic effusion needing drainage."},{"id":"B11.6","c":11,"q":"A patient with pneumonia has been treated for 4 days and remains febrile. The first step is to:","o":["Double the antibiotic dose without review","Stop all care","Order a bone scan","Discharge","Reassess the diagnosis, complications, and culture data"],"a":4,"e":"Persistent fever prompts a review for empyema, resistant organisms, or an alternative diagnosis."},{"id":"B11.7","c":11,"q":"Which sepsis timing statement matches the 2026 Surviving Sepsis Campaign guideline?","o":["Give them only after intensive care admission","Give antimicrobials within 24 hours","Withhold antimicrobials","Give antimicrobials ideally within 1 hour for septic shock or probable or definite sepsis","Wait 12 hours for cultures"],"a":3,"e":"Antimicrobials ideally within 1 hour applies to septic shock and probable or definite sepsis."},{"id":"B11.8","c":11,"q":"For possible sepsis without shock, the 2026 guideline suggests:","o":["Immediate vasopressors","No treatment ever","A time-limited investigation with antimicrobials within 3 hours if concern persists","Steroids only","Antimicrobials in 24 hours"],"a":2,"e":"Possible sepsis without shock gets a time-limited evaluation and treatment within 3 hours."},{"id":"B11.9","c":11,"q":"In the first 3 hours of septic shock resuscitation, the 2026 guideline suggests at least how much crystalloid?","o":["None","30 mL/kg","10 mL/kg","5 mL/kg","100 mL/kg"],"a":1,"e":"The suggestion is at least 30 mL/kg, with low certainty of evidence."},{"id":"B11.10","c":11,"q":"What mean arterial pressure target does the 2026 guideline suggest for septic shock?","o":["90 mm Hg","40 mm Hg","65 mm Hg","No target","110 mm Hg"],"a":2,"e":"A target of 65 mm Hg is suggested."},{"id":"B11.11","c":11,"q":"A nursing-home resident has pneumonia after a witnessed large-volume vomit. Which term describes the event?","o":["Asthma","Sarcoidosis","Aspiration pneumonia","Pulmonary embolism","Hypersensitivity pneumonitis"],"a":2,"e":"A witnessed aspiration with infiltrate in a dependent segment is aspiration pneumonia."},{"id":"B11.12","c":11,"q":"A patient with community-acquired pneumonia has no risk factors for resistant organisms. What principle guides empiric therapy?","o":["Use the broadest agent for everyone","Use antifungal therapy first","Cover typical and atypical pathogens according to the local guideline","Withhold therapy until culture results","Use steroids alone"],"a":2,"e":"Empiric therapy follows severity, risk factors, and local resistance."},{"id":"B11.13","c":11,"q":"Which test result would best support de-escalation from broad antibiotics?","o":["A falling hematocrit only","A negative MRSA nasal polymerase chain reaction in a pneumonia patient","A larger infiltrate","A new rash","A raised temperature"],"a":1,"e":"A negative MRSA nasal PCR has a high negative predictive value for MRSA pneumonia."},{"id":"B11.14","c":11,"q":"A 30-year-old with pneumonia has a normal oxygen level, normal vital signs, and reliable follow-up. The best site of care is:","o":["Step-down unit","Operating room","Hospice","Intensive care","Outpatient"],"a":4,"e":"Low-severity patients with a safe home setting can be treated as outpatients."},{"id":"B11.15","c":11,"q":"A patient with pneumonia has pleural fluid that is thick pus. The diagnosis is:","o":["Hemothorax","Transudate","Pneumothorax","Empyema","Chylothorax"],"a":3,"e":"Grossly purulent fluid is an empyema and needs drainage."},{"id":"B11.16","c":11,"q":"After discharge for pneumonia, which counseling is most important?","o":["Avoid all exercise","No counseling","Vaccination and smoking cessation","Lifelong antibiotics","Daily steroids"],"a":2,"e":"Vaccination and tobacco treatment reduce recurrence."},{"id":"B11.17","c":11,"q":"A patient has pneumonia and a new rash after starting an antibiotic. The best response is:","o":["Ignore the rash","Stop all monitoring","Add a second same-class drug","Continue unchanged","Recognize a possible drug reaction and change therapy"],"a":4,"e":"A drug reaction needs reassessment and a different agent."},{"id":"B11.18","c":11,"q":"Which prevention step reduces ventilator-associated pneumonia?","o":["Delayed extubation","Avoiding oral care","Routine antibiotics for all","Continuous deep sedation","Head-of-bed elevation and daily sedation interruption"],"a":4,"e":"Standard bundles include elevation, sedation review, and oral care."},{"id":"B11.19","c":11,"q":"A patient with a lung abscess is stable. The usual first-line approach is:","o":["Radiation","Prolonged antibiotics with drainage only if needed","Steroids","Observation without antibiotics","Immediate lobectomy"],"a":1,"e":"Most abscesses respond to prolonged antibiotics; drainage is reserved for failure."},{"id":"B11.20","c":11,"q":"A young adult has fever, dry cough, and patchy infiltrates after exposure to a group with similar symptoms. Which pathogen is classically considered?","o":["Cytomegalovirus","Mycoplasma pneumoniae","Aspergillus","Pneumocystis jirovecii","Nocardia"],"a":1,"e":"Atypical pneumonia in young groups often involves Mycoplasma."},{"id":"B11.21","c":11,"q":"Hospitalized pneumonia patient: which finding should prompt consideration of influenza or other viral testing in season?","o":["Isolated back pain","Fever, cough, and community circulation","Normal chest radiograph and no cough","Normal vital signs","Age 20 and no symptoms"],"a":1,"e":"Testing is guided by symptoms and local circulation, and affects treatment."},{"id":"B11.22","c":11,"q":"The best summary of the main purpose of severity criteria in pneumonia is:","o":["To predict color of sputum","To decide intensive care need and site of care","To replace clinical judgment","To measure vaccine response","To pick the brand of antibiotic"],"a":1,"e":"Criteria support, but do not replace, clinical judgment on disposition."},{"id":"B17.1","c":17,"q":"A 52-year-old man with obesity, loud snoring, witnessed apneas, and hypertension has a high pretest probability of moderate to severe obstructive sleep apnea and no major cardiopulmonary disease. The best diagnostic test is:","o":["Home sleep apnea testing","Multiple sleep latency test","Chest radiograph","Overnight oximetry alone","Spirometry"],"a":0,"e":"Uncomplicated adults with high pretest probability can be tested at home."},{"id":"B17.2","c":17,"q":"A patient with heart failure, chronic opioid use, and suspected sleep apnea needs testing. The best test is:","o":["No testing","Home test","Pulse oximetry at clinic","In-laboratory polysomnography","Questionnaire only"],"a":3,"e":"Significant cardiopulmonary disease or opioid use favors attended polysomnography to detect central events and hypoventilation."},{"id":"B17.3","c":17,"q":"A polysomnogram shows an apnea-hypopnea index of 22 events per hour. The severity category is:","o":["Normal","Primary snoring only","Moderate","Mild","Severe"],"a":2,"e":"Fifteen to 30 events per hour is moderate."},{"id":"B17.4","c":17,"q":"An apnea-hypopnea index of 3 events per hour in an asymptomatic person is:","o":["Central apnea","Normal","Severe","Mild","Moderate"],"a":1,"e":"Under 5 events per hour is considered normal in adults."},{"id":"B17.5","c":17,"q":"Which first-line therapy has the strongest evidence for symptom and blood pressure benefit in moderate to severe obstructive sleep apnea?","o":["Sedative hypnotics","Nasal steroid alone","Alcohol before bed","Continuous positive airway pressure","Daytime stimulant alone"],"a":3,"e":"Positive airway pressure remains first-line therapy."},{"id":"B17.6","c":17,"q":"A patient uses CPAP only 2 hours a night. Which first step best improves adherence?","o":["Stop therapy","Increase pressure without review","Start sedatives","Mask refitting, humidification, and early follow-up","Discharge from care"],"a":3,"e":"Early troubleshooting and support improve use."},{"id":"B17.7","c":17,"q":"A 45-year-old with severe obstructive sleep apnea and obesity asks about medication. In December 2024 the FDA approved which agent for moderate to severe obstructive sleep apnea in adults with obesity?","o":["Zolpidem","Sildenafil","Tirzepatide","Metformin","Modafinil alone"],"a":2,"e":"Tirzepatide was approved on 20 December 2024 for this indication, alongside diet and exercise."},{"id":"B17.8","c":17,"q":"A patient cannot tolerate CPAP and has a mild jaw deficiency. A reasonable alternative is:","o":["Sedatives","A mandibular advancement device","A cervical collar","Alcohol","Opioids"],"a":1,"e":"Oral appliances help selected patients with mild to moderate disease or CPAP intolerance."},{"id":"B17.9","c":17,"q":"Hypoglossal nerve stimulation is most appropriate for a patient with:","o":["Central sleep apnea only","Severe obesity with any pattern","CPAP intolerance, a limited BMI range, and favorable airway collapse pattern on drug-induced sleep endoscopy","Untreated heart failure only","Complete concentric collapse"],"a":2,"e":"Selection depends on CPAP failure, body habitus, and the pattern of collapse."},{"id":"B17.10","c":17,"q":"A man is a commercial truck driver with severe untreated sleep apnea and an episode of near-miss crashes. What is the right management emphasis?","o":["No action","Daytime stimulants only","Continue driving unchanged","Delay evaluation for a year","Prompt treatment and documented adherence before return to duty"],"a":4,"e":"Safety-sensitive work requires effective treatment and monitoring."},{"id":"B17.11","c":17,"q":"A patient with suspected obstructive sleep apnea has a negative home test, but suspicion remains high. The next step is:","o":["Start steroids","Lung biopsy","In-laboratory polysomnography","Repeat nothing","Discharge"],"a":2,"e":"A negative home test does not exclude disease when suspicion is high."},{"id":"B17.12","c":17,"q":"A woman with severe obstructive sleep apnea has a morning headache and a serum bicarbonate of 34 mEq/L. What should be suspected?","o":["Anemia","Obesity hypoventilation syndrome","Hypothyroidism alone","Asthma","Sarcoidosis"],"a":1,"e":"Daytime hypercapnia and a raised bicarbonate point to hypoventilation."},{"id":"B17.13","c":17,"q":"Complex (treatment-emergent) central sleep apnea emerges after starting CPAP. The first approach is:","o":["Stop all therapy","Prescribe sedatives","Start steroids","Continue CPAP with monitoring, since many cases resolve","Add opioids"],"a":3,"e":"Many treatment-emergent central events fade with continued use; persistent cases need adaptive modes."},{"id":"B17.14","c":17,"q":"Cheyne-Stokes respiration is most often seen in patients with:","o":["Obesity alone","Interstitial lung disease only","Asthma","Chronic sinusitis","Heart failure"],"a":4,"e":"It is a crescendo-decrescendo pattern seen with heart failure and stroke."},{"id":"B17.15","c":17,"q":"Adaptive servo-ventilation is contraindicated in central sleep apnea with:","o":["Symptomatic heart failure with reduced ejection fraction","Opioid-related central apnea","High-altitude periodic breathing","Age under 40","Normal heart function"],"a":0,"e":"Trial data showed increased mortality in this group."},{"id":"B17.16","c":17,"q":"Opioid use is associated with which sleep-disordered breathing pattern?","o":["No effect","Isolated snoring","Central apnea and ataxic breathing","Only obstructive hypopnea","Narcolepsy"],"a":2,"e":"Opioids blunt respiratory drive and cause central events."},{"id":"B17.17","c":17,"q":"A patient with obstructive sleep apnea scheduled for surgery should be told to:","o":["Bring the CPAP device and use it postoperatively","Leave it at home","Take extra sedatives","Skip anesthesia review","Avoid monitoring"],"a":0,"e":"Perioperative CPAP use reduces postoperative respiratory events."},{"id":"B17.18","c":17,"q":"Which feature is the best predictor of excessive daytime sleepiness from a sleep disorder, rather than simple fatigue?","o":["Unintended dozing in passive situations","Muscle ache","Mild tiredness after exertion","Dry mouth","Weight gain"],"a":0,"e":"True sleepiness is falling asleep when passive."},{"id":"B17.19","c":17,"q":"Obstructive sleep apnea is linked to which cardiovascular condition?","o":["None","Mitral valve prolapse only","Aortic dissection only","Congenital heart disease only","Resistant hypertension"],"a":4,"e":"Resistant hypertension is a classic association."},{"id":"B17.20","c":17,"q":"A 50-year-old man with a narrow retropalatal airway snores and has obstructive events that are worst in the supine position. Which mechanism best explains airway collapse during sleep?","o":["A wider airway at sleep onset","Loss of lung elastic recoil alone","Increased upper airway muscle tone","Reduced upper airway dilator muscle activity in an anatomically narrow airway","Pleural fluid"],"a":3,"e":"Sleep lowers dilator muscle activity, and a narrow, collapsible airway then closes."},{"id":"B17.21","c":17,"q":"A 60-year-old man has loud snoring and an Epworth Sleepiness Scale score of 4. Which statement about screening questionnaires such as STOP-Bang is correct?","o":["Questionnaires are never useful","Questionnaires estimate probability and do not replace testing","Questionnaires equal polysomnography","A high score proves disease","A low score proves no disease"],"a":1,"e":"Questionnaires help triage but do not diagnose."},{"id":"B17.22","c":17,"q":"A sleep laboratory switches its hypopnea scoring rule from one requiring a 3% desaturation or arousal to one requiring a 4% desaturation. What is the usual effect on a patient's reported apnea-hypopnea index?","o":["It falls, and some patients move to a lower severity category","It rises in every patient","It converts to the respiratory disturbance index only","It is unchanged in every patient","It becomes a central apnea index"],"a":0,"e":"The stricter rule scores fewer hypopneas, so the index can fall and the severity category can change."},{"id":"B17.23","c":17,"q":"A weight-loss program in a patient with obesity and obstructive sleep apnea typically:","o":["Causes central apnea","Worsens apnea","Has no effect","Reduces severity and sometimes resolves disease","Eliminates the need for follow-up"],"a":3,"e":"Weight loss improves severity and may allow lower pressures."},{"id":"B17.24","c":17,"q":"A child with adenotonsillar hypertrophy and snoring has apneas. The first-line treatment is:","o":["CPAP in all cases","Observation forever","Adenotonsillectomy","Oral appliance","Steroids only"],"a":2,"e":"Surgery is first-line for most children."},{"id":"B17.25","c":17,"q":"A patient on CPAP has persistent residual events and mask leak. The best first measure is:","o":["Double pressure","Start a sedative","Ignore the data","Stop therapy","Download the device data and address leak"],"a":4,"e":"Device data guide troubleshooting."},{"id":"B17.26","c":17,"q":"A patient with hypercapnic obesity hypoventilation and obstructive sleep apnea should first be treated with:","o":["Steroids","Sedatives","Oxygen alone","Positive airway pressure with attention to hypoventilation","Opioids"],"a":3,"e":"Oxygen alone can worsen hypoventilation."},{"id":"B17.27","c":17,"q":"Which statement about alcohol is correct?","o":["Evening alcohol can worsen obstructive events","It prevents central events","Alcohol improves apnea","It increases muscle tone","It has no effect"],"a":0,"e":"Alcohol relaxes upper airway muscles."},{"id":"B17.28","c":17,"q":"A patient has REM-related obstructive sleep apnea. Compared with non-REM disease:","o":["REM has no effect","Events occur only in deep sleep","Treatment is never needed","Events cluster in REM sleep when muscle tone is lowest","Events never occur in REM"],"a":3,"e":"REM atonia worsens collapse."},{"id":"B17.29","c":17,"q":"Supine-predominant obstructive sleep apnea may respond to:","o":["Bronchodilators","Diuretics only","Steroids","Positional therapy","Antibiotics"],"a":3,"e":"Avoiding the supine position helps selected patients."},{"id":"B17.30","c":17,"q":"After starting CPAP, which symptom change is most expected within weeks?","o":["Less daytime sleepiness","Hearing loss","More snoring","Worse blood pressure","Weight gain from therapy alone"],"a":0,"e":"Sleepiness usually improves."},{"id":"B17.31","c":17,"q":"Which test would best exclude narcolepsy as a cause of persistent sleepiness after treated apnea?","o":["Echocardiography","Multiple sleep latency test after adequate sleep","Chest CT","Arterial gas","Spirometry"],"a":1,"e":"The multiple sleep latency test measures sleep latency and REM onset."},{"id":"B17.32","c":17,"q":"In a patient with treated sleep apnea and ongoing sleepiness, the first step is to:","o":["Ignore symptoms","Add a stimulant at once","Stop CPAP","Confirm CPAP adherence and rule out insufficient sleep","Order lung biopsy"],"a":3,"e":"Look for undertreatment and behavioral causes first."},{"id":"B17.33","c":17,"q":"A patient is concerned about pregnancy and sleep apnea. Untreated disease may be associated with:","o":["No outcomes","Lower blood pressure","Hypertensive disorders of pregnancy","Improved fetal growth","Less snoring"],"a":2,"e":"Sleep apnea is associated with gestational hypertension and preeclampsia."},{"id":"B17.34","c":17,"q":"Upper airway surgery for adults is most useful when:","o":["It is the first step in all patients","The airway is normal","A child has tonsil disease only","The patient is asymptomatic","A specific anatomic target is identified and CPAP fails"],"a":4,"e":"Surgery is individualized after assessment."},{"id":"B17.35","c":17,"q":"Which finding on a polysomnogram supports upper airway resistance rather than classic apnea?","o":["REM behavior","Respiratory effort-related arousals","Cheyne-Stokes pattern","Absent effort","Seizure"],"a":1,"e":"Effort-related arousals mark flow limitation without full events."},{"id":"B17.36","c":17,"q":"A patient with obstructive sleep apnea and insomnia is told to:","o":["Treat both conditions, since insomnia can limit CPAP use","Take sedatives only","Stop CPAP","Avoid all treatment","Ignore insomnia"],"a":0,"e":"Comorbid insomnia often needs cognitive behavioral therapy."},{"id":"B12.1","c":12,"q":"A 38-year-old man from an endemic region has 6 weeks of cough, night sweats, and an upper lobe cavity. He is awaiting sputum results. Where should he be managed?","o":["In a droplet-precaution room","In an airborne isolation room","In a hallway bed","At home with no precautions","In a standard room with a mask on staff only"],"a":1,"e":"Suspected pulmonary tuberculosis needs airborne isolation until proven otherwise."},{"id":"B12.2","c":12,"q":"A patient with drug-susceptible pulmonary tuberculosis is to receive standard therapy. Which regimen is correct?","o":["Moxifloxacin alone","Ethambutol and pyrazinamide for 9 months","Two months of isoniazid, rifampin, pyrazinamide, and ethambutol, then four months of isoniazid and rifampin","Isoniazid alone for 6 months","Rifampin alone for 2 months"],"a":2,"e":"The standard 6-month regimen is 2HRZE/4HR."},{"id":"B12.3","c":12,"q":"A patient with cavitary tuberculosis still has positive cultures at 2 months. Which change is typically considered?","o":["Stopping therapy","Adding steroids only","Stopping rifampin","A longer continuation phase of 7 months, for 9 months total","Switching to isoniazid alone"],"a":3,"e":"Cavitation with delayed culture conversion is a reason to extend to 9 months."},{"id":"B12.4","c":12,"q":"A 55 kg adult is started on pyrazinamide and ethambutol. Using the weight-band table (40 to 55 kg), the daily doses are:","o":["Pyrazinamide 1,000 mg and ethambutol 800 mg","Pyrazinamide 2,000 mg and ethambutol 1,600 mg","Pyrazinamide 3,000 mg and ethambutol 2,400 mg","Pyrazinamide 1,500 mg and ethambutol 1,200 mg","Pyrazinamide 500 mg and ethambutol 400 mg"],"a":0,"e":"The 40 to 55 kg band uses 1,000 mg and 800 mg."},{"id":"B12.5","c":12,"q":"A 70 kg adult starts standard daily therapy. The pyrazinamide dose from the weight-band table is:","o":["2,000 mg","3,000 mg","1,500 mg","1,000 mg","500 mg"],"a":2,"e":"The 56 to 75 kg band uses 1,500 mg of pyrazinamide and 1,200 mg of ethambutol."},{"id":"B12.6","c":12,"q":"A diabetic patient starts isoniazid. Which supplement is recommended to lower the risk of neuropathy?","o":["Iron","Pyridoxine (vitamin B6)","Vitamin C","Vitamin A","Vitamin K"],"a":1,"e":"Pyridoxine is given to patients at risk of neuropathy."},{"id":"B12.7","c":12,"q":"A patient on tuberculosis therapy develops dark urine, jaundice, and persistent vomiting. The immediate step is to:","o":["Ignore the symptoms","Stop the drugs and seek evaluation promptly","Take extra doses","Add alcohol","Wait one month"],"a":1,"e":"These symptoms suggest hepatotoxicity and need prompt assessment."},{"id":"B12.8","c":12,"q":"A patient reports blurred vision and difficulty seeing red-green colors on ethambutol. The most likely cause is:","o":["Retinal detachment","Glaucoma","Optic neuritis","Migraine","Cataract"],"a":2,"e":"Ethambutol can cause optic neuritis, so visual symptoms need review."},{"id":"B12.9","c":12,"q":"A 25-year-old with drug-susceptible pulmonary tuberculosis is eligible for a shorter regimen. The CDC 4-month option is:","o":["Streptomycin alone","Isoniazid alone","Rifampin for 4 months","Linezolid alone","Isoniazid, rifapentine, pyrazinamide, and moxifloxacin for 8 weeks, then isoniazid, rifapentine, and moxifloxacin for 9 weeks"],"a":4,"e":"The 17-week regimen applies to people aged 12 and older with drug-susceptible pulmonary tuberculosis."},{"id":"B12.10","c":12,"q":"In rifampin-resistant tuberculosis, which all-oral regimen is now used?","o":["Bedaquiline, pretomanid, linezolid, and moxifloxacin","Isoniazid alone","Rifampin plus ethambutol","Ethambutol alone","Streptomycin alone"],"a":0,"e":"BPaLM, or BPaL, is used according to current guidance."},{"id":"B12.11","c":12,"q":"Why is directly observed therapy standard in tuberculosis?","o":["It avoids monitoring","It replaces notification","It is required only for children","It supports adherence and prevents resistance and relapse","It reduces the number of drugs"],"a":3,"e":"Supervised therapy improves completion."},{"id":"B12.12","c":12,"q":"A healthcare worker has a positive interferon-gamma release assay, normal chest radiograph, and no symptoms. The diagnosis is:","o":["Sarcoidosis","Latent tuberculosis infection","Miliary tuberculosis","Silicosis","Active pulmonary tuberculosis"],"a":1,"e":"Infection without disease needs treatment to prevent progression."},{"id":"B12.13","c":12,"q":"A patient before starting a tumor necrosis factor inhibitor has a positive tuberculosis test. What should happen?","o":["Give steroids","Start the biologic at once","Ignore the result","Repeat in 10 years","Rule out active disease and treat latent infection"],"a":4,"e":"Screen and treat latent infection before biologic therapy."},{"id":"B12.14","c":12,"q":"A patient with bronchiectasis and nodular infiltrates has Mycobacterium avium complex in three sputum cultures. Which regimen structure does the guideline favor for macrolide-susceptible disease?","o":["At least three drugs including a macrolide and ethambutol","Ethambutol alone","Isoniazid alone","Macrolide alone","Fluoroquinolone alone"],"a":0,"e":"A macrolide-based multidrug regimen is recommended."},{"id":"B12.15","c":12,"q":"Which macrolide is preferred for Mycobacterium avium complex pulmonary disease?","o":["Telithromycin","Erythromycin","Azithromycin","Roxithromycin","Fidaxomicin"],"a":2,"e":"The guideline suggests azithromycin over clarithromycin."},{"id":"B12.16","c":12,"q":"A patient with Mycobacterium avium complex remains culture-positive after 6 months of guideline-based therapy. The next addition is:","o":["Steroids","Oral vancomycin","Amikacin liposome inhalation suspension","Isoniazid alone","Stopping all therapy"],"a":2,"e":"The agent is added for refractory disease."},{"id":"B12.17","c":12,"q":"How long should Mycobacterium avium complex treatment continue?","o":["2 weeks","3 months total","1 month","At least 12 months after sputum cultures become negative","Until symptoms improve only"],"a":3,"e":"The guideline recommends a minimum of 12 months of negative cultures."},{"id":"B12.18","c":12,"q":"A man in the Ohio River Valley has fever, cough, and mediastinal adenopathy after cave exploration. The most likely fungal infection is:","o":["Cryptococcosis","Histoplasmosis","Coccidioidomycosis","Aspergillosis","Mucormycosis"],"a":1,"e":"Histoplasma is endemic in the Ohio and Mississippi river valleys."},{"id":"B12.19","c":12,"q":"A traveler from the American Southwest has fever, erythema nodosum, and a lung nodule. Which fungus is likely?","o":["Histoplasma","Candida","Blastomyces","Pneumocystis","Coccidioides"],"a":4,"e":"Coccidioidomycosis is endemic in the Southwest."},{"id":"B12.20","c":12,"q":"A patient with a cavity from old tuberculosis has hemoptysis and a ball within the cavity on CT. The diagnosis is:","o":["Carcinoma","Hydatid cyst","Aspergilloma","Lung abscess","Pulmonary infarct"],"a":2,"e":"A fungus ball in a pre-existing cavity is an aspergilloma."},{"id":"B12.21","c":12,"q":"A patient with asthma has recurrent infiltrates, central bronchiectasis, a total IgE over 1,000 IU/mL, and positive Aspergillus-specific IgE. The diagnosis is:","o":["Sarcoidosis","Invasive aspergillosis","Pulmonary embolism","Cystic fibrosis only","Allergic bronchopulmonary aspergillosis"],"a":4,"e":"The combination of asthma, high IgE, and central bronchiectasis fits the disease."},{"id":"B12.22","c":12,"q":"A neutropenic patient has fever and new nodules with a halo sign on CT. The most likely organism is:","o":["Streptococcus pneumoniae","Aspergillus","Mycoplasma","Rhinovirus","Legionella"],"a":1,"e":"The halo sign suggests invasive aspergillosis in neutropenia."},{"id":"B12.23","c":12,"q":"A person with advanced HIV has headache and a positive cryptococcal antigen. The appropriate next test is:","o":["Spirometry","Bone scan","Nothing","Lumbar puncture","Chest radiograph only"],"a":3,"e":"Evaluate for meningitis when the antigen is positive."},{"id":"B12.24","c":12,"q":"A single positive Mycobacterium avium complex culture in an asymptomatic patient with a normal radiograph usually represents:","o":["Disease needing treatment","Cancer","Tuberculosis","Sarcoidosis","Colonization or contamination"],"a":4,"e":"Diagnosis requires symptoms, imaging, and repeated positive microbiology."},{"id":"B12.25","c":12,"q":"Which test best detects rifampin resistance rapidly from sputum?","o":["Skin test","Chest radiograph","Culture alone","Smear alone","A molecular test (such as Xpert MTB/RIF)"],"a":4,"e":"Molecular tests detect resistance within hours."},{"id":"B12.26","c":12,"q":"A patient receives standard tuberculosis therapy and symptoms have not improved by 2 months. What should be evaluated?","o":["Nothing","Cataracts","Sleep apnea","Nonadherence, malabsorption, resistance, or immune reconstitution","Pregnancy only"],"a":3,"e":"Nonresponse prompts a review of these causes."},{"id":"B12.27","c":12,"q":"Active tuberculosis must be reported to:","o":["The neighbors","No one","The airline","The public health authority","Only the employer"],"a":3,"e":"Notification is required and supports contact investigation."},{"id":"B20.1","c":20,"q":"A 170 cm man with ARDS is ventilated. Using the ARDSNet formula, his predicted body weight is closest to:","o":["100 kg","66 kg","50 kg","85 kg","120 kg"],"a":1,"e":"For a man, 50 + 0.91 (height in cm minus 152.4) is about 66 kg."},{"id":"B20.2","c":20,"q":"For the same patient, a tidal volume of 6 mL/kg predicted body weight equals about:","o":["1,200 mL","800 mL","400 mL","1,000 mL","200 mL"],"a":2,"e":"Six times 66 is about 396 mL."},{"id":"B20.3","c":20,"q":"The 2024 ATS guideline for ARDS suggests a tidal volume range of:","o":["15 to 20 mL/kg","12 to 15 mL/kg","No specific range","10 to 12 mL/kg","4 to 8 mL/kg predicted body weight"],"a":4,"e":"Lower tidal volumes protect the lung."},{"id":"B20.4","c":20,"q":"A patient with ARDS has a plateau pressure of 34 cm H2O. The best action is to:","o":["Remove PEEP","Stop monitoring","Increase respiratory rate with larger volumes","Reduce tidal volume","Increase tidal volume"],"a":3,"e":"Plateau pressure should be kept below 30 cm H2O."},{"id":"B20.5","c":20,"q":"A patient with moderate to severe ARDS has a PaO2/FiO2 ratio of 90 on optimal ventilator settings. Which therapy has mortality benefit?","o":["Inhaled nitric oxide","High-frequency oscillation","Prone positioning for more than 12 hours daily","Routine steroids at any dose","High tidal volume"],"a":2,"e":"Prone positioning is supported for severe ARDS for prolonged daily periods."},{"id":"B20.6","c":20,"q":"A mechanically ventilated patient suddenly desaturates, with high peak and plateau pressures and absent breath sounds on the left. The most likely cause is:","o":["Mucus plug in the endotracheal tube","Circuit disconnection","Pneumothorax","Sedation","Auto-PEEP"],"a":2,"e":"Absent breath sounds with high pressures suggest tension pneumothorax."},{"id":"B20.7","c":20,"q":"A ventilated patient desaturates, peak pressure rises, but plateau pressure is unchanged. This pattern suggests:","o":["Disconnection","Increased airway resistance (such as a plug or bronchospasm)","Hypovolemia","Pneumothorax","Reduced compliance"],"a":1,"e":"A wide peak-to-plateau gap marks resistance rather than compliance."},{"id":"B20.8","c":20,"q":"A ventilated asthmatic has expiratory flow that does not reach zero before the next breath, and hypotension. The best first step is to:","o":["Disconnect briefly and allow exhalation, then lower rate and prolong expiration","Extubate","Give more fluids only","Raise the respiratory rate","Increase PEEP markedly"],"a":0,"e":"Breath stacking causes auto-PEEP and can cause hemodynamic collapse."},{"id":"B20.9","c":20,"q":"What does DOPE stand for in ventilator troubleshooting?","o":["Dyspnea, obstruction, pH, effusion","Delirium, opioids, pain, emboli","Disconnection, oxygen, PEEP, edema","Displacement, obstruction, pneumothorax, equipment failure","Drugs, oxygen, pressure, extubation"],"a":3,"e":"It is a mnemonic for sudden deterioration on the ventilator."},{"id":"B20.10","c":20,"q":"In a patient with a persistent poor oxygenation, what usually improves oxygenation first in ARDS?","o":["Sedative overdose","Large tidal volumes","Lower FiO2 to 0.21","Diuretics that cause hypotension","Higher PEEP with careful monitoring, and prone positioning"],"a":4,"e":"PEEP and positioning recruit lung and improve gas exchange."},{"id":"B20.11","c":20,"q":"A ventilated COPD patient has high PaCO2 and pH 7.15. The most effective adjustment is:","o":["Decrease the respiratory rate","Decrease the tidal volume markedly","Increase minute ventilation while allowing enough expiratory time","Give bicarbonate only","Increase FiO2 only"],"a":2,"e":"Adjust rate and tidal volume while avoiding auto-PEEP."},{"id":"B20.12","c":20,"q":"A ventilated patient is dyssynchronous with double triggering. A likely cause is:","o":["Overly long expiratory time","Low FiO2","Inspiratory time shorter than the patient's neural inspiratory time","High PEEP only","Cuff leak only"],"a":2,"e":"Breath stacking from double triggering occurs when the set breath is too short."},{"id":"B20.13","c":20,"q":"Which finding best identifies auto-PEEP on the ventilator?","o":["Low peak pressure","Rising SpO2","Wide pulse pressure","Expiratory flow not returning to baseline before the next breath","High tidal volume exhaled"],"a":3,"e":"Flow waveform failing to reach zero shows incomplete exhalation."},{"id":"B20.14","c":20,"q":"A patient with ARDS has hypotension after PEEP is raised. The likely mechanism is:","o":["Pneumothorax only","Hypovolemia from diuresis only","Anaphylaxis","Improved cardiac output","Reduced venous return and right ventricular afterload effects"],"a":4,"e":"Higher intrathoracic pressure lowers preload."},{"id":"B20.15","c":20,"q":"What is the definition used for ARDS severity in the Berlin classification based on?","o":["Chest radiograph alone","Serum albumin","Age","PaO2/FiO2 ratio with PEEP of at least 5 cm H2O","Lactate"],"a":3,"e":"Oxygenation ratio at a minimum PEEP defines mild, moderate, and severe."},{"id":"B20.16","c":20,"q":"A patient with ARDS from sepsis is receiving a neuromuscular blocker. What must accompany it?","o":["Deep sedation and monitoring for weakness risk","Steroid omission","Early extubation","No monitoring","No sedation"],"a":0,"e":"Paralysis without sedation is unacceptable; use the shortest course."},{"id":"B20.17","c":20,"q":"Extracorporeal membrane oxygenation is considered in ARDS when:","o":["The patient is awake and comfortable","Mild hypoxemia","The patient has an intact lung","Severe refractory hypoxemia persists despite optimal ventilation and prone positioning","First-line at admission"],"a":3,"e":"It is reserved for severe refractory cases at experienced centers."},{"id":"B20.18","c":20,"q":"A ventilated patient is ready for a spontaneous breathing trial when:","o":["FiO2 is 1.0","pH is 7.0","Oxygenation is adequate on low PEEP, hemodynamics are stable, and the cause of failure is improving","The patient is paralyzed","Vasopressors are rising"],"a":2,"e":"Readiness depends on oxygenation, stability, and recovery."},{"id":"B20.19","c":20,"q":"Which airway pressure reflects alveolar distension best?","o":["Plateau pressure","Peak inspiratory pressure","Mean airway pressure","Expiratory pressure only","Oral pressure"],"a":0,"e":"Plateau pressure is measured during an inspiratory hold."},{"id":"B20.20","c":20,"q":"A patient with ARDS has a driving pressure of 20 cm H2O. Compared with a driving pressure of 12, this is associated with:","o":["Shorter ICU stay","Lower mortality","Higher mortality","No difference","Better compliance"],"a":2,"e":"Driving pressure (plateau minus PEEP) correlates with outcome."},{"id":"B20.21","c":20,"q":"A patient on pressure support ventilation has a tidal volume of 900 mL and tachypnea due to pain and agitation. The first step is to:","o":["Switch to paralysis","Disconnect","Sedate heavily at once","Increase pressure support","Assess for pain, anxiety, and ventilator settings before sedating"],"a":4,"e":"Treat underlying causes of distress before escalating sedation."},{"id":"B20.22","c":20,"q":"Which complication is most characteristic of prolonged high FiO2?","o":["Absorption atelectasis and oxygen toxicity","Hypoglycemia","Hypertension","Polycythemia","Hypercapnia from steroids"],"a":0,"e":"High oxygen fractions can cause atelectasis and toxicity."},{"id":"B21.1","c":21,"q":"A 68-year-old woman has fever, hypotension of 80/40 mm Hg despite fluids, and lactate of 4.5 mmol/L. When should antimicrobials ideally be given?","o":["After cultures return","Within 6 hours","After vasopressors are weaned","Within 1 hour","Within 24 hours"],"a":3,"e":"Septic shock calls for antimicrobials ideally within 1 hour."},{"id":"B21.2","c":21,"q":"A patient has a fever and a mild rise in respiratory rate. The team is unsure whether this is sepsis, and she has no shock. The 2026 guideline suggests:","o":["No treatment","Immediate intubation","Immediate vasopressors","A time-limited investigation, with antimicrobials within 3 hours if concern persists","Antimicrobials in 24 hours"],"a":3,"e":"Possible sepsis without shock gets a time-limited investigation."},{"id":"B21.3","c":21,"q":"In septic shock, the guideline suggests an initial crystalloid volume of at least:","o":["5 mL/kg","None","30 mL/kg within the first 3 hours","100 mL/kg","1 mL/kg"],"a":2,"e":"The suggestion rests on low-certainty evidence."},{"id":"B21.4","c":21,"q":"The suggested initial mean arterial pressure target in septic shock is:","o":["65 mm Hg","95 mm Hg","85 mm Hg","45 mm Hg","110 mm Hg"],"a":0,"e":"The target is 65 mm Hg."},{"id":"B21.5","c":21,"q":"A patient in shock has a cold, clammy appearance, pulmonary crackles, a distended jugular vein, and a low cardiac output on echocardiography. The shock type is:","o":["Cardiogenic","Neurogenic","Obstructive from tamponade only","Hypovolemic","Distributive"],"a":0,"e":"Low output with congestion fits cardiogenic shock."},{"id":"B21.6","c":21,"q":"A trauma patient has hypotension, flat neck veins, and tachycardia. The shock type is:","o":["Cardiogenic","Distributive","Obstructive","Hypovolemic","Neurogenic"],"a":3,"e":"Low preload with collapsed veins marks hypovolemia."},{"id":"B21.7","c":21,"q":"A patient with hypotension, distended neck veins, muffled heart sounds, and a large pericardial effusion needs:","o":["Pericardial drainage","Diuretic","Large fluid boluses only","Beta-blocker","Thrombolysis"],"a":0,"e":"Tamponade is obstructive shock and needs drainage."},{"id":"B21.8","c":21,"q":"Which first-line vasopressor is typically used in septic shock?","o":["Norepinephrine","Dobutamine alone","Phenylephrine as first choice","Vasopressin as sole initial agent","Dopamine as first choice"],"a":0,"e":"Norepinephrine is the usual first vasopressor."},{"id":"B21.9","c":21,"q":"A patient on high-dose norepinephrine still has hypotension. A common additional step is:","o":["Give a large dose of beta-blocker","Remove the arterial line","Stop vasopressors","Start sedatives only","Add vasopressin"],"a":4,"e":"Adding a second agent reduces catecholamine dose."},{"id":"B21.10","c":21,"q":"In undifferentiated shock, which bedside ultrasound finding suggests hypovolemia?","o":["Diffuse B-lines","Small, collapsing inferior vena cava and hyperdynamic ventricle","Large pericardial effusion","Dilated right ventricle with septal shift","Pneumothorax"],"a":1,"e":"Underfilled heart and a small inferior vena cava point to volume loss."},{"id":"B21.11","c":21,"q":"A hypotensive patient has a dilated right ventricle, a D-shaped septum, and a clot in the leg veins. The diagnosis is:","o":["Cardiogenic shock from left infarct","Septic shock only","Obstructive shock from pulmonary embolism","Hypovolemic shock","Anaphylaxis"],"a":2,"e":"Right ventricular strain with venous thrombus fits massive embolism."},{"id":"B21.12","c":21,"q":"After anaphylaxis, the first-line drug is:","o":["Intramuscular epinephrine","Steroid alone","Antihistamine alone","Oral antihistamine","Intravenous vasopressin alone"],"a":0,"e":"Epinephrine is the first-line treatment."},{"id":"B21.13","c":21,"q":"A patient with septic shock remains hypotensive on norepinephrine and vasopressin. The team considers corticosteroids. The best statement is:","o":["Steroids are required for all patients","Use is considered in refractory septic shock, with the dose taken from the current guideline","Steroids are always contraindicated","Use only before antibiotics","They replace vasopressors"],"a":1,"e":"Hydrocortisone is considered in refractory septic shock; confirm the dose in the current guideline or product label."},{"id":"B21.14","c":21,"q":"A patient with septic shock has a rising lactate despite therapy. Which step is most useful?","o":["Stop monitoring","Remove antibiotics","Search for undrained source of infection and reassess perfusion","Give only oral fluids","Wait 24 hours"],"a":2,"e":"Source control is a key early priority."},{"id":"B25.1","c":25,"q":"A clinic wants to improve inhaler technique checks. A small test with 10 patients in one week, followed by review and adjustment, is an example of:","o":["A plan-do-study-act cycle","A randomized trial","A case-control study","A registry","A meta-analysis"],"a":0,"e":"Small cycles of change are the core of quality improvement."},{"id":"B25.2","c":25,"q":"A diagnostic test has sensitivity 90% and specificity 90%. In a population where disease prevalence is 1%, a positive result is most likely:","o":["Always correct","A true positive","A negative","Uninterpretable","A false positive"],"a":4,"e":"At low prevalence, most positives are false positives (positive predictive value is about 8%)."},{"id":"B25.3","c":25,"q":"As prevalence of a disease rises, with fixed sensitivity and specificity, the positive predictive value:","o":["Falls","Equals the sensitivity","Rises","Stays the same","Equals the specificity"],"a":2,"e":"Predictive values depend on prevalence."},{"id":"B25.4","c":25,"q":"A trial reports a relative risk reduction of 50% for an event that occurs in 2% of control patients. The absolute risk reduction is:","o":["50%","2%","25%","0.5%","1%"],"a":4,"e":"Half of 2% is 1%."},{"id":"B25.5","c":25,"q":"For the same trial, the number needed to treat is:","o":["2","50","100","1,000","10"],"a":2,"e":"Number needed to treat equals 1 divided by 0.01."},{"id":"B25.6","c":25,"q":"A study of ventilation outcomes compares patients who chose a treatment with those who did not, and the groups differ in severity. The main concern is:","o":["Confounding by indication","Allocation concealment","Blinding","Attrition only","Perfect randomization"],"a":0,"e":"Patients who receive a treatment may differ in ways that affect outcome."},{"id":"B25.7","c":25,"q":"Patients enrolled in a screening program appear to live longer from diagnosis, but total mortality is unchanged. This is:","o":["Lead-time bias","Observer bias","Selection bias","Publication bias","Recall bias"],"a":0,"e":"Earlier detection lengthens apparent survival without changing the death date."},{"id":"B25.8","c":25,"q":"A hospital reports that a ventilator-associated event bundle reduced rates only in units that adopted it first. Which design problem limits the conclusion?","o":["Lack of a concurrent control","Blinding","Too large a sample","Intention to treat","Randomization"],"a":0,"e":"Without a control, secular trends can explain changes."},{"id":"B25.9","c":25,"q":"In a root-cause analysis of a wrong-site chest drain, the best focus is:","o":["Ignoring the event","System factors and process failures","Blame of the individual","Removing documentation","Changing the schedule only"],"a":1,"e":"Safety science emphasizes systems."},{"id":"B25.10","c":25,"q":"A patient with decision-making capacity refuses intubation. The correct response is to:","o":["Sedate and proceed","Respect the refusal after ensuring understanding","Intubate anyway","Discharge without discussion","Seek a court order immediately"],"a":1,"e":"Capable patients may refuse treatment."},{"id":"B25.11","c":25,"q":"An unconscious patient with no advance directive has a surrogate. The surrogate should use:","o":["A coin flip","Substituted judgment based on the patient's known values","The physician's preferences","Their own preferences","The hospital's convenience"],"a":1,"e":"Surrogates represent what the patient would choose."},{"id":"B25.12","c":25,"q":"Withholding and withdrawing life-sustaining therapy are, ethically:","o":["Never discussed","Considered equivalent when the patient would not want the therapy","Required for all patients","Always illegal","Always different"],"a":1,"e":"Most ethical frameworks treat them as equivalent."},{"id":"B25.13","c":25,"q":"During a pandemic surge, allocation of scarce ventilators should be based on:","o":["First come, first served only","Staff preference","Race","Transparent criteria applied fairly, without regard to disability or social status","Wealth"],"a":3,"e":"Triage rules should be fair, public, and consistent."},{"id":"B25.14","c":25,"q":"A new journal article reports a surprising benefit in a small single-center trial. The best response is to:","o":["Assume it is wrong","Change practice immediately","Cite it as proof","Ignore all trials","Appraise the design, bias, and precision, and wait for confirmation"],"a":4,"e":"Small trials need replication."},{"id":"B25.15","c":25,"q":"A confidence interval for a relative risk of 0.8 is 0.6 to 1.1. The result is:","o":["Impossible","Proof of harm","Significant","Proof of benefit","Not statistically significant at the 5% level"],"a":4,"e":"The interval includes 1."},{"id":"B25.16","c":25,"q":"A noninferiority trial reports a margin. The key question is:","o":["Whether the drug is new","Whether it is blinded only","Whether the interval excludes harm larger than the margin","Whether the sample is large","Whether the margin is zero"],"a":2,"e":"Noninferiority is judged against a prespecified margin."},{"id":"B25.17","c":25,"q":"A quality metric shows that 60% of eligible patients receive a bundle element. The best next step is to:","o":["Punish clinicians","Wait","Remove the metric","Report only the best unit","Identify barriers and test fixes with small cycles"],"a":4,"e":"Quality work moves from measure to change."},{"id":"B25.18","c":25,"q":"After an adverse event, disclosure to the patient should be:","o":["Given only to the family","Delayed for a year","Prompt, honest, and with an apology and plan","Avoided","Delegated to the lawyer"],"a":2,"e":"Open disclosure is an ethical and professional expectation."},{"id":"B25.19","c":25,"q":"A physician wants to start a research-like practice change. Before proceeding, the proper step is:","o":["Publish first","Ask the patient to waive rights","Proceed without review","Check whether it is quality improvement or research needing ethics review","Do nothing"],"a":3,"e":"Institutions distinguish the two, and research requires oversight."},{"id":"B25.20","c":25,"q":"A patient with a respiratory virus is admitted. Which infection prevention measure most reduces spread?","o":["No masks","Appropriate isolation precautions and hand hygiene","Shared equipment","Open windows only","Visitors without limits"],"a":1,"e":"Transmission-based precautions limit spread."},{"id":"B25.21","c":25,"q":"During an outbreak, clear communication should:","o":["Wait until all data are final","Use jargon only","Hide uncertainty","Avoid the public","Be timely, consistent, and based on the best available evidence, with uncertainty acknowledged"],"a":4,"e":"Trust depends on honesty about what is unknown."},{"id":"B25.22","c":25,"q":"A trial analyzes patients by the group they were assigned to, regardless of what they received. This is:","o":["Intention-to-treat analysis","Post hoc analysis","Per-protocol analysis","As-treated analysis","Subgroup analysis"],"a":0,"e":"It preserves randomization."},{"id":"B25.23","c":25,"q":"A study tests 20 subgroups and finds one significant result. The most likely explanation is:","o":["A true effect","Large sample","Chance from multiple comparisons","Blinding","Perfect design"],"a":2,"e":"Multiple testing inflates false positives."},{"id":"B25.24","c":25,"q":"A hospital finds that a checklist improved safety in one center. Before wide adoption, the team should:","o":["Stop measuring","Ignore context","Consider context and test in the local setting","Mandate without training","Assume identical effect"],"a":2,"e":"Implementation depends on context."},{"id":"B25.25","c":25,"q":"A patient asks for a treatment with no benefit but small harm. The best approach is:","o":["Provide it without comment","Ignore the request","Discharge","Refuse to speak","Explain risks and benefits and recommend against it"],"a":4,"e":"Shared decisions include honest recommendations."},{"id":"B25.26","c":25,"q":"Which measure best captures the harm of an intervention?","o":["Sensitivity","R-squared","Number needed to harm","Kappa","Specificity"],"a":2,"e":"It is the harm counterpart of number needed to treat."},{"id":"B25.27","c":25,"q":"The strongest design for testing a new therapy is usually:","o":["An expert opinion","A well-conducted randomized controlled trial","A case report","A case series","A cross-sectional survey"],"a":1,"e":"Randomization balances known and unknown confounders."},{"id":"B25.28","c":25,"q":"A study finds that coffee drinkers have more lung cancer, but smoking is more common among them. This is an example of:","o":["Confounding","Random error","Effect modification","Measurement error only","Selection bias only"],"a":0,"e":"Smoking is a confounder."},{"id":"B25.29","c":25,"q":"Which statement about p values is correct?","o":["It proves causation","A p value is not the probability that the hypothesis is true","It equals the confidence interval","It measures clinical importance","It measures effect size"],"a":1,"e":"It is the probability of data this extreme if the null were true."},{"id":"B25.30","c":25,"q":"A pulmonary group introduces a new asthma action plan. To measure success, the best outcome measure is:","o":["Brochure design","Number of meetings","Staff opinion only","Emergency visits or hospitalizations over time","Number of handouts printed"],"a":3,"e":"Outcome measures reflect patient benefit."},{"id":"B25.31","c":25,"q":"Moral distress among clinicians is best addressed by:","o":["Dismissal","Open discussion, support, and process improvement","Blame","Overtime","Silence"],"a":1,"e":"Teams need structured support."},{"id":"B25.32","c":25,"q":"A hospital is planning for a respiratory surge. Which preparation matters most?","o":["Closing wards without a plan","Surge capacity plans, supplies, staffing, and triage protocols","Ignoring forecasts","Removing masks","Reducing staff"],"a":1,"e":"Planning before a surge is essential."},{"id":"B25.33","c":25,"q":"A clinician reports a near-miss in a safe reporting system. The system should respond with:","o":["Discipline of the reporter","Learning and system fixes in a nonpunitive culture","Public naming","Removal of the report","No action"],"a":1,"e":"Reporting thrives when it is safe."},{"id":"B25.34","c":25,"q":"A screening test for lung disease is considered. Which criterion supports screening?","o":["The disease is rare and harmless","The test is expensive and unreliable","The disease has no preclinical phase","No treatment is available","Effective treatment exists for early disease"],"a":4,"e":"Screening needs a detectable phase and a treatment that improves outcomes."},{"id":"B25.35","c":25,"q":"A discharge summary omits the plan for follow-up imaging of a lung nodule. This is an example of:","o":["An unrelated event","A perfect process","A diagnostic test","A handoff failure","A new disease"],"a":3,"e":"Communication gaps cause missed follow-up."},{"id":"B25.36","c":25,"q":"Informed consent for a bronchoscopy should include:","o":["Only a signature","Only benefits","No discussion","Alternatives hidden","Purpose, risks, benefits, alternatives, and the right to refuse"],"a":4,"e":"Consent is a process, not a form."},{"id":"B25.37","c":25,"q":"A hospital reviews diagnostic errors. The commonest root is:","o":["Patient fault","Poor handwriting alone","Weather","Equipment color","Cognitive and system factors, such as anchoring and incomplete information"],"a":4,"e":"Diagnostic error arises from both thinking and systems."},{"id":"B25.38","c":25,"q":"A guideline recommendation is labeled strong with low certainty of evidence. The best interpretation is:","o":["The evidence is high quality","The panel judged benefits to clearly outweigh harms despite limited evidence","The panel was divided","The recommendation is optional","The evidence is irrelevant"],"a":1,"e":"Strength and certainty are separate judgments."},{"id":"B19.1","c":19,"q":"A 65-year-old man with COPD is admitted with an exacerbation, pH 7.28, PaCO2 70 mm Hg, and he is alert and cooperative. The best next step is:","o":["Immediate intubation","Observation only","High-flow oxygen at an FiO2 of 1.0","Sedation","Noninvasive ventilation"],"a":4,"e":"Acute hypercapnic acidosis in COPD is the strongest indication for noninvasive ventilation."},{"id":"B19.2","c":19,"q":"An hour after starting noninvasive ventilation, the same patient has pH 7.20, rising PaCO2, and drowsiness. The best next step is:","o":["Prepare for intubation","Continue the same settings for 24 hours","Switch to room air","Add sedatives","Remove monitoring"],"a":0,"e":"Worsening acidosis or mental status after a trial means failure."},{"id":"B19.3","c":19,"q":"Which patient is least suitable for a trial of noninvasive ventilation?","o":["A patient with vomiting, a depressed level of consciousness, and inability to protect the airway","A patient with obesity hypoventilation","A patient with a COPD exacerbation","A patient with cardiogenic pulmonary edema","A patient with immunocompromise and pneumonia who is awake"],"a":0,"e":"Inability to protect the airway is a contraindication."},{"id":"B19.4","c":19,"q":"A patient with acute cardiogenic pulmonary edema is breathless, with oxygen saturation of 84%. Which noninvasive therapy improves oxygenation and reduces intubation?","o":["Beta-agonists","Fluids","Oxygen by simple mask alone","Opioids","Continuous or bilevel positive airway pressure"],"a":4,"e":"Positive pressure reduces preload and work of breathing."},{"id":"B19.5","c":19,"q":"A patient with acute hypoxemic respiratory failure from pneumonia has a respiratory rate of 34 on a non-rebreather mask at 15 L/min. Which device offers heated, humidified flow with some positive pressure?","o":["Simple mask","Room air","Nasal cannula at 2 L/min","High-flow nasal oxygen","Venturi mask at 24%"],"a":3,"e":"High-flow nasal oxygen improves comfort and oxygenation in hypoxemic failure."},{"id":"B19.6","c":19,"q":"A patient on high-flow nasal oxygen has a persistently rising respiratory rate and thoraco-abdominal paradox. The team should:","o":["Add a sedative","Wait 24 hours","Stop oxygen","Increase the flow only","Intubate without delay"],"a":4,"e":"Persistent distress signals failure; delay increases risk."},{"id":"B19.7","c":19,"q":"A COPD patient is prescribed oxygen after an exacerbation. A typical saturation target for patients at risk of hypercapnia is:","o":["70 to 75%","Any value","100%","80%","88 to 92%"],"a":4,"e":"Controlled oxygen avoids worsening hypercapnia."},{"id":"B19.8","c":19,"q":"A young healthy patient with pneumonia but no hypercapnia risk usually has an oxygen saturation target of:","o":["70%","80%","No target","100% always","94 to 98%"],"a":4,"e":"The usual target range is 94 to 98% without hypercapnia risk (confirm the range in the guideline used)."},{"id":"B19.9","c":19,"q":"A patient with carbon monoxide poisoning has a normal pulse oximeter reading. The correct treatment includes:","o":["High-concentration oxygen guided by carboxyhemoglobin","Low-flow oxygen only","Room air","Bicarbonate","Fluids only"],"a":0,"e":"Oxygen shortens the half-life of carboxyhemoglobin."},{"id":"B19.10","c":19,"q":"Which finding distinguishes type 2 from type 1 respiratory failure?","o":["Elevated PaCO2 with respiratory acidosis","High hematocrit","Low hemoglobin","Low PaO2 with normal PaCO2","Low PaCO2"],"a":0,"e":"Type 2 failure is ventilatory with hypercapnia."},{"id":"B19.11","c":19,"q":"A patient on noninvasive ventilation has a large mask leak and aerophagia. The best adjustment is:","o":["Stop treatment","Use a smaller mask without testing","Add sedation","Refit the mask and check settings","Increase the pressure indefinitely"],"a":3,"e":"Interface problems are the commonest cause of failure."},{"id":"B19.12","c":19,"q":"An obese patient with obesity hypoventilation is admitted with pH 7.25. The first-line therapy is:","o":["Diuretics","Sedation","Noninvasive ventilation","Steroids","Oxygen alone"],"a":2,"e":"Positive pressure treats hypoventilation."},{"id":"B19.13","c":19,"q":"A patient with an acute asthma exacerbation shows a rising PaCO2 and fatigue. The team should:","o":["Give sedatives","Reassure","Stop bronchodilators","Discharge","Prepare for intubation in a monitored setting"],"a":4,"e":"Rising carbon dioxide in asthma signals exhaustion."},{"id":"B19.14","c":19,"q":"The alveolar-arterial gradient is increased in which cause of hypoxemia?","o":["Opioid overdose","Pure hypoventilation","Low inspired oxygen","Ventilation-perfusion mismatch","High altitude"],"a":3,"e":"Intrapulmonary causes widen the gradient."},{"id":"B19.15","c":19,"q":"A patient needs oxygen titration and wants to go home. The ambulatory oxygen criterion for chronic hypoxemic COPD includes:","o":["A resting PaO2 of 55 mm Hg or less, or saturation of 88% or less","A saturation of 99%","A PaO2 of 90 mm Hg","Normal gas exchange","Any cough"],"a":0,"e":"Long-term oxygen is given for persistent resting hypoxemia (confirm thresholds in the guideline)."},{"id":"B19.16","c":19,"q":"A patient on high-flow nasal oxygen with a ROX index below 3 after several hours is most likely to:","o":["Be discharged","Need sedatives","Fail and need intubation","Improve spontaneously","Need no further care"],"a":2,"e":"The ROX index (saturation divided by FiO2 over respiratory rate) predicts failure."},{"id":"B19.17","c":19,"q":"Noninvasive ventilation in a patient with COPD should be reassessed within:","o":["1 month","1 week","3 days","Never","1 to 2 hours"],"a":4,"e":"Early gas and clinical reassessment determines success."},{"id":"B19.18","c":19,"q":"Which complication is most common with noninvasive ventilation?","o":["Gastrointestinal bleeding","Pneumonia in all patients","Seizure","Skin breakdown over the nasal bridge","Hearing loss"],"a":3,"e":"Pressure injury from the mask is common."},{"id":"B19.19","c":19,"q":"An immunocompromised patient has acute hypoxemic respiratory failure. A reason to prefer high-flow nasal oxygen or a helmet over early intubation is:","o":["Avoiding intubation complications, with close monitoring","No monitoring needed","They need no oxygen","Noninvasive support is always inferior","Intubation is harmless"],"a":0,"e":"Avoiding intubation can reduce complications if failure is recognized early."},{"id":"B19.20","c":19,"q":"Hyperoxia in critically ill patients is:","o":["Always beneficial","Potentially harmful, so target the lowest adequate oxygen","Safer than hypoxemia","Required","Without effect"],"a":1,"e":"Titrate oxygen to a target."},{"id":"B19.21","c":19,"q":"A patient has respiratory failure from neuromuscular disease and a forced vital capacity that is falling on serial measurements. The next step is:","o":["Closer monitoring and consideration of ventilatory support","Discharge","Reassurance","Stop measurements","Steroids alone"],"a":0,"e":"A falling vital capacity warns of impending failure."},{"id":"B19.22","c":19,"q":"What is the purpose of the P/F ratio in practice?","o":["To measure cardiac output","To measure ventilation","To measure acid-base status","To measure pH","To grade the severity of hypoxemia"],"a":4,"e":"The ratio of PaO2 to FiO2 gauges oxygenation."},{"id":"B22.1","c":22,"q":"A ventilated patient is deeply sedated and cannot be assessed. The ICU liberation bundle recommends:","o":["No sedation ever","Sedation until extubation","Continuous deep sedation for all","Light sedation targets and daily review of the need for sedation","Paralysis for all"],"a":3,"e":"Light sedation improves outcomes."},{"id":"B22.2","c":22,"q":"In the ABCDEF bundle, the letter \"A\" refers to:","o":["Antibiotics","Assess, prevent, and manage pain","Airway","Alkalinization","Albumin"],"a":1,"e":"The bundle starts with pain assessment and management."},{"id":"B22.3","c":22,"q":"The letter \"B\" in the ABCDEF bundle stands for:","o":["Both spontaneous awakening and spontaneous breathing trials","Beta-blockers","Bicarbonate","Bronchoscopy","Blood pressure"],"a":0,"e":"Daily awakening and breathing trials are paired."},{"id":"B22.4","c":22,"q":"The letter \"D\" in the bundle refers to:","o":["Dialysis","Diuretics","Dopamine","Diet","Delirium assessment, prevention, and management"],"a":4,"e":"Delirium is screened every shift."},{"id":"B22.5","c":22,"q":"Which intervention reduces delirium and weakness in ICU survivors?","o":["Isolation","Early mobility","Prolonged bed rest","Deep sedation","Restraints"],"a":1,"e":"Early mobility is part of the bundle."},{"id":"B22.6","c":22,"q":"A patient passes a spontaneous breathing trial. The next assessment before extubation is:","o":["A tracheostomy always","Airway protection, cough, secretions, and mental status","A chest radiograph in every case","A sedative infusion","Nothing"],"a":1,"e":"Passing a trial does not guarantee airway readiness."},{"id":"B22.7","c":22,"q":"A patient fails extubation after 12 hours due to stridor. Which pre-extubation test may have predicted the risk?","o":["A urine test","A bone scan","A cuff-leak test","A chest radiograph","An ECG"],"a":2,"e":"Absence of a cuff leak raises the risk of postextubation stridor."},{"id":"B22.8","c":22,"q":"A ventilated patient has fever, new purulent secretions, and a new infiltrate after 4 days. The likely diagnosis is:","o":["Pulmonary embolism","Ventilator-associated pneumonia","Pneumothorax","Atelectasis only","Asthma"],"a":1,"e":"Clinical and radiographic features support it."},{"id":"B22.9","c":22,"q":"A patient on mechanical ventilation has been immobile for 3 weeks and has limb weakness with preserved cranial nerves. The likely diagnosis is:","o":["Guillain-Barre syndrome only","ICU-acquired weakness","Stroke","Myasthenia gravis","Spinal tumor"],"a":1,"e":"Critical illness polyneuropathy or myopathy follows prolonged illness and immobility."},{"id":"B22.10","c":22,"q":"Which risk factor most increases delirium in the ICU?","o":["Light sedation","Early mobility","Benzodiazepine sedation","Family presence","Daylight"],"a":2,"e":"Benzodiazepines raise the risk of delirium."},{"id":"B22.11","c":22,"q":"A family member asks about cognitive and psychological problems after ICU. The term for this cluster is:","o":["Delirium tremens","Shock","Post-intensive care syndrome","Acute respiratory distress syndrome","Sepsis"],"a":2,"e":"It includes physical, cognitive, and mental health impairments."},{"id":"B22.12","c":22,"q":"A patient receives a central venous catheter. Which measure reduces bloodstream infection?","o":["Skin preparation with water","Maximal barrier precautions and chlorhexidine skin preparation","Routine catheter changes","Femoral site always","Open dressing"],"a":1,"e":"The insertion bundle lowers infection."},{"id":"B22.13","c":22,"q":"Prophylaxis against stress-related gastrointestinal bleeding in ventilated patients is indicated for:","o":["Patients with risk factors such as coagulopathy or prolonged ventilation","All patients","Patients on room air","Outpatients","None"],"a":0,"e":"Prophylaxis is targeted at higher-risk patients."},{"id":"B22.14","c":22,"q":"A tracheostomy is considered when:","o":["Prolonged ventilation is expected","A short trial is planned","The patient is awake","Extubation is imminent","The patient is on room air"],"a":0,"e":"The timing and benefit are individualized."},{"id":"B22.15","c":22,"q":"The Richmond Agitation-Sedation Scale target for most ventilated patients is:","o":["Minus 5","Plus 4","Any score","0 to minus 1, calm to lightly drowsy","Minus 4"],"a":3,"e
