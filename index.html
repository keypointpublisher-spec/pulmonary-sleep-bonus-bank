 healthcare worker has a positive interferon-gamma release assay, normal chest radiograph, and no symptoms. The diagnosis is:","o":["Sarcoidosis","Latent tuberculosis infection","Miliary tuberculosis","Silicosis","Active pulmonary tuberculosis"],"a":1,"e":"A positive interferon-gamma release assay with a normal radiograph and no symptoms is latent tuberculosis infection, which needs treatment to prevent progression. Active disease would have symptoms or radiographic changes, and sarcoidosis, silicosis and miliary disease have other features.","t":"Positive IGRA with normal imaging and no symptoms = latent TB."},{"id":"B12.13","c":12,"q":"A patient before starting a tumor necrosis factor inhibitor has a positive tuberculosis test. What should happen?","o":["Give steroids","Start the biologic at once","Ignore the result","Repeat in 10 years","Rule out active disease and treat latent infection"],"a":4,"e":"A positive tuberculosis test before a tumor necrosis factor inhibitor requires ruling out active disease and treating latent infection first, since the biologic can reactivate it. Starting immediately, ignoring the result or giving steroids is unsafe.","t":"Treat latent TB before starting a TNF inhibitor."},{"id":"B12.14","c":12,"q":"A patient with bronchiectasis and nodular infiltrates has Mycobacterium avium complex in three sputum cultures. Which regimen structure does the guideline favor for macrolide-susceptible disease?","o":["At least three drugs including a macrolide and ethambutol","Ethambutol alone","Isoniazid alone","Macrolide alone","Fluoroquinolone alone"],"a":0,"e":"For macrolide-susceptible Mycobacterium avium complex lung disease with nodular bronchiectasis, the guideline favors at least three drugs including a macrolide and ethambutol (typically with a rifamycin). A single agent or fluoroquinolone alone leads to resistance.","t":"MAC: macrolide plus ethambutol plus a rifamycin."},{"id":"B12.15","c":12,"q":"Which macrolide is preferred for Mycobacterium avium complex pulmonary disease?","o":["Telithromycin","Erythromycin","Azithromycin","Roxithromycin","Fidaxomicin"],"a":2,"e":"The guideline suggests azithromycin over clarithromycin as the macrolide for Mycobacterium avium complex pulmonary disease. Erythromycin, telithromycin, roxithromycin and fidaxomicin are not preferred.","t":"Preferred macrolide for MAC: azithromycin."},{"id":"B12.16","c":12,"q":"A patient with Mycobacterium avium complex remains culture-positive after 6 months of guideline-based therapy. The next addition is:","o":["Steroids","Oral vancomycin","Amikacin liposome inhalation suspension","Isoniazid alone","Stopping all therapy"],"a":2,"e":"For Mycobacterium avium complex that stays culture-positive after 6 months of guideline-based therapy, add amikacin liposome inhalation suspension for refractory disease. Steroids, oral vancomycin, isoniazid alone or stopping therapy are not appropriate.","t":"Refractory MAC: add inhaled liposomal amikacin."},{"id":"B12.17","c":12,"q":"How long should Mycobacterium avium complex treatment continue?","o":["2 weeks","3 months total","1 month","At least 12 months after sputum cultures become negative","Until symptoms improve only"],"a":3,"e":"Treatment for Mycobacterium avium complex continues for at least 12 months after sputum cultures become negative. Two weeks, 1 month, 3 months or stopping when symptoms improve leads to relapse.","t":"MAC therapy: at least 12 months of negative cultures."},{"id":"B12.18","c":12,"q":"A man in the Ohio River Valley has fever, cough, and mediastinal adenopathy after cave exploration. The most likely fungal infection is:","o":["Cryptococcosis","Histoplasmosis","Coccidioidomycosis","Aspergillosis","Mucormycosis"],"a":1,"e":"Fever, cough and mediastinal adenopathy after cave exploration in the Ohio River Valley point to histoplasmosis, endemic in the Ohio and Mississippi river valleys and linked to bat or bird droppings. Coccidioidomycosis is Southwest, and cryptococcosis, aspergillosis and mucormycosis lack that exposure.","t":"Caves, bat droppings, Ohio-Mississippi valleys: histoplasmosis."},{"id":"B12.19","c":12,"q":"A traveler from the American Southwest has fever, erythema nodosum, and a lung nodule. Which fungus is likely?","o":["Histoplasma","Candida","Blastomyces","Pneumocystis","Coccidioides"],"a":4,"e":"Fever, erythema nodosum and a lung nodule in a traveler from the American Southwest suggest coccidioidomycosis, endemic there. Histoplasma, Blastomyces, Candida and Pneumocystis have other geography or hosts.","t":"American Southwest plus erythema nodosum: Coccidioides."},{"id":"B12.20","c":12,"q":"A patient with a cavity from old tuberculosis has hemoptysis and a ball within the cavity on CT. The diagnosis is:","o":["Carcinoma","Hydatid cyst","Aspergilloma","Lung abscess","Pulmonary infarct"],"a":2,"e":"A ball within a pre-existing cavity such as old tuberculosis, with hemoptysis, is an aspergilloma (fungus ball). Carcinoma, hydatid cyst, lung abscess and infarct do not give a mobile intracavitary ball.","t":"Intracavitary fungus ball with hemoptysis = aspergilloma."},{"id":"B12.21","c":12,"q":"A patient with asthma has recurrent infiltrates, central bronchiectasis, a total IgE over 1,000 IU/mL, and positive Aspergillus-specific IgE. The diagnosis is:","o":["Sarcoidosis","Invasive aspergillosis","Pulmonary embolism","Cystic fibrosis only","Allergic bronchopulmonary aspergillosis"],"a":4,"e":"Asthma with recurrent infiltrates, central bronchiectasis, total IgE over 1,000 IU/mL and positive Aspergillus-specific IgE is allergic bronchopulmonary aspergillosis. Invasive aspergillosis occurs in the immunocompromised, and sarcoidosis, embolism and cystic fibrosis alone do not fit.","t":"Asthma plus IgE above 1,000 plus central bronchiectasis = ABPA."},{"id":"B12.22","c":12,"q":"A neutropenic patient has fever and new nodules with a halo sign on CT. The most likely organism is:","o":["Streptococcus pneumoniae","Aspergillus","Mycoplasma","Rhinovirus","Legionella"],"a":1,"e":"A neutropenic patient with fever and nodules showing a halo sign on CT most likely has invasive Aspergillus infection. Streptococcus, Mycoplasma, rhinovirus and Legionella do not produce this sign.","t":"Neutropenia plus halo sign: invasive aspergillosis."},{"id":"B12.23","c":12,"q":"A person with advanced HIV has headache and a positive cryptococcal antigen. The appropriate next test is:","o":["Spirometry","Bone scan","Nothing","Lumbar puncture","Chest radiograph only"],"a":3,"e":"In advanced HIV with headache and a positive cryptococcal antigen, perform a lumbar puncture to evaluate for meningitis. Spirometry, bone scan, radiograph alone or doing nothing misses it.","t":"Positive cryptococcal antigen: lumbar puncture."},{"id":"B12.24","c":12,"q":"A single positive Mycobacterium avium complex culture in an asymptomatic patient with a normal radiograph usually represents:","o":["Disease needing treatment","Cancer","Tuberculosis","Sarcoidosis","Colonization or contamination"],"a":4,"e":"A single positive Mycobacterium avium complex culture in an asymptomatic patient with a normal radiograph usually represents colonization or contamination. Diagnosis needs symptoms, compatible imaging and repeated positive microbiology.","t":"MAC disease needs symptoms, imaging and repeated positive cultures."},{"id":"B12.25","c":12,"q":"Which test best detects rifampin resistance rapidly from sputum?","o":["Skin test","Chest radiograph","Culture alone","Smear alone","A molecular test (such as Xpert MTB/RIF)"],"a":4,"e":"A molecular test such as Xpert MTB/RIF detects Mycobacterium tuberculosis and rifampin resistance within hours. Skin tests, radiographs, smear alone or culture alone are slower and cannot show resistance quickly.","t":"Xpert MTB/RIF rapidly detects rifampin resistance."},{"id":"B12.26","c":12,"q":"A patient receives standard tuberculosis therapy and symptoms have not improved by 2 months. What should be evaluated?","o":["Nothing","Cataracts","Sleep apnea","Nonadherence, malabsorption, resistance, or immune reconstitution","Pregnancy only"],"a":3,"e":"Lack of improvement at 2 months on standard tuberculosis therapy should prompt a review of nonadherence, malabsorption, drug resistance and immune reconstitution. Cataracts, sleep apnea or pregnancy alone are not causes.","t":"TB nonresponse: check adherence, absorption, resistance, IRIS."},{"id":"B12.27","c":12,"q":"Active tuberculosis must be reported to:","o":["The neighbors","No one","The airline","The public health authority","Only the employer"],"a":3,"e":"Active tuberculosis must be reported to the public health authority, which supports contact investigation. Reporting to neighbors, the airline or only the employer is not required.","t":"Notify the public health authority of active TB."},{"id":"B20.1","c":20,"q":"A 170 cm man with ARDS is ventilated. Using the ARDSNet formula, his predicted body weight is closest to:","o":["100 kg","66 kg","50 kg","85 kg","120 kg"],"a":1,"e":"Predicted body weight for a man is 50 + 0.91 times (height in cm minus 152.4). For 170 cm this is 50 + 0.91 x 17.6, about 66 kg. Ventilator volumes in ARDS use predicted, not actual, body weight, because lung size depends on height and sex.","t":"Male PBW = 50 + 0.91 (height cm - 152.4)."},{"id":"B20.2","c":20,"q":"For the same patient, a tidal volume of 6 mL/kg predicted body weight equals about:","o":["1,200 mL","800 mL","400 mL","1,000 mL","200 mL"],"a":2,"e":"A tidal volume of 6 mL/kg predicted body weight for 66 kg is about 396 mL, close to 400 mL. Values of 800 to 1,200 mL are 12 to 18 mL/kg and are harmful, and 200 mL is too small.","t":"6 mL/kg x 66 kg is about 400 mL."},{"id":"B20.3","c":20,"q":"The 2024 ATS guideline for ARDS suggests a tidal volume range of:","o":["15 to 20 mL/kg","12 to 15 mL/kg","No specific range","10 to 12 mL/kg","4 to 8 mL/kg predicted body weight"],"a":4,"e":"The 2024 ATS guideline suggests a tidal volume range of 4 to 8 mL/kg predicted body weight in ARDS, because lower volumes protect the lung. Ranges of 10 to 20 mL/kg cause volutrauma, and it is not true that no range is recommended.","t":"ARDS tidal volume: 4 to 8 mL/kg predicted body weight."},{"id":"B20.4","c":20,"q":"A patient with ARDS has a plateau pressure of 34 cm H2O. The best action is to:","o":["Remove PEEP","Stop monitoring","Increase respiratory rate with larger volumes","Reduce tidal volume","Increase tidal volume"],"a":3,"e":"A plateau pressure of 34 cm H2O exceeds the target of below 30, so reduce tidal volume to lower alveolar distension. Raising tidal volume or rate with larger volumes worsens it, and removing PEEP or stopping monitoring is wrong.","t":"Plateau pressure above 30: lower the tidal volume."},{"id":"B20.5","c":20,"q":"A patient with moderate to severe ARDS has a PaO2/FiO2 ratio of 90 on optimal ventilator settings. Which therapy has mortality benefit?","o":["Inhaled nitric oxide","High-frequency oscillation","Prone positioning for more than 12 hours daily","Routine steroids at any dose","High tidal volume"],"a":2,"e":"In moderate to severe ARDS (P/F below 150), prone positioning for more than 12 hours daily reduces mortality. Inhaled nitric oxide and high-frequency oscillation have no mortality benefit, routine steroids at any dose are not supported, and high tidal volumes are harmful.","t":"Severe ARDS: prone more than 12 hours a day."},{"id":"B20.6","c":20,"q":"A mechanically ventilated patient suddenly desaturates, with high peak and plateau pressures and absent breath sounds on the left. The most likely cause is:","o":["Mucus plug in the endotracheal tube","Circuit disconnection","Pneumothorax","Sedation","Auto-PEEP"],"a":2,"e":"Sudden desaturation with high peak and plateau pressures and absent breath sounds on one side suggests pneumothorax, possibly tension. A plug or bronchospasm raises peak but not plateau pressure, disconnection drops pressures, and auto-PEEP does not cause unilateral absent sounds.","t":"High peak and plateau plus unilateral absent breath sounds: pneumothorax."},{"id":"B20.7","c":20,"q":"A ventilated patient desaturates, peak pressure rises, but plateau pressure is unchanged. This pattern suggests:","o":["Disconnection","Increased airway resistance (such as a plug or bronchospasm)","Hypovolemia","Pneumothorax","Reduced compliance"],"a":1,"e":"A rise in peak pressure with unchanged plateau pressure means increased airway resistance, as with a mucus plug, kinked tube or bronchospasm. Reduced compliance (pneumothorax, edema) raises both peak and plateau pressure, and disconnection lowers them.","t":"Peak up, plateau unchanged = resistance problem."},{"id":"B20.8","c":20,"q":"A ventilated asthmatic has expiratory flow that does not reach zero before the next breath, and hypotension. The best first step is to:","o":["Disconnect briefly and allow exhalation, then lower rate and prolong expiration","Extubate","Give more fluids only","Raise the respiratory rate","Increase PEEP markedly"],"a":0,"e":"Expiratory flow that does not reach zero before the next breath means breath stacking and auto-PEEP, which can cause hypotension. Disconnect briefly to allow exhalation, then lower the rate and prolong expiration. Extubating, fluids alone, a higher rate or more PEEP worsens air trapping.","t":"Auto-PEEP with hypotension: disconnect, then slow the rate."},{"id":"B20.9","c":20,"q":"What does DOPE stand for in ventilator troubleshooting?","o":["Dyspnea, obstruction, pH, effusion","Delirium, opioids, pain, emboli","Disconnection, oxygen, PEEP, edema","Displacement, obstruction, pneumothorax, equipment failure","Drugs, oxygen, pressure, extubation"],"a":3,"e":"DOPE is the mnemonic for sudden deterioration on the ventilator: Displacement, Obstruction, Pneumothorax, Equipment failure. The other expansions are invented.","t":"DOPE: displacement, obstruction, pneumothorax, equipment."},{"id":"B20.10","c":20,"q":"In a patient with a persistent poor oxygenation, what usually improves oxygenation first in ARDS?","o":["Sedative overdose","Large tidal volumes","Lower FiO2 to 0.21","Diuretics that cause hypotension","Higher PEEP with careful monitoring, and prone positioning"],"a":4,"e":"Persistent poor oxygenation in ARDS is improved by higher PEEP with careful monitoring and by prone positioning, which recruit lung. Large tidal volumes injure the lung, lowering FiO2 to 0.21 or causing hypotension with diuretics does not help, and overdosing sedatives is irrelevant.","t":"ARDS hypoxemia: PEEP and prone positioning."},{"id":"B20.11","c":20,"q":"A ventilated COPD patient has high PaCO2 and pH 7.15. The most effective adjustment is:","o":["Decrease the respiratory rate","Decrease the tidal volume markedly","Increase minute ventilation while allowing enough expiratory time","Give bicarbonate only","Increase FiO2 only"],"a":2,"e":"In a ventilated COPD patient with pH 7.15 and high PaCO2, increase minute ventilation while allowing enough expiratory time to avoid auto-PEEP. Decreasing rate or tidal volume worsens hypercapnia, and bicarbonate alone or more oxygen does not clear carbon dioxide.","t":"Hypercapnia on the ventilator: raise minute ventilation, protect expiratory time."},{"id":"B20.12","c":20,"q":"A ventilated patient is dyssynchronous with double triggering. A likely cause is:","o":["Overly long expiratory time","Low FiO2","Inspiratory time shorter than the patient's neural inspiratory time","High PEEP only","Cuff leak only"],"a":2,"e":"Double triggering occurs when the set inspiratory time is shorter than the patient's neural inspiratory time, so the patient triggers a second breath. Long expiratory time, low FiO2, high PEEP or a cuff leak do not cause it.","t":"Double triggering: set inspiration too short."},{"id":"B20.13","c":20,"q":"Which finding best identifies auto-PEEP on the ventilator?","o":["Low peak pressure","Rising SpO2","Wide pulse pressure","Expiratory flow not returning to baseline before the next breath","High tidal volume exhaled"],"a":3,"e":"Auto-PEEP is identified by expiratory flow that fails to return to baseline before the next breath on the flow waveform. Low peak pressure, rising SpO2, wide pulse pressure and high exhaled volume do not identify it.","t":"Expiratory flow not reaching zero means auto-PEEP."},{"id":"B20.14","c":20,"q":"A patient with ARDS has hypotension after PEEP is raised. The likely mechanism is:","o":["Pneumothorax only","Hypovolemia from diuresis only","Anaphylaxis","Improved cardiac output","Reduced venous return and right ventricular afterload effects"],"a":4,"e":"Raising PEEP in ARDS can cause hypotension by reducing venous return (and affecting right ventricular afterload), since higher intrathoracic pressure lowers preload. It does not improve cardiac output, and anaphylaxis or pneumothorax alone are not the usual mechanism.","t":"High PEEP lowers preload and can cause hypotension."},{"id":"B20.15","c":20,"q":"What is the definition used for ARDS severity in the Berlin classification based on?","o":["Chest radiograph alone","Serum albumin","Age","PaO2/FiO2 ratio with PEEP of at least 5 cm H2O","Lactate"],"a":3,"e":"The Berlin classification grades ARDS severity by the PaO2/FiO2 ratio with PEEP of at least 5 cm H2O: mild 200 to 300, moderate 100 to 200, severe below 100. Chest radiograph alone, albumin, age and lactate do not grade severity.","t":"Berlin severity uses P/F with PEEP at least 5."},{"id":"B20.16","c":20,"q":"A patient with ARDS from sepsis is receiving a neuromuscular blocker. What must accompany it?","o":["Deep sedation and monitoring for weakness risk","Steroid omission","Early extubation","No monitoring","No sedation"],"a":0,"e":"A neuromuscular blocker in ARDS must be given with deep sedation, because paralysis without sedation is unacceptable, and weakness risk should be monitored with the shortest course. Omitting steroids, early extubation, no monitoring or no sedation is wrong.","t":"Never paralyze without deep sedation."},{"id":"B20.17","c":20,"q":"Extracorporeal membrane oxygenation is considered in ARDS when:","o":["The patient is awake and comfortable","Mild hypoxemia","The patient has an intact lung","Severe refractory hypoxemia persists despite optimal ventilation and prone positioning","First-line at admission"],"a":3,"e":"Extracorporeal membrane oxygenation is considered in ARDS when severe refractory hypoxemia persists despite optimal ventilation and prone positioning, at experienced centers. It is not for mild hypoxemia, a comfortable patient, or first-line at admission.","t":"ECMO: refractory severe hypoxemia despite prone positioning."},{"id":"B20.18","c":20,"q":"A ventilated patient is ready for a spontaneous breathing trial when:","o":["FiO2 is 1.0","pH is 7.0","Oxygenation is adequate on low PEEP, hemodynamics are stable, and the cause of failure is improving","The patient is paralyzed","Vasopressors are rising"],"a":2,"e":"A patient is ready for a spontaneous breathing trial when oxygenation is adequate on low PEEP, hemodynamics are stable and the cause of failure is improving. FiO2 of 1.0, pH of 7.0, paralysis or rising vasopressors are not.","t":"SBT readiness: adequate oxygenation on low PEEP, stable, improving."},{"id":"B20.19","c":20,"q":"Which airway pressure reflects alveolar distension best?","o":["Plateau pressure","Peak inspiratory pressure","Mean airway pressure","Expiratory pressure only","Oral pressure"],"a":0,"e":"Plateau pressure, measured during an inspiratory hold, reflects alveolar distension best. Peak pressure includes airway resistance, and mean airway pressure and expiratory pressure alone do not reflect distension.","t":"Plateau pressure reflects alveolar distension."},{"id":"B20.20","c":20,"q":"A patient with ARDS has a driving pressure of 20 cm H2O. Compared with a driving pressure of 12, this is associated with:","o":["Shorter ICU stay","Lower mortality","Higher mortality","No difference","Better compliance"],"a":2,"e":"Driving pressure (plateau minus PEEP) correlates with outcome, and a driving pressure of 20 compared with 12 is associated with higher mortality in ARDS. It is not linked to shorter ICU stay, lower mortality or better compliance.","t":"High driving pressure is associated with higher ARDS mortality."},{"id":"B20.21","c":20,"q":"A patient on pressure support ventilation has a tidal volume of 900 mL and tachypnea due to pain and agitation. The first step is to:","o":["Switch to paralysis","Disconnect","Sedate heavily at once","Increase pressure support","Assess for pain, anxiety, and ventilator settings before sedating"],"a":4,"e":"A patient with large tidal volumes and tachypnea due to pain and agitation needs assessment of pain, anxiety and ventilator settings before sedation. Paralysis, disconnecting, heavy sedation or raising pressure support first treats the symptom, not the cause.","t":"Treat the cause of ventilator distress before escalating sedation."},{"id":"B20.22","c":20,"q":"Which complication is most characteristic of prolonged high FiO2?","o":["Absorption atelectasis and oxygen toxicity","Hypoglycemia","Hypertension","Polycythemia","Hypercapnia from steroids"],"a":0,"e":"Prolonged high FiO2 causes absorption atelectasis and oxygen toxicity. It does not cause hypoglycemia, hypertension or polycythemia, and carbon dioxide retention is not a steroid effect.","t":"High FiO2: absorption atelectasis and oxygen toxicity."},{"id":"B21.1","c":21,"q":"A 68-year-old woman has fever, hypotension of 80/40 mm Hg despite fluids, and lactate of 4.5 mmol/L. When should antimicrobials ideally be given?","o":["After cultures return","Within 6 hours","After vasopressors are weaned","Within 1 hour","Within 24 hours"],"a":3,"e":"Septic shock, with persistent hypotension despite fluids and lactate of 4.5, calls for antimicrobials ideally within 1 hour. Waiting for cultures, 6 hours, 24 hours or vasopressor weaning increases mortality.","t":"Septic shock: antimicrobials within 1 hour."},{"id":"B21.2","c":21,"q":"A patient has a fever and a mild rise in respiratory rate. The team is unsure whether this is sepsis, and she has no shock. The 2026 guideline suggests:","o":["No treatment","Immediate intubation","Immediate vasopressors","A time-limited investigation, with antimicrobials within 3 hours if concern persists","Antimicrobials in 24 hours"],"a":3,"e":"For possible sepsis without shock, the 2026 guideline suggests a time-limited investigation, with antimicrobials within 3 hours if concern persists. No treatment, immediate intubation, immediate vasopressors or 24-hour delay are not recommended.","t":"Possible sepsis without shock: investigate, then antimicrobials within 3 hours if still concerning."},{"id":"B21.3","c":21,"q":"In septic shock, the guideline suggests an initial crystalloid volume of at least:","o":["5 mL/kg","None","30 mL/kg within the first 3 hours","100 mL/kg","1 mL/kg"],"a":2,"e":"In septic shock, the guideline suggests an initial crystalloid volume of at least 30 mL/kg within the first 3 hours, based on low-certainty evidence. Volumes of 1 to 5 mL/kg are inadequate, and 100 mL/kg is excessive.","t":"Septic shock: at least 30 mL/kg crystalloid in 3 hours."},{"id":"B21.4","c":21,"q":"The suggested initial mean arterial pressure target in septic shock is:","o":["65 mm Hg","95 mm Hg","85 mm Hg","45 mm Hg","110 mm Hg"],"a":0,"e":"The suggested initial mean arterial pressure target in septic shock is 65 mm Hg. Higher targets of 85 to 110 do not improve outcomes, and 45 is too low.","t":"Septic shock MAP target: 65 mm Hg."},{"id":"B21.5","c":21,"q":"A patient in shock has a cold, clammy appearance, pulmonary crackles, a distended jugular vein, and a low cardiac output on echocardiography. The shock type is:","o":["Cardiogenic","Neurogenic","Obstructive from tamponade only","Hypovolemic","Distributive"],"a":0,"e":"Cold, clammy skin, pulmonary crackles, distended jugular veins and low cardiac output on echocardiography describe cardiogenic shock: low output with congestion. Hypovolemic shock has flat veins, distributive shock has warm skin and high output, and neurogenic shock has bradycardia.","t":"Cold, congested, low output = cardiogenic shock."},{"id":"B21.6","c":21,"q":"A trauma patient has hypotension, flat neck veins, and tachycardia. The shock type is:","o":["Cardiogenic","Distributive","Obstructive","Hypovolemic","Neurogenic"],"a":3,"e":"A trauma patient with hypotension, flat neck veins and tachycardia has hypovolemic shock from low preload. Distended veins would point to cardiogenic or obstructive shock, and distributive and neurogenic shock have other features.","t":"Flat neck veins and trauma = hypovolemic shock."},{"id":"B21.7","c":21,"q":"A patient with hypotension, distended neck veins, muffled heart sounds, and a large pericardial effusion needs:","o":["Pericardial drainage","Diuretic","Large fluid boluses only","Beta-blocker","Thrombolysis"],"a":0,"e":"Hypotension, distended neck veins, muffled heart sounds and a large pericardial effusion indicate tamponade, an obstructive shock that needs pericardial drainage. Diuretics, large fluid boluses alone, beta-blockers or thrombolysis do not relieve it.","t":"Tamponade: drain the pericardium."},{"id":"B21.8","c":21,"q":"Which first-line vasopressor is typically used in septic shock?","o":["Norepinephrine","Dobutamine alone","Phenylephrine as first choice","Vasopressin as sole initial agent","Dopamine as first choice"],"a":0,"e":"Norepinephrine is the usual first vasopressor in septic shock. Dobutamine alone, phenylephrine, vasopressin as the sole initial agent and dopamine as first choice are not preferred.","t":"Septic shock: norepinephrine first."},{"id":"B21.9","c":21,"q":"A patient on high-dose norepinephrine still has hypotension. A common additional step is:","o":["Give a large dose of beta-blocker","Remove the arterial line","Stop vasopressors","Start sedatives only","Add vasopressin"],"a":4,"e":"When hypotension persists on high-dose norepinephrine, add vasopressin as a second agent, which reduces catecholamine dose. Beta-blockers, removing the arterial line, stopping vasopressors or sedatives only will not help.","t":"Add vasopressin to norepinephrine in refractory septic shock."},{"id":"B21.10","c":21,"q":"In undifferentiated shock, which bedside ultrasound finding suggests hypovolemia?","o":["Diffuse B-lines","Small, collapsing inferior vena cava and hyperdynamic ventricle","Large pericardial effusion","Dilated right ventricle with septal shift","Pneumothorax"],"a":1,"e":"A small, collapsing inferior vena cava with a hyperdynamic ventricle suggests hypovolemia. Diffuse B-lines suggest pulmonary edema, a large pericardial effusion suggests tamponade, a dilated right ventricle with septal shift suggests embolism, and the lung sliding sign loss suggests pneumothorax.","t":"Small collapsing IVC plus hyperdynamic heart = hypovolemia."},{"id":"B21.11","c":21,"q":"A hypotensive patient has a dilated right ventricle, a D-shaped septum, and a clot in the leg veins. The diagnosis is:","o":["Cardiogenic shock from left infarct","Septic shock only","Obstructive shock from pulmonary embolism","Hypovolemic shock","Anaphylaxis"],"a":2,"e":"A hypotensive patient with a dilated right ventricle, D-shaped septum and leg vein clot has obstructive shock from massive pulmonary embolism. Left infarct causes left ventricular failure, and septic, hypovolemic or anaphylactic shock do not cause this right heart picture.","t":"RV dilation plus D-shaped septum plus DVT = massive embolism."},{"id":"B21.12","c":21,"q":"After anaphylaxis, the first-line drug is:","o":["Intramuscular epinephrine","Steroid alone","Antihistamine alone","Oral antihistamine","Intravenous vasopressin alone"],"a":0,"e":"Intramuscular epinephrine is the first-line drug in anaphylaxis. Steroids, antihistamines (oral or alone) and vasopressin alone are adjuncts and do not treat airway and circulatory collapse.","t":"Anaphylaxis: intramuscular epinephrine first."},{"id":"B21.13","c":21,"q":"A patient with septic shock remains hypotensive on norepinephrine and vasopressin. The team considers corticosteroids. The best statement is:","o":["Steroids are required for all patients","Use is considered in refractory septic shock, with the dose taken from the current guideline","Steroids are always contraindicated","Use only before antibiotics","They replace vasopressors"],"a":1,"e":"Corticosteroids (hydrocortisone) are considered in refractory septic shock that remains hypotensive on norepinephrine and vasopressin, with the dose taken from the current guideline or label. They are not required for all, always contraindicated, used only before antibiotics or a replacement for vasopressors.","t":"Steroids: consider in refractory septic shock."},{"id":"B21.14","c":21,"q":"A patient with septic shock has a rising lactate despite therapy. Which step is most useful?","o":["Stop monitoring","Remove antibiotics","Search for undrained source of infection and reassess perfusion","Give only oral fluids","Wait 24 hours"],"a":2,"e":"A rising lactate despite therapy should prompt a search for an undrained source of infection and reassessment of perfusion, since source control is a key early priority. Stopping monitoring, removing antibiotics, giving oral fluids only or waiting 24 hours is wrong.","t":"Rising lactate in sepsis: look for uncontrolled source and reassess perfusion."},{"id":"B25.1","c":25,"q":"A clinic wants to improve inhaler technique checks. A small test with 10 patients in one week, followed by review and adjustment, is an example of:","o":["A plan-do-study-act cycle","A randomized trial","A case-control study","A registry","A meta-analysis"],"a":0,"e":"A small test on 10 patients over a week, followed by review and adjustment, is a plan-do-study-act cycle, the core tool of quality improvement. A randomized trial, case-control study, registry and meta-analysis are research designs with different aims.","t":"PDSA = small cycles of change."},{"id":"B25.2","c":25,"q":"A diagnostic test has sensitivity 90% and specificity 90%. In a population where disease prevalence is 1%, a positive result is most likely:","o":["Always correct","A true positive","A negative","Uninterpretable","A false positive"],"a":4,"e":"With sensitivity and specificity of 90% and prevalence of 1%, out of 1,000 people 10 have disease (9 test positive) and 990 do not (99 test positive), so most positives are false, with a positive predictive value near 8%. A positive result is not always correct or a true positive.","t":"Low prevalence makes most positives false positives."},{"id":"B25.3","c":25,"q":"As prevalence of a disease rises, with fixed sensitivity and specificity, the positive predictive value:","o":["Falls","Equals the sensitivity","Rises","Stays the same","Equals the specificity"],"a":2,"e":"With fixed sensitivity and specificity, the positive predictive value rises as prevalence rises, because predictive values depend on prevalence. It does not fall, stay the same, or equal sensitivity or specificity.","t":"PPV rises with prevalence."},{"id":"B25.4","c":25,"q":"A trial reports a relative risk reduction of 50% for an event that occurs in 2% of control patients. The absolute risk reduction is:","o":["50%","2%","25%","0.5%","1%"],"a":4,"e":"Absolute risk reduction is the control risk times the relative risk reduction: 2% x 50% = 1%. It is not 50%, 2%, 25% or 0.5%.","t":"ARR = control event rate x RRR."},{"id":"B25.5","c":25,"q":"For the same trial, the number needed to treat is:","o":["2","50","100","1,000","10"],"a":2,"e":"Number needed to treat is 1 divided by the absolute risk reduction: 1 / 0.01 = 100. It is not 2, 10, 50 or 1,000.","t":"NNT = 1 / ARR."},{"id":"B25.6","c":25,"q":"A study of ventilation outcomes compares patients who chose a treatment with those who did not, and the groups differ in severity. The main concern is:","o":["Confounding by indication","Allocation concealment","Blinding","Attrition only","Perfect randomization"],"a":0,"e":"When patients who chose a treatment differ in severity from those who did not, the main concern is confounding by indication. Allocation concealment, blinding and randomization address randomized trials, and attrition is a separate issue.","t":"Sicker patients get treatment: confounding by indication."},{"id":"B25.7","c":25,"q":"Patients enrolled in a screening program appear to live longer from diagnosis, but total mortality is unchanged. This is:","o":["Lead-time bias","Observer bias","Selection bias","Publication bias","Recall bias"],"a":0,"e":"Longer survival from diagnosis with unchanged total mortality is lead-time bias, since earlier detection starts the clock sooner without changing the death date. Observer, selection, publication and recall bias differ.","t":"Earlier detection without benefit: lead-time bias."},{"id":"B25.8","c":25,"q":"A hospital reports that a ventilator-associated event bundle reduced rates only in units that adopted it first. Which design problem limits the conclusion?","o":["Lack of a concurrent control","Blinding","Too large a sample","Intention to treat","Randomization"],"a":0,"e":"A before-and-after comparison where only early adopters improved lacks a concurrent control, so secular trends can explain the change. Blinding, large samples, intention to treat and randomization are not the limiting problem.","t":"No concurrent control: trends can explain change."},{"id":"B25.9","c":25,"q":"In a root-cause analysis of a wrong-site chest drain, the best focus is:","o":["Ignoring the event","System factors and process failures","Blame of the individual","Removing documentation","Changing the schedule only"],"a":1,"e":"A root-cause analysis of a wrong-site chest drain should focus on system factors and process failures, since safety science emphasizes systems rather than blame. Ignoring it, blaming the individual or removing documentation is wrong.","t":"Root-cause analysis targets systems, not individuals."},{"id":"B25.10","c":25,"q":"A patient with decision-making capacity refuses intubation. The correct response is to:","o":["Sedate and proceed","Respect the refusal after ensuring understanding","Intubate anyway","Discharge without discussion","Seek a court order immediately"],"a":1,"e":"A patient with decision-making capacity may refuse intubation, so respect the refusal after ensuring understanding. Sedating, intubating anyway, discharging without discussion or an immediate court order violates autonomy.","t":"Capable patients may refuse treatment."},{"id":"B25.11","c":25,"q":"An unconscious patient with no advance directive has a surrogate. The surrogate should use:","o":["A coin flip","Substituted judgment based on the patient's known values","The physician's preferences","Their own preferences","The hospital's convenience"],"a":1,"e":"A surrogate for an unconscious patient with no directive should use substituted judgment based on the patient's known values. A coin flip, the physician's or the surrogate's own preferences, or hospital convenience is wrong.","t":"Surrogates use substituted judgment."},{"id":"B25.12","c":25,"q":"Withholding and withdrawing life-sustaining therapy are, ethically:","o":["Never discussed","Considered equivalent when the patient would not want the therapy","Required for all patients","Always illegal","Always different"],"a":1,"e":"Withholding and withdrawing life-sustaining therapy are considered ethically equivalent when the patient would not want the therapy. They are discussed, not required for all, not always illegal and not always different.","t":"Withholding and withdrawing are ethically equivalent."},{"id":"B25.13","c":25,"q":"During a pandemic surge, allocation of scarce ventilators should be based on:","o":["First come, first served only","Staff preference","Race","Transparent criteria applied fairly, without regard to disability or social status","Wealth"],"a":3,"e":"Scarce ventilator allocation during a surge should follow transparent criteria applied fairly, without regard to disability, race, wealth or social status. First come, first served alone or staff preference is not fair.","t":"Triage must be transparent and fair."},{"id":"B25.14","c":25,"q":"A new journal article reports a surprising benefit in a small single-center trial. The best response is to:","o":["Assume it is wrong","Change practice immediately","Cite it as proof","Ignore all trials","Appraise the design, bias, and precision, and wait for confirmation"],"a":4,"e":"A surprising result from a small single-center trial calls for appraising design, bias and precision and waiting for confirmation, since small trials need replication. Assuming it wrong, changing practice at once, citing it as proof or ignoring trials is wrong.","t":"Small surprising trial: appraise and await replication."},{"id":"B25.15","c":25,"q":"A confidence interval for a relative risk of 0.8 is 0.6 to 1.1. The result is:","o":["Impossible","Proof of harm","Significant","Proof of benefit","Not statistically significant at the 5% level"],"a":4,"e":"A relative risk of 0.8 with a confidence interval of 0.6 to 1.1 includes 1, so the result is not statistically significant at the 5% level. It proves neither benefit nor harm.","t":"CI crossing 1 for a ratio: not significant."},{"id":"B25.16","c":25,"q":"A noninferiority trial reports a margin. The key question is:","o":["Whether the drug is new","Whether it is blinded only","Whether the interval excludes harm larger than the margin","Whether the sample is large","Whether the margin is zero"],"a":2,"e":"A noninferiority trial asks whether the confidence interval excludes harm larger than the prespecified margin. Newness, blinding, sample size or a zero margin do not answer it.","t":"Noninferiority: compare the interval with the margin."},{"id":"B25.17","c":25,"q":"A quality metric shows that 60% of eligible patients receive a bundle element. The best next step is to:","o":["Punish clinicians","Wait","Remove the metric","Report only the best unit","Identify barriers and test fixes with small cycles"],"a":4,"e":"When 60% of eligible patients get a bundle element, identify barriers and test fixes with small cycles. Punishing clinicians, waiting, removing the metric or reporting only the best unit does not improve care.","t":"Measure, find barriers, test changes."},{"id":"B25.18","c":25,"q":"After an adverse event, disclosure to the patient should be:","o":["Given only to the family","Delayed for a year","Prompt, honest, and with an apology and plan","Avoided","Delegated to the lawyer"],"a":2,"e":"After an adverse event, disclosure should be prompt and honest with an apology and plan. Limiting it to family, delaying a year, avoiding it or delegating to a lawyer breaches professional expectations.","t":"Disclose promptly, apologize, share the plan."},{"id":"B25.19","c":25,"q":"A physician wants to start a research-like practice change. Before proceeding, the proper step is:","o":["Publish first","Ask the patient to waive rights","Proceed without review","Check whether it is quality improvement or research needing ethics review","Do nothing"],"a":3,"e":"Before a research-like practice change, check whether it is quality improvement or research needing ethics review, since institutions distinguish the two and research requires oversight. Publishing first, waiver of rights or proceeding without review is wrong.","t":"QI or research? Check before starting."},{"id":"B25.20","c":25,"q":"A patient with a respiratory virus is admitted. Which infection prevention measure most reduces spread?","o":["No masks","Appropriate isolation precautions and hand hygiene","Shared equipment","Open windows only","Visitors without limits"],"a":1,"e":"Appropriate isolation precautions and hand hygiene most reduce spread of a respiratory virus. No masks, shared equipment, open windows only or unlimited visitors raise transmission.","t":"Transmission-based precautions plus hand hygiene limit spread."},{"id":"B25.21","c":25,"q":"During an outbreak, clear communication should:","o":["Wait until all data are final","Use jargon only","Hide uncertainty","Avoid the public","Be timely, consistent, and based on the best available evidence, with uncertainty acknowledged"],"a":4,"e":"During an outbreak, communication should be timely, consistent and evidence-based, with uncertainty acknowledged, because trust depends on honesty about what is unknown. Waiting for final data, jargon, hiding uncertainty or avoiding the public erodes trust.","t":"Outbreak messaging: timely, consistent, honest about uncertainty."},{"id":"B25.22","c":25,"q":"A trial analyzes patients by the group they were assigned to, regardless of what they received. This is:","o":["Intention-to-treat analysis","Post hoc analysis","Per-protocol analysis","As-treated analysis","Subgroup analysis"],"a":0,"e":"Analyzing patients by assigned group regardless of treatment received is intention-to-treat analysis, which preserves randomization. Per-protocol, as-treated, post hoc and subgroup analyses break it.","t":"ITT analyzes as randomized."},{"id":"B25.23","c":25,"q":"A study tests 20 subgroups and finds one significant result. The most likely explanation is:","o":["A true effect","Large sample","Chance from multiple comparisons","Blinding","Perfect design"],"a":2,"e":"One significant result among 20 subgroups is most likely chance from multiple comparisons, since multiple testing inflates false positives. It is not necessarily a true effect, and blinding or sample size does not explain it.","t":"Many subgroups: expect false positives."},{"id":"B25.24","c":25,"q":"A hospital finds that a checklist improved safety in one center. Before wide adoption, the team should:","o":["Stop measuring","Ignore context","Consider context and test in the local setting","Mandate without training","Assume identical effect"],"a":2,"e":"A checklist that worked in one center should be adopted with attention to context and tested locally, since implementation depends on setting. Stopping measurement, ignoring context, mandating without training or assuming identical effect is wrong.","t":"Test interventions in the local context."},{"id":"B25.25","c":25,"q":"A patient asks for a treatment with no benefit but small harm. The best approach is:","o":["Provide it without comment","Ignore the request","Discharge","Refuse to speak","Explain risks and benefits and recommend against it"],"a":4,"e":"When a patient requests a treatment with no benefit and small harm, explain risks and benefits and recommend against it, since shared decisions include honest recommendations. Providing it without comment, ignoring or refusing to speak is wrong.","t":"Explain and recommend against low-value treatment."},{"id":"B25.26","c":25,"q":"Which measure best captures the harm of an intervention?","o":["Sensitivity","R-squared","Number needed to harm","Kappa","Specificity"],"a":2,"e":"Number needed to harm captures the harm of an intervention and is the counterpart of number needed to treat. Sensitivity, specificity, R-squared and kappa do not.","t":"NNH measures harm."},{"id":"B25.27","c":25,"q":"The strongest design for testing a new therapy is usually:","o":["An expert opinion","A well-conducted randomized controlled trial","A case report","A case series","A cross-sectional survey"],"a":1,"e":"A well-conducted randomized controlled trial is usually the strongest design for testing a therapy, since randomization balances known and unknown confounders. Expert opinion, case reports, case series and cross-sectional surveys are weaker.","t":"RCT is the strongest design for therapy."},{"id":"B25.28","c":25,"q":"A study finds that coffee drinkers have more lung cancer, but smoking is more common among them. This is an example of:","o":["Confounding","Random error","Effect modification","Measurement error only","Selection bias only"],"a":0,"e":"Coffee drinkers with more lung cancer because smoking is more common among them shows confounding, with smoking as the confounder. It is not random error, effect modification or just measurement error.","t":"Confounder: related to exposure and outcome."},{"id":"B25.29","c":25,"q":"Which statement about p values is correct?","o":["It proves causation","A p value is not the probability that the hypothesis is true","It equals the confidence interval","It measures clinical importance","It measures effect size"],"a":1,"e":"A p value is not the probability that the hypothesis is true. It is the probability of data this extreme if the null were true, and it does not prove causation, equal the confidence interval, or measure clinical importance or effect size.","t":"P value is not the chance the hypothesis is true."},{"id":"B25.30","c":25,"q":"A pulmonary group introduces a new asthma action plan. To measure success, the best outcome measure is:","o":["Brochure design","Number of meetings","Staff opinion only","Emergency visits or hospitalizations over time","Number of handouts printed"],"a":3,"e":"The best measure of an asthma action plan is outcome: emergency visits or hospitalizations over time. Brochure design, meetings, staff opinion and handouts printed are process or opinion measures.","t":"Judge success by patient outcomes."},{"id":"B25.31","c":25,"q":"Moral distress among clinicians is best addressed by:","o":["Dismissal","Open discussion, support, and process improvement","Blame","Overtime","Silence"],"a":1,"e":"Moral distress among clinicians is addressed by open discussion, support and process improvement. Dismissal, blame, overtime and silence worsen it.","t":"Moral distress: talk, support, fix processes."},{"id":"B25.32","c":25,"q":"A hospital is planning for a respiratory surge. Which preparation matters most?","o":["Closing wards without a plan","Surge capacity plans, supplies, staffing, and triage protocols","Ignoring forecasts","Removing masks","Reducing staff"],"a":1,"e":"Preparing for a respiratory surge means surge capacity plans, supplies, staffing and triage protocols, made before the surge. Closing wards without a plan, ignoring forecasts, removing masks or reducing staff is wrong.","t":"Plan surge capacity before the surge."},{"id":"B25.33","c":25,"q":"A clinician reports a near-miss in a safe reporting system. The system should respond with:","o":["Discipline of the reporter","Learning and system fixes in a nonpunitive culture","Public naming","Removal of the report","No action"],"a":1,"e":"A near-miss report should lead to learning and system fixes in a nonpunitive culture, because reporting thrives when it is safe. Disciplining the reporter, naming publicly, deleting the report or no action discourages reporting.","t":"Near-miss reports: learn, do not punish."},{"id":"B25.34","c":25,"q":"A screening test for lung disease is considered. Which criterion supports screening?","o":["The disease is rare and harmless","The test is expensive and unreliable","The disease has no preclinical phase","No treatment is available","Effective treatment exists for early disease"],"a":4,"e":"Screening is supported when effective treatment exists for early disease, along with a detectable preclinical phase. Rare, harmless disease, a costly unreliable test, no preclinical phase or no treatment argue against it.","t":"Screening needs a preclinical phase and effective early treatment."},{"id":"B25.35","c":25,"q":"A discharge summary omits the plan for follow-up imaging of a lung nodule. This is an example of:","o":["An unrelated event","A perfect process","A diagnostic test","A handoff failure","A new disease"],"a":3,"e":"A discharge summary that omits follow-up imaging of a lung nodule is a handoff failure, since communication gaps cause missed follow-up. It is not unrelated, a perfect process, a test or a new disease.","t":"Missed nodule follow-up: handoff failure."},{"id":"B25.36","c":25,"q":"Informed consent for a bronchoscopy should include:","o":["Only a signature","Only benefits","No discussion","Alternatives hidden","Purpose, risks, benefits, alternatives, and the right to refuse"],"a":4,"e":"Informed consent for bronchoscopy includes the purpose, risks, benefits, alternatives and the right to refuse, because consent is a process, not a form. A signature only, benefits only, no discussion or hidden alternatives is inadequate.","t":"Consent: purpose, risks, benefits, alternatives, right to refuse."},{"id":"B25.37","c":25,"q":"A hospital reviews diagnostic errors. The commonest root is:","o":["Patient fault","Poor handwriting alone","Weather","Equipment color","Cognitive and system factors, such as anchoring and incomplete information"],"a":4,"e":"Diagnostic errors most often arise from cognitive and system factors such as anchoring and incomplete information. Patient fault, handwriting alone, weather or equipment color are not the commonest roots.","t":"Diagnostic error: cognitive plus system factors."},{"id":"B25.38","c":25,"q":"A guideline recommendation is labeled strong with low certainty of evidence. The best interpretation is:","o":["The evidence is high quality","The panel judged benefits to clearly outweigh harms despite limited evidence","The panel was divided","The recommendation is optional","The evidence is irrelevant"],"a":1,"e":"A strong recommendation with low certainty of evidence means the panel judged benefits to clearly outweigh harms despite limited evidence, since strength and certainty are separate judgments. It does not mean high-quality evidence, a divided panel, optional use or irrelevant evidence.","t":"Strength and certainty of evidence are separate."},{"id":"B19.1","c":19,"q":"A 65-year-old man with COPD is admitted with an exacerbation, pH 7.28, PaCO2 70 mm Hg, and he is alert and cooperative. The best next step is:","o":["Immediate intubation","Observation only","High-flow oxygen at an FiO2 of 1.0","Sedation","Noninvasive ventilation"],"a":4,"e":"An alert, cooperative patient with a COPD exacerbation and acute hypercapnic acidosis (pH 7.28, PaCO2 70) is the strongest indication for noninvasive ventilation, which reduces intubation and mortality. Immediate intubation is reserved for NIV failure or contraindications, and observation, high-flow oxygen at FiO2 1.0 or sedation worsen hypercapnia.","t":"COPD with pH below 7.35 and high PaCO2: noninvasive ventilation."},{"id":"B19.2","c":19,"q":"An hour after starting noninvasive ventilation, the same patient has pH 7.20, rising PaCO2, and drowsiness. The best next step is:","o":["Prepare for intubation","Continue the same settings for 24 hours","Switch to room air","Add sedatives","Remove monitoring"],"a":0,"e":"Worsening acidosis (pH 7.20), rising PaCO2 and drowsiness an hour into noninvasive ventilation mean the trial has failed, so prepare for intubation. Continuing the same settings for 24 hours, room air, sedatives or removing monitoring is dangerous.","t":"NIV failure: worsening acidosis or mental status; intubate."},{"id":"B19.3","c":19,"q":"Which patient is least suitable for a trial of noninvasive ventilation?","o":["A patient with vomiting, a depressed level of consciousness, and inability to protect the airway","A patient with obesity hypoventilation","A patient with a COPD exacerbation","A patient with cardiogenic pulmonary edema","A patient with immunocompromise and pneumonia who is awake"],"a":0,"e":"Inability to protect the airway, with vomiting and a depressed level of consciousness, is a contraindication to noninvasive ventilation because of aspiration risk. Obesity hypoventilation, COPD exacerbation, cardiogenic pulmonary edema and awake immunocompromised pneumonia are accepted uses.","t":"Do not use NIV in patients who cannot protect the airway."},{"id":"B19.4","c":19,"q":"A patient with acute cardiogenic pulmonary edema is breathless, with oxygen saturation of 84%. Which noninvasive therapy improves oxygenation and reduces intubation?","o":["Beta-agonists","Fluids","Oxygen by simple mask alone","Opioids","Continuous or bilevel positive airway pressure"],"a":4,"e":"Continuous or bilevel positive airway pressure improves oxygenation and reduces intubation in acute cardiogenic pulmonary edema by lowering preload and work of breathing. Beta-agonists, fluids, simple mask oxygen alone and opioids do not.","t":"Cardiogenic pulmonary edema: CPAP or bilevel NIV."},{"id":"B19.5","c":19,"q":"A patient with acute hypoxemic respiratory failure from pneumonia has a respiratory rate of 34 on a non-rebreather mask at 15 L/min. Which device offers heated, humidified flow with some positive pressure?","o":["Simple mask","Room air","Nasal cannula at 2 L/min","High-flow nasal oxygen","Venturi mask at 24%"],"a":3,"e":"High-flow nasal oxygen delivers heated, humidified flow with some positive pressure and improves comfort and oxygenation in hypoxemic failure. Simple masks, room air, low-flow cannula and a 24% Venturi mask do not meet this need.","t":"High-flow nasal oxygen: heated, humidified, mild pressure."},{"id":"B19.6","c":19,"q":"A patient on high-flow nasal oxygen has a persistently rising respiratory rate and thoraco-abdominal paradox. The team should:","o":["Add a sedative","Wait 24 hours","Stop oxygen","Increase the flow only","Intubate without delay"],"a":4,"e":"A persistently rising respiratory rate with thoraco-abdominal paradox on high-flow oxygen signals failure, so intubate without delay. Sedation, waiting 24 hours, stopping oxygen or increasing flow only increases risk.","t":"Persistent distress on high-flow: intubate early."},{"id":"B19.7","c":19,"q":"A COPD patient is prescribed oxygen after an exacerbation. A typical saturation target for patients at risk of hypercapnia is:","o":["70 to 75%","Any value","100%","80%","88 to 92%"],"a":4,"e":"For patients at risk of hypercapnia such as COPD, the target saturation is 88 to 92%, because controlled oxygen avoids worsening carbon dioxide retention. Targets of 70 to 80% are unsafe, and 100% or any value risks hyperoxia.","t":"Hypercapnia risk: aim for 88 to 92%."},{"id":"B19.8","c":19,"q":"A young healthy patient with pneumonia but no hypercapnia risk usually has an oxygen saturation target of:","o":["70%","80%","No target","100% always","94 to 98%"],"a":4,"e":"A young healthy patient with pneumonia and no hypercapnia risk has the usual target of 94 to 98%. Targets of 70 or 80% are too low, and 100% always is unnecessary. Confirm the range in the guideline used.","t":"No hypercapnia risk: aim for 94 to 98%."},{"id":"B19.9","c":19,"q":"A patient with carbon monoxide poisoning has a normal pulse oximeter reading. The correct treatment includes:","o":["High-concentration oxygen guided by carboxyhemoglobin","Low-flow oxygen only","Room air","Bicarbonate","Fluids only"],"a":0,"e":"Carbon monoxide poisoning is treated with high-concentration oxygen guided by carboxyhemoglobin, since oxygen shortens its half-life. The pulse oximeter is falsely normal, and low-flow oxygen, room air, bicarbonate or fluids alone are inadequate.","t":"CO poisoning: 100% oxygen, guided by carboxyhemoglobin."},{"id":"B19.10","c":19,"q":"Which finding distinguishes type 2 from type 1 respiratory failure?","o":["Elevated PaCO2 with respiratory acidosis","High hematocrit","Low hemoglobin","Low PaO2 with normal PaCO2","Low PaCO2"],"a":0,"e":"Type 2 (ventilatory) respiratory failure is defined by an elevated PaCO2 with respiratory acidosis. Type 1 shows low PaO2 with normal or low PaCO2, and hematocrit and hemoglobin do not define the type.","t":"Type 2 failure = hypercapnia."},{"id":"B19.11","c":19,"q":"A patient on noninvasive ventilation has a large mask leak and aerophagia. The best adjustment is:","o":["Stop treatment","Use a smaller mask without testing","Add sedation","Refit the mask and check settings","Increase the pressure indefinitely"],"a":3,"e":"A large mask leak and aerophagia during noninvasive ventilation call for refitting the mask and checking settings, since interface problems are the commonest cause of failure. Stopping treatment, a smaller mask without testing, sedation or indefinitely higher pressure are not appropriate.","t":"NIV intolerance: refit the interface first."},{"id":"B19.12","c":19,"q":"An obese patient with obesity hypoventilation is admitted with pH 7.25. The first-line therapy is:","o":["Diuretics","Sedation","Noninvasive ventilation","Steroids","Oxygen alone"],"a":2,"e":"Obesity hypoventilation with acute acidosis (pH 7.25) is treated first with noninvasive ventilation, since positive pressure treats hypoventilation. Diuretics, sedation, steroids and oxygen alone do not and can worsen hypercapnia.","t":"Obesity hypoventilation with acidosis: noninvasive ventilation."},{"id":"B19.13","c":19,"q":"A patient with an acute asthma exacerbation shows a rising PaCO2 and fatigue. The team should:","o":["Give sedatives","Reassure","Stop bronchodilators","Discharge","Prepare for intubation in a monitored setting"],"a":4,"e":"A rising PaCO2 and fatigue in acute asthma signal exhaustion, so prepare for intubation in a monitored setting. Sedatives, reassurance, stopping bronchodilators or discharge are dangerous.","t":"Rising CO2 in asthma: prepare to intubate."},{"id":"B19.14","c":19,"q":"The alveolar-arterial gradient is increased in which cause of hypoxemia?","o":["Opioid overdose","Pure hypoventilation","Low inspired oxygen","Ventilation-perfusion mismatch","High altitude"],"a":3,"e":"The alveolar-arterial gradient is increased in intrapulmonary causes of hypoxemia such as ventilation-perfusion mismatch (and shunt, diffusion limitation). Opioid overdose, pure hypoventilation, low inspired oxygen and high altitude leave it normal.","t":"A-a gradient widens with V/Q mismatch, shunt and diffusion limitation."},{"id":"B19.15","c":19,"q":"A patient needs oxygen titration and wants to go home. The ambulatory oxygen criterion for chronic hypoxemic COPD includes:","o":["A resting PaO2 of 55 mm Hg or less, or saturation of 88% or less","A saturation of 99%","A PaO2 of 90 mm Hg","Normal gas exchange","Any cough"],"a":0,"e":"Long-term oxygen for chronic hypoxemic COPD is given for persistent resting hypoxemia, a PaO2 of 55 mm Hg or less or saturation of 88% or less (confirm thresholds in the guideline). A saturation of 99%, PaO2 of 90, normal gas exchange or cough does not qualify.","t":"LTOT: resting PaO2 55 or less or SpO2 88% or less."},{"id":"B19.16","c":19,"q":"A patient on high-flow nasal oxygen with a ROX index below 3 after several hours is most likely to:","o":["Be discharged","Need sedatives","Fail and need intubation","Improve spontaneously","Need no further care"],"a":2,"e":"A ROX index (saturation divided by FiO2, divided by respiratory rate) below about 3 after several hours predicts high-flow failure, so the patient is likely to need intubation. They are unlikely to improve spontaneously or be discharged.","t":"Low ROX index predicts high-flow nasal oxygen failure."},{"id":"B19.17","c":19,"q":"Noninvasive ventilation in a patient with COPD should be reassessed within:","o":["1 month","1 week","3 days","Never","1 to 2 hours"],"a":4,"e":"Noninvasive ventilation in COPD should be reassessed within 1 to 2 hours with blood gas and clinical review, because early response determines success. Waiting days, a week or a month, or never reassessing, delays rescue.","t":"Reassess NIV in 1 to 2 hours."},{"id":"B19.18","c":19,"q":"Which complication is most common with noninvasive ventilation?","o":["Gastrointestinal bleeding","Pneumonia in all patients","Seizure","Skin breakdown over the nasal bridge","Hearing loss"],"a":3,"e":"The most common complication of noninvasive ventilation is skin breakdown over the nasal bridge from mask pressure. Gastrointestinal bleeding, universal pneumonia, seizure and hearing loss are not typical.","t":"NIV: nasal bridge pressure injury is the commonest complication."},{"id":"B19.19","c":19,"q":"An immunocompromised patient has acute hypoxemic respiratory failure. A reason to prefer high-flow nasal oxygen or a helmet over early intubation is:","o":["Avoiding intubation complications, with close monitoring","No monitoring needed","They need no oxygen","Noninvasive support is always inferior","Intubation is harmless"],"a":0,"e":"In an immunocompromised patient with acute hypoxemic respiratory failure, high-flow nasal oxygen or a helmet may avoid intubation complications, with close monitoring and early recognition of failure. They still require oxygen and monitoring, and noninvasive support is not always inferior.","t":"Noninvasive support may avoid intubation, but monitor closely."},{"id":"B19.20","c":19,"q":"Hyperoxia in critically ill patients is:","o":["Always beneficial","Potentially harmful, so target the lowest adequate oxygen","Safer than hypoxemia","Required","Without effect"],"a":1,"e":"Hyperoxia in critically ill patients is potentially harmful, so target the lowest adequate oxygen. It is not always beneficial, safer than hypoxemia, required or without effect.","t":"Avoid hyperoxia; titrate to target."},{"id":"B19.21","c":19,"q":"A patient has respiratory failure from neuromuscular disease and a forced vital capacity that is falling on serial measurements. The next step is:","o":["Closer monitoring and consideration of ventilatory support","Discharge","Reassurance","Stop measurements","Steroids alone"],"a":0,"e":"Respiratory failure from neuromuscular disease with a falling forced vital capacity needs closer monitoring and consideration of ventilatory support, since a falling vital capacity warns of impending failure. Discharge, reassurance, stopping measurements or steroids alone are unsafe.","t":"Falling FVC in neuromuscular disease: monitor and plan ventilatory support."},{"id":"B19.22","c":19,"q":"What is the purpose of the P/F ratio in practice?","o":["To measure cardiac output","To measure ventilation","To measure acid-base status","To measure pH","To grade the severity of hypoxemia"],"a":4,"e":"The P/F ratio (PaO2 divided by FiO2) grades the severity of hypoxemia, and it is the oxygenation index used for ARDS. It does not measure cardiac output, ventilation, acid-base status or pH.","t":"P/F ratio grades hypoxemia severity."},{"id":"B22.1","c":22,"q":"A ventilated patient is deeply sedated and cannot be assessed. The ICU liberation bundle recommends:","o":["No sedation ever","Sedation until extubation","Continuous deep sedation for all","Light sedation targets and daily review of the need for sedation","Paralysis for all"],"a":3,"e":"The ICU liberation bundle favors light sedation targets with a daily review of the need for sedation, because deep sedation prolongs ventilation, delirium and weakness. No sedation ever, continuous deep sedation, sedation until extubation or routine paralysis are not recommended.","t":"Target light sedation and review it daily."},{"id":"B22.2","c":22,"q":"In the ABCDEF bundle, the letter \"A\" refers to:","o":["Antibiotics","Assess, prevent, and manage pain","Airway","Alkalinization","Albumin"],"a":1,"e":"In the ABCDEF bundle, A stands for Assess, prevent and manage pain. It does not stand for antibiotics, airway, alkalinization or albumin.","t":"ABCDEF: A = assess and manage pain."},{"id":"B22.3","c":22,"q":"The letter \"B\" in the ABCDEF bundle stands for:","o":["Both spontaneous awakening and spontaneous breathing trials","Beta-blockers","Bicarbonate","Bronchoscopy","Blood pressure"],"a":0,"e":"B in the bundle stands for Both spontaneous awakening trials and spontaneous breathing trials, which are paired daily. Beta-blockers, bicarbonate, bronchoscopy and blood pressure are not what B means.","t":"B = both awakening and breathing trials."},{"id":"B22.4","c":22,"q":"The letter \"D\" in the bundle refers to:","o":["Dialysis","Diuretics","Dopamine","Diet","Delirium assessment, prevention, and management"],"a":4,"e":"D in the bundle is Delirium assessment, prevention and management, with screening every shift. Dialysis, diuretics, dopamine and diet are not part of the letter.","t":"D = delirium assessment and management."},{"id":"B22.5","c":22,"q":"Which intervention reduces delirium and weakness in ICU survivors?","o":["Isolation","Early mobility","Prolonged bed rest","Deep sedation","Restraints"],"a":1,"e":"Early mobility reduces delirium and weakness in ICU survivors and is part of the bundle (E). Isolation, prolonged bed rest, deep sedation and restraints all raise the risk.","t":"Early mobility lowers delirium and ICU weakness."},{"id":"B22.6","c":22,"q":"A patient passes a spontaneous breathing trial. The next assessment before extubation is:","o":["A tracheostomy always","Airway protection, cough, secretions, and mental status","A chest radiograph in every case","A sedative infusion","Nothing"],"a":1,"e":"Passing a spontaneous breathing trial does not guarantee airway readiness, so assess airway protection, cough, secretions and mental status before extubation. A routine tracheostomy, universal radiograph, sedative infusion or nothing is wrong.","t":"After a passed SBT, check airway protection, cough, secretions and mental status."},{"id":"B22.7","c":22,"q":"A patient fails extubation after 12 hours due to stridor. Which pre-extubation test may have predicted the risk?","o":["A urine test","A bone scan","A cuff-leak test","A chest radiograph","An ECG"],"a":2,"e":"A cuff-leak test may have predicted postextubation stridor, since the absence of a leak around the deflated cuff suggests airway edema. Urine tests, bone scans, radiographs and ECG do not assess airway swelling.","t":"No cuff leak raises the risk of postextubation stridor."},{"id":"B22.8","c":22,"q":"A ventilated patient has fever, new purulent secretions, and a new infiltrate after 4 days. The likely diagnosis is:","o":["Pulmonary embolism","Ventilator-associated pneumonia","Pneumothorax","Atelectasis only","Asthma"],"a":1,"e":"Fever, new purulent secretions and a new infiltrate after about 4 days of ventilation indicate ventilator-associated pneumonia. Embolism, pneumothorax, atelectasis alone and asthma do not combine these features.","t":"New infiltrate plus purulent secretions on the ventilator: VAP."},{"id":"B22.9","c":22,"q":"A patient on mechanical ventilation has been immobile for 3 weeks and has limb weakness with preserved cranial nerves. The likely diagnosis is:","o":["Guillain-Barre syndrome only","ICU-acquired weakness","Stroke","Myasthenia gravis","Spinal tumor"],"a":1,"e":"Limb weakness with preserved cranial nerves after prolonged critical illness and immobility suggests ICU-acquired weakness (critical illness polyneuropathy or myopathy). Guillain-Barre, stroke, myasthenia gravis and spinal tumor have other patterns, and cranial nerves are often involved in myasthenia.","t":"Limb weakness after prolonged ICU stay: ICU-acquired weakness."},{"id":"B22.10","c":22,"q":"Which risk factor most increases delirium in the ICU?","o":["Light sedation","Early mobility","Benzodiazepine sedation","Family presence","Daylight"],"a":2,"e":"Benzodiazepine sedation is the strongest listed risk factor for ICU delirium. Light sedation, early mobility, family presence and daylight reduce it.","t":"Benzodiazepines raise delirium risk."},{"id":"B22.11","c":22,"q":"A family member asks about cognitive and psychological problems after ICU. The term for this cluster is:","o":["Delirium tremens","Shock","Post-intensive care syndrome","Acute respiratory distress syndrome","Sepsis"],"a":2,"e":"Physical, cognitive and mental health problems after critical illness are called post-intensive care syndrome. Delirium tremens, shock, ARDS and sepsis are different entities.","t":"PICS = physical, cognitive and psychological impairment after ICU."},{"id":"B22.12","c":22,"q":"A patient receives a central venous catheter. Which measure reduces bloodstream infection?","o":["Skin preparation with water","Maximal barrier precautions and chlorhexidine skin preparation","Routine catheter changes","Femoral site always","Open dressing"],"a":1,"e":"Maximal barrier precautions and chlorhexidine skin preparation reduce catheter-related bloodstream infection. Water prep, routine catheter changes, femoral site always and open dressing raise risk.","t":"Central line bundle: full barrier plus chlorhexidine."},{"id":"B22.13","c":22,"q":"Prophylaxis against stress-related gastrointestinal bleeding in ventilated patients is indicated for:","o":["Patients with risk factors such as coagulopathy or prolonged ventilation","All patients","Patients on room air","Outpatients","None"],"a":0,"e":"Stress ulcer prophylaxis is indicated in ventilated patients with risk factors such as coagulopathy or prolonged ventilation, not everyone. Giving it to all, to patients on room air or to none misses the targeted approach.","t":"Stress ulcer prophylaxis: high-risk ventilated patients."},{"id":"B22.14","c":22,"q":"A tracheostomy is considered when:","o":["Prolonged ventilation is expected","A short trial is planned","The patient is awake","Extubation is imminent","The patient is on room air"],"a":0,"e":"A tracheostomy is considered when prolonged ventilation is expected, with timing and benefit individualized. It is not for a short trial, an awake patient, imminent extubation or room air.","t":"Consider tracheostomy when prolonged ventilation is expected."},{"id":"B22.15","c":22,"q":"The Richmond Agitation-Sedation Scale target for most ventilated patients is:","o":["Minus 5","Plus 4","Any score","0 to minus 1, calm to lightly drowsy","Minus 4"],"a":3,"e":"The RASS target for most ventilated patients is 0 to minus 1, calm to lightly drowsy. Minus 4 or 5 is deep sedation, and plus 4 is combative.","t":"Usual RASS target: 0 to -1."},{"id":"B22.16","c":22,"q":"Which monitoring tool screens for delirium?","o":["The Glasgow Coma Scale alone","A chest radiograph","The Epworth scale","The APACHE score","The Confusion Assessment Method for the ICU"],"a":4,"e":"The Confusion Assessment Method for the ICU (CAM-ICU) screens for delirium and is validated in ventilated patients. GCS, radiographs, Epworth and APACHE do not detect delirium.","t":"CAM-ICU screens for delirium."},{"id":"B22.17","c":22,"q":"A ventilated patient develops hypotension and tachycardia after intubation. Which cause should be excluded first?","o":["Tension pneumothorax","Hypothermia","Anemia only","Pain","Hypoglycemia only"],"a":0,"e":"Hypotension and tachycardia after intubation should prompt exclusion of tension pneumothorax first, since positive pressure can cause or worsen it. Hypothermia, anemia, pain and hypoglycemia alone are less urgent.","t":"Hypotension after intubation: exclude tension pneumothorax."},{"id":"B22.18","c":22,"q":"Which strategy reduces ventilator days?","o":["Avoiding trials","Daily paired spontaneous awakening and breathing trials","Deep sedation","Maximal tidal volumes","Paralysis"],"a":1,"e":"Daily paired spontaneous awakening and breathing trials reduce ventilator days. Avoiding trials, deep sedation, maximal tidal volumes and paralysis prolong ventilation.","t":"Paired daily awakening and breathing trials shorten ventilation."},{"id":"B22.19","c":22,"q":"Which factor is most associated with failed extubation?","o":["Good cough","Weak cough and excessive secretions","Short ventilation","Young age","Light sedation"],"a":1,"e":"A weak cough and excessive secretions are most associated with failed extubation, because secretion clearance matters. Good cough, short ventilation, young age and light sedation favor success.","t":"Weak cough and secretions predict extubation failure."},{"id":"B22.20","c":22,"q":"A patient with a prolonged ICU stay asks about follow-up. The best plan includes:","o":["Annual chest radiograph only","Post-ICU clinic review for physical, cognitive, and psychological recovery","No follow-up","A phone call in a year","Sleep medication only"],"a":1,"e":"Prolonged ICU stay calls for post-ICU clinic review of physical, cognitive and psychological recovery, which addresses post-intensive care syndrome. A yearly radiograph, no follow-up, a call in a year or sleep medication alone is inadequate.","t":"Arrange post-ICU follow-up for PICS."},{"id":"B22.21","c":22,"q":"A patient has an arterial line trace with marked respiratory variation in systolic pressure. This suggests:","o":["Tamponade only","Normal findings only","Hypervolemia","Fluid responsiveness in a ventilated patient without arrhythmia","Pulmonary embolism"],"a":3,"e":"Marked respiratory variation in the arterial line pressure suggests fluid responsiveness in a ventilated patient without arrhythmia, as pulse pressure variation predicts volume response. It is not just normal, hypervolemia, tamponade alone or embolism.","t":"Large pulse pressure variation = fluid responsive (ventilated, sinus rhythm)."},{"id":"B22.22","c":22,"q":"A ventilated patient on a continuous infusion of a sedative is ready for a daily awakening trial. The first step is to:","o":["Stop or reduce the infusion and assess","Increase it","Do nothing","Start another sedative","Paralyze"],"a":0,"e":"For a daily awakening trial, stop or reduce the sedative infusion and assess, which reveals the lowest dose needed. Increasing it, doing nothing, adding another sedative or paralysis defeats the purpose.","t":"Awakening trial: stop or reduce sedation and assess."},{"id":"B22.23","c":22,"q":"Hospital-acquired pressure injury in ICU patients is best prevented by:","o":["Ignoring skin","Heavy sedation","Bed rest without turns","Tight restraints","Turning, support surfaces, and skin checks"],"a":4,"e":"Pressure injury is prevented by turning, support surfaces and skin checks. Ignoring skin, heavy sedation, bed rest without turns and tight restraints cause it.","t":"Prevent pressure injury with turning, surfaces and skin checks."},{"id":"B22.24","c":22,"q":"An ICU team plans a family meeting. The main goal is to:","o":["Assign blame","Reduce visits","Avoid discussion","Obtain a signature","Share prognosis, understand values, and align care with them"],"a":4,"e":"The main goal of an ICU family meeting is to share prognosis, understand the patient's values and align care with them, which improves care and reduces distress. It is not to assign blame, reduce visits, avoid discussion or just obtain a signature.","t":"Family meetings: prognosis, values, aligned care."},{"id":"B22.25","c":22,"q":"Early enteral nutrition in ventilated patients is generally:","o":["Delayed for a week always","Preferred over parenteral nutrition when the gut works","Replaced by fasting","Given only to the obese","Contraindicated"],"a":1,"e":"Early enteral nutrition is preferred over parenteral nutrition when the gut works. A week-long delay, fasting, giving only to the obese or contraindication is wrong.","t":"Use the gut when it works: enteral over parenteral."},{"id":"B15.1","c":15,"q":"A 66-year-old man with a prior asbestos exposure has progressive dyspnea and a large right pleural effusion with nodular pleural thickening on CT. Cytology is negative twice. The best next step is:","o":["Repeat chest radiograph only","Antibiotics","Diuretics","Pleural biopsy by thoracoscopy or image guidance","Observation for 6 months"],"a":3,"e":"Asbestos exposure, progressive dyspnea, a large effusion and nodular pleural thickening suggest mesothelioma, and two negative cytology results do not exclude it because cytology has limited sensitivity. Obtain tissue by thoracoscopy or image-guided pleural biopsy. Repeating a radiograph, antibiotics, diuretics or waiting 6 months delays the diagnosis.","t":"Suspected mesothelioma with negative cytology: pleural biopsy."},{"id":"B15.2","c":15,"q":"A patient with a malignant pleural effusion has recurrent dyspnea after each drainage, and the lung re-expands fully. Which option allows home drainage?","o":["Open thoracotomy","Chest tube for 6 weeks","Indwelling pleural catheter","Diuretics","Repeat thoracentesis every week"],"a":2,"e":"Recurrent malignant effusion with full lung re-expansion is well managed with an indwelling pleural catheter, which allows home drainage and avoids repeated procedures. Open thoracotomy, a 6-week chest tube, diuretics or weekly thoracentesis are less suitable.","t":"Recurrent malignant effusion with expandable lung: indwelling pleural catheter."},{"id":"B15.3","c":15,"q":"A patient with a malignant effusion has a trapped lung after drainage. Pleurodesis is likely to:","o":["Be unnecessary for any","Be required","Fail","Cause immediate cure","Succeed in all cases"],"a":2,"e":"Pleurodesis needs the lung to expand and appose the pleura, so in a trapped lung it is likely to fail. It is not unnecessary or curative in all cases, and an indwelling catheter is the better option.","t":"Trapped lung: pleurodesis fails; use an indwelling catheter."},{"id":"B15.4","c":15,"q":"Which pleural fluid finding in a malignant effusion predicts a shorter survival and lower pleurodesis success?","o":["Low pH and low glucose","High pH","Low protein","Low LDH","Normal glucose"],"a":0,"e":"A low pleural fluid pH and low glucose in a malignant effusion indicate heavy tumor burden and predict shorter survival and lower pleurodesis success. High pH, normal glucose, low protein and low LDH are not associated with poor outcome.","t":"Low pH and low glucose in malignant effusion predict worse outcomes."},{"id":"B15.5","c":15,"q":"A 55-year-old woman has facial swelling, distended neck veins, and a mediastinal mass. The most likely syndrome is:","o":["Superior vena cava syndrome","Pneumothorax","Pancoast syndrome","Tamponade","Horner syndrome only"],"a":0,"e":"Facial swelling, distended neck veins and a mediastinal mass indicate superior vena cava syndrome from obstruction of the vessel. Pneumothorax, Pancoast syndrome, tamponade and Horner syndrome alone do not give this picture.","t":"Facial swelling plus neck vein distention plus mediastinal mass = SVC syndrome."},{"id":"B15.6","c":15,"q":"A patient with superior vena cava syndrome has stridor. The priority is:","o":["Secure the airway and arrange urgent therapy","Large fluid bolus","Lie flat","Delay evaluation","Elevate legs"],"a":0,"e":"Stridor in superior vena cava syndrome signals airway compromise, so the priority is to secure the airway and arrange urgent therapy. Large fluid boluses, lying flat, elevating the legs or delaying evaluation worsen the obstruction.","t":"SVC syndrome with stridor: airway first, urgent treatment."},{"id":"B15.7","c":15,"q":"A tumor at the lung apex causes shoulder pain, hand weakness, and ptosis with miosis. The syndrome is:","o":["Pancoast syndrome with Horner involvement","Cervical rib","Guillain-Barre syndrome","Lambert-Eaton syndrome","Superior vena cava syndrome"],"a":0,"e":"An apical tumor causing shoulder pain, hand weakness, and ptosis with miosis is Pancoast syndrome with Horner involvement, from invasion of the brachial plexus and sympathetic chain. Cervical rib, Guillain-Barre, Lambert-Eaton and SVC syndrome do not cause Horner features.","t":"Apical tumor plus arm pain plus Horner = Pancoast syndrome."},{"id":"B15.8","c":15,"q":"A young woman has an anterior mediastinal mass, ptosis, and fatigable weakness. The likely diagnosis is:","o":["Thymoma with myasthenia gravis","Goiter","Bronchogenic cyst","Teratoma only","Lymphoma only"],"a":0,"e":"A young woman with an anterior mediastinal mass, ptosis and fatigable weakness most likely has a thymoma with myasthenia gravis. Goiter, bronchogenic cyst, teratoma alone and lymphoma alone do not explain the neuromuscular findings.","t":"Anterior mediastinal mass plus fatigable weakness = thymoma with myasthenia gravis."},{"id":"B15.9","c":15,"q":"Which mediastinal compartment most commonly holds a thymoma, teratoma, thyroid mass, or lymphoma?","o":["Pleural","Middle","Posterior","Retroperitoneal","Anterior"],"a":4,"e":"The anterior mediastinum holds the four Ts: thymoma, teratoma, thyroid mass (and terrible lymphoma). Pleural, middle, posterior and retroperitoneal compartments hold other lesions.","
